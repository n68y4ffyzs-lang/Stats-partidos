   CONFIGURACION DE SUPABASE
   La URL y la clave se introducen desde la propia app (pantalla
   "Sincronización") y se guardan en este dispositivo. No hace
   falta editar este archivo. Mientras no se configuren, la app
   funciona igualmente en modo solo-local (localStorage).
=========================================================== */
const TABLE = "registro_partido_data";
const SUPABASE_URL_KEY = "rp_supabase_url";
const SUPABASE_ANON_KEY_KEY = "rp_supabase_anon_key";

function isValidSupabaseConfig(url, key) {
  return !!(url && key && /^https?:\/\//.test(url));
}

function getStoredSupabaseConfig() {
  return {
    url: localStorage.getItem(SUPABASE_URL_KEY) || "",
    key: localStorage.getItem(SUPABASE_ANON_KEY_KEY) || "",
  };
}

function setStoredSupabaseConfig(url, key) {
  if (url) localStorage.setItem(SUPABASE_URL_KEY, url);
  else localStorage.removeItem(SUPABASE_URL_KEY);
  if (key) localStorage.setItem(SUPABASE_ANON_KEY_KEY, key);
  else localStorage.removeItem(SUPABASE_ANON_KEY_KEY);
}

/* ---------------------------------------------------------
   Utilidades
--------------------------------------------------------- */
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

function halfLabel(match) {
  if (match.half === "descanso") return "Descanso";
  if (match.half === "finalizado") return "Finalizado";
  return match.half === 1 ? "1ª parte" : "2ª parte";
}

/* ---------------------------------------------------------
   Almacenamiento local + sincronización con Supabase
--------------------------------------------------------- */
const DATA_KEY = "rp_data_v1";
const TEAM_CODE_KEY = "rp_team_code";
const DEVICE_ID_KEY = "rp_device_id";

function emptyData() {
  return { squad: [], matchesList: [], matchesById: {}, updatedAt: 0 };
}

function loadLocalData() {
  try {
    const raw = localStorage.getItem(DATA_KEY);
    if (!raw) return emptyData();
    const parsed = JSON.parse(raw);
    return {
      squad: parsed.squad || [],
      matchesList: parsed.matchesList || [],
      matchesById: parsed.matchesById || {},
      updatedAt: parsed.updatedAt || 0,
    };
  } catch (e) {
    return emptyData();
  }
}

function saveLocalData(data) {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify(data));
  } catch (e) {
    console.error("Error guardando en localStorage", e);
  }
}

function getDeviceId() {
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if (!id) {
    id = genId();
    localStorage.setItem(DEVICE_ID_KEY, id);
  }
  return id;
}

function getStoredTeamCode() {
  return localStorage.getItem(TEAM_CODE_KEY) || "";
}

function setStoredTeamCode(code) {
  if (code) localStorage.setItem(TEAM_CODE_KEY, code);
  else localStorage.removeItem(TEAM_CODE_KEY);
}

/* ---------------------------------------------------------
   Pantalla: Plantilla
--------------------------------------------------------- */
function SquadManager({ squad, onSave, onBack }) {
  const [players, setPlayers] = useState(squad);
  const [number, setNumber] = useState("");
  const [name, setName] = useState("");

  useEffect(() => setPlayers(squad), [squad]);

  function addPlayer() {
    if (!name.trim()) return;
    const updated = [
      ...players,
      { id: genId(), number: number.trim() || "-", name: name.trim() },
    ];
    setPlayers(updated);
    onSave(updated);
    setNumber("");
    setName("");
  }

  function removePlayer(id) {
    const updated = players.filter((p) => p.id !== id);
    setPlayers(updated);
    onSave(updated);
  }

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-6 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <h1 className="display text-2xl font-semibold">Plantilla</h1>
      </div>

      <div className="mp-card p-3 mb-4 flex gap-2">
        <input
          value={number}
          onChange={(e) => setNumber(e.target.value)}
          placeholder="Dorsal"
          inputMode="numeric"
          pattern="[0-9]*"
          className="mp-input px-3 py-2 w-20 text-center"
        />
        <input
          value={name}
          onChange={(e) => setName(e.target.value)}
          placeholder="Nombre del jugador"
          className="mp-input px-3 py-2 flex-1"
          onKeyDown={(e) => e.key === "Enter" && addPlayer()}
        />
        <button onClick={addPlayer} className="mp-btn mp-btn-primary px-4 text-sm font-semibold">
          Añadir
        </button>
      </div>

      <div className="flex flex-col gap-2">
        {players
          .slice()
          .sort((a, b) => Number(a.number) - Number(b.number))
          .map((p) => (
            <div key={p.id} className="mp-card p-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="mp-shirt w-9 h-9 text-sm font-semibold">{p.number}</div>
                <span>{p.name}</span>
              </div>
              <button
                onClick={() => removePlayer(p.id)}
                className="text-sm"
                style={{ color: "var(--crimson)" }}
              >
                Quitar
              </button>
            </div>
          ))}
        {players.length === 0 && (
          <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>
            Añade jugadores para poder convocarlos en un partido.
          </div>
        )}
      </div>
    </div>
  );
}

   Pantalla: Nuevo partido
--------------------------------------------------------- */
function MatchSetup({ squad, onCreate, onBack, onGoSquad }) {
  const [opponent, setOpponent] = useState("");
  const [date, setDate] = useState(todayISO());
  const [halfLength, setHalfLength] = useState(25);
  const [titulares, setTitulares] = useState([]);

  function toggle(id) {
    setTitulares((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );
  }

  function submit() {
    if (!opponent.trim() || titulares.length === 0) return;
    onCreate({ opponent: opponent.trim(), date, halfLength: Number(halfLength) || 25, titulares });
  }

  if (squad.length === 0) {
    return (
      <div className="max-w-md mx-auto p-4 pb-10">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm mb-4">
          Volver
        </button>
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          Primero necesitas añadir jugadores a la plantilla.
        </div>
        <button onClick={onGoSquad} className="mp-btn mp-btn-primary w-full py-3 mt-4 font-semibold">
          Ir a la plantilla
        </button>
      </div>
    );
  }

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-6 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <h1 className="display text-2xl font-semibold">Nuevo partido</h1>
      </div>

      <div className="mp-card p-3 mb-3">
        <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Rival</label>
        <input
          value={opponent}
          onChange={(e) => setOpponent(e.target.value)}
          placeholder="Nombre del equipo rival"
          className="mp-input px-3 py-2 w-full mt-1"
        />
      </div>

      <div className="flex gap-3 mb-3">
        <div className="mp-card p-3 flex-1">
          <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Fecha</label>
          <input
            type="date"
            value={date}
            onChange={(e) => setDate(e.target.value)}
            className="mp-input px-3 py-2 w-full mt-1"
          />
        </div>
        <div className="mp-card p-3 w-28">
          <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Min./parte</label>
          <input
            type="number"
            value={halfLength}
            onChange={(e) => setHalfLength(e.target.value)}
            inputMode="numeric"
            pattern="[0-9]*"
            className="mp-input px-3 py-2 w-full mt-1"
          />
        </div>
      </div>

      <div className="mp-card p-3 mb-4">
        <div className="flex items-center justify-between mb-2">
          <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Once inicial</label>
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>{titulares.length} seleccionados</span>
        </div>
        <div className="flex flex-wrap gap-2">
          {squad
            .slice()
            .sort((a, b) => Number(a.number) - Number(b.number))
            .map((p) => {
              const active = titulares.includes(p.id);
              return (
                <button
                  key={p.id}
                  onClick={() => toggle(p.id)}
                  className="mp-btn px-3 py-2 text-sm flex items-center gap-2"
                  style={active ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
                >
                  <span className="font-semibold">{p.number}</span>
                  <span>{p.name}</span>
                </button>
              );
            })}
        </div>
      </div>

      <button
        onClick={submit}
        disabled={!opponent.trim() || titulares.length === 0}
        className="mp-btn mp-btn-primary w-full py-3 font-semibold disabled:opacity-40"
      >
        Empezar partido
      </button>
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Partido en directo
--------------------------------------------------------- */
function LiveMatch({ match, squad, onUpdate, onFinish, onBack }) {
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [subOutId, setSubOutId] = useState(null);
  const [tab, setTab] = useState("jugadores");
  const [showPlayerStats, setShowPlayerStats] = useState(false);
  const [, forceTick] = useState(0);

  const matchRef = useRef(match);
  const anchorRef = useRef(null); // { atMs, base } — referencia para calcular el tiempo en directo sin tocar el estado global cada segundo
  useEffect(() => { matchRef.current = match; }, [match]);

  const playerById = useCallback(
    (id) => squad.find((p) => p.id === id) || { id, number: "?", name: "Desconocido" },
    [squad]
  );

  // Filtra jugadores que ya no están en la plantilla (p.ej. borrados después de convocarlos)
  const rosterOnPitch = match.onPitch.filter((id) => squad.some((p) => p.id === id));
  const rosterBench = match.bench.filter((id) => squad.some((p) => p.id === id));

  const clockKey = match.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";

  function currentElapsed() {
    if (!match.clock.running || !anchorRef.current) return match.clock[clockKey];
    return anchorRef.current.base + Math.floor((Date.now() - anchorRef.current.atMs) / 1000);
  }

  function currentMinute() {
    const secs = currentElapsed();
    if (match.clock.activeHalf === 1) return Math.floor(secs / 60) + 1;
    return match.halfLength + Math.floor(secs / 60) + 1;
  }

  // Ancla el cronómetro en directo al reanudar (o al cambiar de parte)
  useEffect(() => {
    anchorRef.current = match.clock.running ? { atMs: Date.now(), base: match.clock[clockKey] } : null;
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [match.clock.running, match.clock.activeHalf]);

  // Refresca la pantalla cada segundo sin escribir en almacenamiento ni red
  useEffect(() => {
    if (!match.clock.running) return;
    const interval = setInterval(() => forceTick((t) => t + 1), 1000);
    return () => clearInterval(interval);
  }, [match.clock.running]);

  // Persiste el cronómetro cada pocos segundos, sin bloquear el tap del usuario
  useEffect(() => {
    if (!match.clock.running) return;
    const interval = setInterval(() => {
      const m = matchRef.current;
      const key = m.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";
      onUpdate({ ...m, clock: { ...m.clock, [key]: currentElapsed() } }, false);
    }, 5000);
    return () => clearInterval(interval);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [match.clock.running, match.clock.activeHalf]);

  function toggleRunning() {
    const willRun = !match.clock.running;
    onUpdate(
      { ...match, clock: { ...match.clock, [clockKey]: currentElapsed(), running: willRun } },
      true
    );
  }

  function endHalf1() {
    onUpdate(
      { ...match, half: "descanso", clock: { ...match.clock, half1Elapsed: currentElapsed(), running: false } },
      true
    );
  }

  function startHalf2() {
    onUpdate({ ...match, half: 2, clock: { ...match.clock, running: true, activeHalf: 2 } }, true);
  }

  function addEvent(typeId) {
    if (!selectedPlayerId) return;
    const p = playerById(selectedPlayerId);
    const half = match.clock.activeHalf;
    const seconds = currentElapsed();
    const minute = currentMinute();
    const entry = {
      id: genId(),
      half,
      seconds,
      minute,
      playerId: p.id,
      playerNumber: p.number,
      playerName: p.name,
      type: typeId,
    };
    onUpdate({ ...match, events: [...match.events, entry] }, true);
  }

  function removeEvent(id) {
    onUpdate({ ...match, events: match.events.filter((e) => e.id !== id) }, true);
  }

  function removeSub(id) {
    onUpdate({ ...match, subs: match.subs.filter((s) => s.id !== id) }, true);
  }

  function confirmSub(inId) {
    const outP = playerById(subOutId);
    const inP = playerById(inId);
    const half = match.clock.activeHalf;
    const minute = currentMinute();
    const newOnPitch = match.onPitch.map((id) => (id === subOutId ? inId : id));
    const newBench = match.bench.map((id) => (id === inId ? subOutId : id));
    const subEntry = {
      id: genId(),
      half,
      minute,
      outId: outP.id,
      outName: outP.name,
      outNumber: outP.number,
      inId: inP.id,
      inName: inP.name,
      inNumber: inP.number,
    };
    onUpdate(
      { ...match, onPitch: newOnPitch, bench: newBench, subs: [...match.subs, subEntry] },
      true
    );
    setSubOutId(null);
    if (selectedPlayerId === subOutId) setSelectedPlayerId(null);
  }

  const activeElapsed = currentElapsed();

  const timeline = [
    ...match.events.map((e) => ({ ...e, kind: "event" })),
    ...match.subs.map((s) => ({ ...s, kind: "sub" })),
  ].sort((a, b) => (b.half - a.half) || (b.minute - a.minute) || (b.id > a.id ? 1 : -1));

  const selectedPlayer = selectedPlayerId ? playerById(selectedPlayerId) : null;
  const isGoalkeeperSelected = !!selectedPlayer && GOALKEEPER_NUMBERS.includes(String(selectedPlayer.number));
  const visibleEventTypes = EVENT_TYPES.filter((ev) => ev.group !== "portero" || isGoalkeeperSelected);

  const golesFavor = match.events.filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const golesContra =
    (match.concededSetPieces || []).length + match.events.filter((e) => e.type === "gol_encajado").length;

  return (
    <div className="max-w-6xl mx-auto p-3 pb-8">
      {/* Resultado del partido, bien visible arriba del todo */}
      <div className="text-center pt-1 mb-1">
        <div className="text-[10px] uppercase tracking-wide" style={{ color: "var(--chalk-dim)" }}>
          Resultado
        </div>
        <div className="display text-4xl font-bold tabular-nums leading-none">
          {golesFavor} - {golesContra}
        </div>
      </div>

      {/* Cabecera + marcador, todo en una franja compacta */}
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3 pt-2">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
            Volver
          </button>
          <div>
            <div className="font-semibold leading-tight">vs {match.opponent}</div>
            <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>{match.date}</div>
          </div>
        </div>

        <div className="mp-card px-4 py-2 flex items-center gap-4">
          <div>
            <div className="text-[10px]" style={{ color: "var(--chalk-dim)" }}>{halfLabel(match)}</div>
            <div className="display text-2xl font-semibold tabular-nums leading-none">
              {formatClock(activeElapsed)}
            </div>
          </div>
          <div className="flex items-center gap-2">
            {(match.half === 1 || match.half === 2) && (
              <button
                onClick={toggleRunning}
                className="mp-btn mp-btn-primary px-3 py-2 text-xs font-semibold"
              >
                {match.clock.running ? "Pausar" : "Reanudar"}
              </button>
            )}
            {match.half === 1 && (
              <button onClick={endHalf1} className="mp-btn mp-btn-outline px-3 py-2 text-xs">
                Fin 1ª parte
              </button>
            )}
            {match.half === "descanso" && (
              <button onClick={startHalf2} className="mp-btn mp-btn-primary px-3 py-2 text-xs font-semibold">
                Iniciar 2ª parte
              </button>
            )}
            {match.half === 2 && (
              <button onClick={onFinish} className="mp-btn mp-btn-outline px-3 py-2 text-xs" style={{ color: "var(--crimson)" }}>
                Finalizar partido
              </button>
            )}
          </div>
        </div>
      </div>

      {/* Pestañas: jugadores/eventos en directo, o el resumen de cómo va el partido */}
      <div className="flex gap-2 mb-3">
        <button
          onClick={() => setTab("jugadores")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "jugadores" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Jugadores
        </button>
        <button
          onClick={() => setTab("estadisticas")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "estadisticas" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Estadísticas del partido
        </button>
        <button
          onClick={() => setTab("campo")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "campo" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Campo
        </button>
      </div>

      {tab === "campo" && (
        <FieldFormation match={match} squad={squad} playerById={playerById} onUpdate={onUpdate} currentMinute={currentMinute} />
      )}

      {tab === "estadisticas" && (
        <React.Fragment>
          {match.events.length === 0 ? (
            <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
              Aún no hay eventos registrados en este partido.
            </div>
          ) : (
            <MatchTotals events={match.events} />
          )}

          <button
            onClick={() => setShowPlayerStats((v) => !v)}
            className="mp-btn mp-btn-outline w-full py-2.5 text-sm mt-4 mb-2"
          >
            {showPlayerStats ? "Ocultar estadísticas por jugador" : "Ver estadísticas por jugador"}
          </button>
          {showPlayerStats && (
            <PlayerStatsAccordion
              players={[...rosterOnPitch, ...rosterBench].map((id) => playerById(id))}
              events={match.events}
            />
          )}
        </React.Fragment>
      )}

      {/* Layout horizontal: en el campo a la izquierda, eventos + cronología a la derecha */}
      {tab === "jugadores" && (
      <div className="lg:grid lg:grid-cols-[260px_1fr] lg:gap-4 lg:items-start">
        <div className="mb-4 lg:mb-0">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
            En el campo — toca para seleccionar
          </div>
          <div className="grid grid-cols-2 gap-2 lg:grid-cols-1 lg:gap-1.5">
            {rosterOnPitch.map((id) => {
              const p = playerById(id);
              const selected = selectedPlayerId === id;
              return (
                <div
                  key={id}
                  className="mp-card flex items-center gap-2 px-2 py-1.5"
                  style={selected ? { borderColor: "var(--cielo)" } : {}}
                >
                  <button
                    onClick={() => setSelectedPlayerId(selected ? null : id)}
                    className={`mp-shirt w-9 h-9 text-sm font-semibold shrink-0 ${selected ? "selected" : ""}`}
                  >
                    {p.number}
                  </button>
                  <button
                    onClick={() => setSelectedPlayerId(selected ? null : id)}
                    className="flex-1 min-w-0 text-left text-sm truncate"
                  >
                    {p.name}
                  </button>
                  <button
                    onClick={() => setSubOutId(id)}
                    className="text-[10px] shrink-0"
                    style={{ color: "var(--cielo)" }}
                  >
                    Cambiar
                  </button>
                </div>
              );
            })}
          </div>

          {/* Panel de cambio: los suplentes solo aparecen aquí, al pulsar "Cambiar" */}
          {subOutId && (
            <div className="mp-card p-3 mt-3">
              <div className="text-sm mb-2">
                Entra por <span className="font-semibold">{playerById(subOutId).name}</span>:
              </div>
              <div className="flex flex-wrap gap-2 mb-2">
                {rosterBench.map((id) => {
                  const p = playerById(id);
                  return (
                    <button
                      key={id}
                      onClick={() => confirmSub(id)}
                      className="mp-btn px-3 py-2 text-sm"
                    >
                      {p.number} · {p.name}
                    </button>
                  );
                })}
                {rosterBench.length === 0 && (
                  <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>No hay suplentes disponibles.</span>
                )}
              </div>
              <button onClick={() => setSubOutId(null)} className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                Cancelar
              </button>
            </div>
          )}
        </div>

        <div>
          {/* Eventos */}
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
            {selectedPlayerId
              ? `Evento para ${playerById(selectedPlayerId).name}${isGoalkeeperSelected ? " (portero)" : ""}`
              : "Selecciona un jugador para registrar un evento"}
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 mb-5">
            {visibleEventTypes.map((ev) => (
              <button
                key={ev.id}
                disabled={!selectedPlayerId}
                onClick={() => addEvent(ev.id)}
                className={`mp-card ${GROUP_META[ev.group].cls} px-3 py-2.5 text-sm text-left disabled:opacity-30`}
              >
                {ev.label}
              </button>
            ))}
          </div>

          {/* Cronología */}
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Cronología</div>
          <div className="flex flex-col gap-2 lg:max-h-[45vh] lg:overflow-y-auto lg:pr-1">
            {timeline.length === 0 && (
              <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>Aún no hay eventos registrados.</div>
            )}
            {timeline.map((t) =>
              t.kind === "event" ? (
                <div key={t.id} className={`mp-card ${GROUP_META[EVENT_TYPES.find((e) => e.id === t.type).group].cls} p-2.5 flex items-center justify-between`}>
                  <span className="text-sm">
                    <span style={{ color: "var(--chalk-dim)" }}>{t.minute}' · </span>
                    #{t.playerNumber} {t.playerName} — {EVENT_LABEL[t.type]}
                  </span>
                  <button onClick={() => removeEvent(t.id)} className="text-xs" style={{ color: "var(--crimson)" }}>
                    Deshacer
                  </button>
                </div>
              ) : (
                <div key={t.id} className="mp-card chip-cielo p-2.5 flex items-center justify-between">
                  <span className="text-sm">
                    <span style={{ color: "var(--chalk-dim)" }}>{t.minute}' · </span>
                    Cambio: sale #{t.outNumber} {t.outName}, entra #{t.inNumber} {t.inName}
                  </span>
                  <button onClick={() => removeSub(t.id)} className="text-xs" style={{ color: "var(--crimson)" }}>
                    Deshacer
                  </button>
                </div>
              )
            )}
          </div>
        </div>
      </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Campo: colocar a cada jugador en su posición
--------------------------------------------------------- */
function FieldFormation({ match, squad, playerById, onUpdate, currentMinute }) {
  const [selectedId, setSelectedId] = useState(null);
  const pitchRef = useRef(null);
  const positions = match.positions || {};

  const rosterOnPitch = match.onPitch.filter((id) => squad.some((p) => p.id === id));
  const rosterBench = match.bench.filter((id) => squad.some((p) => p.id === id));

  const placedIds = rosterOnPitch.filter((id) => positions[id]);
  const unplacedIds = rosterOnPitch.filter((id) => !positions[id]);
  const selectedIsBench = !!selectedId && rosterBench.includes(selectedId);

  function setPosition(playerId, coords) {
    onUpdate({ ...match, positions: { ...positions, [playerId]: coords } }, true);
  }

  function clearPosition(playerId) {
    const next = { ...positions };
    delete next[playerId];
    onUpdate({ ...match, positions: next }, true);
  }

  function substitute(outId, inId) {
    const outP = playerById(outId);
    const inP = playerById(inId);
    const half = match.clock.activeHalf;
    const minute = currentMinute();
    const newOnPitch = match.onPitch.map((id) => (id === outId ? inId : id));
    const newBench = match.bench.map((id) => (id === inId ? outId : id));
    const subEntry = {
      id: genId(),
      half,
      minute,
      outId: outP.id,
      outName: outP.name,
      outNumber: outP.number,
      inId: inP.id,
      inName: inP.name,
      inNumber: inP.number,
    };
    const nextPositions = { ...positions };
    if (nextPositions[outId]) {
      nextPositions[inId] = nextPositions[outId];
    }
    delete nextPositions[outId];
    onUpdate(
      { ...match, onPitch: newOnPitch, bench: newBench, subs: [...match.subs, subEntry], positions: nextPositions },
      true
    );
  }

  function handleSelect(id) {
    if (!selectedId) {
      setSelectedId(id);
      return;
    }
    if (selectedId === id) {
      setSelectedId(null);
      return;
    }
    const tappedIsBench = rosterBench.includes(id);
    if (selectedIsBench !== tappedIsBench) {
      const inId = selectedIsBench ? selectedId : id;
      const outId = selectedIsBench ? id : selectedId;
      substitute(outId, inId);
      setSelectedId(null);
    } else {
      setSelectedId(id);
    }
  }

  function handlePitchClick(e) {
    if (!selectedId || selectedIsBench || !pitchRef.current) return;
    const rect = pitchRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    setPosition(selectedId, {
      x: Math.min(96, Math.max(4, x)),
      y: Math.min(96, Math.max(4, y)),
    });
    setSelectedId(null);
  }

  return (
    <div className="mb-4">
      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        {selectedId
          ? selectedIsBench
            ? `Toca al jugador del campo que sale por ${playerById(selectedId).name}`
            : `Toca el campo para colocar a ${playerById(selectedId).name}, o un suplente para cambiarlo`
          : "Toca un jugador y luego el campo para colocarlo, o toca un suplente para hacer un cambio"}
      </div>

      <div
        ref={pitchRef}
        onClick={handlePitchClick}
        className="relative w-full mx-auto mb-3"
        style={{
          maxWidth: 380,
          aspectRatio: "68 / 100",
          background: "#2E7D32",
          borderRadius: 12,
          border: "2px solid rgba(255,255,255,0.55)",
          overflow: "hidden",
        }}
      >
        <div style={{ position: "absolute", left: 0, right: 0, top: "50%", height: 2, background: "rgba(255,255,255,0.55)" }} />
        <div
          style={{
            position: "absolute",
            left: "50%",
            top: "50%",
            width: "26%",
            aspectRatio: "1 / 1",
            marginLeft: "-13%",
            marginTop: "-13%",
            borderRadius: "50%",
            border: "2px solid rgba(255,255,255,0.55)",
          }}
        />
        <div
          style={{
            position: "absolute",
            left: "50%",
            top: 0,
            width: "60%",
            height: "16%",
            marginLeft: "-30%",
            border: "2px solid rgba(255,255,255,0.55)",
            borderTop: "none",
          }}
        />
        <div
          style={{
            position: "absolute",
            left: "50%",
            bottom: 0,
            width: "60%",
            height: "16%",
            marginLeft: "-30%",
            border: "2px solid rgba(255,255,255,0.55)",
            borderBottom: "none",
          }}
        />

        {placedIds.map((id) => {
          const p = playerById(id);
          const pos = positions[id];
          const selected = selectedId === id;
          return (
            <button
              key={id}
              onClick={(e) => {
                e.stopPropagation();
                handleSelect(id);
              }}
              className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
              style={{
                position: "absolute",
                left: `${pos.x}%`,
                top: `${pos.y}%`,
                transform: "translate(-50%, -50%)",
              }}
            >
              {p.number}
            </button>
          );
        })}
      </div>

      {selectedId && !selectedIsBench && (
        <button
          onClick={() => {
            clearPosition(selectedId);
            setSelectedId(null);
          }}
          className="mp-btn mp-btn-outline w-full py-2 text-xs mb-3"
          style={{ color: "var(--crimson)" }}
        >
          Quitar del campo a {playerById(selectedId).name}
        </button>
      )}

      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Sin colocar</div>
      <div className="flex flex-wrap gap-2 mb-4">
        {unplacedIds.length === 0 && (
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            Todos los jugadores en el campo están colocados.
          </span>
        )}
        {unplacedIds.map((id) => {
          const p = playerById(id);
          const selected = selectedId === id;
          return (
            <button
              key={id}
              onClick={() => handleSelect(id)}
              className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
            >
              {p.number}
            </button>
          );
        })}
      </div>

      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        Banquillo — toca un suplente y luego a quién sustituye
      </div>
      <div className="flex flex-wrap gap-2">
        {rosterBench.length === 0 && (
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>No hay suplentes disponibles.</span>
        )}
        {rosterBench.map((id) => {
          const p = playerById(id);
          const selected = selectedId === id;
          return (
            <div key={id} className="flex flex-col items-center gap-1" style={{ width: 56 }}>

  );
}

/* ---------------------------------------------------------
   Pantalla: Resumen
--------------------------------------------------------- */
function MatchSummary({ match, onBack, onExport }) {
  const stats = {};
  match.events.forEach((e) => {
    if (!stats[e.playerId]) {
      stats[e.playerId] = { number: e.playerNumber, name: e.playerName, counts: {} };
    }
    stats[e.playerId].counts[e.type] = (stats[e.playerId].counts[e.type] || 0) + 1;
  });
  const rows = Object.values(stats).sort((a, b) => Number(a.number) - Number(b.number));
  const usedTypes = EVENT_TYPES.filter((ev) => rows.some((r) => r.counts[ev.id]));

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-4 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <div>
          <h1 className="display text-2xl font-semibold">Resumen</h1>
          <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            vs {match.opponent} · {match.date}
          </div>
        </div>
      </div>

      <button
        onClick={onExport}
        className="mp-btn mp-btn-primary w-full py-3 font-semibold mb-5"
      >
        Descargar CSV del partido
      </button>

      {rows.length === 0 ? (
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          No se registró ningún evento en este partido.
        </div>
      ) : (
        <div className="mp-scroll overflow-x-auto">
          <table className="text-sm w-full" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th className="text-left p-2" style={{ color: "var(--chalk-dim)" }}>Jugador</th>
                {usedTypes.map((ev) => (
                  <th key={ev.id} className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>
                    {ev.label}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.number + r.name} className="mp-card">
                  <td className="p-2 whitespace-nowrap">#{r.number} {r.name}</td>
                  {usedTypes.map((ev) => (
                    <td key={ev.id} className="text-center p-2">{r.counts[ev.id] || "–"}</td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      {match.subs.length > 0 && (
        <div className="mt-5">
          <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>Cambios</div>
          <div className="flex flex-col gap-2">
            {match.subs.map((s) => (
              <div key={s.id} className="mp-card chip-cielo p-2.5 text-sm">
                {s.minute}' — Sale #{s.outNumber} {s.outName}, entra #{s.inNumber} {s.inName}
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Estadísticas de temporada
--------------------------------------------------------- */
function StatCard({ label, value, sub }) {
  return (
    <div className="mp-card p-3">
      <div className="text-xs mb-1" style={{ color: "var(--chalk-dim)" }}>{label}</div>
      <div className="display text-3xl font-semibold leading-none">{value}</div>
      {sub && (
        <div className="text-xs mt-1" style={{ color: "var(--chalk-dim)" }}>{sub}</div>
      )}
    </div>
  );
}

function MatchTotals({ events }) {
  const totals = {};
  events.forEach((e) => {
    totals[e.type] = (totals[e.type] || 0) + 1;
  });

  const faltas = totals["falta_cometida"] || 0;
  const tirosPuerta = totals["remate_puerta"] || 0;
  const tirosFuera = totals["remate_fuera"] || 0;
  const tirosTotales = tirosPuerta + tirosFuera;
  const tirosPuertaPct = tirosTotales === 0 ? null : Math.round((tirosPuerta / tirosTotales) * 100);
  const duelosGanados = (totals["duelo_ganado"] || 0) + (totals["duelo_general_ganado"] || 0);
  const duelosPerdidos = (totals["duelo_perdido"] || 0) + (totals["duelo_general_perdido"] || 0);
  const duelosTotales = duelosGanados + duelosPerdidos;
  const duelosPct = duelosTotales === 0 ? null : Math.round((duelosGanados / duelosTotales) * 100);
  const robos = totals["recuperacion"] || 0;
  const paradas =
    (totals["parada_area"] || 0) +
    (totals["parada_fuera_area"] || 0) +
    (totals["parada_area_pequena"] || 0);

  return (
    <div className="grid grid-cols-2 gap-2">
      <StatCard label="Faltas totales" value={faltas} />
      <StatCard
        label="Tiros a puerta"
        value={tirosPuertaPct === null ? "–" : `${tirosPuertaPct}%`}
        sub={tirosTotales === 0 ? "Sin tiros registrados" : `${tirosPuerta} de ${tirosTotales}`}
      />
      <StatCard
        label="Duelos ganados"
        value={duelosPct === null ? "–" : `${duelosPct}%`}
        sub={duelosTotales === 0 ? "Sin duelos registrados" : `${duelosGanados} de ${duelosTotales}`}
      />
      <StatCard label="Robos totales" value={robos} />
      <StatCard label="Paradas totales" value={paradas} />
    </div>
  );
}

function computePlayerStats(playerId, events) {
  const own = events.filter((e) => e.playerId === playerId);
  const count = (type) => own.filter((e) => e.type === type).length;
  const duelosGanados = count("duelo_ganado") + count("duelo_general_ganado");
  const duelosPerdidos = count("duelo_perdido") + count("duelo_general_perdido");
  const duelosTotales = duelosGanados + duelosPerdidos;
  const duelosPct = duelosTotales === 0 ? null : Math.round((duelosGanados / duelosTotales) * 100);
  const regatesOk = count("regate");
  const regatesFallados = count("regate_fallado");
  const regatesTotales = regatesOk + regatesFallados;
  const regatesPct = regatesTotales === 0 ? null : Math.round((regatesOk / regatesTotales) * 100);
  const tirosPuerta = count("remate_puerta");
  const tirosFuera = count("remate_fuera");
  const tirosTotales = tirosPuerta + tirosFuera;
  const tirosPuertaPct = tirosTotales === 0 ? null : Math.round((tirosPuerta / tirosTotales) * 100);
  const perdidas = count("perdida");
  const robos = count("recuperacion");
  const goles = ALL_GOAL_TYPES.reduce((sum, t) => sum + count(t), 0);
  const asistencias = count("asistencia");
  const paradas = count("parada_area") + count("parada_fuera_area") + count("parada_area_pequena");
  const despejes = count("despeje");
  const golesEncajados = count("gol_encajado");
  return {
    duelosGanados,
    duelosPerdidos,
    duelosTotales,
    duelosPct,
    regatesOk,
    regatesFallados,
    regatesTotales,
    regatesPct,
    tirosPuerta,
    tirosFuera,
    tirosTotales,
    tirosPuertaPct,
    perdidas,
    robos,
    goles,
    asistencias,
    paradas,
    despejes,
    golesEncajados,
  };
}

/* ---------------------------------------------------------
   Gráfico de barras horizontal, una métrica por jugador
--------------------------------------------------------- */
function PlayerBarChart({ title, color, rows }) {
  if (rows.length === 0) return null;
  const max = Math.max(...rows.map((r) => r.raw));

  return (
    <div className="mp-card p-3">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>{title}</div>
      <div className="flex flex-col gap-1.5">
        {rows.map((r) => (
          <div key={r.label} className="flex items-center gap-2">
            <div className="text-xs w-20 shrink-0 truncate">{r.label}</div>
            <div className="flex-1 h-3 rounded-full" style={{ background: "rgba(244,241,232,0.08)" }}>
              <div
                className="h-3 rounded-full"
                style={{ width: `${max === 0 ? 0 : (r.raw / max) * 100}%`, background: color }}
              />
            </div>
            <div className="text-xs w-9 text-right shrink-0" style={{ fontVariantNumeric: "tabular-nums" }}>
              {r.display}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function PlayerStatsCharts({ players, events }) {
  const withStats = players.map((p) => ({ p, s: computePlayerStats(p.id, events) }));

  function rowsFor(pick, format) {
    return withStats
      .map(({ p, s }) => {
        const raw = pick(s) || 0;
        return { label: p.name, raw, display: format ? format(raw) : String(raw) };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  const charts = [
    { title: "Goles", color: "var(--turf)", rows: rowsFor((s) => s.goles) },
    { title: "Asistencias", color: "var(--turf)", rows: rowsFor((s) => s.asistencias) },
    { title: "Duelos ganados", color: "var(--cielo)", rows: rowsFor((s) => s.duelosPct, (v) => `${v}%`) },
    { title: "Regates acertados", color: "var(--cielo)", rows: rowsFor((s) => s.regatesPct, (v) => `${v}%`) },
    { title: "Recuperaciones", color: "var(--cielo)", rows: rowsFor((s) => s.robos) },
    { title: "Balones perdidos", color: "var(--crimson)", rows: rowsFor((s) => s.perdidas) },
    { title: "Paradas (portero)", color: "var(--violet)", rows: rowsFor((s) => s.paradas) },
    { title: "Goles encajados (portero)", color: "var(--crimson)", rows: rowsFor((s) => s.golesEncajados) },
  ].filter((c) => c.rows.length > 0);

  if (charts.length === 0) {
    return (
      <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
        Aún no hay suficientes eventos registrados para mostrar gráficos.
      </div>
    );
  }

  return (
    <div className="flex flex-col gap-2">
      {charts.map((c) => (
        <PlayerBarChart key={c.title} title={c.title} color={c.color} rows={c.rows} />
      ))}
    </div>
  );
}

function SeasonStats({ matches, squad, onBack }) {
  const [showTeamStats, setShowTeamStats] = useState(false);
  const [showPlayerStats, setShowPlayerStats] = useState(false);
  const [showCharts, setShowCharts] = useState(false);
  const allSeasonEvents = matches.flatMap((m) => m.events);

  const stats = {};
  let matchesWithEvents = 0;

  matches.forEach((m) => {
    if (m.events.length > 0) matchesWithEvents += 1;
    m.events
      .filter((e) => e.type !== "pase_clave")
      .forEach((e) => {
        if (!stats[e.playerId]) {
          stats[e.playerId] = { number: e.playerNumber, name: e.playerName, counts: {} };
        }
        stats[e.playerId].counts[e.type] = (stats[e.playerId].counts[e.type] || 0) + 1;
      });
  });

  const rows = Object.values(stats)
    .map((r) => {
      const goles = ALL_GOAL_TYPES.reduce((sum, t) => sum + (r.counts[t] || 0), 0);
      const asistencias = r.counts["asistencia"] || 0;
      return { ...r, goles, asistencias, golesAsistencias: goles + asistencias };
    })
    .filter((r) => r.golesAsistencias > 0)
    .sort((a, b) => b.golesAsistencias - a.golesAsistencias);

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-4 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <div>
          <h1 className="display text-2xl font-semibold">Estadísticas de temporada</h1>
          <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            {matches.length} partido{matches.length === 1 ? "" : "s"} registrado{matches.length === 1 ? "" : "s"}
            {matchesWithEvents > 0 && ` · ${matchesWithEvents} con eventos`}
          </div>
        </div>
      </div>

      {rows.length === 0 ? (
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          Aún no hay goles ni asistencias registrados en ningún partido.
        </div>
      ) : (
        <div className="mp-scroll overflow-x-auto">
          <table className="text-sm w-full" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th className="text-left p-2" style={{ color: "var(--chalk-dim)" }}>Jugador</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Goles</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Asistencias</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Goles+Asistencias</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.number + r.name} className="mp-card">
                  <td className="p-2 whitespace-nowrap">#{r.number} {r.name}</td>
                  <td className="text-center p-2">{r.goles || "–"}</td>
                  <td className="text-center p-2">{r.asistencias || "–"}</td>
                  <td className="text-center p-2 font-semibold">{r.golesAsistencias}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <button
        onClick={() => setShowTeamStats((v) => !v)}
        className="mp-btn mp-btn-outline w-full py-2.5 text-sm mt-4 mb-2"
      >
        {showTeamStats ? "Ocultar estadísticas del equipo" : "Ver estadísticas del equipo"}
      </button>
      {showTeamStats && (
        allSeasonEvents.length === 0 ? (
          <div className="mp-card p-4 text-sm mb-2" style={{ color: "var(--chalk-dim)" }}>
            Aún no hay eventos registrados en ningún partido.
          </div>
        ) : (
          <div className="mb-2">
            <MatchTotals events={allSeasonEvents} />
          </div>
        )
      )}

      <button
        onClick={() => setShowPlayerStats((v) => !v)}
        className="mp-btn mp-btn-outline w-full py-2.5 text-sm mb-2"
      >
        {showPlayerStats ? "Ocultar estadísticas por jugador" : "Ver estadísticas por jugador"}
      </button>
      {showPlayerStats && (
        <React.Fragment>
          <PlayerStatsAccordion players={squad} events={allSeasonEvents} />

          <button
            onClick={() => setShowCharts((v) => !v)}
            className="mp-btn mp-btn-outline w-full py-2.5 text-sm mt-3 mb-2"
          >
            {showCharts ? "Ocultar gráficos" : "Ver gráficos"}
          </button>
          {showCharts && <PlayerStatsCharts players={squad} events={allSeasonEvents} />}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Balón parado
--------------------------------------------------------- */
function cornerConcededCount(match) {
  return (match.concededSetPieces || []).filter((e) => (e.origin || "corner") === "corner").length;
}

function SetPieceStats({ matches, onBack }) {
  const allEvents = matches.flatMap((m) => m.events);
  const countType = (type) => allEvents.filter((e) => e.type === type).length;

  const cornerFavor = countType("gol_corner");
  const faltaFavor = countType("gol_falta");
  const penaltiFavor = countType("gol_penalti");
  const setPieceFavorTotal = cornerFavor + faltaFavor + penaltiFavor;
  const totalGoals = allEvents.filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const setPiecePct = totalGoals === 0 ? null : Math.round((setPieceFavorTotal / totalGoals) * 100);

  const contraTotal = matches.reduce((sum, m) => sum + cornerConcededCount(m), 0);

  const rows = matches
    .map((m) => ({
      id: m.id,
      opponent: m.opponent,
      date: m.date,
      favor: m.events.filter((e) => SET_PIECE_GOAL_TYPES.includes(e.type)).length,
      contra: cornerConcededCount(m),
    }))
    .filter((r) => r.favor > 0 || r.contra > 0)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-4 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <h1 className="display text-2xl font-semibold">Balón parado</h1>
      </div>

      <div className="grid grid-cols-2 gap-2 mb-5">
        <StatCard label="Goles de córner" value={cornerFavor} />
        <StatCard label="Goles de falta" value={faltaFavor} />
        <StatCard label="Goles de penalti" value={penaltiFavor} />
        <StatCard label="Total a balón parado" value={setPieceFavorTotal} />
        <StatCard
          label="% de los goles totales"
          value={setPiecePct === null ? "–" : `${setPiecePct}%`}
          sub={totalGoals === 0 ? "Sin goles registrados" : `${setPieceFavorTotal} de ${totalGoals} goles`}
        />
        <StatCard label="Goles de córner encajados" value={contraTotal} />
      </div>

      <h2 className="text-sm uppercase tracking-wide mb-2" style={{ color: "var(--chalk-dim)" }}>
        Por partido
      </h2>

      {rows.length === 0 ? (
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          Aún no hay goles a balón parado registrados en ningún partido.
        </div>
      ) : (
        <div className="flex flex-col gap-2">
          {rows.map((r) => (
            <div key={r.id} className="mp-card p-3 flex items-center justify-between">
              <div>
                <div className="font-semibold">vs {r.opponent}</div>
                <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>{r.date}</div>
              </div>
              <div className="text-sm text-right">
                <div style={{ color: "var(--turf)" }}>{r.favor} a favor</div>
                <div style={{ color: "var(--crimson)" }}>{r.contra} en contra</div>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   App principal
--------------------------------------------------------- */
function App() {
  const [view, setView] = useState("home");
  const [data, setData] = useState(loadLocalData);
  const [match, setMatch] = useState(null);
  const [teamCode, setTeamCodeState] = useState(getStoredTeamCode);
  const [supabaseConfig, setSupabaseConfig] = useState(getStoredSupabaseConfig);
  const [syncStatus, setSyncStatus] = useState("unconfigured");
  const [lastSyncedAt, setLastSyncedAt] = useState(null);

  const configured = isValidSupabaseConfig(supabaseConfig.url, supabaseConfig.key);

  const dataRef = useRef(data);
  const teamCodeRef = useRef(teamCode);
  const matchRef = useRef(match);
  const pushTimerRef = useRef(null);
  const supabaseRef = useRef(null);
  const deviceId = useRef(getDeviceId()).current;

  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => { teamCodeRef.current = teamCode; }, [teamCode]);
  useEffect(() => { matchRef.current = match; }, [match]);

  // Crea (o recrea) el cliente de Supabase cuando cambia la configuración
  useEffect(() => {
    if (configured && window.supabase) {
      supabaseRef.current = window.supabase.createClient(supabaseConfig.url, supabaseConfig.key);
      setSyncStatus(teamCodeRef.current ? "synced" : "no-code");
    } else {
      supabaseRef.current = null;
      setSyncStatus("unconfigured");
    }
  }, [configured, supabaseConfig.url, supabaseConfig.key]);

  /* --- Sincronización con Supabase --- */

  function computeStatus() {
    if (!configured) return "unconfigured";
    if (!teamCodeRef.current) return "no-code";
    if (!navigator.onLine) return "offline";
    return "synced";
  }

  async function pushToSupabase(stamped) {
    if (!supabaseRef.current || !teamCodeRef.current) return;
    setSyncStatus("syncing");
    try {
      const { error } = await supabaseRef.current.from(TABLE).upsert({
        team_code: teamCodeRef.current,
        data: stamped,
        device_id: deviceId,
        updated_at: new Date(stamped.updatedAt).toISOString(),
      });
      if (error) throw error;
      setSyncStatus("synced");
      setLastSyncedAt(Date.now());
    } catch (e) {
      console.error("Error sincronizando con Supabase", e);
      setSyncStatus("error");
    }
  }

  function scheduleSync(stamped, immediate) {
    if (!supabaseRef.current || !teamCodeRef.current) return;
    if (pushTimerRef.current) {
      clearTimeout(pushTimerRef.current);
      pushTimerRef.current = null;
    }
    if (immediate) {
      pushToSupabase(stamped);
    } else {
      pushTimerRef.current = setTimeout(() => {
        pushToSupabase(dataRef.current);
      }, 1500);
    }
  }

  function applyRemoteData(remoteData, remoteUpdatedAt) {
    const merged = { ...emptyData(), ...remoteData, updatedAt: remoteUpdatedAt };
    setData(merged);
    dataRef.current = merged;
    saveLocalData(merged);
    if (matchRef.current) {
      const refreshed = merged.matchesById[matchRef.current.id];
      if (refreshed) setMatch(refreshed);
    }
  }

  async function pullFromSupabase() {
    if (!supabaseRef.current || !teamCodeRef.current) return;
    setSyncStatus("syncing");
    try {
      const { data: row, error } = await supabaseRef.current
        .from(TABLE)
        .select("data, updated_at")
        .eq("team_code", teamCodeRef.current)
        .maybeSingle();
      if (error) throw error;
      if (row && row.data) {
        const remoteUpdatedAt = new Date(row.updated_at).getTime();
        if (remoteUpdatedAt > dataRef.current.updatedAt) {
          applyRemoteData(row.data, remoteUpdatedAt);
        } else if (dataRef.current.updatedAt > remoteUpdatedAt) {
          await pushToSupabase(dataRef.current);
        }
      } else {
        await pushToSupabase(dataRef.current);
      }
      setSyncStatus("synced");
      setLastSyncedAt(Date.now());
    } catch (e) {
      console.error("Error sincronizando con Supabase", e);
      setSyncStatus("error");
    }
  }

  function saveTeamCode(code) {
    setStoredTeamCode(code);
    setTeamCodeState(code);
    teamCodeRef.current = code;
    setSyncStatus(computeStatus());
    if (code) pullFromSupabase();
  }

  function saveSupabaseConfig(url, key) {
    setStoredSupabaseConfig(url, key);
    setSupabaseConfig({ url, key });
  }

  // Sincroniza al arrancar y suscribe a cambios en tiempo real
  useEffect(() => {
    if (!supabaseRef.current || !teamCode) return;
    pullFromSupabase();

    const channel = supabaseRef.current
      .channel(`registro_partido_${teamCode}`)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: TABLE, filter: `team_code=eq.${teamCode}` },
        (payload) => {
          const row = payload.new;
          if (!row || row.device_id === deviceId) return;
          const remoteUpdatedAt = new Date(row.updated_at).getTime();
          if (remoteUpdatedAt > dataRef.current.updatedAt) {
            applyRemoteData(row.data, remoteUpdatedAt);
          }
        }
      )
      .subscribe();

    return () => {
      supabaseRef.current.removeChannel(channel);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [teamCode, configured, supabaseConfig.url, supabaseConfig.key]);

  // Reintenta al recuperar conexión / volver a la pestaña
  useEffect(() => {
    function handleOnline() { pullFromSupabase(); }
    function handleVisibility() {
      if (document.hidden && pushTimerRef.current) {
        clearTimeout(pushTimerRef.current);
        pushTimerRef.current = null;
        pushToSupabase(dataRef.current);
      } else if (!document.hidden) {
        pullFromSupabase();
      }
    }
    window.addEventListener("online", handleOnline);
    document.addEventListener("visibilitychange", handleVisibility);
    return () => {
      window.removeEventListener("online", handleOnline);
      document.removeEventListener("visibilitychange", handleVisibility);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* --- Mutación central de datos --- */

  function commit(nextData, { syncNow = true } = {}) {
    const stamped = { ...nextData, updatedAt: Date.now() };
    setData(stamped);
    dataRef.current = stamped;
    saveLocalData(stamped);
    scheduleSync(stamped, syncNow);
  }

  function saveSquad(updatedSquad) {
    commit({ ...dataRef.current, squad: updatedSquad });
  }

  function goHome() {
    setMatch(null);
    setView("home");
  }

  function createMatch({ opponent, date, halfLength, titulares }) {
    const squad = dataRef.current.squad;
    const bench = squad.filter((p) => !titulares.includes(p.id)).map((p) => p.id);
    const newMatch = {
      id: genId(),
      opponent,
      date,
      halfLength,
      half: 1,
      finished: false,
      clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1 },
      onPitch: titulares,
      bench,
      events: [],
      subs: [],
      concededSetPieces: [],
      positions: {},
    };
    const updatedList = [
      ...dataRef.current.matchesList,
      { id: newMatch.id, opponent, date, finished: false },
    ];
    commit({
      ...dataRef.current,
      matchesList: updatedList,
      matchesById: { ...dataRef.current.matchesById, [newMatch.id]: newMatch },
    });
    setMatch(newMatch);
    setView("live");
  }

  function openMatch(id) {
    const m = dataRef.current.matchesById[id];
    if (!m) return;
    setMatch(m);
    setView(m.finished ? "summary" : "live");
  }

  function deleteMatch(id, opponent) {
    if (!window.confirm(`¿Eliminar el partido vs ${opponent}? Esta acción no se puede deshacer.`)) return;
    const { [id]: _removed, ...restMatchesById } = dataRef.current.matchesById;
    const updatedList = dataRef.current.matchesList.filter((m) => m.id !== id);
    commit({ ...dataRef.current, matchesList: updatedList, matchesById: restMatchesById });
    if (match && match.id === id) {
      setMatch(null);
      setView("home");
    }
  }

  function updateMatch(updated, persistNow) {
    setMatch(updated);
    commit(
      { ...dataRef.current, matchesById: { ...dataRef.current.matchesById, [updated.id]: updated } },
      { syncNow: persistNow }
    );
  }

  function finishMatch() {
    const updated = {
      ...match,
      half: "finalizado",
      finished: true,
      clock: { ...match.clock, running: false },
    };
    setMatch(updated);
    const updatedList = dataRef.current.matchesList.map((m) =>
      m.id === updated.id ? { ...m, finished: true } : m
    );
    commit({
      ...dataRef.current,
      matchesList: updatedList,
      matchesById: { ...dataRef.current.matchesById, [updated.id]: updated },
    });
    setView("summary");
  }

  function exportCSV() {
    const rows = [["partido", "fecha", "rival", "parte", "minuto", "dorsal", "jugador", "evento"]];
    match.events.forEach((e) => {
      rows.push([match.id, match.date, match.opponent, e.half, e.minute, e.playerNumber, e.playerName, EVENT_LABEL[e.type] || e.type]);
    });
    match.subs.forEach((s) => {
      rows.push([match.id, match.date, match.opponent, s.half, s.minute, s.outNumber, s.outName, `sale (entra ${s.inName})`]);
      rows.push([match.id, match.date, match.opponent, s.half, s.minute, s.inNumber, s.inName, `entra (sale ${s.outName})`]);
    });
    const csv = rows
      .map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(","))
      .join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `partido_${match.opponent.replace(/\s+/g, "_")}_${match.date}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div className="mp-app">
      <GlobalStyles />
      {view === "home" && (
        <Home
          matches={data.matchesList}
          squadCount={data.squad.length}
          onNewMatch={() => setView("setup")}
          onOpenMatch={openMatch}
          onDeleteMatch={deleteMatch}
          onGoSquad={() => setView("squad")}
          onGoSeason={() => setView("season")}
          onGoSetPieces={() => setView("setpieces")}
          syncStatus={syncStatus}
          onGoSync={() => setView("sync")}
        />
      )}
      {view === "squad" && (
        <SquadManager squad={data.squad} onSave={saveSquad} onBack={goHome} />
      )}
      {view === "setup" && (
        <MatchSetup
          squad={data.squad}
          onCreate={createMatch}
          onBack={goHome}
          onGoSquad={() => setView("squad")}
        />
      )}
      {view === "live" && match && (
        <LiveMatch
          match={match}
          squad={data.squad}
          onUpdate={updateMatch}
          onFinish={finishMatch}
          onBack={goHome}
        />
      )}
      {view === "summary" && match && (
        <MatchSummary match={match} onBack={goHome} onExport={exportCSV} />
      )}
      {view === "season" && (
        <SeasonStats matches={Object.values(data.matchesById)} squad={data.squad} onBack={goHome} />
      )}
      {view === "setpieces" && (
        <SetPieceStats matches={Object.values(data.matchesById)} onBack={goHome} />
      )}
      {view === "sync" && (
        <SyncSettings
          status={syncStatus}
          teamCode={teamCode}
          lastSyncedAt={lastSyncedAt}
          supabaseUrl={supabaseConfig.url}
          supabaseKey={supabaseConfig.key}
          configured={configured}
          onSaveTeamCode={saveTeamCode}
          onSaveConfig={saveSupabaseConfig}
          onSyncNow={pullFromSupabase}
          onBack={goHome}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
