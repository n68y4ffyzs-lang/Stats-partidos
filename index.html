function App() {
  const [view, setView] = useState("home");
  const [data, setData] = useState(loadLocalData);
  const [match, setMatch] = useState(null);
  const [authUser, setAuthUser] = useState(getStoredAuthUser);
  const ownerId = authUser ? authUser.id : "";
  const isOwnerAccount = !!authUser && authUser.accountType === "owner";
  // Cuenta cuyos datos ya se han contrastado con la nube en esta sesión (hasta entonces no se
  // sabe si ya tiene equipo elegido, así que no se muestra el buscador de equipo)
  const [cloudCheckedFor, setCloudCheckedFor] = useState("");
  const [skipTeamSetup, setSkipTeamSetup] = useState(false);
  const [changingTeam, setChangingTeam] = useState(false);
  // Enlace de "cambiar contraseña" abierto: pantalla propia para escribir la nueva
  const [recoveryOpen, setRecoveryOpen] = useState(false);
  // Cambio de contraseña con código en curso: no abrir además la pantalla del enlace
  const codeRecoveryRef = useRef(false);
  // Enlace de un email de Supabase que ha fallado (caducado, ya usado, otro navegador...)
  const [authLinkError, setAuthLinkError] = useState(() => authLinkErrorMessage());
  const [supabaseConfig, setSupabaseConfig] = useState(getStoredSupabaseConfig);
  const [syncStatus, setSyncStatus] = useState("unconfigured");
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const [calendarImport, setCalendarImport] = useState({ loading: false, message: null });
  const [crestImport, setCrestImport] = useState({ loading: false, message: null });

  const configured = isValidSupabaseConfig(supabaseConfig.url, supabaseConfig.key);

  const dataRef = useRef(data);
  const ownerRef = useRef(ownerId);
  const matchRef = useRef(match);
  const pushTimerRef = useRef(null);
  const supabaseRef = useRef(null);
  const pendingRef = useRef(loadPending());
  const [pendingCount, setPendingCount] = useState(pendingRef.current.length);
  const [online, setOnline] = useState(typeof navigator === "undefined" ? true : navigator.onLine);
  const flushingRef = useRef(false);
  const flushAgainRef = useRef(false);
  const retryTimerRef = useRef(null);
  const retryAttemptRef = useRef(0);
  const deviceId = useRef(getDeviceId()).current;

  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => { ownerRef.current = ownerId; }, [ownerId]);
  useEffect(() => { matchRef.current = match; }, [match]);

  // Crea (o recrea) el cliente de Supabase cuando cambia la configuración
  useEffect(() => {
    if (configured && window.supabase) {
      // La sesión (email + contraseña) la guarda y renueva el propio cliente de Supabase
      supabaseRef.current = window.supabase.createClient(supabaseConfig.url, supabaseConfig.key, {
        auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true },
      });
      setSyncStatus(ownerRef.current ? "synced" : "no-code");
    } else {
      supabaseRef.current = null;
      setSyncStatus("unconfigured");
    }
  }, [configured, supabaseConfig.url, supabaseConfig.key]);

  // Conexión con Supabase para dispositivos nuevos: si no hay una guardada, se pide a /api/config
  // (variables de entorno de Vercel). Si no está configurada allí, se sigue pidiendo a mano.
  useEffect(() => {
    if (configured) return;
    fetch("/api/config")
      .then((r) => (r.ok ? r.json() : {}))
      .then((cfg) => {
        if (cfg && isValidSupabaseConfig(cfg.url, cfg.anonKey) && !isValidSupabaseConfig(getStoredSupabaseConfig().url, getStoredSupabaseConfig().key)) {
          saveSupabaseConfig(cfg.url, cfg.anonKey);
        }
      })
      .catch(() => {});
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [configured]);

  // Sesión: al entrar se cargan los datos de esa cuenta; solo un cierre de sesión real
  // (SIGNED_OUT) la quita. Sin conexión no se pierde la sesión, aunque no se pueda renovar.
  useEffect(() => {
    const client = supabaseRef.current;
    if (!client) return;
    let cancelled = false;
    client.auth.getSession().then(({ data }) => {
      if (cancelled || !data || !data.session || !data.session.user) return;
      handleAuthUser(data.session.user);
      // Se entró con el enlace de "cambiar contraseña": se pide la nueva aunque se haya perdido el aviso
      if (AUTH_LINK.recovery) setRecoveryOpen(true);
      // El tipo de cuenta puede haber cambiado en Supabase: se pide el usuario actualizado
      if (navigator.onLine) {
        client.auth.getUser().then(({ data: fresh }) => {
          if (!cancelled && fresh && fresh.user && fresh.user.id === data.session.user.id) handleAuthUser(fresh.user);
        }).catch(() => {});
      }
    });
    const { data: sub } = client.auth.onAuthStateChange((event, session) => {
      if (event === "SIGNED_OUT") handleAuthUser(null);
      else if (session && session.user) handleAuthUser(session.user);
      if (event === "PASSWORD_RECOVERY" && !codeRecoveryRef.current) setRecoveryOpen(true);
    });
    return () => {
      cancelled = true;
      sub && sub.subscription && sub.subscription.unsubscribe();
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [configured, supabaseConfig.url, supabaseConfig.key]);

  /* --- Sincronización con Supabase --- */

  function computeStatus() {
    if (!configured) return "unconfigured";
    if (!ownerRef.current) return "no-code";
    if (!navigator.onLine) return "offline";
    return "synced";
  }

  // Antes de sobrescribir la nube, comprueba que no vamos a perder jugadores o partidos que
  // ya estaban guardados allí (p.ej. un dispositivo con datos desactualizados). Si detecta que
  // se perdería información pide confirmación explícita en vez de sobrescribir sin más.
  // `opts.force` salta esta comprobación (usado al restaurar una copia o al forzar la subida).
  // Devuelve "ok", "blocked" (el usuario canceló el aviso) o "error". Si sube bien, borra de la
  // cola los cambios que ya iban incluidos en `stamped` (los hechos durante la subida se quedan).
  async function pushToSupabase(stamped, opts = {}) {
    if (!supabaseRef.current || !ownerRef.current) return "error";
    // El código con el que empezó la subida: si el usuario cambia de equipo mientras tanto,
    // estos datos no pueden acabar en la fila del otro equipo.
    const code = ownerRef.current;
    const client = supabaseRef.current;
    const coveredIds = new Set(
      pendingRef.current.filter((e) => e.at <= stamped.updatedAt).map((e) => e.id)
    );
    setSyncStatus("syncing");
    try {
      if (!opts.force) {
        const { data: existing, error: fetchErr } = await client
          .from(TABLE)
          .select("data")
          .eq(OWNER_COL, code)
          .maybeSingle();
        if (fetchErr) throw fetchErr;
        const remoteData = existing && existing.data;
        if (remoteData) {
          const remoteSquad = (remoteData.squad || []).length;
          const remoteMatches = (remoteData.matchesList || []).length;
          const localSquad = (stamped.squad || []).length;
          const localMatches = (stamped.matchesList || []).length;
          if (localSquad < remoteSquad || localMatches < remoteMatches) {
            const proceed = window.confirm(
              `Aviso de posible pérdida de datos\n\n` +
              `En la nube hay ${remoteSquad} jugador${remoteSquad === 1 ? "" : "es"} y ${remoteMatches} partido${remoteMatches === 1 ? "" : "s"}.\n` +
              `Este dispositivo tiene ${localSquad} jugador${localSquad === 1 ? "" : "es"} y ${localMatches} partido${localMatches === 1 ? "" : "s"}.\n\n` +
              `Si sincronizas ahora, la nube se sobrescribirá con menos datos de los que tiene guardados.\n\n` +
              `¿Seguro que quieres continuar?`
            );
            if (!proceed) {
              setSyncStatus("blocked");
              return "blocked";
            }
          }
        }
      }
      if (ownerRef.current !== code) return "stale";
      const { error } = await client.from(TABLE).upsert({
        [OWNER_COL]: code,
        data: stamped,
        device_id: deviceId,
        updated_at: new Date(stamped.updatedAt).toISOString(),
      });
      if (error) throw error;
      // Copia en el histórico: no crítica, no bloquea ni falla la sincronización si falla.
      client
        .from(HISTORY_TABLE)
        .insert({ [OWNER_COL]: code, data: stamped, device_id: deviceId })
        .then(({ error: histError }) => {
          if (histError) console.error("Error guardando histórico", histError);
        });
      if (ownerRef.current !== code) return "stale";
      setLastRemoteUpdatedAt(stamped.updatedAt);
      removePending(coveredIds);
      setSyncStatus("synced");
      setLastSyncedAt(Date.now());
      return "ok";
    } catch (e) {
      console.error("Error sincronizando con Supabase", e);
      setSyncStatus(navigator.onLine ? "error" : "offline");
      return "error";
    }
  }

  /* --- Cola de cambios pendientes --- */

  function setPending(entries) {
    pendingRef.current = entries;
    savePending(entries);
    setPendingCount(entries.length);
  }

  function removePending(ids) {
    if (!ids || ids.size === 0) return;
    setPending(pendingRef.current.filter((e) => !ids.has(e.id)));
  }

  // Apunta un cambio local en la cola. Los guardados automáticos del cronómetro (silent) se
  // agrupan en una sola entrada mientras no haya otro cambio entre medias, para que el
  // contador de pendientes refleje acciones reales y no un tic cada 5 segundos.
  function enqueueChange(prev, next, silent) {
    if (!supabaseRef.current || !ownerRef.current) return;
    const { keys, matchIds } = diffDataForQueue(prev, next);
    if (keys.length === 0 && matchIds.length === 0) return;
    const entries = pendingRef.current;
    const last = entries[entries.length - 1];
    if (
      silent && last && last.silent &&
      keys.join() === (last.keys || []).join() && matchIds.join() === (last.matchIds || []).join()
    ) {
      setPending([...entries.slice(0, -1), { ...last, at: next.updatedAt }]);
      return;
    }
    setPending([...entries, { id: genId(), at: next.updatedAt, keys, matchIds, silent: !!silent }]);
  }

  function scheduleFlush(delay) {
    if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
    pushTimerRef.current = setTimeout(() => {
      pushTimerRef.current = null;
      flushQueue();
    }, delay);
  }

  function scheduleRetry() {
    if (retryTimerRef.current) clearTimeout(retryTimerRef.current);
    const attempt = retryAttemptRef.current++;
    const delay = Math.min(60000, 5000 * Math.pow(2, attempt)); // 5 s, 10 s, 20 s, 40 s, 60 s...
    retryTimerRef.current = setTimeout(() => {
      retryTimerRef.current = null;
      flushQueue();
    }, delay);
  }

  // Sube a Supabase todo lo pendiente. Si la nube cambió desde la última vez que este
  // dispositivo estuvo al día (otro dispositivo guardó algo), fusiona antes de subir.
  // Si falla, lo reintenta solo más tarde; sin conexión espera al evento "online".
  async function flushQueue() {
    if (!supabaseRef.current || !ownerRef.current) return;
    if (pendingRef.current.length === 0) return;
    if (flushingRef.current) {
      flushAgainRef.current = true;
      return;
    }
    if (!navigator.onLine) {
      setSyncStatus("offline");
      scheduleRetry(); // por si el evento "online" no llega (pasa a veces en iPad)
      return;
    }
    flushingRef.current = true;
    setSyncStatus("syncing");
    let result = "error";
    const code = ownerRef.current;
    try {
      const snapshot = dataRef.current;
      const { data: row, error } = await supabaseRef.current
        .from(TABLE)
        .select("data, updated_at")
        .eq(OWNER_COL, ownerRef.current)
        .maybeSingle();
      if (error) throw error;
      if (ownerRef.current !== code) {
        result = "stale";
        return;
      }
      const remoteUpdatedAt = row ? new Date(row.updated_at).getTime() : 0;
      if (row && row.data && isEmptyData(snapshot) && !isEmptyData(row.data)) {
        // Este dispositivo no tiene datos y la nube sí: se descarga en vez de subir
        applyRemoteData(row.data, remoteUpdatedAt);
        setPending([]);
        result = "retry-now";
        return;
      }
      let toUpload = snapshot;
      if (row && row.data && remoteUpdatedAt > getLastRemoteUpdatedAt()) {
        const merged = mergePendingIntoRemote(row.data, snapshot, pendingRef.current);
        toUpload = {
          ...merged,
          squad: migrateSquadPositions(merged.squad || []),
          setPiecePositions: migrateSetPiecePositions(merged.setPiecePositions || {}),
          updatedAt: Math.max(Date.now(), remoteUpdatedAt + 1),
        };
        if (dataRef.current !== snapshot) {
          // Hubo cambios mientras se descargaba: se repite con los datos al día
          flushAgainRef.current = true;
          result = "retry-now";
          return;
        }
        setData(toUpload);
        dataRef.current = toUpload;
        saveLocalData(toUpload);
        if (matchRef.current) {
          const refreshed = toUpload.matchesById[matchRef.current.id];
          if (refreshed) setMatch(refreshed);
        }
      }
      result = await pushToSupabase(toUpload);
      if (result === "ok") setCloudCheckedFor(code);
    } catch (e) {
      console.error("Error subiendo cambios pendientes", e);
      setSyncStatus(navigator.onLine ? "error" : "offline");
    } finally {
      flushingRef.current = false;
      if (result === "ok" || result === "retry-now") {
        retryAttemptRef.current = 0;
        if (flushAgainRef.current || pendingRef.current.length > 0) {
          flushAgainRef.current = false;
          scheduleFlush(300);
        }
      } else if (result === "error") {
        flushAgainRef.current = false;
        scheduleRetry();
      } else {
        flushAgainRef.current = false; // "blocked" (espera a que el usuario revise) o "stale" (cambió de equipo)
      }
    }
  }

  function applyRemoteData(remoteData, remoteUpdatedAt) {
    const merged = {
      ...emptyData(),
      ...remoteData,
      squad: migrateSquadPositions(remoteData.squad || []),
      setPiecePositions: migrateSetPiecePositions(remoteData.setPiecePositions || {}),
      updatedAt: remoteUpdatedAt,
    };
    setData(merged);
    dataRef.current = merged;
    saveLocalData(merged);
    setLastRemoteUpdatedAt(remoteUpdatedAt);
    if (matchRef.current) {
      const refreshed = merged.matchesById[matchRef.current.id];
      if (refreshed) setMatch(refreshed);
    }
  }

  async function pullFromSupabase() {
    if (!supabaseRef.current || !ownerRef.current) return;
    // Con cambios sin subir, nunca se descarga encima: se suben (fusionando si hace falta)
    if (pendingRef.current.length > 0) {
      retryAttemptRef.current = 0;
      return flushQueue();
    }
    if (!navigator.onLine) {
      setSyncStatus("offline");
      return;
    }
    setSyncStatus("syncing");
    const code = ownerRef.current;
    try {
      const { data: row, error } = await supabaseRef.current
        .from(TABLE)
        .select("data, updated_at")
        .eq(OWNER_COL, code)
        .maybeSingle();
      if (error) throw error;
      if (ownerRef.current !== code) return; // cambió de equipo mientras se descargaba
      if (row && row.data) {
        const remoteUpdatedAt = new Date(row.updated_at).getTime();
        if (remoteUpdatedAt > dataRef.current.updatedAt || (isEmptyData(dataRef.current) && !isEmptyData(row.data))) {
          applyRemoteData(row.data, remoteUpdatedAt);
        } else if (dataRef.current.updatedAt > remoteUpdatedAt) {
          if ((await pushToSupabase(dataRef.current)) !== "ok") return;
        } else {
          setLastRemoteUpdatedAt(remoteUpdatedAt);
        }
      } else {
        if ((await pushToSupabase(dataRef.current)) !== "ok") return;
      }
      setSyncStatus("synced");
      setLastSyncedAt(Date.now());
      setCloudCheckedFor(code);
    } catch (e) {
      console.error("Error sincronizando con Supabase", e);
      setSyncStatus("error");
    }
  }

  // Cambiar de cuenta cambia de "cajón": se cargan los datos locales de esa cuenta (vacíos si
  // es la primera vez en este dispositivo) y nunca se llevan los de la anterior. Lo pendiente
  // de subir de la cuenta anterior se queda en su cola y se sube cuando vuelva a entrar.
  // Solo al entrar desde el modo sin sesión se conservan los datos que hubiera (son del propio
  // usuario en este dispositivo) si la cuenta aún no tiene nada aquí.
  function switchOwner(id) {
    const prevId = ownerRef.current;
    if (id === prevId) return;
    if (pushTimerRef.current) clearTimeout(pushTimerRef.current);
    if (retryTimerRef.current) clearTimeout(retryTimerRef.current);
    pushTimerRef.current = null;
    retryTimerRef.current = null;
    retryAttemptRef.current = 0;

    const carryOver =
      !prevId && id && localStorage.getItem(teamKey(DATA_KEY, id)) == null && !isEmptyData(dataRef.current);
    const current = dataRef.current;
    setActiveTeamCode(id);
    ownerRef.current = id;
    let next;
    if (carryOver) {
      next = current;
      saveLocalData(next);
      try { localStorage.removeItem(teamKey(DATA_KEY, "")); } catch (e) { /* no crítico */ }
    } else {
      next = loadLocalData();
    }
    setData(next);
    dataRef.current = next;
    setPending(loadPending());
    setMatch(null);
    matchRef.current = null;
    setView((v) => (v === "sync" ? v : "home"));
    setSyncStatus(computeStatus());
    // La descarga de la nube la hace el efecto de tiempo real al cambiar `ownerId`
  }

  function handleAuthUser(user) {
    const next = user ? { id: user.id, email: user.email || "", accountType: accountTypeOf(user) } : null;
    const prevId = ownerRef.current;
    if ((next ? next.id : "") !== prevId) switchOwner(next ? next.id : "");
    setStoredAuthUser(next);
    setAuthUser((cur) =>
      cur && next && cur.id === next.id && cur.email === next.email && cur.accountType === next.accountType ? cur : next
    );
  }

  /* --- Cuenta (Supabase Auth, email + contraseña) --- */
  function authErrorMessage(error) {
    const msg = (error && error.message) || "";
    if (/invalid login credentials/i.test(msg)) return "Email o contraseña incorrectos.";
    if (/email not confirmed/i.test(msg)) return "Aún no has confirmado el email: revisa tu correo.";
    if (/already registered|already been registered/i.test(msg)) return "Ya existe una cuenta con ese email: usa Entrar.";
    if (/password should be at least/i.test(msg)) return "La contraseña debe tener al menos 6 caracteres.";
    if (/fetch|network/i.test(msg)) return "Sin conexión: hace falta internet para entrar o crear la cuenta.";
    return msg || "No se pudo completar.";
  }

  async function signIn(email, password) {
    if (!supabaseRef.current) return { error: "Primero guarda la conexión con Supabase." };
    const { data: res, error } = await supabaseRef.current.auth.signInWithPassword({ email, password });
    if (error) return { error: authErrorMessage(error) };
    if (res && res.user) handleAuthUser(res.user);
    return { ok: true };
  }

  async function signUp(email, password) {
    if (!supabaseRef.current) return { error: "Primero guarda la conexión con Supabase." };
    const { data: res, error } = await supabaseRef.current.auth.signUp({
      email,
      password,
      options: { emailRedirectTo: window.location.origin },
    });
    if (error) return { error: authErrorMessage(error) };
    if (res && res.session && res.user) {
      handleAuthUser(res.user);
      return { ok: true };
    }
    return { info: "Cuenta creada. Te hemos enviado un email para confirmarla; después vuelve aquí y pulsa Entrar." };
  }

  async function signOut() {
    if (!supabaseRef.current) return;
    const n = pendingRef.current.length;
    const msg =
      n > 0
        ? `Hay ${n} cambio${n === 1 ? "" : "s"} sin subir. Se quedan guardados en este dispositivo y se subirán cuando vuelvas a entrar con esta cuenta. ¿Cerrar sesión?`
        : "¿Cerrar sesión en este dispositivo? Tus datos siguen en la nube y volverán al entrar.";
    if (!window.confirm(msg)) return;
    await supabaseRef.current.auth.signOut({ scope: "local" });
    handleAuthUser(null);
  }

  // Recuperar contraseña. Sin `code`: envía el email (con un código de 6 cifras y, además, un
  // enlace). Con `code`: lo comprueba y pone la contraseña nueva desde la propia app, sin
  // depender del enlace (que en iPad se gasta con la vista previa y se abre en el navegador).
  async function resetPassword(email, code, newPassword) {
    const client = supabaseRef.current;
    if (!client) return { error: "Primero guarda la conexión con Supabase." };
    if (!code) {
      const { error } = await client.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin });
      if (error) return { error: authErrorMessage(error) };
      return { info: "Te hemos enviado un email con un código. Escríbelo abajo junto a tu nueva contraseña.", codeSent: true };
    }
    codeRecoveryRef.current = true;
    try {
      const { data: res, error } = await client.auth.verifyOtp({ email, token: String(code).trim(), type: "recovery" });
      if (error) {
        return {
          error: /expired|invalid/i.test(error.message || "")
            ? "El código no es válido o ha caducado. Usa el del último email que pediste, o pide otro."
            : authErrorMessage(error),
        };
      }
      const { error: pwdError } = await client.auth.updateUser({ password: newPassword });
      if (res && res.user) handleAuthUser(res.user);
      if (pwdError) return { error: `Has entrado en tu cuenta, pero no se pudo cambiar la contraseña: ${authErrorMessage(pwdError)}` };
      return { ok: true, info: "Contraseña cambiada. Ya has entrado con tu cuenta." };
    } finally {
      codeRecoveryRef.current = false;
    }
  }

  async function saveNewPassword(pwd) {
    if (!supabaseRef.current) return { error: "No hay conexión con Supabase en este navegador." };
    const { error } = await supabaseRef.current.auth.updateUser({ password: pwd });
    return error ? { error: authErrorMessage(error) } : { ok: true };
  }

  function saveSupabaseConfig(url, key) {
    setStoredSupabaseConfig(url, key);
    setSupabaseConfig({ url, key });
  }

  // Escapes manuales para cuando el aviso automático de pérdida de datos no basta:
  // forzar que gane este dispositivo, o forzar que gane la nube.
  async function forcePushToCloud() {
    if (!supabaseRef.current || !ownerRef.current) return;
    if (
      !window.confirm(
        "Esto sobrescribirá los datos de la nube con los de este dispositivo, sin comprobaciones. ¿Continuar?"
      )
    )
      return;
    await pushToSupabase(dataRef.current, { force: true });
  }

  async function forcePullFromCloud() {
    if (!supabaseRef.current || !ownerRef.current) return;
    if (
      !window.confirm(
        "Esto sobrescribirá los datos de este dispositivo con los de la nube. ¿Continuar?"
      )
    )
      return;
    setSyncStatus("syncing");
    try {
      const { data: row, error } = await supabaseRef.current
        .from(TABLE)
        .select("data, updated_at")
        .eq(OWNER_COL, ownerRef.current)
        .maybeSingle();
      if (error) throw error;
      if (row && row.data) {
        applyRemoteData(row.data, new Date(row.updated_at).getTime());
        setPending([]); // el usuario eligió que gane la nube
        setSyncStatus("synced");
        setLastSyncedAt(Date.now());
      } else {
        window.alert("No hay datos en la nube para este código de equipo.");
        setSyncStatus(computeStatus());
      }
    } catch (e) {
      console.error("Error descargando de Supabase", e);
      setSyncStatus("error");
    }
  }

  /* --- Histórico de copias en la nube --- */
  const [history, setHistory] = useState([]);
  const [historyLoading, setHistoryLoading] = useState(false);

  async function loadHistory() {
    if (!supabaseRef.current || !ownerRef.current) return;
    setHistoryLoading(true);
    try {
      const { data: rows, error } = await supabaseRef.current
        .from(HISTORY_TABLE)
        .select("id, data, created_at")
        .eq(OWNER_COL, ownerRef.current)
        .order("created_at", { ascending: false })
        .limit(20);
      if (error) throw error;
      setHistory(rows || []);
    } catch (e) {
      console.error("Error cargando histórico", e);
    } finally {
      setHistoryLoading(false);
    }
  }

  async function restoreFromHistory(entry) {
    const squadLen = (entry.data.squad || []).length;
    const matchesLen = (entry.data.matchesList || []).length;
    const when = new Date(entry.created_at).toLocaleString();
    if (
      !window.confirm(
        `¿Restaurar la copia del ${when}?\n\n` +
          `Esa copia tiene ${squadLen} jugador${squadLen === 1 ? "" : "es"} y ${matchesLen} partido${matchesLen === 1 ? "" : "s"}.\n\n` +
          `Se sustituirán los datos actuales de este dispositivo y de la nube por esta copia.`
      )
    )
      return;
    const stamped = {
      ...emptyData(),
      ...entry.data,
      squad: migrateSquadPositions(entry.data.squad || []),
      setPiecePositions: migrateSetPiecePositions(entry.data.setPiecePositions || {}),
      updatedAt: Date.now(),
    };
    setData(stamped);
    dataRef.current = stamped;
    saveLocalData(stamped);
    await pushToSupabase(stamped, { force: true });
  }

  /* --- Copiar a la cuenta los datos de la época del código de equipo --- */
  // Solo lee: la fila antigua de la nube y lo guardado en este dispositivo con ese código.
  // No borra ni modifica nada de lo antiguo.
  async function inspectLegacyData(code) {
    const result = { cloud: null, local: null, cloudError: null, board: null };
    try {
      const raw = localStorage.getItem(teamKey(DATA_KEY, code));
      if (raw) result.local = JSON.parse(raw);
    } catch (e) {
      /* sin copia local */
    }
    // La Pizarra nunca se sincronizó con la nube: solo existe en el dispositivo donde se hizo
    const board = parsePitchBoard(localStorage.getItem(teamKey(PITCH_BOARD_KEY, code)));
    if (board && (Object.keys(board.positions).length || board.strokes.length)) result.board = board;
    if (configured && window.supabase) {
      // Cliente sin sesión (rol anon), que es el que tenía acceso a la tabla antigua
      const read = async (withHeader) => {
        const legacyClient = window.supabase.createClient(supabaseConfig.url, supabaseConfig.key, {
          auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false, storageKey: "statix-legacy-anon" },
          ...(withHeader ? { global: { headers: { "x-team-code": code } } } : {}),
        });
        return legacyClient.from(LEGACY_TABLE).select("data, updated_at").eq("team_code", code).maybeSingle();
      };
      try {
        let res = await read(true);
        if (res.error) res = await read(false);
        if (res.error) throw res.error;
        if (res.data && res.data.data) {
          result.cloud = { ...res.data.data, updatedAt: new Date(res.data.updated_at).getTime() };
        }
      } catch (e) {
        result.cloudError = (e && e.message) || "No se pudo leer la nube";
      }
    }
    return result;
  }

  function downloadJSON(obj, name) {
    const blob = new Blob([JSON.stringify(obj, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  // Copias de seguridad antes de copiar: lo que se va a copiar y lo que ya hubiera en la cuenta
  // Copias de seguridad de lo que se va a copiar y de lo que se va a sustituir en la cuenta
  function backupBeforeLegacyImport(source, code, board) {
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    const slug = pdfFileSlug(code);
    if (source) {
      downloadJSON(source, `statix_backup_codigo_${slug}_${stamp}.json`);
      const cur = dataRef.current;
      if ((cur.squad || []).length || (cur.matchesList || []).length) {
        downloadJSON(cur, `statix_backup_cuenta_antes_de_copiar_${stamp}.json`);
      }
    }
    if (board) {
      downloadJSON(board, `statix_backup_pizarra_codigo_${slug}_${stamp}.json`);
      const curBoard = loadPitchBoard();
      if (Object.keys(curBoard.positions).length || curBoard.strokes.length) {
        downloadJSON(curBoard, `statix_backup_pizarra_cuenta_antes_de_copiar_${stamp}.json`);
      }
    }
  }

  // `source`: datos (plantilla, partidos, balón parado...) o null para no tocarlos.
  // `board`: Pizarra de este dispositivo o null. Se guarda en la de la cuenta activa, en este
  // dispositivo (como siempre, la Pizarra no se sincroniza entre dispositivos).
  function importLegacyData(source, board) {
    if (board) {
      try {
        localStorage.setItem(teamKey(PITCH_BOARD_KEY), JSON.stringify({ positions: board.positions, strokes: board.strokes }));
      } catch (e) {
        console.error("Error copiando la Pizarra", e);
        window.alert("No se pudo copiar la Pizarra en este dispositivo.");
      }
    }
    if (!source) return;
    const merged = {
      ...emptyData(),
      ...source,
      squad: migrateSquadPositions(source.squad || []),
      setPiecePositions: migrateSetPiecePositions(source.setPiecePositions || {}),
    };
    commit(merged);
  }

  /* --- Copia de seguridad manual (JSON) --- */
  function exportJSON() {
    const blob = new Blob([JSON.stringify(dataRef.current, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    const stamp = new Date().toISOString().replace(/[:.]/g, "-");
    a.href = url;
    a.download = `statix_backup_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function importJSON(file) {
    const reader = new FileReader();
    reader.onerror = () => window.alert("No se pudo leer el archivo.");
    reader.onload = () => {
      let parsed;
      try {
        parsed = JSON.parse(reader.result);
      } catch (e) {
        window.alert("El archivo no es un JSON válido.");
        return;
      }
      if (!parsed || !Array.isArray(parsed.squad) || !Array.isArray(parsed.matchesList)) {
        window.alert("El archivo no tiene el formato esperado de una copia de Statix.");
        return;
      }
      const currentSquad = dataRef.current.squad.length;
      const currentMatches = dataRef.current.matchesList.length;
      const importSquad = parsed.squad.length;
      const importMatches = parsed.matchesList.length;
      if (
        !window.confirm(
          `Vas a importar una copia con ${importSquad} jugador${importSquad === 1 ? "" : "es"} y ${importMatches} partido${importMatches === 1 ? "" : "s"}.\n\n` +
            `Los datos actuales de este dispositivo (${currentSquad} jugador${currentSquad === 1 ? "" : "es"}, ${currentMatches} partido${currentMatches === 1 ? "" : "s"}) se sustituirán. ¿Continuar?`
        )
      )
        return;
      const merged = {
        ...emptyData(),
        ...parsed,
        squad: migrateSquadPositions(parsed.squad || []),
        setPiecePositions: migrateSetPiecePositions(parsed.setPiecePositions || {}),
      };
      commit(merged);
    };
    reader.readAsText(file);
  }

  // Sincroniza al arrancar y suscribe a cambios en tiempo real
  useEffect(() => {
    if (!supabaseRef.current || !ownerId) return;
    pullFromSupabase();

    const channel = supabaseRef.current
      .channel(`statix_user_${ownerId}`)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: TABLE, filter: `${OWNER_COL}=eq.${ownerId}` },
        (payload) => {
          const row = payload.new;
          if (!row || row.device_id === deviceId) return;
          if (row[OWNER_COL] !== ownerRef.current) return; // nunca datos de otra cuenta
          const remoteUpdatedAt = new Date(row.updated_at).getTime();
          if (pendingRef.current.length > 0) {
            flushQueue(); // fusiona lo del otro dispositivo con lo pendiente de este
          } else if (remoteUpdatedAt > dataRef.current.updatedAt) {
            applyRemoteData(row.data, remoteUpdatedAt);
          }
        }
      )
      .subscribe();

    // Respaldo del tiempo real (si el canal se corta o tarda): se comprueba la nube cada 30 s
    // mientras la app está a la vista.
    const poll = setInterval(() => {
      if (!document.hidden && navigator.onLine) pullFromSupabase();
    }, 30000);

    const client = supabaseRef.current;
    return () => {
      clearInterval(poll);
      client.removeChannel(channel);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [ownerId, configured, supabaseConfig.url, supabaseConfig.key]);

  // Reintenta al recuperar conexión / volver a la pestaña
  useEffect(() => {
    function handleOnline() {
      setOnline(true);
      retryAttemptRef.current = 0;
      pullFromSupabase(); // con cambios pendientes, esto los sube
    }
    function handleOffline() {
      setOnline(false);
      setSyncStatus(computeStatus());
    }
    function handleVisibility() {
      if (document.hidden && pushTimerRef.current) {
        clearTimeout(pushTimerRef.current);
        pushTimerRef.current = null;
        flushQueue();
      } else if (!document.hidden) {
        pullFromSupabase();
      }
    }
    window.addEventListener("online", handleOnline);
    window.addEventListener("offline", handleOffline);
    document.addEventListener("visibilitychange", handleVisibility);
    return () => {
      window.removeEventListener("online", handleOnline);
      window.removeEventListener("offline", handleOffline);
      document.removeEventListener("visibilitychange", handleVisibility);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* --- Mutación central de datos --- */

  // Todo cambio se guarda primero en local y se apunta en la cola; la subida va aparte y,
  // sin conexión, simplemente espera.
  function commit(nextData, { syncNow = true } = {}) {
    // Rojas y acumulación de amarillas nuevas → Sancionados (ver applySanctionTriggers)
    nextData = applySanctionTriggers(nextData);
    const prev = dataRef.current;
    const stamped = { ...nextData, updatedAt: Math.max(Date.now(), (prev.updatedAt || 0) + 1) };
    setData(stamped);
    dataRef.current = stamped;
    saveLocalData(stamped);
    enqueueChange(prev, stamped, !syncNow);
    if (!supabaseRef.current || !ownerRef.current) return;
    if (!navigator.onLine) {
      setSyncStatus("offline");
      return;
    }
    scheduleFlush(syncNow ? 0 : 1500);
  }

  function saveSquad(updatedSquad) {
    commit({ ...dataRef.current, squad: updatedSquad });
  }

  // Buscador de equipo (cuentas nuevas): con el equipo elegido se averigua su grupo de liga y
  // se guardan nombre, códigos FFCV y duración de las partes; después se traen su escudo, los
  // escudos de los rivales y el calendario. La clasificación sale sola con el grupo guardado.
  // Con `replace` (cambiar de equipo desde Ajustes): antes se quitan los partidos programados, aún
  // sin jugar, que vinieron del calendario del equipo anterior, y el escudo propio pasa a ser el
  // del equipo nuevo. Plantilla, partidos jugados, estadísticas y notas no se tocan.
  async function chooseFfcvTeam(t, { replace = false } = {}) {
    if (replace) {
      const prevCode = normalizeTeamProfile(dataRef.current.team).ffcvTeamCode;
      const cur = dataRef.current;
      const stale = (cur.matchesList || [])
        .filter((m) => m.scheduled && !m.finished && m.ffcvTeamCode && m.ffcvTeamCode === prevCode && prevCode !== t.codequipo)
        .map((m) => m.id);
      const crests = cur.crests || emptyCrests();
      const byId = { ...cur.matchesById };
      stale.forEach((id) => delete byId[id]);
      commit({
        ...cur,
        matchesList: cur.matchesList.filter((m) => !stale.includes(m.id)),
        matchesById: byId,
        crests: t.escudo ? crests : { ...crests, own: null },
      });
    }
    let group = null;
    try {
      const r = await fetch(
        `/api/buscar-equipo?codequipo=${encodeURIComponent(t.codequipo)}&categoria=${encodeURIComponent(t.codigoCategoria)}`
      );
      const body = await r.json();
      if (r.ok && body.codGrupo) group = body;
    } catch (e) {
      /* sin grupo: se guarda igualmente el equipo */
    }
    saveTeamProfile({
      name: t.nombre,
      ffcvTeamCode: t.codequipo,
      ffcvGroupCode: group ? group.codGrupo : "",
      ...(group && group.halfLength ? { defaultHalfLength: group.halfLength } : {}),
    });
    if (t.escudo) {
      try {
        const ir = await fetch("/api/escudo?p=" + encodeURIComponent(t.escudo));
        if (ir.ok) await saveCrest("own", null, await resizeCrest(await ir.blob()));
      } catch (e) {
        /* sin escudo: se puede elegir a mano en Inicio */
      }
    }
    if (group) {
      importFfcvCrests();
      importFfcvCalendar();
    }
    return group;
  }

  // Perfil del equipo (nombre, FFCV, duración por defecto): viaja con el resto de datos
  function saveTeamProfile(profile) {
    commit({ ...dataRef.current, team: { ...normalizeTeamProfile(dataRef.current.team), ...profile } });
  }

  // Pesos de la nota de este equipo: viajan con el resto de datos a Supabase
  function saveRatingConfig(config) {
    commit({ ...dataRef.current, ratingConfig: normalizeRatingConfig(config) }, { syncNow: true });
  }

  function saveSetPiecePositions(category, positions) {
    commit({
      ...dataRef.current,
      setPiecePositions: { ...(dataRef.current.setPiecePositions || {}), [category]: positions },
    });
  }

  // kind: "own" (nuestro escudo) o "rival" (el del equipo `name`)
  async function saveCrest(kind, name, dataUrl) {
    dataUrl = await removeWhiteBackground(dataUrl);
    const crests = dataRef.current.crests || emptyCrests();
    const next =
      kind === "own"
        ? { ...crests, own: dataUrl, ownNoBg: true }
        : { ...crests, rivals: { ...crests.rivals, [crestKey(name)]: dataUrl } };
    commit({ ...dataRef.current, crests: next });
  }

  // Los escudos ya guardados (de antes de este cambio) también pierden el fondo blanco, una sola vez
  useEffect(() => {
    const c = data.crests;
    if (!c || (c.ownNoBg && c.rivalsNoBg)) return;
    // Sin escudos no hay nada que convertir: no se guarda nada (un dispositivo nuevo no debe
    // marcar sus datos vacíos como "más recientes" que los de la nube)
    if (!c.own && !Object.keys(c.rivals || {}).length) return;
    (async () => {
      const own = c.own && !c.ownNoBg ? await removeWhiteBackground(c.own) : c.own;
      let rivals = c.rivals;
      if (!c.rivalsNoBg) {
        const entries = await Promise.all(
          Object.entries(c.rivals).map(async ([k, v]) => [k, await removeWhiteBackground(v)])
        );
        rivals = Object.fromEntries(entries);
      }
      const cur = dataRef.current.crests;
      if (cur && cur.own === c.own && cur.rivals === c.rivals) {
        commit({ ...dataRef.current, crests: { ...cur, own, ownNoBg: true, rivals, rivalsNoBg: true } });
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data.crests]);

  // Descarga de la FFCV los escudos de todos los equipos del grupo (el nuestro incluido).
  // Solo rellena los que aún no tienen escudo: los que hayas elegido a mano no se tocan.
  async function importFfcvCrests() {
    const profile = normalizeTeamProfile(dataRef.current.team);
    if (!profile.ffcvGroupCode) {
      setCrestImport({ loading: false, message: "Primero configura el grupo de la FFCV en Ajustes → Mi equipo." });
      return;
    }
    setCrestImport({ loading: true, message: null });
    try {
      const r = await fetch(`/api/clasificacion?cod_grupo=${encodeURIComponent(profile.ffcvGroupCode)}`);
      const body = await r.json();
      if (!r.ok) throw new Error(body.error || "No se pudo consultar la FFCV");
      const teams = (body.clasificacion || []).filter((t) => t.escudo);
      const base = dataRef.current.crests || emptyCrests();
      const missing = teams.filter((t) =>
        t.codequipo === profile.ffcvTeamCode ? !base.own : !base.rivals[crestKey(t.nombre)]
      );
      const results = await Promise.all(
        missing.map(async (t) => {
          try {
            const ir = await fetch("/api/escudo?p=" + encodeURIComponent(t.escudo));
            if (!ir.ok) throw new Error("sin imagen");
            return { team: t, url: await removeWhiteBackground(await resizeCrest(await ir.blob())) };
          } catch (e) {
            return { team: t, url: null };
          }
        })
      );
      const current = dataRef.current.crests || emptyCrests();
      let own = current.own;
      const rivals = { ...current.rivals };
      let added = 0;
      let failed = 0;
      results.forEach(({ team, url }) => {
        if (!url) {
          failed++;
          return;
        }
        if (team.codequipo === profile.ffcvTeamCode) own = url;
        else rivals[crestKey(team.nombre)] = url;
        added++;
      });
      const ownChanged = own !== current.own;
      if (added > 0) {
        const latest = dataRef.current.crests || emptyCrests();
        commit({
          ...dataRef.current,
          crests: { ...latest, own: ownChanged ? own : latest.own, ownNoBg: ownChanged ? true : latest.ownNoBg, rivals: { ...latest.rivals, ...rivals } },
        });
      }
      const msg =
        added === 0 && failed === 0
          ? "Ya tienes los escudos de todos los equipos del grupo."
          : `Escudos descargados de la FFCV: ${added}.` + (failed ? ` No se pudieron descargar ${failed}.` : "");
      setCrestImport({ loading: false, message: msg });
    } catch (e) {
      setCrestImport({ loading: false, message: `Error: ${e.message || "no se pudieron descargar los escudos"}` });
    }
  }

  function goHome() {
    setMatch(null);
    setView("home");
  }

  function goStats() {
    setMatch(null);
    setView("stats");
  }

  // Los sancionados con partidos pendientes no se pueden convocar: salen del once y quedan como
  // desconvocados con motivo "Sanción" (marcados para que no se puedan volver a convocar).
  function withSanctionsApplied(titulares, desconvocados) {
    const pending = pendingSanctionsByPlayer(dataRef.current);
    const nextDesconv = { ...desconvocados };
    dataRef.current.squad.forEach((p) => {
      if (pending[p.id]) nextDesconv[p.id] = { reason: "sancion", other: "", sanctioned: true };
    });
    return { titulares: titulares.filter((id) => !pending[id]), desconvocados: nextDesconv };
  }

  function updateSanction(id, remaining) {
    const n = Math.max(0, Math.min(99, Math.round(Number(remaining) || 0)));
    const sanctions = (dataRef.current.sanctions || [])
      .map((s) => (s.id === id ? { ...s, remaining: n } : s))
      .filter((s) => s.remaining > 0);
    commit({ ...dataRef.current, sanctions });
  }

  function createMatch({ opponent, date, halfLength, titulares: rawTitulares, desconvocados: rawDesconv = {}, isHome, competition = "liga" }) {
    const squad = dataRef.current.squad;
    const scheduled = date > todayISO();
    // Un partido programado se revisa al empezarlo; si se juega ya, se aplican las sanciones ahora
    const { titulares, desconvocados } = scheduled
      ? { titulares: rawTitulares, desconvocados: rawDesconv }
      : withSanctionsApplied(rawTitulares, rawDesconv);
    // Suplentes = el resto de la plantilla menos los desconvocados de este partido
    const bench = squad.filter((p) => !titulares.includes(p.id) && !desconvocados[p.id]).map((p) => p.id);
    const newMatch = {
      id: genId(),
      opponent,
      date,
      halfLength,
      half: 1,
      finished: false,
      scheduled,
      isHome,
      competition,
      clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1, runStartedAt: null },
      onPitch: titulares,
      bench,
      desconvocados,
      events: [],
      subs: [],
      concededSetPieces: [],
      teamEvents: [],
      opponentChances: [],
      positions: {},
      positionHistory: [],
      setPieceAssignments: {},
    };
    const updatedList = [
      ...dataRef.current.matchesList,
      { id: newMatch.id, opponent, date, finished: false, scheduled, isHome, competition },
    ];
    commit({
      ...dataRef.current,
      matchesList: updatedList,
      matchesById: { ...dataRef.current.matchesById, [newMatch.id]: newMatch },
    });
    if (scheduled) {
      setMatch(null);
      setView("home");
    } else {
      setMatch(newMatch);
      setView("live");
    }
  }

  function beginScheduledMatch(rawTitulares, rawDesconv = {}) {
    const squad = dataRef.current.squad;
    const { titulares, desconvocados } = withSanctionsApplied(rawTitulares, rawDesconv);
    const bench = squad.filter((p) => !titulares.includes(p.id) && !desconvocados[p.id]).map((p) => p.id);
    const updated = {
      ...match,
      scheduled: false,
      half: 1,
      onPitch: titulares,
      bench,
      desconvocados,
      clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1, runStartedAt: null },
    };
    setMatch(updated);
    const updatedList = dataRef.current.matchesList.map((m) =>
      m.id === updated.id ? { ...m, scheduled: false } : m
    );
    commit({
      ...dataRef.current,
      matchesList: updatedList,
      matchesById: { ...dataRef.current.matchesById, [updated.id]: updated },
    });
    setView("live");
  }

  function openMatch(id) {
    const m = dataRef.current.matchesById[id];
    if (!m) return;
    setMatch(m);
    setView(m.scheduled ? "scheduled" : m.finished ? "summary" : "live");
  }

  function importFfcvCalendar() {
    setCalendarImport({ loading: true, message: null });
    const profile = normalizeTeamProfile(dataRef.current.team);
    if (!profile.ffcvGroupCode || !profile.ffcvTeamCode) {
      setCalendarImport({ loading: false, message: "Primero elige tu grupo y tu equipo de la FFCV en Ajustes → Mi equipo." });
      return;
    }
    fetch(`/api/calendario?cod_grupo=${encodeURIComponent(profile.ffcvGroupCode)}&cod_equipo=${encodeURIComponent(profile.ffcvTeamCode)}`)
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        if (!ok || body.error) throw new Error(body.error || "No se pudo obtener el calendario");
        const fixtures = body.fixtures || [];
        const existing = dataRef.current.matchesList;
        const alreadyImported = (f) =>
          existing.some((m) => m.date === f.date && m.opponent.trim().toLowerCase() === f.opponent.trim().toLowerCase());
        const squad = dataRef.current.squad;
        const newFixtures = fixtures.filter((f) => !alreadyImported(f));

        if (newFixtures.length === 0) {
          setCalendarImport({ loading: false, message: "El calendario ya estaba importado, no hay partidos nuevos." });
          return;
        }

        const newMatches = newFixtures.map((f) => ({
          id: genId(),
          opponent: f.opponent,
          date: f.date,
          halfLength: profile.defaultHalfLength,
          half: 1,
          finished: false,
          scheduled: true,
          isHome: f.isHome,
          ffcvTeamCode: profile.ffcvTeamCode, // de qué equipo de la FFCV viene este partido del calendario
          clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1, runStartedAt: null },
          onPitch: [],
          bench: squad.map((p) => p.id),
          events: [],
          subs: [],
          concededSetPieces: [],
          teamEvents: [],
          opponentChances: [],
          positions: {},
          positionHistory: [],
          setPieceAssignments: {},
        }));

        const updatedList = [
          ...existing,
          ...newMatches.map((m) => ({
            id: m.id,
            opponent: m.opponent,
            date: m.date,
            finished: false,
            scheduled: true,
            isHome: m.isHome,
            ffcvTeamCode: m.ffcvTeamCode,
          })),
        ];
        const updatedById = { ...dataRef.current.matchesById };
        newMatches.forEach((m) => { updatedById[m.id] = m; });

        commit({ ...dataRef.current, matchesList: updatedList, matchesById: updatedById });
        setCalendarImport({
          loading: false,
          message: `Importados ${newMatches.length} partido${newMatches.length === 1 ? "" : "s"} del calendario de la FFCV.`,
        });
      })
      .catch((e) => setCalendarImport({ loading: false, message: `Error: ${e.message}` }));
  }

  function deleteMatch(id, opponent) {
    if (!window.confirm(`¿Eliminar el partido vs ${opponent}? Esta acción no se puede deshacer.`)) return;
    const { [id]: _removed, ...restMatchesById } = dataRef.current.matchesById;
    const updatedList = dataRef.current.matchesList.filter((m) => m.id !== id);
    commit({ ...dataRef.current, matchesList: updatedList, matchesById: restMatchesById });
    if (match && match.id === id) {
      setMatch(null);
      setView("home");
    }
  }

  function updateMatch(updated, persistNow) {
    setMatch(updated);
    commit(
      { ...dataRef.current, matchesById: { ...dataRef.current.matchesById, [updated.id]: updated } },
      { syncNow: persistNow }
    );
  }

  function finishMatch() {
    const updated = {
      ...match,
      half: "finalizado",
      finished: true,
      clock: { ...match.clock, running: false },
    };
    setMatch(updated);
    const updatedList = dataRef.current.matchesList.map((m) =>
      m.id === updated.id ? { ...m, finished: true } : m
    );
    // Partido de liga finalizado: un partido menos de sanción para cada sancionado
    commit(
      serveSanctions(
        {
          ...dataRef.current,
          matchesList: updatedList,
          matchesById: { ...dataRef.current.matchesById, [updated.id]: updated },
        },
        updated
      )
    );
    setView("summary");
  }

  function exportCSV() {
    // "nota" = nota final del jugador en el partido (vacía si no llegó a jugar)
    const ratings = computeMatchRatings(match, data.squad, ratingConfig);
    const noteOf = (playerId) => (ratings[playerId] != null ? ratings[playerId].toFixed(1) : "");
    const rows = [["partido", "fecha", "rival", "parte", "minuto", "dorsal", "jugador", "evento", "nota"]];
    match.events.forEach((e) => {
      rows.push([match.id, match.date, match.opponent, e.half, e.minute, e.playerNumber, e.playerName, EVENT_LABEL[e.type] || e.type, noteOf(e.playerId)]);
    });
    match.subs.forEach((s) => {
      rows.push([match.id, match.date, match.opponent, s.half, s.minute, s.outNumber, s.outName, `sale (entra ${s.inName})`, noteOf(s.outId)]);
      rows.push([match.id, match.date, match.opponent, s.half, s.minute, s.inNumber, s.inName, `entra (sale ${s.outName})`, noteOf(s.inId)]);
    });
    // Una fila de "nota final" por cada jugador que participó, de mayor a menor nota
    Object.keys(ratings)
      .map((id) => ({ id, p: data.squad.find((pp) => pp.id === id) }))
      .filter((r) => r.p)
      .sort((a, b) => ratings[b.id] - ratings[a.id])
      .forEach(({ id, p }) => {
        rows.push([match.id, match.date, match.opponent, "", "", p.number, p.name, "nota final", noteOf(id)]);
      });
    const csv = rows
      .map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(","))
      .join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `partido_${match.opponent.replace(/\s+/g, "_")}_${match.date}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  const isTabView = TAB_VIEWS.includes(view);
  const ratingConfig = normalizeRatingConfig(data.ratingConfig);
  const team = normalizeTeamProfile(data.team);
  const nextScheduledMatch =
    data.matchesList
      .filter((m) => m.scheduled)
      .sort((a, b) => (a.date > b.date ? 1 : -1))[0] || null;
  const seasonHighlights = computeSeasonHighlights(Object.values(data.matchesById), data.squad);
  const syncView = syncDisplay(syncStatus, online, pendingCount);
  const showTeamSetup =
    !!authUser && configured && cloudCheckedFor === ownerId && !team.ffcvTeamCode && !skipTeamSetup;

  return (
    <RatingConfigContext.Provider value={ratingConfig}>
    <div className="mp-app">
      <GlobalStyles />
      {showTeamSetup && <TeamSetup onChoose={chooseFfcvTeam} onSkip={() => setSkipTeamSetup(true)} />}
      {recoveryOpen && (
        <NewPasswordOverlay email={authUser && authUser.email} onSave={saveNewPassword} onClose={() => setRecoveryOpen(false)} />
      )}
      {authLinkError && (
        <AuthLinkErrorOverlay
          message={authLinkError}
          onClose={() => {
            setAuthLinkError(null);
            try {
              window.history.replaceState(null, "", window.location.pathname); // quita el error de la dirección
            } catch (e) {
              /* no crítico */
            }
          }}
        />
      )}
      {changingTeam && (
        <TeamSetup
          mode="change"
          currentName={team.name}
          onChoose={(t) => chooseFfcvTeam(t, { replace: true })}
          confirmChoice={(t) =>
            window.confirm(
              `¿Cambiar tu equipo a «${t.nombre}» (${t.categoria})?\n\n` +
                `Cambia el equipo de referencia de la FFCV: clasificación, calendario, escudo y rivales. ` +
                `Los partidos programados que vinieron del calendario del equipo anterior y aún no se han jugado se quitan.\n\n` +
                `No se toca ni se borra nada más: tu plantilla, los partidos jugados, las estadísticas y las puntuaciones se quedan igual.`
            )
          }
          onSkip={() => setChangingTeam(false)}
        />
      )}
      <div style={isTabView ? { paddingBottom: 64 } : undefined}>
        {view === "home" && (
          <Home
            needsLogin={configured && !authUser}
            teamName={team.name}
            crests={data.crests}
            onSaveCrest={saveCrest}
            syncStatus={syncView}
            onGoSync={() => setView("sync")}
            onNewMatch={() => setView("setup")}
            nextMatch={nextScheduledMatch}
            onOpenMatch={openMatch}
            highlights={seasonHighlights}
          />
        )}
        {view === "partidos" && (
          <MatchesTab
            team={team}
            matches={data.matchesList}
            crests={data.crests}
            onOpenMatch={openMatch}
            onDeleteMatch={deleteMatch}
            onImportCalendar={importFfcvCalendar}
            calendarImport={calendarImport}
            onImportCrests={importFfcvCrests}
            crestImport={crestImport}
          />
        )}
        {view === "squad" && (
          <SquadManager
            sanctions={data.sanctions || []}
            onUpdateSanction={updateSanction}
            squad={data.squad}
            matches={Object.values(data.matchesById)}
            onSave={saveSquad}
            onBack={goHome}
          />
        )}
        {view === "stats" && (
          <StatsHub
            onGoSeason={() => setView("season")}
            onGoSetPieces={() => setView("setpieces")}
            onGoCharts={() => setView("charts")}
            onGoPitch={() => setView("pitch")}
          />
        )}
        {view === "sync" && (
          <SyncSettings
            status={syncStatus}
            display={syncView}
            authUser={authUser}
            lastSyncedAt={lastSyncedAt}
            supabaseUrl={supabaseConfig.url}
            supabaseKey={supabaseConfig.key}
            configured={configured}
            onSignIn={signIn}
            onSignUp={signUp}
            onSignOut={signOut}
            onResetPassword={resetPassword}
            onInspectLegacy={inspectLegacyData}
            onBackupLegacy={backupBeforeLegacyImport}
            onImportLegacy={importLegacyData}
            accountData={data}
            onSaveConfig={saveSupabaseConfig}
            onSyncNow={pullFromSupabase}
            onForcePush={forcePushToCloud}
            onForcePull={forcePullFromCloud}
            history={history}
            historyLoading={historyLoading}
            onLoadHistory={loadHistory}
            onRestoreHistory={restoreFromHistory}
            onExportJSON={exportJSON}
            onImportJSON={importJSON}
            ratingConfig={ratingConfig}
            onSaveRatingConfig={saveRatingConfig}
            isOwner={isOwnerAccount}
            onChangeTeam={() => setChangingTeam(true)}
            team={team}
            crests={data.crests}
            onSaveTeam={saveTeamProfile}
            onSaveCrest={saveCrest}
            onBack={goHome}
          />
        )}
        {view === "setup" && (
          <MatchSetup
            sanctioned={pendingSanctionsByPlayer(data)}
            defaultHalfLength={team.defaultHalfLength}
            teamFormation={team.defaultFormation}
            formationChosen={!!team.formationChosen}
            onChooseFormation={(id) => saveTeamProfile({ defaultFormation: id, formationChosen: true })}
            squad={data.squad}
            crests={data.crests}
            onSaveCrest={saveCrest}
            onCreate={createMatch}
            onBack={goHome}
            onGoSquad={() => setView("squad")}
          />
        )}
        {view === "scheduled" && match && (
          <ScheduledMatch
            sanctioned={pendingSanctionsByPlayer(data)}
            match={match}
            squad={data.squad}
            crests={data.crests}
            onSaveCrest={saveCrest}
            onStart={beginScheduledMatch}
            onDelete={() => deleteMatch(match.id, match.opponent)}
            onBack={goHome}
            teamFormation={team.defaultFormation}
            formationChosen={!!team.formationChosen}
            onChooseFormation={(id) => saveTeamProfile({ defaultFormation: id, formationChosen: true })}
          />
        )}
        {view === "live" && match && (
          <LiveMatch
            match={match}
            squad={data.squad}
            crests={data.crests}
            setPiecePositions={data.setPiecePositions || {}}
            onSaveCrest={saveCrest}
            onUpdate={updateMatch}
            onFinish={finishMatch}
            onBack={goHome}
            syncView={syncView}
            defaultFormation={team.defaultFormation}
          />
        )}
        {view === "summary" && match && (
          <MatchSummary match={match} squad={data.squad} crests={data.crests} teamName={team.name} onBack={goHome} onExport={exportCSV} onUpdate={updateMatch} onReplay={() => setView("replay")} />
        )}
        {view === "replay" && match && (
          <ReplayMatch match={match} squad={data.squad} crests={data.crests} onUpdate={updateMatch} onBack={() => setView("summary")} />
        )}
        {view === "season" && (
          <SeasonStats
            matches={Object.values(data.matchesById)}
            squad={data.squad}
            onBack={goStats}
            onGoCharts={() => setView("charts")}
          />
        )}
        {view === "charts" && (
          <PlayerChartsScreen
            players={data.squad}
            events={Object.values(data.matchesById).flatMap((m) => m.events)}
            teamEvents={Object.values(data.matchesById).flatMap((m) => m.teamEvents || [])}
            matches={Object.values(data.matchesById)}
            onBack={goStats}
          />
        )}
        {view === "setpieces" && (
          <SetPieceStats
            matches={Object.values(data.matchesById)}
            squad={data.squad}
            setPiecePositions={data.setPiecePositions || {}}
            onSaveSetPiecePositions={saveSetPiecePositions}
            onBack={goStats}
          />
        )}
        {view === "pitch" && <PitchScreen squad={data.squad} crests={data.crests} onBack={goStats} />}
      </div>
      {isTabView && <BottomNav active={view} onNavigate={setView} />}
    </div>
    </RatingConfigContext.Provider>
  );
}

// Antes de arrancar: los datos muy antiguos (sin código) pasan a las claves de su código de
// equipo, donde quedan disponibles para copiarlos a una cuenta; y se activa la última cuenta
// con sesión en este dispositivo (así se abre con sus datos también sin conexión).
migrateUnscopedStorage(getStoredTeamCode(), [DATA_KEY, PENDING_KEY, LAST_REMOTE_KEY, LEAGUE_CACHE_KEY, PITCH_BOARD_KEY]);
setActiveTeamCode((getStoredAuthUser() || {}).id || "");

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
