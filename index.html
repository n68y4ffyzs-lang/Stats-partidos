=========================================================== */
const TABLE = "registro_partido_data";
const SUPABASE_URL_KEY = "rp_supabase_url";
const SUPABASE_ANON_KEY_KEY = "rp_supabase_anon_key";

function isValidSupabaseConfig(url, key) {
  return !!(url && key && /^https?:\/\//.test(url));
}

function getStoredSupabaseConfig() {
  return {
    url: localStorage.getItem(SUPABASE_URL_KEY) || "",
    key: localStorage.getItem(SUPABASE_ANON_KEY_KEY) || "",
  };
}

function setStoredSupabaseConfig(url, key) {
  if (url) localStorage.setItem(SUPABASE_URL_KEY, url);
  else localStorage.removeItem(SUPABASE_URL_KEY);
  if (key) localStorage.setItem(SUPABASE_ANON_KEY_KEY, key);
  else localStorage.removeItem(SUPABASE_ANON_KEY_KEY);
}

function genId() {

function todayISO() {

}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

// Cálculo puro del tiempo transcurrido y el minuto a partir del propio match,
// sin depender de referencias locales que puedan quedarse desactualizadas entre componentes.
function computeElapsed(match) {
  const key = match.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";
  if (!match.clock.running) return match.clock[key];
  const startedAt = match.clock.runStartedAt || Date.now();
  return match.clock[key] + Math.floor((Date.now() - startedAt) / 1000);
}

function computeMinute(match) {
  const secs = computeElapsed(match);
  if (match.clock.activeHalf === 1) return Math.floor(secs / 60) + 1;
  return match.halfLength + Math.floor(secs / 60) + 1;
}

function halfLabel(match) {
  if (match.half === "descanso") return "Descanso";
  if (match.half === "finalizado") return "Finalizado";
  return match.half === 1 ? "1ª parte" : "2ª parte";
}

}

--------------------------------------------------------- */
const DATA_KEY = "rp_data_v1";
const TEAM_CODE_KEY = "rp_team_code";
const DEVICE_ID_KEY = "rp_device_id";

function emptyData() {
  return { squad: [], matchesList: [], matchesById: {}, setPiecePositions: {}, crests: emptyCrests(), updatedAt: 0 };
}

/* ---------------------------------------------------------
   Escudos: el propio y los de los rivales (por nombre), como imágenes pequeñas en data URL.
   Viajan dentro de los datos, así que se sincronizan con Supabase como todo lo demás.
--------------------------------------------------------- */
function emptyCrests() {
  return { own: null, ownNoBg: false, rivalsNoBg: false, rivals: {} };
}

function crestKey(name) {
  return (name || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function rivalCrest(crests, name) {
  return (crests && crests.rivals && crests.rivals[crestKey(name)]) || null;
}

// Reduce la imagen elegida a un cuadrado máximo de 128 px (conserva la transparencia)
function resizeCrest(file, size = 128) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("La imagen no es válida"));
      img.onload = () => {
        const iw = img.width || size; // un SVG sin tamaño propio puede dar 0
        const ih = img.height || size;
        const scale = Math.min(1, size / Math.max(iw, ih));
        const w = Math.max(1, Math.round(iw * scale));
        const h = Math.max(1, Math.round(ih * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Quita el fondo blanco de un escudo (los JPG de la FFCV lo traen): borra el blanco que toca el
// borde de la imagen, así el blanco de dentro del escudo se conserva. Devuelve un data URL PNG.
function removeWhiteBackground(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(dataUrl);
    img.onload = () => {
      try {
        const w = img.width;
        const h = img.height;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, w, h);
        const px = imageData.data;
        const isLight = (i, min) => px[i + 3] < 10 || Math.min(px[i], px[i + 1], px[i + 2]) >= min;
        const removed = new Uint8Array(w * h);
        const stack = [];
        const push = (x, y) => {
          const k = y * w + x;
          if (!removed[k] && isLight(k * 4, 225)) {
            removed[k] = 1;
            stack.push(k);
          }
        };
        for (let x = 0; x < w; x++) {
          push(x, 0);
          push(x, h - 1);
        }
        for (let y = 0; y < h; y++) {
          push(0, y);
          push(w - 1, y);
        }
        while (stack.length) {
          const k = stack.pop();
          const x = k % w;
          const y = (k - x) / w;
          if (x > 0) push(x - 1, y);
          if (x < w - 1) push(x + 1, y);
          if (y > 0) push(x, y - 1);
          if (y < h - 1) push(x, y + 1);
        }
        // Halo claro que deja la compresión JPG junto al borde del escudo
        const halo = [];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const k = y * w + x;
            if (removed[k] || !isLight(k * 4, 195)) continue;
            if (
              (x > 0 && removed[k - 1]) ||
              (x < w - 1 && removed[k + 1]) ||
              (y > 0 && removed[k - w]) ||
              (y < h - 1 && removed[k + w])
            ) {
              halo.push(k);
            }
          }
        }
        halo.forEach((k) => (removed[k] = 1));
        for (let k = 0; k < removed.length; k++) if (removed[k]) px[k * 4 + 3] = 0;
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL("image/png"));
      } catch (e) {
        resolve(dataUrl);
      }
    };
    img.src = dataUrl;
  });
}

// Versión en blanco de un escudo (para pintarlo sobre el césped): conserva la forma y los detalles,
// que quedan más tenues cuanto más claros eran en el original. Devuelve un data URL PNG.
function whiteCrest(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(null);
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const px = imageData.data;
        for (let i = 0; i < px.length; i += 4) {
          const lum = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255;
          px[i + 3] = Math.round(px[i + 3] * (0.25 + 0.75 * (1 - lum)));
          px[i] = px[i + 1] = px[i + 2] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL("image/png"));
      } catch (e) {
        resolve(null);
      }
    };
    img.src = dataUrl;
  });
}

// Escudo pequeño; si no hay imagen y `empty` es true, un círculo vacío del mismo tamaño
function CrestImage({ src, size = 24, empty = false }) {
  if (!src) {
    if (!empty) return null;
    return (
      <span
        className="shrink-0 inline-flex items-center justify-center"
        style={{
          width: size,
          height: size,
          borderRadius: 999,
          border: "2px dashed rgba(244,241,232,0.35)",
          color: "var(--chalk-dim)",
          fontSize: size * 0.45,
          lineHeight: 1,
        }}
      >
        +
      </span>
    );
  }
  return <img src={src} alt="" className="shrink-0" style={{ width: size, height: size, objectFit: "contain" }} />;
}

// Escudo que se cambia tocándolo: abre el selector de imágenes del dispositivo
function CrestPicker({ src, size = 40, onPick, label }) {
  const inputRef = useRef(null);
  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      onPick(await resizeCrest(file));
    } catch (err) {
      window.alert(err.message || "No se pudo cargar la imagen");
    }
  }
  return (
    <span className="inline-flex flex-col items-center gap-1 shrink-0">
      <button type="button" onClick={() => inputRef.current && inputRef.current.click()} aria-label={label}>
        <CrestImage src={src} size={size} empty />
      </button>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
    </span>
  );
}

// Los dos escudos de un partido en fila, en el orden local - visitante (nosotros primero si jugamos en casa)
function MatchCrests({ match, crests, size = 28 }) {
  const own = crests && crests.own;
  const rival = rivalCrest(crests, match.opponent);
  if (!own && !rival) return null;
  const pair = match.isHome === false ? [rival, own] : [own, rival];
  return (
    <span className="inline-flex items-center gap-1 shrink-0">
      {pair.map((src, i) => (src ? <CrestImage key={i} src={src} size={size} /> : <span key={i} style={{ width: size }} />))}
    </span>
  );
}

// Resultado con escudos: local a la izquierda y visitante a la derecha (nosotros, si jugamos en casa)
function ScoreWithCrests({ match, favor, contra, crests, onPickOwn, onPickRival, size = 44 }) {
  const away = match.isHome === false;
  const own = onPickOwn ? (
    <CrestPicker src={crests && crests.own} size={size} onPick={onPickOwn} label="Cambiar nuestro escudo" />
  ) : (
    <CrestImage src={crests && crests.own} size={size} />
  );
  const rivalSrc = rivalCrest(crests, match.opponent);
  const rival = onPickRival ? (
    <CrestPicker src={rivalSrc} size={size} onPick={onPickRival} label={`Cambiar el escudo de ${match.opponent}`} />
  ) : (
    <CrestImage src={rivalSrc} size={size} />
  );
  return (
    <div className="display text-4xl font-bold tabular-nums leading-none flex items-center justify-center gap-3">
      {away ? rival : own}
      <span>
        {away ? contra : favor} - {away ? favor : contra}
      </span>
      {away ? own : rival}
    </div>
  );
}

function loadLocalData() {
  try {
    const raw = localStorage.getItem(DATA_KEY);
    if (!raw) return emptyData();
    const parsed = JSON.parse(raw);
    return {
      squad: parsed.squad || [],
      matchesList: parsed.matchesList || [],
      matchesById: parsed.matchesById || {},
      setPiecePositions: parsed.setPiecePositions || {},
      crests: {
        own: (parsed.crests && parsed.crests.own) || null,
        ownNoBg: !!(parsed.crests && parsed.crests.ownNoBg),
        rivalsNoBg: !!(parsed.crests && parsed.crests.rivalsNoBg),
        rivals: (parsed.crests && parsed.crests.rivals) || {},
      },
      updatedAt: parsed.updatedAt || 0,
    };
  } catch (e) {
    return emptyData();
  }
}

function saveLocalData(data) {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify(data));
  } catch (e) {
    console.error("Error guardando en localStorage", e);
  }
}

function getDeviceId() {
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if (!id) {
    id = genId();
    localStorage.setItem(DEVICE_ID_KEY, id);
  }
  return id;
}

function getStoredTeamCode() {
  return localStorage.getItem(TEAM_CODE_KEY) || "";
}

function setStoredTeamCode(code) {
  if (code) localStorage.setItem(TEAM_CODE_KEY, code);
  else localStorage.removeItem(TEAM_CODE_KEY);
}

/* ---------------------------------------------------------
   Clasificación de liga (FFCV) — vía proxy propio en /api/clasificacion
   para evitar el bloqueo CORS del navegador. No es una API oficial de
   la FFCV: si deja de funcionar o el equipo cambia de grupo, hay que
   actualizar DEFAULT_COD_GRUPO en api/clasificacion.js.
--------------------------------------------------------- */
const LEAGUE_TEAM_CODE = "903635134"; // C.F. Nou Jove Castelló 'A' — Primera Cadet, Grup 1
const LEAGUE_CACHE_KEY = "rp_league_cache_v1";

function loadLeagueCache() {
  try {
    const raw = localStorage.getItem(LEAGUE_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveLeagueCache(data) {
  try {
    localStorage.setItem(LEAGUE_CACHE_KEY, JSON.stringify({ data, fetchedAt: Date.now() }));
  } catch (e) {
    console.error("Error guardando la clasificación en caché", e);
  }
}

function LeagueStandings() {
  const cached = useRef(loadLeagueCache()).current;
  const [data, setData] = useState(cached ? cached.data : null);
  const [fetchedAt, setFetchedAt] = useState(cached ? cached.fetchedAt : null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [expanded, setExpanded] = useState(false);

  const load = useCallback(() => {
    setLoading(true);
    setError(null);
    fetch("/api/clasificacion")
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        if (!ok || body.error) throw new Error(body.error || "No se pudo cargar la clasificación");
        setData(body);
        setFetchedAt(Date.now());
        saveLeagueCache(body);
      })
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  }, []);

  useEffect(() => { load(); }, [load]);

  const rows = data ? data.clasificacion || [] : [];
  const myRow = rows.find((r) => r.codequipo === LEAGUE_TEAM_CODE) || null;

  return (
    <div className="mb-6">
      {/* Etiqueta horizontal: toca para desplegar la tabla completa */}
      <button
        onClick={() => setExpanded((v) => !v)}
        className="mp-card mp-btn w-full flex items-center justify-between gap-3 px-3 py-2.5"
        style={expanded ? { borderColor: "var(--turf)" } : {}}
      >
        <div className="flex items-center gap-3 min-w-0">
          <div
            className="mp-shirt w-9 h-9 text-sm font-semibold shrink-0"
            style={myRow ? { borderColor: "var(--turf)" } : {}}
          >
            {myRow ? myRow.posicion : "–"}
          </div>
          <div className="min-w-0 text-left">
            <div className="text-sm font-semibold">Clasificación</div>
            <div className="text-xs truncate" style={{ color: "var(--chalk-dim)" }}>
              {data ? `${data.competicion} · ${data.grupo}` : loading ? "Cargando…" : "Toca para ver"}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {myRow && (
            <span className="text-xs font-semibold" style={{ color: "var(--turf)" }}>
              {myRow.puntos} pts
            </span>
          )}
          <span
            className="text-xs"
            style={{
              color: "var(--chalk-dim)",
              display: "inline-block",
              transition: "transform 0.18s ease",
              transform: expanded ? "rotate(180deg)" : "none",
            }}
          >
            ▼
          </span>
        </div>
      </button>

      {expanded && (
        <div className="mp-card mp-fade-in p-3 mt-2">
          <div className="flex items-center justify-between mb-2 gap-2">
            <div className="min-w-0 text-xs truncate" style={{ color: "var(--chalk-dim)" }}>
              {data ? `Jornada ${data.jornada} · ${data.fecha_jornada}` : "Sin datos todavía"}
            </div>
            <button
              onClick={load}
              disabled={loading}
              className="mp-btn mp-btn-outline px-2 py-1 text-xs shrink-0 disabled:opacity-40"
            >
              {loading ? "Cargando…" : "Actualizar"}
            </button>
          </div>

          {error && (
            <div className="text-xs mb-2" style={{ color: "var(--amber)" }}>
              {data
                ? "No se pudo actualizar; se muestra la última clasificación guardada."
                : `No se pudo cargar la clasificación (${error}). Puede que la FFCV esté dando problemas, inténtalo de nuevo en unos segundos.`}
            </div>
          )}

          {rows.length > 0 ? (
            <div className="mp-scroll overflow-x-auto">
              <table className="text-xs w-full" style={{ borderCollapse: "collapse" }}>
                <thead>
                  <tr style={{ color: "var(--chalk-dim)" }}>
                    <th className="text-left p-1">#</th>
                    <th className="text-left p-1">Equipo</th>
                    <th className="text-center p-1">PJ</th>
                    <th className="text-center p-1">PG</th>
                    <th className="text-center p-1">PE</th>
                    <th className="text-center p-1">PP</th>

                    <th className="text-center p-1">GC</th>
                    <th className="text-center p-1">Pts</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => {
                    const isUs = r.codequipo === LEAGUE_TEAM_CODE;
                    return (
                      <tr key={r.codequipo} style={isUs ? { background: "rgba(111,190,68,0.15)" } : {}}>
                        <td className="p-1">{r.posicion}</td>

                          {r.nombre}

          {fetchedAt && (
            <div className="text-[10px] mt-2" style={{ color: "var(--chalk-dim)" }}>
              Actualizado: {new Date(fetchedAt).toLocaleString()}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Calendario: cada partido en su día/mes, incluidos los futuros
--------------------------------------------------------- */
const CALENDAR_WEEKDAYS = ["L", "M", "X", "J", "V", "S", "D"];

function MatchCalendar({ matches, crests, onOpenMatch }) {
  const [cursor, setCursor] = useState(() => {
    const [y, m] = todayISO().split("-").map(Number);
    return { year: y, month: m - 1 };
  });
  const [selectedDate, setSelectedDate] = useState(null);

  const matchesByDate = {};
  matches.forEach((m) => {
    (matchesByDate[m.date] = matchesByDate[m.date] || []).push(m);
  });

  const pad = (n) => String(n).padStart(2, "0");
  const first = new Date(cursor.year, cursor.month, 1);
  const startWeekday = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const isoFor = (d) => `${cursor.year}-${pad(cursor.month + 1)}-${pad(d)}`;
  const monthLabel = first.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  const todayIso = todayISO();

  function shiftMonth(delta) {
    setSelectedDate(null);
    setCursor((c) => {
      let month = c.month + delta;
      let year = c.year;
      if (month < 0) { month = 11; year -= 1; }
      if (month > 11) { month = 0; year += 1; }
      return { year, month };
    });
  }

  const selectedMatches = selectedDate ? matchesByDate[selectedDate] || [] : [];

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <button onClick={() => shiftMonth(-1)} className="mp-btn mp-btn-outline px-3 py-1.5 text-sm">
          ‹
        </button>
        <div className="text-sm font-semibold capitalize">{monthLabel}</div>
        <button onClick={() => shiftMonth(1)} className="mp-btn mp-btn-outline px-3 py-1.5 text-sm">
          ›
        </button>
      </div>

      <div className="grid grid-cols-7 gap-1 mb-1">
        {CALENDAR_WEEKDAYS.map((d) => (
          <div key={d} className="text-center text-[10px]" style={{ color: "var(--chalk-dim)" }}>
            {d}
          </div>
        ))}
      </div>

      <div className="grid grid-cols-7 gap-1 mb-2">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const iso = isoFor(d);
          const dayMatches = matchesByDate[iso] || [];
          const hasMatch = dayMatches.length > 0;
          const isToday = iso === todayIso;
          const selected = iso === selectedDate;
          const vColor = hasMatch ? venueColor(dayMatches[0]) : null;
          return (
            <button
              key={i}
              onClick={() => hasMatch && setSelectedDate(selected ? null : iso)}
              className="mp-card flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 text-xs"
              style={{
                minHeight: 42,
                borderColor: selected ? "var(--chalk)" : hasMatch ? vColor : isToday ? "var(--cielo)" : undefined,
                borderWidth: hasMatch ? 2 : 1,
                opacity: hasMatch ? 1 : 0.4,
              }}
            >
              <span>{d}</span>
              {hasMatch && (
                <span
                  className="truncate w-full text-center leading-tight"
                  style={{ fontSize: 8, color: vColor }}
                >
                  {dayMatches[0].opponent}
                </span>
              )}
            </button>
          );
        })}
      </div>

      {selectedDate && (
        <div className="flex flex-col gap-2 mp-fade-in">
          {selectedMatches.map((m) => {
            const badge = matchBadge(m);
            const vLabel = venueLabel(m);
            return (
              <button
                key={m.id}
                onClick={() => onOpenMatch(m.id)}
                className="mp-card p-3 text-left flex items-center justify-between gap-2"
              >
                <div className="min-w-0 flex items-center gap-2">
                  <MatchCrests match={m} crests={crests} size={28} />
                  <div className="min-w-0">
                    <div className="font-semibold truncate">vs {m.opponent}</div>
                    <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                      {m.date}
                      {vLabel && <span style={{ color: venueColor(m) }}> · {vLabel}</span>}
                    </div>
                  </div>
                </div>
                <span
                  className="text-xs px-2 py-1 rounded-full whitespace-nowrap shrink-0"
                  style={{ background: badge.bg, color: badge.color }}
                >
                  {badge.label}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Plantilla
--------------------------------------------------------- */
function SquadManager({ squad, onSave, onBack }) {
  const [players, setPlayers] = useState(squad);
  const [number, setNumber] = useState("");
  const [name, setName] = useState("");

  useEffect(() => setPlayers(squad), [squad]);

  function addPlayer() {
    if (!name.trim()) return;
    const updated = [
      ...players,
      { id: genId(), number: number.trim() || "-", name: name.trim() },
    ];
    setPlayers(updated);
    onSave(updated);
    setNumber("");
    setName("");
  }

  function removePlayer(id) {
    const updated = players.filter((p) => p.id !== id);
    setPlayers(updated);
    onSave(updated);
  }

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-6 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <h1 className="display text-2xl font-semibold">Plantilla</h1>
      </div>

      <div className="mp-card p-3 mb-4 flex gap-2">
        <input
          value={number}
          onChange={(e) => setNumber(e.target.value)}
          placeholder="Dorsal"
          inputMode="numeric"
          pattern="[0-9]*"
          className="mp-input px-3 py-2 w-20 text-center"
        />
        <input
          value={name}
          onChange={(e) => setName(e.target.value)}
          placeholder="Nombre del jugador"
          className="mp-input px-3 py-2 flex-1"
          onKeyDown={(e) => e.key === "Enter" && addPlayer()}
        />
        <button onClick={addPlayer} className="mp-btn mp-btn-primary px-4 text-sm font-semibold">
          Añadir
        </button>
      </div>

      <div className="flex flex-col gap-2">
        {players
          .slice()
          .sort((a, b) => Number(a.number) - Number(b.number))
          .map((p) => (
            <div key={p.id} className="mp-card p-3 flex items-center justify-between">
              <div className="flex items-center gap-3">
                <div className="mp-shirt w-9 h-9 text-sm font-semibold">{p.number}</div>
                <span>{p.name}</span>
              </div>
              <button
                onClick={() => removePlayer(p.id)}
                className="text-sm"
                style={{ color: "var(--crimson)" }}
              >
                Quitar
              </button>
            </div>
          ))}
        {players.length === 0 && (
          <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>
            Añade jugadores para poder convocarlos en un partido.
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
function MatchSetup({ squad, crests, onSaveCrest, onCreate, onBack, onGoSquad }) {
  const [opponent, setOpponent] = useState("");
  const [date, setDate] = useState(todayISO());
  const [halfLength, setHalfLength] = useState(45);
  const [titulares, setTitulares] = useState([]);
  const [isHome, setIsHome] = useState(true);
  // Escudo elegido para este rival (si no elige ninguno se usa el que ya haya guardado con ese nombre)
  const [newCrest, setNewCrest] = useState(null);

  const isFuture = date > todayISO();
  const rivalCrestSrc = newCrest || rivalCrest(crests, opponent);

  function toggle(id) {
    setTitulares((prev) =>
      prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]
    );
  }

  function submit() {
    if (!opponent.trim() || (!isFuture && titulares.length === 0)) return;
    if (newCrest) onSaveCrest("rival", opponent.trim(), newCrest);
    onCreate({ opponent: opponent.trim(), date, halfLength: Number(halfLength) || 45, titulares, isHome });
  }

  if (squad.length === 0) {
    return (
      <div className="max-w-md mx-auto p-4 pb-10">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm mb-4">
          Volver
        </button>
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          Primero necesitas añadir jugadores a la plantilla.
        </div>
        <button onClick={onGoSquad} className="mp-btn mp-btn-primary w-full py-3 mt-4 font-semibold">
          Ir a la plantilla
        </button>
      </div>
    );
  }

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-6 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <h1 className="display text-2xl font-semibold">Nuevo partido</h1>
      </div>

      <div className="mp-card p-3 mb-3">
        <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Rival</label>
        <div className="flex items-center gap-3 mt-1">
          <CrestPicker src={rivalCrestSrc} size={40} onPick={setNewCrest} label="Elegir el escudo del rival" />
          <input
            value={opponent}
            onChange={(e) => setOpponent(e.target.value)}
            placeholder="Nombre del equipo rival"
            className="mp-input px-3 py-2 w-full"
          />
        </div>
        <div className="text-[10px] mt-1" style={{ color: "var(--chalk-dim)" }}>
          Toca el círculo para elegir el escudo (opcional). Se recordará para este rival.
        </div>
      </div>

      <div className="flex gap-3 mb-3">
        <div className="mp-card p-3 flex-1 min-w-0">
          <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Fecha</label>
          <input
            type="date"
            value={date}
            onChange={(e) => setDate(e.target.value)}
            className="mp-input px-3 py-2 w-full mt-1"
          />
        </div>
        <div className="mp-card p-3 w-28">
          <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Min./parte</label>
          <input
            type="number"
            value={halfLength}
            onChange={(e) => setHalfLength(e.target.value)}
            inputMode="numeric"
            pattern="[0-9]*"
            className="mp-input px-3 py-2 w-full mt-1"
          />
        </div>
      </div>

      <div className="mp-card p-3 mb-3">
        <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>¿Dónde se juega?</label>
        <div className="flex gap-2 mt-1">
          <button
            onClick={() => setIsHome(true)}
            className="mp-btn px-3 py-2 text-sm flex-1"
            style={isHome ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
          >
            Local
          </button>
          <button
            onClick={() => setIsHome(false)}
            className="mp-btn px-3 py-2 text-sm flex-1"
            style={!isHome ? { background: "var(--crimson)", color: "#fff", border: "none" } : {}}
          >
            Visitante
          </button>
        </div>
      </div>

      {isFuture && (
        <div className="mp-card p-3 mb-4 text-xs" style={{ color: "var(--chalk-dim)" }}>
          Esta fecha es futura: el partido se guardará como <span style={{ color: "var(--cielo)" }}>programado</span> en
          el calendario. Podrás elegir el once inicial y empezarlo cuando llegue el día.
        </div>
      )}

      <div className="mp-card p-3 mb-4">
        <div className="flex items-center justify-between mb-2">
          <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            Once inicial{isFuture ? " (opcional por ahora)" : ""}
          </label>
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>{titulares.length} seleccionados</span>
        </div>
        <div className="flex flex-wrap gap-2">
          {squad
            .slice()
            .sort((a, b) => Number(a.number) - Number(b.number))
            .map((p) => {
              const active = titulares.includes(p.id);
              return (
                <button
                  key={p.id}
                  onClick={() => toggle(p.id)}
                  className="mp-btn px-3 py-2 text-sm flex items-center gap-2"
                  style={active ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
                >
                  <span className="font-semibold">{p.number}</span>
                  <span>{p.name}</span>
                </button>
              );
            })}
        </div>
      </div>

      <button
        onClick={submit}
        disabled={!opponent.trim() || (!isFuture && titulares.length === 0)}
        className="mp-btn mp-btn-primary w-full py-3 font-semibold disabled:opacity-40"
      >
        {isFuture ? "Programar partido" : "Empezar partido"}
      </button>
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Partido en directo
--------------------------------------------------------- */
function LiveMatch({ match, squad, crests, onSaveCrest, onUpdate, onFinish, onBack }) {
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [subOutId, setSubOutId] = useState(null);
  const [tab, setTab] = useState("jugadores");
  const [showPlayerStats, setShowPlayerStats] = useState(false);
  const [pendingDetail, setPendingDetail] = useState(null);
  const [, forceTick] = useState(0);

  const matchRef = useRef(match);
  useEffect(() => { matchRef.current = match; }, [match]);

  const playerById = useCallback(
    (id) => squad.find((p) => p.id === id) || { id, number: "?", name: "Desconocido" },
    [squad]
  );

  // Filtra jugadores que ya no están en la plantilla (p.ej. borrados después de convocarlos)
  const rosterOnPitch = match.onPitch.filter((id) => squad.some((p) => p.id === id));
  const rosterBench = match.bench.filter((id) => squad.some((p) => p.id === id));

  const clockKey = match.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";

  function currentElapsed() {
    return computeElapsed(match);
  }

  function currentMinute() {
    return computeMinute(match);
  }

  // Refresca la pantalla cada segundo sin escribir en almacenamiento ni red
  useEffect(() => {
    if (!match.clock.running) return;
    const interval = setInterval(() => forceTick((t) => t + 1), 1000);
    return () => clearInterval(interval);
  }, [match.clock.running]);

  // Persiste el cronómetro cada pocos segundos, sin bloquear el tap del usuario.
  // Al persistir, reinicia runStartedAt para que el siguiente cálculo no cuente el tiempo dos veces.
  useEffect(() => {
    if (!match.clock.running) return;
    const interval = setInterval(() => {
      const m = matchRef.current;
      const key = m.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";
      onUpdate(
        { ...m, clock: { ...m.clock, [key]: computeElapsed(m), runStartedAt: Date.now() } },
        false
      );
    }, 5000);
    return () => clearInterval(interval);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [match.clock.running, match.clock.activeHalf]);

  function toggleRunning() {
    const willRun = !match.clock.running;
    onUpdate(
      {
        ...match,
        clock: {
          ...match.clock,
          [clockKey]: computeElapsed(match),
          running: willRun,
          runStartedAt: willRun ? Date.now() : match.clock.runStartedAt,
        },
      },
      true
    );
  }

  function resetClock() {
    if (!window.confirm("¿Reiniciar el cronómetro de esta parte a 00:00?")) return;
    onUpdate(
      {
        ...match,
        clock: {
          ...match.clock,
          [clockKey]: 0,
          runStartedAt: match.clock.running ? Date.now() : match.clock.runStartedAt,
        },
      },
      true
    );
  }

  function restartMatchClock() {
    if (!window.confirm("¿Empezar el partido de nuevo desde el minuto 0 (1ª parte)?")) return;
    onUpdate(
      {
        ...match,
        half: 1,
        clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1, runStartedAt: null },
      },
      true
    );
  }

  function endHalf1() {
    onUpdate(
      { ...match, half: "descanso", clock: { ...match.clock, half1Elapsed: computeElapsed(match), running: false } },
      true
    );
  }

  function startHalf2() {
    onUpdate(
      { ...match, half: 2, clock: { ...match.clock, running: true, activeHalf: 2, runStartedAt: Date.now() } },
      true
    );
  }

  function addEvent(typeId) {
    if (!selectedPlayerId) return;
    if (EVENTS_WITH_DETAIL[typeId]) {
      setPendingDetail({ typeId, playerId: selectedPlayerId });
      return;
    }
    const p = playerById(selectedPlayerId);
    const half = match.clock.activeHalf;
    const seconds = currentElapsed();
    const minute = currentMinute();
    const entry = {
      id: genId(),
      half,
      seconds,
      minute,
      playerId: p.id,
      playerNumber: p.number,
      playerName: p.name,
      type: typeId,
    };
    onUpdate({ ...match, events: [...match.events, entry] }, true);
  }

  function confirmDetail(value) {
    if (!pendingDetail) return;
    const { typeId, playerId } = pendingDetail;
    const meta = EVENTS_WITH_DETAIL[typeId];
    const isTypeOverride = meta.field === "__type__";
    const p = playerById(playerId);
    const half = match.clock.activeHalf;
    const seconds = currentElapsed();
    const minute = currentMinute();
    const entry = {
      id: genId(),
      half,
      seconds,
      minute,
      playerId: p.id,
      playerNumber: p.number,
      playerName: p.name,
      type: isTypeOverride ? value : typeId,
    };
    if (!isTypeOverride) entry[meta.field] = value;
    onUpdate({ ...match, events: [...match.events, entry] }, true);
    setPendingDetail(null);
  }

  function cancelDetail() {
    setPendingDetail(null);
  }

  function removeEvent(id) {
    onUpdate({ ...match, events: match.events.filter((e) => e.id !== id) }, true);
  }

  function removeSub(id) {
    onUpdate({ ...match, subs: match.subs.filter((s) => s.id !== id) }, true);
  }

  function confirmSub(inId) {
    const outP = playerById(subOutId);
    const inP = playerById(inId);
    const half = match.clock.activeHalf;
    const minute = currentMinute();
    const newOnPitch = match.onPitch.map((id) => (id === subOutId ? inId : id));
    const newBench = match.bench.map((id) => (id === inId ? subOutId : id));
    const subEntry = {
      id: genId(),
      half,
      minute,
      outId: outP.id,
      outName: outP.name,
      outNumber: outP.number,
      inId: inP.id,
      inName: inP.name,
      inNumber: inP.number,
    };
    onUpdate(
      { ...match, onPitch: newOnPitch, bench: newBench, subs: [...match.subs, subEntry] },
      true
    );
    setSubOutId(null);
    if (selectedPlayerId === subOutId) setSelectedPlayerId(null);
  }

  const activeElapsed = currentElapsed();

  const timeline = [
    ...match.events.map((e) => ({ ...e, kind: "event" })),
    ...match.subs.map((s) => ({ ...s, kind: "sub" })),
  ].sort((a, b) => (b.half - a.half) || (b.minute - a.minute) || (b.id > a.id ? 1 : -1));

  const selectedPlayer = selectedPlayerId ? playerById(selectedPlayerId) : null;
  const isGoalkeeperSelected = !!selectedPlayer && GOALKEEPER_NUMBERS.includes(String(selectedPlayer.number));
  const visibleEventTypes = EVENT_TYPES.filter(
    (ev) => !ev.hidden && (ev.group !== "portero" || isGoalkeeperSelected)
  );

  const golesFavor = match.events.filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const golesContra =
    (match.concededSetPieces || []).length + match.events.filter((e) => e.type === "gol_encajado").length;

  return (
    <div className="max-w-6xl mx-auto p-3 pb-8">
      {/* Resultado del partido, bien visible arriba del todo */}
      <div className="text-center pt-1 mb-1">
        <div className="text-[10px] uppercase tracking-wide" style={{ color: "var(--chalk-dim)" }}>
          Resultado
        </div>
        <ScoreWithCrests
          match={match}
          favor={golesFavor}
          contra={golesContra}
          crests={crests}
          onPickOwn={(url) => onSaveCrest("own", null, url)}
          onPickRival={(url) => onSaveCrest("rival", match.opponent, url)}
        />
      </div>

      {/* Cabecera + marcador, todo en una franja compacta */}
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3 pt-2">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
            Volver
          </button>
          <div>
            <div className="font-semibold leading-tight">vs {match.opponent}</div>
            <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>{match.date}</div>
          </div>
        </div>

        <div className="mp-card px-4 py-2 flex items-center gap-4">
          <div>
            <div className="text-[10px]" style={{ color: "var(--chalk-dim)" }}>{halfLabel(match)}</div>
            <div className="display text-2xl font-semibold tabular-nums leading-none">
              {formatClock(activeElapsed)}
            </div>
          </div>
          <div className="flex items-center gap-2">
            {(match.half === 1 || match.half === 2) && (
              <button
                onClick={toggleRunning}
                className="mp-btn mp-btn-primary px-3 py-2 text-xs font-semibold"
              >
                {match.clock.running ? "Pausar" : "Reanudar"}
              </button>
            )}
            {(match.half === 1 || match.half === 2) && (
              <button
                onClick={resetClock}
                className="mp-btn mp-btn-outline px-3 py-2 text-xs"
                style={{ color: "var(--crimson)" }}

                Reiniciar
              </button>
            )}
            <button
              onClick={restartMatchClock}
              className="mp-btn mp-btn-outline px-3 py-2 text-xs"
              style={{ color: "var(--crimson)" }}
            >
              Empezar desde 0
            </button>
            {match.half === 1 && (
              <button onClick={endHalf1} className="mp-btn mp-btn-outline px-3 py-2 text-xs">
                Fin 1ª parte
              </button>
            )}
            {match.half === "descanso" && (
              <button onClick={startHalf2} className="mp-btn mp-btn-primary px-3 py-2 text-xs font-semibold">
                Iniciar 2ª parte
              </button>
            )}
            {match.half === 2 && (
              <button onClick={onFinish} className="mp-btn mp-btn-outline px-3 py-2 text-xs" style={{ color: "var(--crimson)" }}>
                Finalizar partido
              </button>
            )}
          </div>
        </div>
      </div>

      {tab === "jugadores" && <OpponentChanceMarker match={match} onUpdate={onUpdate} />}

      {/* Pestañas: jugadores/eventos en directo, o el resumen de cómo va el partido */}
      <div className="flex gap-2 mb-3">
        <button
          onClick={() => setTab("jugadores")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "jugadores" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Jugadores y equipo
        </button>
        <button
          onClick={() => setTab("estadisticas")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "estadisticas" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Estadísticas del partido
        </button>
        <button
          onClick={() => setTab("campo")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "campo" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Campo
        </button>
      </div>

      {tab === "campo" && (
        <FieldFormation match={match} squad={squad} playerById={playerById} onUpdate={onUpdate} />
      )}

      {tab === "estadisticas" && (
        <React.Fragment>
          {match.events.length === 0 ? (
            <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
              Aún no hay eventos registrados en este partido.
            </div>
          ) : (
            <MatchTotals events={match.events} teamEvents={match.teamEvents || []} />
          )}

          <button
            onClick={() => setShowPlayerStats((v) => !v)}
            className="mp-btn mp-btn-outline w-full py-2.5 text-sm mt-4 mb-2"
          >
            {showPlayerStats ? "Ocultar estadísticas por jugador" : "Ver estadísticas por jugador"}
          </button>
          {showPlayerStats && (
            <PlayerStatsAccordion
              players={[...rosterOnPitch, ...rosterBench].map((id) => playerById(id))}
              events={match.events}
            />
          )}
        </React.Fragment>
      )}

      {/* Layout horizontal: en el campo a la izquierda, eventos + cronología en medio, eventos de equipo a la derecha */}
      {tab === "jugadores" && (
      <div className="lg:grid lg:grid-cols-[260px_1fr_280px] lg:gap-4 lg:items-start">
        <div className="mb-4 lg:mb-0">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
            En el campo — toca para seleccionar
          </div>
          <div className="grid grid-cols-2 gap-2 lg:grid-cols-1 lg:gap-1.5">
            {rosterOnPitch.map((id) => {
              const p = playerById(id);
              const selected = selectedPlayerId === id;
              return (
                <div
                  key={id}
                  className="mp-card flex items-center gap-2 px-2 py-1.5"
                  style={selected ? { borderColor: "var(--cielo)" } : {}}
                >
                  <button
                    onClick={() => setSelectedPlayerId(selected ? null : id)}
                    className={`mp-shirt w-9 h-9 text-sm font-semibold shrink-0 ${selected ? "selected" : ""}`}
                  >
                    {p.number}
                  </button>
                  <button
                    onClick={() => setSelectedPlayerId(selected ? null : id)}
                    className="flex-1 min-w-0 text-left text-sm truncate"
                  >
                    {p.name}
                  </button>
                  <button
                    onClick={() => setSubOutId(id)}
                    className="text-[10px] shrink-0"
                    style={{ color: "var(--cielo)" }}
                  >
                    Cambiar
                  </button>
                </div>
              );
            })}
          </div>

          {/* Panel de cambio: los suplentes solo aparecen aquí, al pulsar "Cambiar" */}
          {subOutId && (
            <div className="mp-card p-3 mt-3">
              <div className="text-sm mb-2">
                Entra por <span className="font-semibold">{playerById(subOutId).name}</span>:
              </div>
              <div className="flex flex-wrap gap-2 mb-2">
                {rosterBench.map((id) => {
                  const p = playerById(id);
                  return (
                    <button
                      key={id}
                      onClick={() => confirmSub(id)}
                      className="mp-btn px-3 py-2 text-sm"
                    >
                      {p.number} · {p.name}
                    </button>
                  );
                })}
                {rosterBench.length === 0 && (
                  <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>No hay suplentes disponibles.</span>
                )}
              </div>
              <button onClick={() => setSubOutId(null)} className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                Cancelar
              </button>
            </div>
          )}
        </div>

        <div>
          {/* Detalle pendiente: motivo de tarjeta o zona de la falta */}
          {pendingDetail && (
            <div className="mp-card p-3 mb-3" style={{ borderColor: "var(--amber)" }}>
              <div className="text-sm mb-2">
                {EVENTS_WITH_DETAIL[pendingDetail.typeId].prompt} — {playerById(pendingDetail.playerId).name}
              </div>
              <div className="flex flex-wrap gap-2 mb-2">
                {EVENTS_WITH_DETAIL[pendingDetail.typeId].options.map((opt) => (
                  <button
                    key={opt.value}
                    onClick={() => confirmDetail(opt.value)}
                    className="mp-btn px-3 py-2 text-sm"
                  >
                    {opt.label}
                  </button>
                ))}
              </div>
              <button onClick={cancelDetail} className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                Cancelar
              </button>
            </div>
          )}

          {/* Eventos */}
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
            {selectedPlayerId
              ? `Evento para ${playerById(selectedPlayerId).name}${isGoalkeeperSelected ? " (portero)" : ""}`
              : "Selecciona un jugador para registrar un evento"}
          </div>
          <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-2 mb-5">
            {visibleEventTypes.map((ev) => (
              <button
                key={ev.id}
                disabled={!selectedPlayerId}
                onClick={() => addEvent(ev.id)}
                className={`mp-card ${eventChipCls(ev.id)} px-3 py-2.5 text-sm text-left disabled:opacity-30`}
              >
                {ev.label}
              </button>
            ))}
          </div>

          {/* Cronología */}
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Cronología</div>
          <div className="flex flex-col gap-2 lg:max-h-[45vh] lg:overflow-y-auto lg:pr-1">
            {timeline.length === 0 && (
              <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>Aún no hay eventos registrados.</div>
            )}
            {timeline.map((t) =>
              t.kind === "event" ? (
                <div key={t.id} className={`mp-card ${eventChipCls(t.type)} p-2.5 flex items-center justify-between`}>
                  <span className="text-sm">
                    <span style={{ color: "var(--chalk-dim)" }}>{t.minute}' · </span>
                    #{t.playerNumber} {t.playerName} — {EVENT_LABEL[t.type]}
                    {eventDetailLabel(t) && ` (${eventDetailLabel(t)})`}
                  </span>
                  <button onClick={() => removeEvent(t.id)} className="text-xs" style={{ color: "var(--crimson)" }}>
                    Deshacer
                  </button>
                </div>
              ) : (
                <div key={t.id} className="mp-card chip-cielo p-2.5 flex items-center justify-between">
                  <span className="text-sm">
                    <span style={{ color: "var(--chalk-dim)" }}>{t.minute}' · </span>
                    Cambio: sale #{t.outNumber} {t.outName}, entra #{t.inNumber} {t.inName}
                  </span>
                  <button onClick={() => removeSub(t.id)} className="text-xs" style={{ color: "var(--crimson)" }}>
                    Deshacer
                  </button>
                </div>
              )
            )}
          </div>
        </div>

        <div className="mt-4 lg:mt-0">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Eventos de equipo</div>
          <TeamEventsPanel match={match} onUpdate={onUpdate} />
        </div>
      </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Campo: colocar a cada jugador en su posición
--------------------------------------------------------- */
function FieldFormation({ match, squad, playerById, onUpdate }) {
  const [selectedId, setSelectedId] = useState(null);
  const pitchRef = useRef(null);
  const positions = match.positions || {};

  // Lápiz y goma sobre el campo: los trazos se guardan en el partido (coordenadas 0..105 x 0..68)
  const [mode, setMode] = useState("mover");
  const [color, setColor] = useState(PITCH_COLORS[1].value);
  const [thick, setThick] = useState(false);
  const [eraserPos, setEraserPos] = useState(null);
  const [strokes, setStrokes] = useState(match.strokes || []);
  const strokesRef = useRef(strokes);
  const svgRef = useRef(null);
  const drawingRef = useRef(false);
  const erasingRef = useRef(false);
  const dirtyRef = useRef(false);
  useBlockTouchScroll(svgRef, mode !== "mover");

  // Si el dibujo cambia desde otro dispositivo, lo recogemos (salvo si estamos pintando ahora mismo)
  useEffect(() => {
    if (match.strokes && match.strokes !== strokesRef.current && !drawingRef.current && !erasingRef.current) {
      strokesRef.current = match.strokes;
      setStrokes(match.strokes);
    }
  }, [match.strokes]);

  function setStrokesLocal(next) {
    strokesRef.current = next;
    setStrokes(next);
  }

  function commitStrokes(next) {
    setStrokesLocal(next);
    onUpdate({ ...match, strokes: next }, true);
  }

  function toPitchPoint(e) {
    const rect = svgRef.current.getBoundingClientRect();
    return {
      x: Math.round(((e.clientX - rect.left) / rect.width) * 105 * 100) / 100,
      y: Math.round(((e.clientY - rect.top) / rect.height) * 68 * 100) / 100,
    };
  }

  function eraseAt(p) {
    const prev = strokesRef.current;
    const next = prev.filter((s) => !strokeTouches(s, p));
    if (next.length !== prev.length) {
      dirtyRef.current = true;
      setStrokesLocal(next);
    }
  }

  function handleDrawDown(e) {
    e.currentTarget.setPointerCapture(e.pointerId);
    const p = toPitchPoint(e);
    if (mode === "dibujar") {
      drawingRef.current = true;
      setStrokesLocal([...strokesRef.current, { color, width: thick ? 1.1 : 0.5, pts: [[p.x, p.y]] }]);
    } else if (mode === "goma") {
      erasingRef.current = true;
      setEraserPos(p);
      eraseAt(p);
    }
  }

  function handleDrawMove(e) {
    if (mode === "dibujar" && drawingRef.current) {
      const p = toPitchPoint(e);
      const prev = strokesRef.current;
      const last = prev[prev.length - 1];
      setStrokesLocal([...prev.slice(0, -1), { ...last, pts: [...last.pts, [p.x, p.y]] }]);
    } else if (mode === "goma") {
      const p = toPitchPoint(e);
      setEraserPos(p);
      if (erasingRef.current) eraseAt(p);
    }
  }

  function handleDrawUp() {
    if (drawingRef.current || (erasingRef.current && dirtyRef.current)) commitStrokes(strokesRef.current);
    drawingRef.current = false;
    erasingRef.current = false;
    dirtyRef.current = false;
  }

  function changeMode(next) {
    setMode(next);
    setSelectedId(null);
  }

  const modeBtn = (id, label) => (
    <button
      onClick={() => changeMode(id)}
      className="mp-btn px-3 py-2 text-sm"
      style={mode === id ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
    >
      {label}
    </button>
  );

  const rosterOnPitch = match.onPitch.filter((id) => squad.some((p) => p.id === id));
  const rosterBench = match.bench.filter((id) => squad.some((p) => p.id === id));

  const placedIds = rosterOnPitch.filter((id) => positions[id]);
  const unplacedIds = rosterOnPitch.filter((id) => !positions[id]);
  const selectedIsBench = !!selectedId && rosterBench.includes(selectedId);

  function setPosition(playerId, coords) {
    onUpdate({ ...match, positions: { ...positions, [playerId]: coords } }, true);
  }

  function clearPosition(playerId) {
    const next = { ...positions };
    delete next[playerId];
    onUpdate({ ...match, positions: next }, true);
  }

  function substitute(outId, inId) {
    const outP = playerById(outId);
    const inP = playerById(inId);
    const half = match.clock.activeHalf;
    const minute = computeMinute(match);
    const newOnPitch = match.onPitch.map((id) => (id === outId ? inId : id));
    const newBench = match.bench.map((id) => (id === inId ? outId : id));
    const subEntry = {
      id: genId(),
      half,
      minute,
      outId: outP.id,
      outName: outP.name,
      outNumber: outP.number,
      inId: inP.id,
      inName: inP.name,
      inNumber: inP.number,
    };
    const nextPositions = { ...positions };
    if (nextPositions[outId]) {
      nextPositions[inId] = nextPositions[outId];
    }
    delete nextPositions[outId];
    onUpdate(
      { ...match, onPitch: newOnPitch, bench: newBench, subs: [...match.subs, subEntry], positions: nextPositions },
      true
    );
  }

  function handleSelect(id) {
    if (!selectedId) {
      setSelectedId(id);
      return;
    }
    if (selectedId === id) {
      setSelectedId(null);
      return;
    }
    const tappedIsBench = rosterBench.includes(id);
    if (selectedIsBench !== tappedIsBench) {
      const inId = selectedIsBench ? selectedId : id;
      const outId = selectedIsBench ? id : selectedId;
      substitute(outId, inId);
      setSelectedId(null);
    } else {
      setSelectedId(id);
    }
  }

  function handlePitchClick(e) {
    if (!selectedId || selectedIsBench || !pitchRef.current) return;
    const rect = pitchRef.current.getBoundingClientRect();
    // El campo se dibuja en horizontal (portería propia a la izquierda), pero las posiciones se
    // guardan como siempre (campo vertical, portería propia abajo): x = 100 - y_pantalla, y = x_pantalla
    const screenX = ((e.clientX - rect.left) / rect.width) * 100;
    const screenY = ((e.clientY - rect.top) / rect.height) * 100;
    setPosition(selectedId, {
      x: Math.min(96, Math.max(4, screenY)),
      y: Math.min(96, Math.max(4, 100 - screenX)),
    });
    setSelectedId(null);
  }

  return (
    <div className="mb-4">
      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        {selectedId
          ? selectedIsBench
            ? `Toca al jugador del campo que sale por ${playerById(selectedId).name}`
            : `Toca el campo para colocar a ${playerById(selectedId).name}, o un suplente para cambiarlo`
          : "Toca un jugador y luego el campo para colocarlo, o toca un suplente para hacer un cambio"}
      </div>

      <div
        ref={pitchRef}
        onClick={handlePitchClick}
        className="relative w-full mx-auto mb-3"
        style={{
          aspectRatio: "105 / 68",
          background: "#2E7D32",
          borderRadius: 12,
          border: "2px solid rgba(255,255,255,0.55)",
          overflow: "hidden",
        }}
      >
        {(() => {
          const line = "2px solid rgba(255,255,255,0.55)";
          return (
            <React.Fragment>
              {/* Línea de medio campo y círculo central */}
              <div style={{ position: "absolute", top: 0, bottom: 0, left: "50%", width: 2, marginLeft: -1, background: "rgba(255,255,255,0.55)" }} />
              <div
                style={{
                  position: "absolute",
                  left: "50%",
                  top: "50%",
                  width: "17.4%",
                  aspectRatio: "1 / 1",
                  transform: "translate(-50%, -50%)",
                  borderRadius: "50%",
                  border: line,
                }}
              />
              {/* Áreas grandes y pequeñas de cada portería */}
              {[
                { side: "left", w: "15.7%", h: "59.3%", border: "borderLeft" },
                { side: "right", w: "15.7%", h: "59.3%", border: "borderRight" },
                { side: "left", w: "5.2%", h: "26.9%", border: "borderLeft" },
                { side: "right", w: "5.2%", h: "26.9%", border: "borderRight" },
              ].map((a, i) => (
                <div
                  key={i}
                  style={{
                    position: "absolute",
                    [a.side]: 0,
                    top: "50%",
                    width: a.w,
                    height: a.h,
                    transform: "translateY(-50%)",
                    border: line,
                    [a.border]: "none",
                  }}
                />
              ))}
            </React.Fragment>
          );
        })()}

        {placedIds.map((id) => {
          const p = playerById(id);
          const pos = positions[id];
          const selected = selectedId === id;
          return (
            <button
              key={id}
              onClick={(e) => {
                e.stopPropagation();
                handleSelect(id);
              }}
              className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
              style={{
                position: "absolute",
                left: `${100 - pos.y}%`,
                top: `${pos.x}%`,
                transform: "translate(-50%, -50%)",
              }}
            >
              {p.number}
            </button>
          );
        })}

        {/* Dibujo (por encima de las fichas); solo captura el dedo con el lápiz o la goma activos */}
        <svg
          ref={svgRef}
          viewBox="0 0 105 68"
          preserveAspectRatio="none"
          onPointerDown={handleDrawDown}
          onPointerMove={handleDrawMove}
          onPointerUp={handleDrawUp}
          onPointerCancel={handleDrawUp}
          onPointerLeave={() => setEraserPos(null)}
          onClick={(e) => e.stopPropagation()}
          style={{
            position: "absolute",
            inset: 0,
            width: "100%",
            height: "100%",
            pointerEvents: mode === "mover" ? "none" : "auto",
            touchAction: "none",
            userSelect: "none",
            WebkitUserSelect: "none",
            cursor: "crosshair",
          }}
        >
          {strokes.map((s, i) => (
            <path
              key={i}
              d={strokePath(s.pts)}
              fill="none"
              stroke={s.color}
              strokeWidth={s.width}
              strokeLinecap="round"
              strokeLinejoin="round"
            />
          ))}
          {mode === "goma" && eraserPos && (
            <circle
              cx={eraserPos.x}
              cy={eraserPos.y}
              r={ERASER_RADIUS}
              fill="rgba(255,255,255,0.15)"
              stroke="#FFFFFF"
              strokeWidth="0.3"
              strokeDasharray="0.8 0.6"
            />
          )}
        </svg>
      </div>

      {selectedId && !selectedIsBench && (
        <button
          onClick={() => {
            clearPosition(selectedId);
            setSelectedId(null);
          }}
          className="mp-btn mp-btn-outline w-full py-2 text-xs mb-3"
          style={{ color: "var(--crimson)" }}
        >
          Quitar del campo a {playerById(selectedId).name}
        </button>
      )}

      <div className="md:grid md:grid-cols-[1fr_auto] md:gap-4 md:items-start">
      <div>
      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Sin colocar</div>
      <div className="flex flex-wrap gap-2 mb-4">
        {unplacedIds.length === 0 && (
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            Todos los jugadores en el campo están colocados.
          </span>
        )}
        {unplacedIds.map((id) => {
          const p = playerById(id);
          const selected = selectedId === id;
          return (
            <button
              key={id}
              onClick={() => handleSelect(id)}
              className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
            >
              {p.number}
            </button>
          );
        })}
      </div>

      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        Banquillo — toca un suplente y luego a quién sustituye
      </div>
      <div className="flex flex-wrap gap-2">
        {rosterBench.length === 0 && (
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>No hay suplentes disponibles.</span>
        )}
        {rosterBench.map((id) => {
          const p = playerById(id);
          const selected = selectedId === id;
          return (
            <div key={id} className="flex flex-col items-center gap-1" style={{ width: 56 }}>
              <button
                onClick={() => handleSelect(id)}
                className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
              >
                {p.number}
              </button>
              <span className="text-[10px] text-center leading-tight" style={{ color: "var(--chalk-dim)" }}>
                {p.name.split(" ")[0]}
              </span>
            </div>
          );
        })}
      </div>
      </div>

      {/* Herramientas de dibujo: en el hueco de abajo a la derecha del campo */}
      <div className="mp-card p-3 mt-4 md:mt-0" style={{ maxWidth: 300 }}>
        <div className="mb-2 text-xs" style={{ color: "var(--chalk-dim)" }}>Dibujar sobre el campo</div>
        <div className="flex flex-wrap gap-2 mb-2">
          {modeBtn("mover", "✋ Mover")}
          {modeBtn("dibujar", "✏️ Lápiz")}
          {modeBtn("goma", "🧽 Goma")}
        </div>
        <div className="flex flex-wrap items-center gap-2 mb-2" style={{ opacity: mode === "dibujar" ? 1 : 0.5 }}>
          {PITCH_COLORS.map((c) => (
            <button
              key={c.id}
              aria-label={`Color ${c.id}`}
              onClick={() => {
                setColor(c.value);
                changeMode("dibujar");
              }}
              style={{
                width: 28,
                height: 28,
                borderRadius: 999,
                background: c.value,
                border: color === c.value ? "3px solid var(--cielo)" : "2px solid rgba(244,241,232,0.4)",
              }}
            />
          ))}
          <button onClick={() => setThick((t) => !t)} className="mp-btn px-2 py-1 text-xs">
            {thick ? "Trazo grueso" : "Trazo fino"}
          </button>
        </div>
        <div className="flex flex-wrap gap-2">
          <button
            onClick={() => commitStrokes(strokes.slice(0, -1))}
            disabled={strokes.length === 0}
            className="mp-btn px-3 py-2 text-sm disabled:opacity-40"
          >
            Deshacer
          </button>
          <button
            onClick={() => commitStrokes([])}
            disabled={strokes.length === 0}
            className="mp-btn px-3 py-2 text-sm disabled:opacity-40"
            style={{ color: "var(--crimson)" }}
          >
            Borrar todo
          </button>
        </div>
      </div>
      </div>
    </div>
  );
}

function OpponentChanceMarker({ match, onUpdate }) {
  const opponentChances = match.opponentChances || [];

  function addOpponentChance() {
    const entry = { id: genId(), half: match.clock.activeHalf, minute: computeMinute(match) };
    onUpdate({ ...match, opponentChances: [...opponentChances, entry] }, true);
  }
  function removeOpponentChance(id) {
    onUpdate({ ...match, opponentChances: opponentChances.filter((e) => e.id !== id) }, true);
  }

  return (
    <div className="mp-card p-3 mb-3">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>
        Ocasiones del rival — solo para localizarlas luego en el vídeo, no cuenta en las estadísticas
      </div>
      <button onClick={addOpponentChance} className="mp-btn mp-btn-outline w-full py-2 text-sm mb-2">
        + Marcar ocasión del rival
      </button>
      {opponentChances.length > 0 && (
        <div className="flex flex-wrap gap-2">
          {opponentChances
            .slice()
            .sort((a, b) => b.half - a.half || b.minute - a.minute)
            .map((c) => (
              <span key={c.id} className="mp-card px-2 py-1 text-xs flex items-center gap-2">
                {c.minute}'
                <button onClick={() => removeOpponentChance(c.id)} style={{ color: "var(--crimson)" }}>
                  ×
                </button>
              </span>
            ))}
        </div>
      )}
    </div>
  );
}

function TeamEventsPanel({ match, onUpdate }) {
  const teamEvents = match.teamEvents || [];

  function countOf(typeId) {
    return teamEvents.filter((e) => e.type === typeId).length;
  }
  function addTeamEvent(typeId) {
    const entry = { id: genId(), type: typeId, half: match.clock.activeHalf, minute: computeMinute(match) };
    onUpdate({ ...match, teamEvents: [...teamEvents, entry] }, true);
  }
  function undoLastTeamEvent(typeId) {
    const idxFromEnd = [...teamEvents].reverse().findIndex((e) => e.type === typeId);
    if (idxFromEnd === -1) return;
    const idx = teamEvents.length - 1 - idxFromEnd;
    onUpdate({ ...match, teamEvents: [...teamEvents.slice(0, idx), ...teamEvents.slice(idx + 1)] }, true);
  }

  return (
    <div className="mb-4">
      {TEAM_EVENT_SECTIONS.map((section) => (
        <div key={section.id} className="mb-4">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>{section.label}</div>
          <div className="grid grid-cols-2 gap-2">
            {TEAM_EVENT_TYPES.filter((t) => t.section === section.id).map((t) => (
              <TeamEventCounter
                key={t.id}
                label={t.short}
                value={countOf(t.id)}
                onAdd={() => addTeamEvent(t.id)}
                onUndo={() => undoLastTeamEvent(t.id)}
              />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Estadísticas de temporada
--------------------------------------------------------- */
function StatCard({ label, value, sub }) {
  return (
    <div className="mp-card p-3">
      <div className="text-xs mb-1" style={{ color: "var(--chalk-dim)" }}>{label}</div>
      <div className="display text-3xl font-semibold leading-none">{value}</div>
      {sub && (
        <div className="text-xs mt-1" style={{ color: "var(--chalk-dim)" }}>{sub}</div>
      )}
    </div>
  );
}

function MatchTotals({ events, teamEvents = [] }) {
  const totals = {};
  events.forEach((e) => {
    totals[e.type] = (totals[e.type] || 0) + 1;
  });
  const teamCount = (type) => teamEvents.filter((e) => e.type === type).length;

  const faltasEnContra = totals["falta_cometida"] || 0;
  const faltasAFavor = totals["falta_recibida"] || 0;
  const amarillas = totals["amarilla"] || 0;
  const rojas = totals["roja"] || 0;
  const cornersFavor = teamCount("corner_favor");
  const cornersContra = teamCount("corner_contra");
  const tirosPuerta = totals["remate_puerta"] || 0;
  const tirosFuera = totals["remate_fuera"] || 0;
  const tirosTotales = tirosPuerta + tirosFuera;
  const tirosPuertaPct = tirosTotales === 0 ? null : Math.round((tirosPuerta / tirosTotales) * 100);
  const duelosGanados = (totals["duelo_ganado"] || 0) + (totals["duelo_general_ganado"] || 0);
  const duelosPerdidos = (totals["duelo_perdido"] || 0) + (totals["duelo_general_perdido"] || 0);
  const duelosTotales = duelosGanados + duelosPerdidos;
  const duelosPct = duelosTotales === 0 ? null : Math.round((duelosGanados / duelosTotales) * 100);
  const robos = totals["recuperacion"] || 0;
  const paradas =
    (totals["parada_area"] || 0) +
    (totals["parada_fuera_area"] || 0) +
    (totals["parada_area_pequena"] || 0);

  return (
    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
      <StatCard label="Faltas a favor" value={faltasAFavor} />
      <StatCard label="Faltas en contra" value={faltasEnContra} />
      <StatCard label="Tarjetas amarillas" value={amarillas} />
      <StatCard label="Tarjetas rojas" value={rojas} />
      <StatCard label="Córners a favor" value={cornersFavor} />
      <StatCard label="Córners en contra" value={cornersContra} />
      <StatCard
        label="Tiros a puerta"
        value={tirosPuertaPct === null ? "–" : `${tirosPuertaPct}%`}
        sub={tirosTotales === 0 ? "Sin tiros registrados" : `${tirosPuerta} de ${tirosTotales}`}
      />
      <StatCard
        label="Duelos ganados"
        value={duelosPct === null ? "–" : `${duelosPct}%`}
        sub={duelosTotales === 0 ? "Sin duelos registrados" : `${duelosGanados} de ${duelosTotales}`}
      />
      <StatCard label="Robos totales" value={robos} />
      <StatCard label="Paradas totales" value={paradas} />
    </div>
  );
}

/* ---------------------------------------------------------
   Estadísticas del equipo de toda la temporada, en medias por partido
--------------------------------------------------------- */
function SeasonTeamStats({ matches }) {
  const n = matches.length;
  if (n === 0) return null;

  const allEvents = matches.flatMap((m) => m.events);
  const count = (type) => allEvents.filter((e) => e.type === type).length;
  const teamEventCount = (type) =>
    matches.reduce((sum, m) => sum + (m.teamEvents || []).filter((e) => e.type === type).length, 0);

  const faltas = count("falta_cometida");
  const amarillas = count("amarilla");
  const rojas = count("roja");
  const tirosPuerta = count("remate_puerta");
  const tirosFuera = count("remate_fuera");
  const corners = teamEventCount("corner_favor");
  const robos = count("recuperacion");
  const golesFavor = allEvents.filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const golesContra = matches.reduce(
    (sum, m) => sum + (m.concededSetPieces || []).length + m.events.filter((e) => e.type === "gol_encajado").length,
    0
  );

  const avg = (total) => Math.round((total / n) * 10) / 10;

  return (
    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
      <StatCard label="Goles a favor" value={golesFavor} sub={`${avg(golesFavor)} por partido`} />
      <StatCard label="Goles encajados" value={golesContra} sub={`${avg(golesContra)} por partido`} />
      <StatCard label="Tarjetas amarillas" value={amarillas} sub={`${avg(amarillas)} por partido`} />
      <StatCard label="Tarjetas rojas" value={rojas} sub={`${avg(rojas)} por partido`} />
      <StatCard label="Faltas por partido" value={avg(faltas)} />
      <StatCard label="Tiros a puerta/partido" value={avg(tirosPuerta)} />
      <StatCard label="Tiros fuera/partido" value={avg(tirosFuera)} />
      <StatCard label="Córners por partido" value={avg(corners)} />
      <StatCard label="Robos por partido" value={avg(robos)} />
    </div>
  );
}

function computePlayerStats(playerId, events) {
  const own = events.filter((e) => e.playerId === playerId);
  const count = (type) => own.filter((e) => e.type === type).length;
  const duelosGanados = count("duelo_ganado") + count("duelo_general_ganado");
  const duelosPerdidos = count("duelo_perdido") + count("duelo_general_perdido");
  const duelosTotales = duelosGanados + duelosPerdidos;
  const duelosPct = duelosTotales === 0 ? null : Math.round((duelosGanados / duelosTotales) * 100);
  const regatesOk = count("regate");
  const regatesFallados = count("regate_fallado");
  const regatesTotales = regatesOk + regatesFallados;
  const regatesPct = regatesTotales === 0 ? null : Math.round((regatesOk / regatesTotales) * 100);
  const tirosPuerta = count("remate_puerta");
  const tirosFuera = count("remate_fuera");
  const tirosTotales = tirosPuerta + tirosFuera;
  const tirosPuertaPct = tirosTotales === 0 ? null : Math.round((tirosPuerta / tirosTotales) * 100);
  const perdidas = count("perdida");
  const robos = count("recuperacion");
  const goles = ALL_GOAL_TYPES.reduce((sum, t) => sum + count(t), 0);
  const asistencias = count("asistencia");
  const paradas = count("parada_area") + count("parada_fuera_area") + count("parada_area_pequena");
  const despejes = count("despeje");
  const golesEncajados = count("gol_encajado");
  const amarillas = count("amarilla");
  const rojas = count("roja");
  return {
    duelosGanados,
    duelosPerdidos,
    duelosTotales,
    duelosPct,
    regatesOk,
    regatesFallados,
    regatesTotales,
    regatesPct,
    tirosPuerta,
    tirosFuera,
    tirosTotales,
    tirosPuertaPct,
    perdidas,
    robos,
    goles,
    asistencias,
    paradas,
    despejes,
    golesEncajados,
    amarillas,
    rojas,
  };
}

              {open && isGoalkeeper && (

                </div>
              )}
              {open &&
                (() => {
                  const own = events.filter((e) => e.playerId === p.id);
                  const counts = {};
                  own.forEach((e) => {
                    counts[e.type] = (counts[e.type] || 0) + 1;
                  });
                  const usedTypes = EVENT_TYPES.filter(
                    (ev) => counts[ev.id] && !(isGoalkeeper && FIELD_PLAYER_GROUPS.includes(ev.group))
                  );
                  if (usedTypes.length === 0) return null;
                  return (
                    <div className="px-3 pb-3 pt-2" style={{ borderTop: "1px solid rgba(244,241,232,0.08)" }}>
                      <div className="text-xs mb-1" style={{ color: "var(--chalk-dim)" }}>Todos los eventos</div>
                      <div className="flex flex-col gap-1">
                        {usedTypes.map((ev) => (
                          <div key={ev.id} className="flex items-center justify-between text-sm">
                            <span style={{ color: "var(--chalk-dim)" }}>{ev.label}</span>
                            <span className="font-semibold">
                              {counts[ev.id]}
                              {matches && matchesPlayed > 0 && (
                                <span className="text-xs font-normal ml-1" style={{ color: "var(--chalk-dim)" }}>
                                  ({(counts[ev.id] / matchesPlayed).toFixed(1)}/partido)
                                </span>
                              )}
                            </span>
                          </div>
                        ))}
                      </div>
                    </div>
                  );
                })()}
            </div>
          );
        })}
    </div>
  );
}

/* ---------------------------------------------------------
   Gráfico de composición: reparto en % entre 2-3 resultados posibles
--------------------------------------------------------- */
function PercentBreakdownChart({ title, segments }) {
  const total = segments.reduce((sum, s) => sum + s.value, 0);
  if (total === 0) return null;
  const visible = segments.filter((s) => s.value > 0);

  return (
    <div className="mp-card p-3">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>{title}</div>
      <div className="flex w-full h-4 rounded-full overflow-hidden">
        {visible.map((s, i) => (
          <div
            key={s.label}
            style={{
              width: `${(s.value / total) * 100}%`,
              background: s.color,
              borderRight: i < visible.length - 1 ? "2px solid var(--pitch)" : "none",
            }}
          />
        ))}
      </div>
      <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2">
        {segments.map((s) => (
          <div key={s.label} className="flex items-center gap-1 text-[11px]" style={{ color: "var(--chalk-dim)" }}>
            <span
              style={{ width: 8, height: 8, borderRadius: 2, background: s.color, display: "inline-block" }}
            />
            {s.label}:{" "}
            <span className="font-semibold" style={{ color: "var(--chalk)" }}>
              {Math.round((s.value / total) * 100)}% ({s.value})
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}
