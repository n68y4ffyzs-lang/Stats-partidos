<script>
  // Service Worker: guarda la app para poder abrirla sin conexión (ver sw.js).
  // Busca versiones nuevas al arrancar, al recuperar conexión y al volver a la app; una versión
  // nueva se aplica la próxima vez que se abra la app, sin cortar lo que se esté haciendo.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").then(function (reg) {
        function check() { if (navigator.onLine) reg.update().catch(function () {}); }
        window.addEventListener("online", check);
        document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
      }).catch(function (e) { console.error("Error registrando el Service Worker", e); });
    });
  }
</script>

const SUPABASE_ANON_KEY_KEY = "rp_supabase_anon_key";

function isValidSupabaseConfig(url, key) {
  return !!(url && key && /^https?:\/\//.test(url));
}

function getStoredSupabaseConfig() {
  return {
    url: localStorage.getItem(SUPABASE_URL_KEY) || "",
    key: localStorage.getItem(SUPABASE_ANON_KEY_KEY) || "",
  };
}

function setStoredSupabaseConfig(url, key) {
  if (url) localStorage.setItem(SUPABASE_URL_KEY, url);
  else localStorage.removeItem(SUPABASE_URL_KEY);
  if (key) localStorage.setItem(SUPABASE_ANON_KEY_KEY, key);
  else localStorage.removeItem(SUPABASE_ANON_KEY_KEY);
}

/* ---------------------------------------------------------

--------------------------------------------------------- */
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

// Cálculo puro del tiempo transcurrido y el minuto a partir del propio match,
// sin depender de referencias locales que puedan quedarse desactualizadas entre componentes.
// Duración de cada parte en segundos, la que se puso al crear el partido (sin límite si falta)
function halfLimitSeconds(match) {
  return (Number(match.halfLength) || 0) * 60 || Infinity;
}

// El cronómetro de cada parte nunca pasa de su duración: al llegar, se queda clavado ahí.
function computeElapsed(match) {
  const key = match.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";
  const base = match.clock[key] || 0;
  if (!match.clock.running) return Math.min(base, halfLimitSeconds(match));
  const startedAt = match.clock.runStartedAt || Date.now();
  return Math.min(base + Math.floor((Date.now() - startedAt) / 1000), halfLimitSeconds(match));
}

function isHalfTimeUp(match) {
  return computeElapsed(match) >= halfLimitSeconds(match);
}

function computeMinute(match) {
  const secs = computeElapsed(match);
  const inHalf = Math.min(Math.floor(secs / 60) + 1, Number(match.halfLength) || Infinity);
  if (match.clock.activeHalf === 1) return inHalf;
  return match.halfLength + inHalf;
}

function halfLabel(match) {
  if (match.half === "descanso") return "Descanso";
  if (match.half === "finalizado") return "Finalizado";
  return match.half === 1 ? "1ª parte" : "2ª parte";
}

function matchBadge(m) {
  if (m.scheduled) return { label: "Programado", bg: "rgba(62,146,204,0.18)", color: "var(--cielo)" };
  if (m.finished) return { label: "Finalizado", bg: "rgba(111,190,68,0.15)", color: "var(--turf)" };
  return { label: "En juego", bg: "rgba(227,167,45,0.18)", color: "var(--amber)" };
}

// Local (verde) / visitante (rojo); gris si no se sabe (partidos antiguos sin ese dato)

}
function venueLabel(m) {

  return null;
}

--------------------------------------------------------- */

/* Aislamiento en este dispositivo: todo lo que es de una cuenta (datos, cola de pendientes,
   pizarra, caché de la clasificación...) se guarda bajo una clave con su id de usuario, así
   que entrar con otra cuenta nunca enseña ni sube los datos de la anterior. Sin sesión (modo
   solo local) se usa la clave sin sufijo. Los datos de la época de los códigos de equipo
   siguen en sus claves antiguas (…::<código>) hasta que se copian a una cuenta. */
let activeTeamCode = "";

function teamKey(base, code = activeTeamCode) {
  return code ? `${base}::${code}` : base;
}

function setActiveTeamCode(code) {
  activeTeamCode = code || "";
}

// Antes todo se guardaba sin código de equipo: la primera vez, eso pertenece al equipo con el
// que estaba configurado el dispositivo y se mueve a sus claves.
function migrateUnscopedStorage(code, baseKeys) {
  if (!code) return;
  baseKeys.forEach((base) => {
    try {
      const legacy = localStorage.getItem(base);
      if (legacy != null && localStorage.getItem(teamKey(base, code)) == null) {
        localStorage.setItem(teamKey(base, code), legacy);
      }
      if (legacy != null) localStorage.removeItem(base);
    } catch (e) {
      console.error("Error migrando datos locales al código de equipo", e);
    }
  });
}

/* ---------------------------------------------------------
   Escudos: el propio y los de los rivales (por nombre), como imágenes pequeñas en data URL.
   Viajan dentro de los datos, así que se sincronizan con Supabase como todo lo demás.
--------------------------------------------------------- */
function emptyCrests() {
  return { own: null, ownNoBg: false, rivalsNoBg: false, rivals: {} };
}

function crestKey(name) {
  return (name || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function rivalCrest(crests, name) {
  return (crests && crests.rivals && crests.rivals[crestKey(name)]) || null;
}

// Reduce la imagen elegida a un cuadrado máximo de 128 px (conserva la transparencia)
function resizeCrest(file, size = 128) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("La imagen no es válida"));
      img.onload = () => {
        const iw = img.width || size; // un SVG sin tamaño propio puede dar 0
        const ih = img.height || size;
        const scale = Math.min(1, size / Math.max(iw, ih));
        const w = Math.max(1, Math.round(iw * scale));
        const h = Math.max(1, Math.round(ih * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Quita el fondo blanco de un escudo (los JPG de la FFCV lo traen): borra el blanco que toca el
// borde de la imagen, así el blanco de dentro del escudo se conserva. Devuelve un data URL PNG.
function removeWhiteBackground(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(dataUrl);
    img.onload = () => {
      try {
        const w = img.width;
        const h = img.height;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, w, h);
        const px = imageData.data;
        const isLight = (i, min) => px[i + 3] < 10 || Math.min(px[i], px[i + 1], px[i + 2]) >= min;
        const removed = new Uint8Array(w * h);
        const stack = [];
        const push = (x, y) => {
          const k = y * w + x;
          if (!removed[k] && isLight(k * 4, 225)) {
            removed[k] = 1;
            stack.push(k);
          }
        };
        for (let x = 0; x < w; x++) {
          push(x, 0);
          push(x, h - 1);
        }
        for (let y = 0; y < h; y++) {
          push(0, y);
          push(w - 1, y);
        }
        while (stack.length) {
          const k = stack.pop();
          const x = k % w;
          const y = (k - x) / w;
          if (x > 0) push(x - 1, y);
          if (x < w - 1) push(x + 1, y);
          if (y > 0) push(x, y - 1);
          if (y < h - 1) push(x, y + 1);
        }
        // Halo claro que deja la compresión JPG junto al borde del escudo
        const halo = [];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const k = y * w + x;
            if (removed[k] || !isLight(k * 4, 195)) continue;
            if (
              (x > 0 && removed[k - 1]) ||
              (x < w - 1 && removed[k + 1]) ||
              (y > 0 && removed[k - w]) ||
              (y < h - 1 && removed[k + w])
            ) {
              halo.push(k);
            }
          }
        }
        halo.forEach((k) => (removed[k] = 1));
        for (let k = 0; k < removed.length; k++) if (removed[k]) px[k * 4 + 3] = 0;
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL("image/png"));
      } catch (e) {
        resolve(dataUrl);
      }
    };
    img.src = dataUrl;
  });
}

// Versión en blanco de un escudo (para pintarlo sobre el césped): conserva la forma y los detalles,
// que quedan más tenues cuanto más claros eran en el original. Devuelve un data URL PNG.
function whiteCrest(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(null);
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const px = imageData.data;
        for (let i = 0; i < px.length; i += 4) {
          const lum = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255;
          px[i + 3] = Math.round(px[i + 3] * (0.25 + 0.75 * (1 - lum)));
          px[i] = px[i + 1] = px[i + 2] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL("image/png"));
      } catch (e) {
        resolve(null);
      }
    };
    img.src = dataUrl;
  });
}

function useWhiteCrest(src) {
  const [white, setWhite] = useState(null);
  useEffect(() => {
    let alive = true;
    if (!src) {

    }
    whiteCrest(src).then((url) => alive && setWhite(url));
    return () => {

}

// Formato antiguo de una jugada de balón parado: positions = { [playerId]: {x,y}, ball: {x,y} },
// es decir, las posiciones estaban atadas a un jugador concreto de la plantilla.
// Formato nuevo: slots = [{id,x,y}], posiciones fijas independientes del jugador; qué jugador
// ocupa cada slot se decide partido a partido (match.setPieceAssignments).
function migratePlay(play) {
  if (play.slots) return play;
  const legacyPositions = play.positions || {};
  const slots = Object.keys(legacyPositions)
    .filter((k) => k !== "ball")
    .map((playerId) => ({ id: genId(), x: legacyPositions[playerId].x, y: legacyPositions[playerId].y }));
  return { id: play.id, name: play.name, slots, ball: legacyPositions.ball || null };
}

function migrateSetPiecePositions(raw) {
  const out = {};
  Object.keys(raw || {}).forEach((category) => {
    out[category] = (Array.isArray(raw[category]) ? raw[category] : []).map(migratePlay);
  });
  return out;
}

// Migra las 4 posiciones antiguas (Portero/Defensa/Centrocampista/Delantero) al nuevo detalle
// de 9 posiciones (PT/DFI/DFC/DFD/CAI/CAD/MC/MCO/DC). Un jugador ya migrado no se toca.
const LEGACY_POSITION_MIGRATION = {
  portero: "PT",
  defensa: "DFC",
  centrocampista: "MC",
  delantero: "DC",
};
function migrateSquadPositions(squad) {
  return (squad || []).map((p) =>
    p.position && LEGACY_POSITION_MIGRATION[p.position]
      ? { ...p, position: LEGACY_POSITION_MIGRATION[p.position] }
      : p
  );
}

/* ---------------------------------------------------------
   Sanciones (Plantilla → Sancionados). Viajan con los datos del equipo:
   - data.sanctions: [{ id, playerId, reason: "roja" | "amarillas", count, matchId, opponent,
     date, remaining, served: [matchId...] }]. Mientras `remaining` > 0 el jugador no se puede
     convocar; al finalizar cada partido de liga se descuenta 1 (nunca en el partido que la
     originó) y al llegar a 0 sale de la lista.
   - data.sanctionTriggers: claves de los motivos ya tratados (cada roja, y cada múltiplo de 5
     amarillas por jugador), para no volver a crear una sanción que se quitó a mano.
   La primera vez (sin sanctionTriggers) se marcan como tratados los de partidos ya
   finalizados: las sanciones no se aplican hacia atrás.
--------------------------------------------------------- */
function isLeagueMatch(m) {
  return !m || m.competition !== "amistoso";
}

function sanctionTriggersOf(data) {
  const matches = Object.values(data.matchesById || {})
    .filter((m) => !m.scheduled)
    .sort((a, b) => String(a.date || "").localeCompare(String(b.date || "")) || String(a.id).localeCompare(String(b.id)));
  const triggers = [];
  const yellows = {};
  matches.forEach((m) => {
    [...(m.events || [])]
      .sort((a, b) => a.half - b.half || a.minute - b.minute)
      .forEach((e) => {
        const base = { playerId: e.playerId, matchId: m.id, opponent: m.opponent, date: m.date, finished: !!m.finished };
        if (e.type === "roja") triggers.push({ ...base, key: `roja:${e.id}`, reason: "roja" });
        if (e.type === "amarilla") {
          yellows[e.playerId] = (yellows[e.playerId] || 0) + 1;
          if (yellows[e.playerId] % 5 === 0) {
            triggers.push({ ...base, key: `amarillas:${e.playerId}:${yellows[e.playerId]}`, reason: "amarillas", count: yellows[e.playerId] });
          }
        }
      });
  });
  return triggers;
}

// Crea las sanciones nuevas (roja, o cada 5 amarillas en la temporada) con 1 partido por defecto
function applySanctionTriggers(data) {
  const triggers = sanctionTriggersOf(data);
  if (!Array.isArray(data.sanctionTriggers)) {
    // Primera vez: lo de partidos ya finalizados no genera sanción
    const done = triggers.filter((t) => t.finished).map((t) => t.key);
    data = { ...data, sanctionTriggers: done };
  }
  const done = new Set(data.sanctionTriggers);
  const fresh = triggers.filter((t) => !done.has(t.key));
  if (!fresh.length) return data;
  return {
    ...data,
    sanctionTriggers: [...data.sanctionTriggers, ...fresh.map((t) => t.key)],
    sanctions: [
      ...(data.sanctions || []),
      ...fresh.map((t) => ({
        id: genId(),
        playerId: t.playerId,
        reason: t.reason,
        count: t.count || null,
        matchId: t.matchId,
        opponent: t.opponent,
        date: t.date,
        remaining: 1,
        served: [],
      })),
    ],
  };
}

// Al finalizar un partido de liga: 1 partido menos a cada sanción pendiente (salvo la que nació
// en ese mismo partido); las que llegan a 0 salen de Sancionados.
function serveSanctions(data, match) {
  if (!isLeagueMatch(match)) return data;
  const sanctions = (data.sanctions || [])
    .map((s) =>
      s.remaining > 0 && s.matchId !== match.id && !(s.served || []).includes(match.id)
        ? { ...s, remaining: s.remaining - 1, served: [...(s.served || []), match.id] }
        : s
    )
    .filter((s) => s.remaining > 0);
  return { ...data, sanctions };
}

// { playerId: partidos pendientes } (si tiene varias sanciones, se suman)
function pendingSanctionsByPlayer(data) {
  const out = {};
  (data.sanctions || []).forEach((s) => {
    if (s.remaining > 0) out[s.playerId] = (out[s.playerId] || 0) + s.remaining;
  });
  return out;
}

function sanctionReasonText(s) {
  if (s.reason === "roja") return `Roja${s.opponent ? ` vs ${s.opponent}` : ""}`;
  return `${s.count || 5} amarillas${s.opponent ? ` (la última vs ${s.opponent})` : ""}`;
}

/* ---------------------------------------------------------
   Cola de cambios pendientes de subir a Supabase
   Cada cambio guardado en local añade una entrada { id, at, keys, matchIds, silent } con qué
   partes de los datos tocó (claves de primer nivel y partidos). No guarda copias completas
   (llenarían el almacenamiento del iPad): como los datos son un único documento, subir el
   estado actual ya incluye todos los cambios de la cola en el orden en que ocurrieron. Las
   entradas se borran solo cuando la subida que las incluye se confirma, así que un corte a
   mitad no pierde nada, y reintentar es seguro porque la subida sustituye el documento.
   Las marcas de qué se tocó sirven para fusionar si otro dispositivo cambió la nube mientras
   tanto (ver mergePendingIntoRemote).
--------------------------------------------------------- */
function loadPending() {
  try {
    const parsed = JSON.parse(localStorage.getItem(teamKey(PENDING_KEY)) || "[]");
    return Array.isArray(parsed) ? parsed : [];

    else localStorage.removeItem(teamKey(PENDING_KEY));

  }
}

// Qué ha cambiado entre dos versiones de los datos (comparando referencias: las
// actualizaciones son inmutables, así que lo que no se tocó conserva la misma referencia).
function diffDataForQueue(prev, next) {
  const keys = new Set([...Object.keys(prev || {}), ...Object.keys(next || {})]);
  keys.delete("updatedAt");
  const changedKeys = [...keys].filter((k) => (prev || {})[k] !== (next || {})[k]);
  const prevById = (prev && prev.matchesById) || {};
  const nextById = (next && next.matchesById) || {};
  const matchIds = [...new Set([...Object.keys(prevById), ...Object.keys(nextById)])].filter(
    (id) => prevById[id] !== nextById[id]
  );
  return { keys: changedKeys, matchIds };
}

// Otro dispositivo cambió la nube mientras este tenía cambios sin subir: parte de lo que hay
// en la nube y encima pone lo que este dispositivo cambió (partidos concretos y secciones
// enteras como la plantilla), para no pisar lo del otro ni perder lo de este.
function mergePendingIntoRemote(remote, local, pending) {
  const keys = new Set();
  const matchIds = new Set();
  pending.forEach((e) => {
    (e.keys || []).forEach((k) => keys.add(k));
    (e.matchIds || []).forEach((id) => matchIds.add(id));
  });
  const merged = { ...emptyData(), ...remote };
  keys.forEach((k) => {
    if (k !== "matchesById" && k !== "matchesList") merged[k] = local[k];
  });
  const byId = { ...(remote.matchesById || {}) };
  let list = [...(remote.matchesList || [])];
  matchIds.forEach((id) => {
    const localMatch = (local.matchesById || {})[id];
    const localEntry = (local.matchesList || []).find((m) => m.id === id);
    if (localMatch) byId[id] = localMatch;
    else delete byId[id];
    const idx = list.findIndex((m) => m.id === id);
    if (localEntry) {
      if (idx >= 0) list[idx] = localEntry;
      else list.push(localEntry);
    } else if (!localMatch && idx >= 0) {
      list.splice(idx, 1);
    }
  });
  merged.matchesById = byId;
  merged.matchesList = list;
  return merged;
}

--------------------------------------------------------- */
const SYNC_META = {
  unconfigured: { color: "#8A8577", label: "Sin configurar" },
  "no-code": { color: "var(--amber)", label: "Sin sesión iniciada" },
  offline: { color: "var(--amber)", label: "Sin conexión" },
  syncing: { color: "var(--cielo)", label: "Sincronizando…" },
  synced: { color: "var(--turf)", label: "Sincronizado" },
  error: { color: "var(--crimson)", label: "Error de sincronización" },
  blocked: { color: "var(--amber)", label: "Sincronización cancelada (revisa)" },
};

// Lo que enseña el indicador: sin conexión manda sobre todo lo demás, luego los cambios
// pendientes de subir y, si no queda nada, el estado normal ("Sincronizado", error...).
function syncDisplay(status, online, pendingCount) {
  if (status === "unconfigured" || status === "no-code") return SYNC_META[status];
  const plural = pendingCount === 1 ? "" : "s";
  if (!online) {
    return {
      color: "var(--amber)",
      label: pendingCount > 0
        ? `Sin conexión — guardando en local (${pendingCount} pendiente${plural})`
        : "Sin conexión — guardando en local",
    };
  }
  if (status === "blocked") return SYNC_META.blocked;
  if (pendingCount > 0) {
    return {
      color: status === "syncing" ? "var(--cielo)" : "var(--amber)",
      label: status === "syncing"
        ? `Subiendo ${pendingCount} cambio${plural}…`
        : `${pendingCount} cambio${plural} pendiente${plural} de subir`,
    };
  }
  return SYNC_META[status] || SYNC_META.unconfigured;
}

function SyncBadge({ status, onClick }) {
  const meta = typeof status === "object" && status ? status : SYNC_META[status] || SYNC_META.unconfigured;
  return (
    <button
      onClick={onClick}
      className="flex items-center gap-2 text-xs px-2 py-1.5 rounded-full mp-card"
      style={{ color: "var(--chalk-dim)" }}
    >
      <span className="mp-dot" style={{ background: meta.color }} />
      {meta.label}
    </button>
  );
}

    setHalfLength(team.defaultHalfLength);
    setFormation(team.defaultFormation);
    setGroupCode(team.ffcvGroupCode);
    setTeamCode(team.ffcvTeamCode);
  }, [team.name, team.defaultHalfLength, team.defaultFormation, team.ffcvGroupCode, team.ffcvTeamCode]);

  const dirty =
    name.trim() !== team.name ||
    Number(halfLength) !== team.defaultHalfLength ||
    formation !== team.defaultFormation ||
    groupCode.trim() !== team.ffcvGroupCode ||
    teamCode.trim() !== team.ffcvTeamCode;

  function findTeams() {
    const g = groupCode.trim();
    if (!/^\d+$/.test(g)) {
      setLookup({ loading: false, error: "El código de grupo son solo números." });
      return;
    }
    setLookup({ loading: true, error: null });
    fetch(`/api/clasificacion?cod_grupo=${encodeURIComponent(g)}`)
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        if (!ok || body.error) throw new Error(body.error || "No se pudo consultar la FFCV");
        setGroupTeams({ label: `${body.competicion || ""} · ${body.grupo || ""}`, teams: body.clasificacion || [] });
        setLookup({ loading: false, error: null });
      })
      .catch((e) => setLookup({ loading: false, error: e.message }));
  }

  function pickTeam(code) {
    setTeamCode(code);
    const t = groupTeams && groupTeams.teams.find((x) => x.codequipo === code);
    if (t && !name.trim()) setName(t.nombre);
  }

  function save() {
    onSave({
      name: name.trim(),
      defaultHalfLength: Math.min(Math.max(Number(halfLength) || 45, 10), 60),
      defaultFormation: formation,
      ...(formation !== team.defaultFormation ? { formationChosen: true } : {}),
      ffcvGroupCode: groupCode.trim(),
      ffcvTeamCode: teamCode.trim(),
    });
  }

  const inputCls = "mp-input w-full px-3 py-2 text-sm";
  const labelStyle = { color: "var(--chalk-dim)" };
  return (
    <div className="mp-card p-3 mb-4">
      <label className="text-xs" style={labelStyle}>Mi equipo</label>
      <div className="flex items-center gap-3 mt-2 mb-3">
        <CrestPicker src={crests && crests.own} size={48} onPick={(url) => onSaveCrest("own", null, url)} label="Elegir el escudo de mi equipo" />
        <div className="flex-1 min-w-0">
          <div className="text-[11px] mb-1" style={labelStyle}>Nombre del club</div>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Nombre de tu equipo" className={inputCls} />
        </div>
      </div>
      <div className="text-[11px] mb-1" style={labelStyle}>Duración de cada parte por defecto (minutos)</div>
      <input type="number" min={10} max={60} value={halfLength} onChange={(e) => setHalfLength(e.target.value)} className={inputCls + " mb-3"} />
      <div className="text-[11px] mb-1" style={labelStyle}>
        Formación por defecto (la de "Colocar automáticamente"; en cada partido se puede cambiar solo para ese partido)
      </div>
      <select value={formation} onChange={(e) => setFormation(e.target.value)} className={inputCls + " mb-3"}>
        {RIVAL_FORMATIONS.map((f) => (
          <option key={f.id} value={f.id}>{f.id}</option>
        ))}
      </select>

      <div className="text-[11px] mb-1" style={labelStyle}>
        FFCV: código de grupo (el número <span className="font-semibold">cod_grupo</span> de la página de tu
        competición en ffcv.es; cambia cada temporada)
      </div>
      <div className="flex gap-2 mb-2">
        <input value={groupCode} onChange={(e) => setGroupCode(e.target.value)} inputMode="numeric" placeholder="p. ej. 905431893" className={inputCls} />
        <button onClick={findTeams} disabled={lookup.loading || !groupCode.trim()} className="mp-btn mp-btn-outline px-3 py-2 text-xs shrink-0 disabled:opacity-40">
          {lookup.loading ? "Buscando…" : "Buscar equipos"}
        </button>
      </div>
      {lookup.error && <div className="text-xs mb-2" style={{ color: "var(--crimson)" }}>{lookup.error}</div>}
      {groupTeams && (
        <div className="mb-2">
          <div className="text-[11px] mb-1" style={labelStyle}>{groupTeams.label} — elige tu equipo:</div>
          <select value={teamCode} onChange={(e) => pickTeam(e.target.value)} className={inputCls}>
            <option value="">Elige…</option>
            {groupTeams.teams.map((t) => (
              <option key={t.codequipo} value={t.codequipo}>{t.nombre}</option>
            ))}
          </select>
        </div>
      )}
      <div className="text-[11px] mb-1" style={labelStyle}>FFCV: código de equipo</div>
      <input value={teamCode} onChange={(e) => setTeamCode(e.target.value)} inputMode="numeric" placeholder="Se rellena al elegir tu equipo" className={inputCls + " mb-3"} />
      <button onClick={save} disabled={!dirty} className="mp-btn mp-btn-primary w-full py-2.5 text-sm font-semibold disabled:opacity-40">
        {dirty ? "Guardar mi equipo" : "Guardado"}
      </button>
    </div>
  );
}

// Primera vez con una cuenta sin equipo: buscador por nombre (como "Buscar por rival", pero
// contra la FFCV). Al elegir el equipo la app se configura sola: escudo, clasificación y calendario.
function TeamSetup({ onChoose, onSkip, mode = "first", currentName, confirmChoice }) {
  const changing = mode === "change";
  const [query, setQuery] = useState("");
  const [results, setResults] = useState(null);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState(null);
  const [choosing, setChoosing] = useState(null);
  const [notFound, setNotFound] = useState(false);

  useEffect(() => {
    const q = query.trim();
    if (q.length < 3) {
      setResults(null);
      setError(null);
      return;
    }
    let cancelled = false;
    setLoading(true);
    const t = setTimeout(() => {
      fetch(`/api/buscar-equipo?q=${encodeURIComponent(q)}`)
        .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
        .then(({ ok, body }) => {
          if (cancelled) return;
          if (!ok || body.error) throw new Error(body.error || "No se pudo buscar en la FFCV");
          setResults(body.equipos || []);
          setError(null);
        })
        .catch((e) => !cancelled && setError(e.message))
        .finally(() => !cancelled && setLoading(false));
    }, 500);
    return () => {
      cancelled = true;
      clearTimeout(t);
    };
  }, [query]);

  async function choose(team) {
    if (confirmChoice && !confirmChoice(team)) return;
    setChoosing(team);
    const group = await onChoose(team);
    if (group) onSkip();
    else setNotFound(true);
  }

  const dim = { color: "var(--chalk-dim)" };
  return (
    <div className="mp-app" style={{ position: "fixed", inset: 0, zIndex: 60, overflowY: "auto", background: "var(--pitch)" }}>
      <div className="max-w-md mx-auto p-4 pb-10">
        <h1 className="display text-2xl font-semibold pt-2 mb-1">{changing ? "Cambiar de equipo" : "Busca tu equipo"}</h1>
        <p className="text-sm mb-4" style={dim}>
          {changing
            ? `Ahora tienes ${currentName ? `«${currentName}»` : "un equipo"}. Busca tu club y elige el equipo correcto: se traerán su escudo, la clasificación y el calendario de la FFCV.`
            : "Escribe el nombre de tu club y elige tu equipo. La app traerá su escudo, la clasificación y el calendario de la FFCV."}
        </p>

        {choosing ? (
          <div className="mp-card p-4 text-sm">
            {notFound ? (
              <>
                <div className="mb-3">
                  Hemos guardado <span className="font-semibold">{choosing.nombre}</span>, pero no
                  encontramos su liga en la FFCV: la clasificación y el calendario no estarán disponibles.
                </div>
                <button onClick={onSkip} className="mp-btn mp-btn-primary w-full py-2.5 font-semibold">Continuar</button>
              </>
            ) : (
              <div>Configurando <span className="font-semibold">{choosing.nombre}</span>… (escudo, clasificación y calendario)</div>
            )}
          </div>
        ) : (
          <>
            <input
              value={query}
              onChange={(e) => setQuery(e.target.value)}
              placeholder="Buscar tu equipo… (p. ej. Nou Jove)"
              className="mp-input px-3 py-2 w-full mb-3"
              autoFocus
              autoCapitalize="none"
              autoCorrect="off"
            />
            {loading && <div className="text-xs mb-2" style={dim}>Buscando en la FFCV…</div>}
            {error && <div className="text-xs mb-2" style={{ color: "var(--crimson)" }}>{error}</div>}
            {results && results.length === 0 && !loading && (
              <div className="text-xs mb-2" style={dim}>No hay equipos con ese nombre esta temporada.</div>
            )}
            <div className="flex flex-col gap-2">
              {(results || []).map((t) => (
                <button key={t.codequipo} onClick={() => choose(t)} className="mp-card flex items-center gap-3 px-3 py-2 text-left">
                  {t.escudo ? (
                    <img src={`/api/escudo?p=${encodeURIComponent(t.escudo)}`} alt="" loading="lazy" width={32} height={32} style={{ objectFit: "contain" }} />
                  ) : (
                    <span style={{ width: 32 }} />
                  )}
                  <span className="min-w-0">
                    <span className="block text-sm font-semibold truncate">{t.nombre}</span>
                    <span className="block text-xs truncate" style={dim}>{t.categoria}</span>
                    {changing && currentName && t.nombre === currentName && (
                      <span className="block text-[10px]" style={{ color: "var(--turf)" }}>(nombre del equipo actual)</span>
                    )}
                  </span>
                </button>
              ))}
            </div>
            <button onClick={onSkip} className="text-xs mt-4" style={dim}>{changing ? "Cancelar" : "Ahora no"}</button>
          </>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Enlaces de los emails de Supabase (cambiar contraseña, confirmar cuenta). Se leen al
   cargar la página, antes de que el cliente de Supabase limpie la dirección, para saber si
   se entró desde "cambiar contraseña" y para explicar el error si el enlace no ha valido.
--------------------------------------------------------- */
const AUTH_LINK = (() => {
  try {
    const hash = new URLSearchParams(window.location.hash.replace(/^#/, ""));
    const query = new URLSearchParams(window.location.search);
    const get = (k) => hash.get(k) || query.get(k);
    return {
      recovery: get("type") === "recovery",
      hasToken: !!(get("access_token") || get("code")),
      errorCode: get("error_code") || get("error") || null,
      errorDescription: get("error_description") || "",
    };
  } catch (e) {
    return { recovery: false, hasToken: false, errorCode: null, errorDescription: "" };
  }
})();

function authLinkErrorMessage() {
  if (AUTH_LINK.errorCode) {
    const expired = /expired|invalid/i.test(AUTH_LINK.errorCode + " " + AUTH_LINK.errorDescription);
    return expired
      ? "El enlace del email ha caducado o ya se había usado. Solo vale el último email que pediste, y una sola vez. Pide otro desde Ajustes → Cuenta."
      : `El enlace del email no ha funcionado${AUTH_LINK.errorDescription ? ` (${AUTH_LINK.errorDescription})` : ""}. Pide otro desde Ajustes → Cuenta.`;
  }
  const cfg = getStoredSupabaseConfig();
  if ((AUTH_LINK.recovery || AUTH_LINK.hasToken) && !isValidSupabaseConfig(cfg.url, cfg.key)) {
    return "Este navegador no tiene la conexión con la app configurada, así que el enlace no puede usarse aquí. Ábrelo en el mismo navegador (y la misma ventana) donde pediste el email.";
  }
  return null;
}

// Pantalla para escribir la contraseña nueva al entrar desde el enlace del email
function NewPasswordOverlay({ email, onSave, onClose }) {
  const [pwd, setPwd] = useState("");
  const [pwd2, setPwd2] = useState("");
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [done, setDone] = useState(false);
  const dim = { color: "var(--chalk-dim)" };

  async function save() {
    if (pwd.length < 6) return setError("La contraseña debe tener al menos 6 caracteres.");
    if (pwd !== pwd2) return setError("Las dos contraseñas no coinciden.");
    setBusy(true);
    setError(null);
    const res = await onSave(pwd);
    setBusy(false);
    if (res.error) setError(res.error);
    else setDone(true);
  }

  return (
    <div className="mp-app" style={{ position: "fixed", inset: 0, zIndex: 70, overflowY: "auto", background: "var(--pitch)" }}>
      <div className="max-w-md mx-auto p-4 pt-10">
        <h1 className="display text-2xl font-semibold mb-1">Nueva contraseña</h1>
        {done ? (
          <React.Fragment>
            <p className="text-sm mb-4" style={{ color: "var(--turf)" }}>
              Contraseña cambiada. A partir de ahora entra con la nueva.
            </p>
            <button onClick={onClose} className="mp-btn mp-btn-primary w-full py-2.5 font-semibold">Continuar</button>
          </React.Fragment>
        ) : (
          <React.Fragment>
            <p className="text-sm mb-4" style={dim}>
              {email ? `Escribe la nueva contraseña para ${email}.` : "Escribe tu nueva contraseña."}
            </p>
            <input type="password" value={pwd} onChange={(e) => setPwd(e.target.value)} placeholder="Nueva contraseña (mínimo 6 caracteres)"
              className="mp-input px-3 py-2 w-full mb-2" autoComplete="new-password" autoFocus />
            <input type="password" value={pwd2} onChange={(e) => setPwd2(e.target.value)} placeholder="Repite la contraseña"
              className="mp-input px-3 py-2 w-full" autoComplete="new-password" onKeyDown={(e) => e.key === "Enter" && save()} />
            {error && <div className="text-xs mt-2" style={{ color: "var(--crimson)" }}>{error}</div>}
            <button onClick={save} disabled={busy || !pwd || !pwd2} className="mp-btn mp-btn-primary w-full py-2.5 font-semibold mt-3 disabled:opacity-40">
              {busy ? "Guardando…" : "Guardar contraseña"}
            </button>
            <button onClick={onClose} className="text-xs mt-3" style={dim}>Ahora no</button>
          </React.Fragment>
        )}
      </div>
    </div>
  );
}

// Ajustes → Cuenta: entrar, crear cuenta, recuperar contraseña y cerrar sesión
function AccountCard({ authUser, configured, onSignIn, onSignUp, onSignOut, onResetPassword }) {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState(null);
  // Recuperar contraseña con el código del email
  const [showCode, setShowCode] = useState(false);
  const [code, setCode] = useState("");
  const [newPwd, setNewPwd] = useState("");
  const [newPwd2, setNewPwd2] = useState("");
  const labelStyle = { color: "var(--chalk-dim)" };

  async function run(fn) {
    setBusy(true);
    setMsg(null);
    try {
      const res = (await fn()) || {};
      if (res.error) setMsg({ error: true, text: res.error });
      else if (res.info) setMsg({ error: false, text: res.info });
      if (res.ok) setPassword("");
      if (res.codeSent) setShowCode(true);
      if (res.ok && showCode) {
        setShowCode(false);
        setCode("");
        setNewPwd("");
        setNewPwd2("");
      }
    } finally {
      setBusy(false);
    }
  }

  function submitCode() {
    const cleanCode = code.replace(/\s+/g, "");
    if (!/^\d{6,10}$/.test(cleanCode)) return setMsg({ error: true, text: "El código son las cifras que vienen en el email." });
    if (newPwd.length < 6) return setMsg({ error: true, text: "La contraseña debe tener al menos 6 caracteres." });
    if (newPwd !== newPwd2) return setMsg({ error: true, text: "Las dos contraseñas no coinciden." });
    run(() => onResetPassword(email.trim(), cleanCode, newPwd));
  }

  if (authUser) {
    return (
      <div className="mp-card p-3 mb-4">
        <label className="text-xs" style={labelStyle}>Cuenta</label>
        {msg && !msg.error && <div className="text-xs mt-1" style={{ color: "var(--turf)" }}>{msg.text}</div>}
        <div className="text-sm mt-1 mb-2">Sesión iniciada como <span className="font-semibold">{authUser.email}</span></div>
        <p className="text-xs mb-2" style={labelStyle}>
          Entra con esta misma cuenta en el iPad y en el ordenador para que compartan los datos.
        </p>
        <button onClick={onSignOut} className="mp-btn mp-btn-outline w-full py-2 text-sm">Cerrar sesión</button>
      </div>
    );
  }

  const valid = /.+@.+\..+/.test(email.trim()) && password.length >= 6;
  return (
    <div className="mp-card p-3 mb-4">
      <label className="text-xs" style={labelStyle}>Cuenta</label>
      <p className="text-xs mt-1 mb-2" style={labelStyle}>
        Entra con tu email y contraseña para ver y sincronizar tus datos. Usa la misma cuenta
        en el iPad y en el ordenador.
      </p>
      <input value={email} onChange={(e) => setEmail(e.target.value)} type="email" placeholder="tu@email.com"
        className="mp-input px-3 py-2 w-full mb-2" autoCapitalize="none" autoCorrect="off" autoComplete="email" />
      <input value={password} onChange={(e) => setPassword(e.target.value)} type="password" placeholder="Contraseña (mínimo 6 caracteres)"
        className="mp-input px-3 py-2 w-full" autoComplete="current-password" />
      <div className="flex gap-2 mt-3">
        <button onClick={() => run(() => onSignIn(email.trim(), password))} disabled={!configured || !valid || busy}
          className="mp-btn mp-btn-primary flex-1 py-2.5 font-semibold disabled:opacity-40">Entrar</button>
        <button onClick={() => run(() => onSignUp(email.trim(), password))} disabled={!configured || !valid || busy}
          className="mp-btn mp-btn-outline flex-1 py-2.5 text-sm disabled:opacity-40">Crear cuenta</button>
      </div>
      <button onClick={() => run(() => onResetPassword(email.trim()))} disabled={!configured || !/.+@.+\..+/.test(email.trim()) || busy}
        className="text-xs mt-2 disabled:opacity-40" style={{ color: "var(--cielo)" }}>
        ¿Olvidaste la contraseña? (escribe tu email arriba)
      </button>
      {!showCode && (
        <button onClick={() => setShowCode(true)} className="text-xs mt-2 ml-3" style={{ color: "var(--chalk-dim)" }}>
          Ya tengo un código
        </button>
      )}
      {showCode && (
        <div className="mp-card p-3 mt-3" style={{ borderColor: "var(--cielo)" }}>
          <div className="text-sm font-semibold mb-1">Cambiar la contraseña con el código</div>
          <p className="text-xs mb-2" style={labelStyle}>
            Escribe el código del último email que te hemos enviado{email.trim() ? ` a ${email.trim()}` : " (y tu email arriba)"} y tu nueva contraseña.
          </p>
          <input value={code} onChange={(e) => setCode(e.target.value)} inputMode="numeric" autoComplete="one-time-code"
            placeholder="Código del email" className="mp-input px-3 py-2 w-full mb-2 tracking-widest" />
          <input value={newPwd} onChange={(e) => setNewPwd(e.target.value)} type="password" autoComplete="new-password"
            placeholder="Nueva contraseña (mínimo 6 caracteres)" className="mp-input px-3 py-2 w-full mb-2" />
          <input value={newPwd2} onChange={(e) => setNewPwd2(e.target.value)} type="password" autoComplete="new-password"
            placeholder="Repite la contraseña" className="mp-input px-3 py-2 w-full"
            onKeyDown={(e) => e.key === "Enter" && submitCode()} />
          <button onClick={submitCode} disabled={busy || !configured || !code.trim() || !newPwd || !newPwd2 || !/.+@.+\..+/.test(email.trim())}
            className="mp-btn mp-btn-primary w-full py-2.5 font-semibold mt-3 disabled:opacity-40">
            {busy ? "Comprobando…" : "Cambiar contraseña"}
          </button>
          <button onClick={() => setShowCode(false)} className="text-xs mt-2" style={labelStyle}>Cancelar</button>
        </div>
      )}
      {msg && (
        <div className="text-xs mt-2" style={{ color: msg.error ? "var(--crimson)" : "var(--turf)" }}>{msg.text}</div>
      )}
      {!configured && (
        <div className="text-xs mt-2" style={{ color: "var(--amber)" }}>Primero guarda la conexión con Supabase de abajo.</div>
      )}
    </div>
  );
}

// Ajustes → Traer datos del código de equipo antiguo, en tres pasos con confirmación:
// 1) buscar (solo lee), 2) descargar copia de seguridad, 3) copiar a la cuenta. Se elige qué
// copiar: los datos (plantilla, partidos, balón parado...) y/o la Pizarra de este dispositivo.
// Si la cuenta ya tiene datos, los datos vienen desmarcados para no pisar lo registrado
// después. Lo antiguo no se borra ni se modifica.
function LegacyImportCard({ accountData, onInspect, onBackup, onImport }) {
  const [code, setCode] = useState(() => getStoredTeamCode());
  const [found, setFound] = useState(null);
  const [source, setSource] = useState(null);
  const [copyData, setCopyData] = useState(false);
  const [copyBoard, setCopyBoard] = useState(false);
  const [busy, setBusy] = useState(false);
  const [backedUp, setBackedUp] = useState(false);
  const [done, setDone] = useState(false);
  const labelStyle = { color: "var(--chalk-dim)" };
  const count = (d) => d ? `${(d.squad || []).length} jugadores, ${(d.matchesList || []).length} partidos` : "";
  const when = (d) => (d && d.updatedAt ? new Date(d.updatedAt).toLocaleString() : "—");
  const boardCount = (b) => {
    const n = Object.keys(b.positions).length;
    return `${n} ficha${n === 1 ? "" : "s"} colocada${n === 1 ? "" : "s"}, ${b.strokes.length} dibujo${b.strokes.length === 1 ? "" : "s"}`;
  };
  const accountHasData = !!(accountData && ((accountData.squad || []).length || (accountData.matchesList || []).length));

  async function search() {
    setBusy(true);
    setFound(null);
    setSource(null);
    setBackedUp(false);
    setDone(false);
    const res = await onInspect(code.trim());
    setFound(res);
    // Por defecto, la versión más reciente
    const cands = [res.cloud && "cloud", res.local && "local"].filter(Boolean);
    if (cands.length === 1) setSource(cands[0]);
    else if (cands.length === 2) setSource((res.local.updatedAt || 0) > (res.cloud.updatedAt || 0) ? "local" : "cloud");
    setCopyData(cands.length > 0 && !accountHasData);
    setCopyBoard(!!res.board);
    setBusy(false);
  }

  const chosen = found && source ? found[source] : null;
  const dataToCopy = copyData && chosen ? chosen : null;
  const boardToCopy = copyBoard && found && found.board ? found.board : null;
  const somethingToCopy = !!(dataToCopy || boardToCopy);

  function changed(fn) {
    return (...args) => { fn(...args); setBackedUp(false); setDone(false); };
  }

  function doImport() {
    const parts = [];
    if (dataToCopy) parts.push(`· Plantilla, partidos, estadísticas y balón parado (${count(dataToCopy)})`);
    if (boardToCopy) parts.push(`· Pizarra de este dispositivo (${boardCount(boardToCopy)})`);
    const warn = dataToCopy && accountHasData
      ? `\n\nOJO: los datos de tu cuenta (${count(accountData)}) se sustituirán por estos; lo que hayas registrado después de la primera copia se perdería. Tienes su copia en el archivo descargado.`
      : "";
    const boardWarn = boardToCopy ? "\n\nLa Pizarra que tengas ahora con tu cuenta en este dispositivo se sustituye (también tienes su copia)." : "";
    if (!window.confirm(`¿Copiar a tu cuenta desde el código "${code.trim()}"?\n\n${parts.join("\n")}${warn}${boardWarn}\n\nLo antiguo no se borra.`)) return;
    onImport(dataToCopy, boardToCopy);
    setDone(true);
  }

  return (
    <div className="mp-card p-3 mb-4">
      <label className="text-xs" style={labelStyle}>Traer datos de tu código de equipo antiguo</label>
      <p className="text-xs mt-1 mb-2" style={labelStyle}>
        Copia a tu cuenta lo que tenías con el código de equipo. Nada de lo antiguo se borra.
      </p>
      <div className="flex gap-2">
        <input value={code} onChange={(e) => setCode(e.target.value)} placeholder="Código de equipo antiguo"
          className="mp-input px-3 py-2 w-full" autoCapitalize="none" autoCorrect="off" />
        <button onClick={search} disabled={!code.trim() || busy} className="mp-btn mp-btn-outline px-3 py-2 text-xs shrink-0 disabled:opacity-40">
          {busy ? "Buscando…" : "1. Buscar"}
        </button>
      </div>

      {found && (
        <div className="mt-3 flex flex-col gap-2 text-xs">
          {!found.cloud && !found.local && !found.board && (
            <div style={{ color: "var(--amber)" }}>
              No hay datos con ese código{found.cloudError ? ` (la nube respondió: ${found.cloudError})` : ""}.
            </div>
          )}
          {found.cloudError && (found.cloud || found.local) && (
            <div style={{ color: "var(--amber)" }}>No se pudo leer la nube: {found.cloudError}</div>
          )}

          {(found.cloud || found.local) && (
            <div className="flex flex-col gap-1">
              <label className="flex items-start gap-2 font-semibold">
                <input type="checkbox" checked={copyData} onChange={changed((e) => setCopyData(e.target.checked))} className="mt-0.5" />
                <span>Plantilla, partidos, estadísticas y balón parado</span>
              </label>
              {accountHasData && (
                <div className="ml-5" style={{ color: "var(--amber)" }}>
                  Tu cuenta ya tiene datos ({count(accountData)}). Márcalo solo si quieres sustituirlos por los antiguos.
                </div>
              )}
              {copyData && [["cloud", "En la nube"], ["local", "En este dispositivo"]].map(([k, label]) =>
                found[k] ? (
                  <label key={k} className="flex items-start gap-2 ml-5">
                    <input type="radio" checked={source === k} onChange={changed(() => setSource(k))} className="mt-0.5" />
                    <span>{label}: {count(found[k])} · última modificación {when(found[k])}</span>
                  </label>
                ) : null
              )}
            </div>
          )}

          <label className="flex items-start gap-2 font-semibold">
            <input type="checkbox" checked={copyBoard} disabled={!found.board} onChange={changed((e) => setCopyBoard(e.target.checked))} className="mt-0.5" />
            <span>
              Pizarra de este dispositivo
              <span className="font-normal" style={labelStyle}>
                {found.board ? ` (${boardCount(found.board)})` : " (no hay Pizarra guardada con ese código en este dispositivo)"}
              </span>
            </span>
          </label>

          {somethingToCopy && (
            <>
              <button onClick={() => { onBackup(dataToCopy, code.trim(), boardToCopy); setBackedUp(true); }}
                className="mp-btn mp-btn-outline w-full py-2 text-sm mt-1">
                2. Descargar copia de seguridad {backedUp ? "✓" : ""}
              </button>
              <button onClick={doImport} disabled={!backedUp || done}
                className="mp-btn mp-btn-primary w-full py-2.5 text-sm font-semibold disabled:opacity-40">
                {done ? "Copiado a tu cuenta ✓" : "3. Copiar a mi cuenta"}
              </button>
              {!backedUp && <div style={labelStyle}>Descarga primero la copia de seguridad para poder copiar.</div>}
              {backedUp && !done && (
                <div className="font-semibold" style={{ color: "var(--amber)" }}>
                  Falta el último paso: pulsa "3. Copiar a mi cuenta".
                </div>
              )}
            </>
          )}
        </div>
      )}
    </div>
  );
}

  onSignOut,
  onResetPassword,

  onImportLegacy,

  onForcePush,
  onForcePull,

  historyLoading,
  onLoadHistory,

  // Cuentas client: solo la cuenta y la tabla de puntuación. Todo lo técnico (conexión,

  );

/* ---------------------------------------------------------
   Ajustes → Puntuación de jugadores: tabla editable de pesos por evento y posición,
   nota base y bonos por resultado. Se edita en un borrador y se guarda con el botón.
--------------------------------------------------------- */
function ratingConfigToDraft(config) {
  const fmt = (v) => (v == null ? "" : v.toFixed(2));
  const weights = {};
  RATING_ROWS.forEach(({ key }) => {
    weights[key] = {};
    RATING_GROUPS.forEach(({ id }) => { weights[key][id] = fmt(config.weights[key][id]); });
  });
  return {
    base: fmt(config.base),
    bonusWin: fmt(config.bonusWin),
    bonusBigWin: fmt(config.bonusBigWin),
    bonusCleanSheet: fmt(config.bonusCleanSheet),
    weights,
  };
}

function parseRatingNumber(text) {
  const t = String(text).trim().replace(",", ".");
  if (t === "") return null;
  const n = Number(t);
  return isFinite(n) ? Math.round(n * 100) / 100 : undefined;
}

function RatingSettings({ config, onSave }) {
  const [draft, setDraft] = useState(() => ratingConfigToDraft(config));
  const [error, setError] = useState(null);
  const savedDraft = ratingConfigToDraft(config);
  const dirty = JSON.stringify(draft) !== JSON.stringify(savedDraft);

  // Si llega una config nueva (otro dispositivo, restaurar) y no hay cambios a medias, se refleja
  const configKey = JSON.stringify(config);
  useEffect(() => {
    if (!dirty) setDraft(ratingConfigToDraft(config));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [configKey]);

  function setField(field, value) {
    setDraft((d) => ({ ...d, [field]: value }));
  }

  function setWeight(key, group, value) {
    setDraft((d) => ({ ...d, weights: { ...d.weights, [key]: { ...d.weights[key], [group]: value } } }));
  }

  function save() {
    const scalar = {};
    for (const f of ["base", "bonusWin", "bonusBigWin", "bonusCleanSheet"]) {
      const v = parseRatingNumber(draft[f]);
      if (v == null) return setError("La nota base y los bonos no pueden quedar vacíos.");
      scalar[f] = v;
    }
    const weights = {};
    for (const { key } of RATING_ROWS) {
      weights[key] = {};
      for (const { id } of RATING_GROUPS) {
        const v = parseRatingNumber(draft.weights[key][id]);
        if (v === undefined) return setError("Hay algún valor que no es un número.");
        weights[key][id] = v;
      }
    }
    setError(null);
    onSave({ ...scalar, weights });
  }

  function restoreDefaults() {
    if (!window.confirm("¿Restaurar la tabla de puntuación, la nota base y los bonos a los valores por defecto?")) return;
    setError(null);
    setDraft(ratingConfigToDraft(DEFAULT_RATING_CONFIG));
    onSave(DEFAULT_RATING_CONFIG);
  }

  const numberInput = (value, onChange, disabled, extraClass = "") => (
    <input
      type="text"
      inputMode="decimal"
      value={disabled ? "" : value}
      disabled={disabled}
      onChange={(e) => onChange(e.target.value)}
      onBlur={(e) => {
        const v = parseRatingNumber(e.target.value);
        if (v != null) onChange(v.toFixed(2));
      }}
      className={`mp-input px-1 py-1 text-center text-xs ${extraClass}`}
      style={disabled ? { opacity: 0.3 } : undefined}
    />
  );

  const scalarRow = (field, label) => (
    <div className="flex items-center justify-between gap-2">
      <span className="text-sm">{label}</span>
      {numberInput(draft[field], (v) => setField(field, v), false, "w-20")}
    </div>
  );

  return (
    <div className="mp-card p-3 mt-4">
      <div className="text-sm font-semibold mb-1">Puntuación de jugadores</div>
      <div className="text-xs mb-3" style={{ color: "var(--chalk-dim)" }}>
        Puntos que suma o resta cada evento según la posición del jugador en ese momento. Una celda vacía
        no suma ni resta. Se guarda con el resto de datos del equipo y se sincroniza entre dispositivos.
      </div>

      <div className="flex flex-col gap-2 mb-3">
        {scalarRow("base", "Nota base al empezar el partido")}
        {scalarRow("bonusWin", "Bono por victoria")}
        {scalarRow("bonusBigWin", "Bono extra por ganar de 5+ goles")}
        {scalarRow("bonusCleanSheet", "Bono extra por ganar con portería a cero")}
      </div>

      <div className="mp-scroll overflow-x-auto -mx-1 px-1">
        <table className="text-xs w-full" style={{ borderCollapse: "collapse" }}>
          <thead>
            <tr>
              <th className="p-1 text-left" style={{ color: "var(--chalk-dim)" }}>Evento</th>
              {RATING_GROUPS.map((g) => (
                <th key={g.id} className="p-1 text-center whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>
                  {g.label}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {RATING_ROWS.map((row) => (
              <tr key={row.key}>
                <td className="p-1 whitespace-nowrap">{row.label}</td>
                {RATING_GROUPS.map((g) => (
                  <td key={g.id} className="p-0.5">
                    {numberInput(
                      draft.weights[row.key][g.id],
                      (v) => setWeight(row.key, g.id, v),
                      !!row.ptOnly && g.id !== "PT",
                      "w-14"
                    )}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {error && (
        <div className="text-xs mt-2" style={{ color: "var(--crimson)" }}>{error}</div>
      )}

      <div className="flex gap-2 mt-3">
        <button
          onClick={save}
          disabled={!dirty}
          className="mp-btn mp-btn-primary flex-1 py-2 text-sm font-semibold"
          style={!dirty ? { opacity: 0.5 } : undefined}
        >
          {dirty ? "Guardar cambios" : "Guardado"}
        </button>
        <button onClick={restoreDefaults} className="mp-btn mp-btn-outline flex-1 py-2 text-sm">
          Restaurar valores por defecto
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Clasificación de liga (FFCV) — vía proxy propio en /api/clasificacion
   para evitar el bloqueo CORS del navegador. No es una API oficial de
   la FFCV. El grupo y el equipo son datos de cada equipo (Ajustes → Mi
   equipo): si cambia de grupo o de temporada, se cambian ahí.
--------------------------------------------------------- */
const LEAGUE_CACHE_KEY = "rp_league_cache_v1";

function loadLeagueCache() {
  try {
    const raw = localStorage.getItem(teamKey(LEAGUE_CACHE_KEY));
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveLeagueCache(data, groupCode) {
  try {
    localStorage.setItem(teamKey(LEAGUE_CACHE_KEY), JSON.stringify({ data, groupCode, fetchedAt: Date.now() }));
  } catch (e) {
    console.error("Error guardando la clasificación en caché", e);
  }
}

function LeagueStandings({ team }) {
  const groupCode = (team && team.ffcvGroupCode) || "";
  const ourCode = (team && team.ffcvTeamCode) || "";
  const loadedCache = useRef(loadLeagueCache()).current;
  const cached = loadedCache && loadedCache.groupCode === groupCode ? loadedCache : null;
  const [data, setData] = useState(cached ? cached.data : null);
  const [fetchedAt, setFetchedAt] = useState(cached ? cached.fetchedAt : null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [expanded, setExpanded] = useState(false);

  const load = useCallback(() => {
    if (!groupCode) {
      setLoading(false);
      return;
    }
    setLoading(true);
    setError(null);
    fetch(`/api/clasificacion?cod_grupo=${encodeURIComponent(groupCode)}`)
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        if (!ok || body.error) throw new Error(body.error || "No se pudo cargar la clasificación");
        setData(body);
        setFetchedAt(Date.now());
        saveLeagueCache(body, groupCode);
      })
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  }, [groupCode]);

  useEffect(() => { load(); }, [load]);

  if (!groupCode) {
    return (
      <div className="mp-card p-3 mb-6 text-xs" style={{ color: "var(--chalk-dim)" }}>
        Clasificación: configura el grupo de la FFCV de tu equipo en Ajustes → Mi equipo.
      </div>
    );
  }

  const rows = data ? data.clasificacion || [] : [];
  const myRow = rows.find((r) => r.codequipo === ourCode) || null;

  return (
    <div className="mb-6">
      {/* Etiqueta horizontal: toca para desplegar la tabla completa */}
      <button
        onClick={() => setExpanded((v) => !v)}
        className="mp-card mp-btn w-full flex items-center justify-between gap-3 px-3 py-2.5"
        style={expanded ? { borderColor: "var(--turf)" } : {}}
      >
        <div className="flex items-center gap-3 min-w-0">
          <div
            className="mp-shirt w-9 h-9 text-sm font-semibold shrink-0"
            style={myRow ? { borderColor: "var(--turf)" } : {}}
          >
            {myRow ? myRow.posicion : "–"}
          </div>
          <div className="min-w-0 text-left">
            <div className="text-sm font-semibold">Clasificación</div>
            <div className="text-xs truncate" style={{ color: "var(--chalk-dim)" }}>
              {data ? `${data.competicion} · ${data.grupo}` : loading ? "Cargando…" : "Toca para ver"}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {myRow && (
            <span className="text-xs font-semibold" style={{ color: "var(--turf)" }}>
              {myRow.puntos} pts
            </span>
          )}
          <span
            className="text-xs"
            style={{
              color: "var(--chalk-dim)",
              display: "inline-block",
              transition: "transform 0.18s ease",
              transform: expanded ? "rotate(180deg)" : "none",
            }}
          >
            ▼
          </span>
        </div>
      </button>

      {expanded && (
        <div className="mp-card mp-fade-in p-3 mt-2">
          <div className="flex items-center justify-between mb-2 gap-2">
            <div className="min-w-0 text-xs truncate" style={{ color: "var(--chalk-dim)" }}>
              {data ? `Jornada ${data.jornada} · ${data.fecha_jornada}` : "Sin datos todavía"}
            </div>
            <button
              onClick={load}
              disabled={loading}
              className="mp-btn mp-btn-outline px-2 py-1 text-xs shrink-0 disabled:opacity-40"
            >
              {loading ? "Cargando…" : "Actualizar"}
            </button>
          </div>

          {error && (
            <div className="text-xs mb-2" style={{ color: "var(--amber)" }}>
              {data
                ? "No se pudo actualizar; se muestra la última clasificación guardada."
                : `No se pudo cargar la clasificación (${error}). Puede que la FFCV esté dando problemas, inténtalo de nuevo en unos segundos.`}
            </div>
          )}

          {rows.length > 0 ? (
            <div className="mp-scroll overflow-x-auto">
              <table className="text-xs w-full" style={{ borderCollapse: "collapse" }}>
                <thead>
                  <tr style={{ color: "var(--chalk-dim)" }}>
                    <th className="text-left p-1">#</th>
                    <th className="text-left p-1">Equipo</th>
                    <th className="text-center p-1">PJ</th>
                    <th className="text-center p-1">PG</th>
                    <th className="text-center p-1">PE</th>
                    <th className="text-center p-1">PP</th>
                    <th className="text-center p-1">GF</th>
                    <th className="text-center p-1">GC</th>
                    <th className="text-center p-1">Pts</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => {
                    const isUs = r.codequipo === ourCode;
                    return (
                      <tr key={r.codequipo} style={isUs ? { background: "rgba(111,190,68,0.15)" } : {}}>
                        <td className="p-1">{r.posicion}</td>
                        <td className="p-1 whitespace-nowrap" style={isUs ? { fontWeight: 600 } : {}}>
                          {r.nombre}
                        </td>
                        <td className="text-center p-1">{r.jugados}</td>
                        <td className="text-center p-1">{r.ganados}</td>
                        <td className="text-center p-1">{r.empatados}</td>
                        <td className="text-center p-1">{r.perdidos}</td>
                        <td className="text-center p-1">{r.goles_a_favor}</td>
                        <td className="text-center p-1">{r.goles_en_contra}</td>
                        <td className="text-center p-1 font-semibold">{r.puntos}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ) : (
            !error && (
              <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                {loading ? "Cargando clasificación…" : "Sin datos de clasificación todavía."}
              </div>
            )
          )}

          {fetchedAt && (
            <div className="text-[10px] mt-2" style={{ color: "var(--chalk-dim)" }}>
              Actualizado: {new Date(fetchedAt).toLocaleString()}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Calendario: cada partido en su día/mes, incluidos los futuros
--------------------------------------------------------- */
const CALENDAR_WEEKDAYS = ["L", "M", "X", "J", "V", "S", "D"];

function MatchCalendar({ matches, crests, onOpenMatch }) {
  const [cursor, setCursor] = useState(() => {
    const [y, m] = todayISO().split("-").map(Number);
    return { year: y, month: m - 1 };
  });
  const [selectedDate, setSelectedDate] = useState(null);

  const matchesByDate = {};
  matches.forEach((m) => {
    (matchesByDate[m.date] = matchesByDate[m.date] || []).push(m);
  });

  const pad = (n) => String(n).padStart(2, "0");
  const first = new Date(cursor.year, cursor.month, 1);
  const startWeekday = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const isoFor = (d) => `${cursor.year}-${pad(cursor.month + 1)}-${pad(d)}`;
  const monthLabel = first.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  const todayIso = todayISO();

  function shiftMonth(delta) {
    setSelectedDate(null);
    setCursor((c) => {
      let month = c.month + delta;
      let year = c.year;
      if (month < 0) { month = 11; year -= 1; }
      if (month > 11) { month = 0; year += 1; }
      return { year, month };
    });
  }

  const selectedMatches = selectedDate ? matchesByDate[selectedDate] || [] : [];

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <button onClick={() => shiftMonth(-1)} className="mp-btn mp-btn-outline px-3 py-1.5 text-sm">
          ‹
        </button>
        <div className="text-sm font-semibold capitalize">{monthLabel}</div>
        <button onClick={() => shiftMonth(1)} className="mp-btn mp-btn-outline px-3 py-1.5 text-sm">
          ›
        </button>
      </div>

      <div className="grid grid-cols-7 gap-1 mb-1">
        {CALENDAR_WEEKDAYS.map((d) => (
          <div key={d} className="text-center text-[10px]" style={{ color: "var(--chalk-dim)" }}>
            {d}
          </div>
        ))}
      </div>

      <div className="grid grid-cols-7 gap-1 mb-2">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const iso = isoFor(d);
          const dayMatches = matchesByDate[iso] || [];
          const hasMatch = dayMatches.length > 0;
          const isToday = iso === todayIso;
          const selected = iso === selectedDate;
          const vColor = hasMatch ? venueColor(dayMatches[0]) : null;
          return (
            <button
              key={i}
              onClick={() => hasMatch && setSelectedDate(selected ? null : iso)}
              className="mp-card flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 text-xs"
              style={{
                minHeight: 42,
                borderColor: selected ? "var(--chalk)" : hasMatch ? vColor : isToday ? "var(--cielo)" : undefined,
                borderWidth: hasMatch ? 2 : 1,
                opacity: hasMatch ? 1 : 0.4,
              }}
            >
              <span>{d}</span>
              {hasMatch && (
                <span
                  className="truncate w-full text-center leading-tight"
                  style={{ fontSize: 8, color: vColor }}
                >
                  {dayMatches[0].opponent}
                </span>
              )}
            </button>
          );
        })}
      </div>

      {selectedDate && (
        <div className="flex flex-col gap-2 mp-fade-in">
          {selectedMatches.map((m) => {
            const badge = matchBadge(m);
            const vLabel = venueLabel(m);
            return (
              <button
