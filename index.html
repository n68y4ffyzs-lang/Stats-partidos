function OpponentChanceMarker({ match, onUpdate }) {
  const opponentChances = match.opponentChances || [];

  function addOpponentChance() {
    const entry = { id: genId(), half: match.clock.activeHalf, minute: computeMinute(match) };
    onUpdate({ ...match, opponentChances: [...opponentChances, entry] }, true);
  }
  function removeOpponentChance(id) {
    onUpdate({ ...match, opponentChances: opponentChances.filter((e) => e.id !== id) }, true);
  }

  return (
    <div className="mp-card p-3 mb-3">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>
        Ocasiones del rival — solo para localizarlas luego en el vídeo, no cuenta en las estadísticas
      </div>
      <button onClick={addOpponentChance} className="mp-btn mp-btn-outline w-full py-2 text-sm mb-2">
        + Marcar ocasión del rival
      </button>
      {opponentChances.length > 0 && (
        <div className="flex flex-wrap gap-2">
          {opponentChances
            .slice()
            .sort((a, b) => b.half - a.half || b.minute - a.minute)
            .map((c) => (
              <span key={c.id} className="mp-card px-2 py-1 text-xs flex items-center gap-2">
                {c.minute}'
                <button onClick={() => removeOpponentChance(c.id)} style={{ color: "var(--crimson)" }}>
                  ×
                </button>
              </span>
            ))}
        </div>
      )}
    </div>
  );
}

function TeamEventsPanel({ match, onUpdate }) {
  const teamEvents = match.teamEvents || [];

  function countOf(typeId) {
    return teamEvents.filter((e) => e.type === typeId).length;
  }
  function addTeamEvent(typeId) {
    const entry = { id: genId(), type: typeId, half: match.clock.activeHalf, minute: computeMinute(match) };
    onUpdate({ ...match, teamEvents: [...teamEvents, entry] }, true);
  }
  function undoLastTeamEvent(typeId) {
    const idxFromEnd = [...teamEvents].reverse().findIndex((e) => e.type === typeId);
    if (idxFromEnd === -1) return;
    const idx = teamEvents.length - 1 - idxFromEnd;
    onUpdate({ ...match, teamEvents: [...teamEvents.slice(0, idx), ...teamEvents.slice(idx + 1)] }, true);
  }

  return (
    <div className="mb-4">
      {TEAM_EVENT_SECTIONS.map((section) => (
        <div key={section.id} className="mb-4">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>{section.label}</div>
          <div className="grid grid-cols-2 gap-2">
            {TEAM_EVENT_TYPES.filter((t) => t.section === section.id).map((t) => (
              <TeamEventCounter
                key={t.id}
                label={t.short}
                value={countOf(t.id)}
                onAdd={() => addTeamEvent(t.id)}
                onUndo={() => undoLastTeamEvent(t.id)}
              />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

function MatchTotals({ events, teamEvents = [] }) {
  const totals = {};
  events.forEach((e) => {
    totals[e.type] = (totals[e.type] || 0) + 1;
  });
  const teamCount = (type) => teamEvents.filter((e) => e.type === type).length;

  const faltasEnContra = totals["falta_cometida"] || 0;
  const faltasAFavor = totals["falta_recibida"] || 0;
  const amarillas = totals["amarilla"] || 0;
  const rojas = totals["roja"] || 0;
  const cornersFavor = teamCount("corner_favor");
  const cornersContra = teamCount("corner_contra");
  const tirosPuerta = totals["remate_puerta"] || 0;
  const tirosFuera = totals["remate_fuera"] || 0;
  const tirosTotales = tirosPuerta + tirosFuera;
  const tirosPuertaPct = tirosTotales === 0 ? null : Math.round((tirosPuerta / tirosTotales) * 100);
  const duelosGanados = (totals["duelo_ganado"] || 0) + (totals["duelo_general_ganado"] || 0);
  const duelosPerdidos = (totals["duelo_perdido"] || 0) + (totals["duelo_general_perdido"] || 0);
  const duelosTotales = duelosGanados + duelosPerdidos;
  const duelosPct = duelosTotales === 0 ? null : Math.round((duelosGanados / duelosTotales) * 100);
  const despejesOk = totals["despeje"] || 0;
  const despejesFallados = totals["despeje_fallado"] || 0;
  const despejesTotales = despejesOk + despejesFallados;
  const despejesPct = despejesTotales === 0 ? null : Math.round((despejesOk / despejesTotales) * 100);
  const robos = totals["recuperacion"] || 0;
  const paradas =
    (totals["parada_area"] || 0) +
    (totals["parada_fuera_area"] || 0) +
    (totals["parada_area_pequena"] || 0);

  return (
    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
      <StatCard label="Faltas a favor" value={faltasAFavor} />
      <StatCard label="Faltas en contra" value={faltasEnContra} />
      <StatCard label="Tarjetas amarillas" value={amarillas} />
      <StatCard label="Tarjetas rojas" value={rojas} />
      <StatCard label="Córners a favor" value={cornersFavor} />
      <StatCard label="Córners en contra" value={cornersContra} />
      <StatCard
        label="Tiros a puerta"
        value={tirosPuertaPct === null ? "–" : `${tirosPuertaPct}%`}
        sub={tirosTotales === 0 ? "Sin tiros registrados" : `${tirosPuerta} de ${tirosTotales}`}
      />
      <StatCard
        label="Duelos ganados"
        value={duelosPct === null ? "–" : `${duelosPct}%`}
        sub={duelosTotales === 0 ? "Sin duelos registrados" : `${duelosGanados} de ${duelosTotales}`}
      />
      <StatCard
        label="Despejes"
        value={despejesPct === null ? "–" : `${despejesPct}%`}
        sub={despejesTotales === 0 ? "Sin despejes registrados" : `${despejesOk} de ${despejesTotales}`}
      />
      <StatCard label="Robos totales" value={robos} />
      <StatCard label="Paradas totales" value={paradas} />
    </div>
  );
}

function SeasonTeamStats({ matches }) {
  const played = matches.filter((m) => !m.scheduled);
  const n = played.length;
  if (n === 0) return null;

  const allEvents = played.flatMap((m) => m.events);
  const count = (type) => allEvents.filter((e) => e.type === type).length;
  const teamEventCount = (type) =>
    played.reduce((sum, m) => sum + (m.teamEvents || []).filter((e) => e.type === type).length, 0);

  const faltas = count("falta_cometida");
  const amarillas = count("amarilla");
  const rojas = count("roja");
  const tirosPuerta = count("remate_puerta");
  const tirosFuera = count("remate_fuera");
  const corners = teamEventCount("corner_favor");
  const robos = count("recuperacion");
  const golesFavor = allEvents.filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const golesContra = played.reduce(
    (sum, m) => sum + (m.concededSetPieces || []).length + m.events.filter((e) => e.type === "gol_encajado").length,
    0
  );
  const despejesOk = count("despeje");
  const despejesFallados = count("despeje_fallado");
  const despejesTotales = despejesOk + despejesFallados;
  const despejesPct = despejesTotales === 0 ? null : Math.round((despejesOk / despejesTotales) * 100);

  const avg = (total) => Math.round((total / n) * 10) / 10;

  return (
    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
      <StatCard label="Goles a favor" value={golesFavor} sub={`${avg(golesFavor)} por partido`} />
      <StatCard label="Goles encajados" value={golesContra} sub={`${avg(golesContra)} por partido`} />
      <StatCard label="Tarjetas amarillas" value={amarillas} sub={`${avg(amarillas)} por partido`} />
      <StatCard label="Tarjetas rojas" value={rojas} sub={`${avg(rojas)} por partido`} />
      <StatCard label="Faltas por partido" value={avg(faltas)} />
      <StatCard label="Tiros a puerta/partido" value={avg(tirosPuerta)} />
      <StatCard label="Tiros fuera/partido" value={avg(tirosFuera)} />
      <StatCard label="Córners por partido" value={avg(corners)} />
      <StatCard label="Robos por partido" value={avg(robos)} />
      <StatCard
        label="Despejes"
        value={despejesPct === null ? "–" : `${despejesPct}%`}
        sub={despejesTotales === 0 ? "Sin despejes registrados" : `${despejesOk} de ${despejesTotales}`}
      />
    </div>
  );
}

// Minutos jugados por cada jugador en un partido concreto: reconstruye el once inicial
// deshaciendo los cambios en orden inverso desde el `onPitch` final, y calcula cuánto
// tiempo estuvo cada uno en el campo entre su entrada y su salida (o el final del partido).
function computeMatchMinutes(match) {
  const totalMinutes =
    Math.round(((match.clock.half1Elapsed || 0) + (match.clock.half2Elapsed || 0)) / 60) ||
    (match.halfLength || 0) * 2;
  const subsSorted = [...(match.subs || [])].sort((a, b) => a.half - b.half || a.minute - b.minute);

  const starters = new Set(match.onPitch || []);
  [...subsSorted].reverse().forEach((s) => {
    starters.delete(s.inId);
    starters.add(s.outId);
  });

  const enterMinute = {};
  const exitMinute = {};
  starters.forEach((id) => { enterMinute[id] = 0; });
  subsSorted.forEach((s) => {
    exitMinute[s.outId] = s.minute;
    enterMinute[s.inId] = s.minute;
  });

  const minutesByPlayer = {};
  const participants = new Set([...starters, ...subsSorted.map((s) => s.inId)]);
  participants.forEach((id) => {
    const enter = enterMinute[id] != null ? enterMinute[id] : 0;
    const exit = exitMinute[id] != null ? exitMinute[id] : totalMinutes;
    minutesByPlayer[id] = Math.max(0, exit - enter);
  });
  return minutesByPlayer;
}

// Destacados de la temporada para el resumen rápido de Inicio: máximo goleador, más
// asistencias y más minutos jugados. Devuelve null en cada uno si todavía no hay datos.
// Minutos jugados por cada jugador sumados en toda la temporada (solo partidos ya jugados,
// no los programados): titular desde el minuto 0, o desde que entra de suplente, hasta que le
// sustituyen o acaba el partido. Lo reutilizan el resumen rápido de Inicio y las estadísticas
// por jugador (temporada y gráficos).
function computeSeasonMinutesByPlayer(matches) {
  const minutesBy = {};
  matches
    .filter((m) => !m.scheduled)
    .forEach((m) => {
      const mins = computeMatchMinutes(m);
      Object.keys(mins).forEach((id) => { minutesBy[id] = (minutesBy[id] || 0) + mins[id]; });
    });
  return minutesBy;
}

function computeSeasonHighlights(matches, squad) {
  const played = matches.filter((m) => !m.scheduled);
  const goalsBy = {};
  const assistsBy = {};
  played.forEach((m) => {
    (m.events || []).forEach((e) => {
      if (ALL_GOAL_TYPES.includes(e.type)) goalsBy[e.playerId] = (goalsBy[e.playerId] || 0) + 1;
      if (e.type === "asistencia") assistsBy[e.playerId] = (assistsBy[e.playerId] || 0) + 1;
    });
  });
  const minutesBy = computeSeasonMinutesByPlayer(matches);
  const nameFor = (id) => { const p = squad.find((pp) => pp.id === id); return p ? p.name : null; };
  const topBy = (map) => {
    const entries = Object.entries(map).filter(([, v]) => v > 0);
    if (entries.length === 0) return null;
    entries.sort((a, b) => b[1] - a[1]);
    const [id, value] = entries[0];
    const name = nameFor(id);
    return name ? { name, value } : null;
  };
  return {
    topScorer: topBy(goalsBy),
    topAssists: topBy(assistsBy),
    mostMinutes: topBy(minutesBy),
  };
}

function computePlayerStats(playerId, events) {
  const own = events.filter((e) => e.playerId === playerId);
  const count = (type) => own.filter((e) => e.type === type).length;
  const duelosGanados = count("duelo_ganado") + count("duelo_general_ganado");
  const duelosPerdidos = count("duelo_perdido") + count("duelo_general_perdido");
  const duelosTotales = duelosGanados + duelosPerdidos;
  const duelosPct = duelosTotales === 0 ? null : Math.round((duelosGanados / duelosTotales) * 100);
  const regatesOk = count("regate");
  const regatesFallados = count("regate_fallado");
  const regatesTotales = regatesOk + regatesFallados;
  const regatesPct = regatesTotales === 0 ? null : Math.round((regatesOk / regatesTotales) * 100);
  const tirosPuerta = count("remate_puerta");
  const tirosFuera = count("remate_fuera");
  const tirosTotales = tirosPuerta + tirosFuera;
  const tirosPuertaPct = tirosTotales === 0 ? null : Math.round((tirosPuerta / tirosTotales) * 100);
  const perdidas = count("perdida");
  const robos = count("recuperacion");
  const goles = ALL_GOAL_TYPES.reduce((sum, t) => sum + count(t), 0);
  const asistencias = count("asistencia");
  const paradas = count("parada_area") + count("parada_fuera_area") + count("parada_area_pequena");
  const despejes = count("despeje");
  const despejesFallados = count("despeje_fallado");
  const despejesTotales = despejes + despejesFallados;
  const despejesPct = despejesTotales === 0 ? null : Math.round((despejes / despejesTotales) * 100);
  const golesEncajados = count("gol_encajado");
  const amarillas = count("amarilla");
  const rojas = count("roja");
  return {
    duelosGanados,
    duelosPerdidos,
    duelosTotales,
    duelosPct,
    regatesOk,
    regatesFallados,
    regatesTotales,
    regatesPct,
    tirosPuerta,
    tirosFuera,
    tirosTotales,
    tirosPuertaPct,
    perdidas,
    robos,
    goles,
    asistencias,
    paradas,
    despejes,
    despejesFallados,
    despejesTotales,
    despejesPct,
    golesEncajados,
    amarillas,
    rojas,
  };
}

                  const usedTypes = EVENT_TYPES.filter(

/* ---------------------------------------------------------

--------------------------------------------------------- */
function PlayerBarChart({ title, color, rows, labelWidth = "w-20" }) {
  if (rows.length === 0) return null;
  const max = Math.max(...rows.map((r) => r.raw));

  return (
    <div className="mp-card p-3">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>{title}</div>
      <div className="flex flex-col gap-1.5">
        {rows.map((r) => (
          <div key={r.label} className="flex items-center gap-2">
            <div className={`text-xs ${labelWidth} shrink-0 truncate`}>{r.label}</div>
            <div className="flex-1 h-3 rounded-full" style={{ background: "rgba(244,241,232,0.08)" }}>
              <div
                className="h-3 rounded-full"
                style={{ width: `${max === 0 ? 0 : (r.raw / max) * 100}%`, background: color }}
              />
            </div>
            <div
              className="text-xs text-right shrink-0 flex flex-col items-end leading-tight"
              style={{ fontVariantNumeric: "tabular-nums", minWidth: r.sub ? "3.75rem" : "2.25rem" }}
            >
              <span>{r.display}</span>
              {r.sub && (
                <span className="text-[10px]" style={{ color: "var(--chalk-dim)" }}>{r.sub}</span>
              )}
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function CardsChart({ withStats }) {

    .sort((a, b) => b.amarillas + b.rojas - (a.amarillas + a.rojas));

  if (rows.length === 0) return null;
  const max = Math.max(...rows.map((r) => Math.max(r.amarillas, r.rojas)));

  return (
    <div className="mp-card p-3">

          <span className="flex items-center gap-1">
            <span style={{ width: 8, height: 8, borderRadius: 2, background: "var(--crimson)", display: "inline-block" }} />

                { value: r.amarillas, color: "var(--amber)" },
                { value: r.rojas, color: "var(--crimson)" },

/* ---------------------------------------------------------
   Gráfico de composición: reparto en % entre 2-3 resultados posibles
--------------------------------------------------------- */
function PercentBreakdownChart({ title, segments }) {
  const total = segments.reduce((sum, s) => sum + s.value, 0);
  if (total === 0) return null;
  const visible = segments.filter((s) => s.value > 0);

  return (
    <div className="mp-card p-3">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>{title}</div>
      <div className="flex w-full h-4 rounded-full overflow-hidden">
        {visible.map((s, i) => (
          <div
            key={s.label}
            style={{
              width: `${(s.value / total) * 100}%`,
              background: s.color,
              borderRight: i < visible.length - 1 ? "2px solid var(--pitch)" : "none",
            }}
          />
        ))}
      </div>
      <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2">
        {segments.map((s) => (
          <div key={s.label} className="flex items-center gap-1 text-[11px]" style={{ color: "var(--chalk-dim)" }}>
            <span
              style={{ width: 8, height: 8, borderRadius: 2, background: s.color, display: "inline-block" }}
            />
            {s.label}:{" "}
            <span className="font-semibold" style={{ color: "var(--chalk)" }}>
              {Math.round((s.value / total) * 100)}% ({s.value})
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

        },

          value: events.filter((e) => e.type === "falta_cometida" && e.zona === "rival").length,

function PlayerStatsCharts({ players, events, matches }) {
  const seasonMinutesByPlayer = matches ? computeSeasonMinutesByPlayer(matches) : {};
  const withStats = players.map((p) => {
    const matchesPlayed = matches
      ? matches.filter((m) => !m.scheduled && (m.onPitch.includes(p.id) || m.bench.includes(p.id))).length
      : 0;
    return {
      p,
      s: computePlayerStats(p.id, events),
      matchesPlayed,
      seasonMinutes: seasonMinutesByPlayer[p.id] || 0,
    };
  });

  function rowsFor(pick, format) {
    return withStats
      .map(({ p, s }) => {
        const raw = pick(s) || 0;
        return { label: p.name, raw, display: format ? format(raw) : String(raw) };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  // Como rowsFor, pero además añade debajo del porcentaje el número real de aciertos sobre el total
  function rowsForPct(pctPick, wonPick, totalPick) {
    return withStats
      .map(({ p, s }) => {
        const raw = pctPick(s) || 0;
        const won = wonPick(s) || 0;
        const total = totalPick(s) || 0;
        return { label: p.name, raw, display: `${raw}%`, sub: total > 0 ? `${won} de ${total}` : null };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  // Media por partido jugado (en vez del total), con el total real debajo
  function rowsForAvg(pick) {
    return withStats
      .map(({ p, s, matchesPlayed }) => {
        const total = pick(s) || 0;
        // Sin lista de partidos (p.ej. gráficos de un solo partido) no hay media que calcular: se muestra el total
        if (!matches) {
          return { label: p.name, raw: total, display: String(total) };
        }
        const raw = matchesPlayed > 0 ? Math.round((total / matchesPlayed) * 10) / 10 : 0;
        return {
          label: p.name,
          raw,
          display: raw.toFixed(1),
          sub: matchesPlayed > 0 ? `${total} en ${matchesPlayed} partido${matchesPlayed === 1 ? "" : "s"}` : null,
        };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  const minutesRows = matches
    ? withStats
        .map(({ p, seasonMinutes }) => ({ label: p.name, raw: seasonMinutes, display: `${seasonMinutes}'` }))
        .filter((r) => r.raw > 0)
        .sort((a, b) => b.raw - a.raw)
    : [];

  const charts = [
    { title: "Minutos jugados (temporada)", color: "var(--amber)", rows: minutesRows },
    { title: "Goles", color: "var(--turf)", rows: rowsFor((s) => s.goles) },
    { title: "Asistencias", color: "var(--turf)", rows: rowsFor((s) => s.asistencias) },
    {
      title: "Duelos ganados",
      color: "var(--cielo)",
      rows: rowsForPct((s) => s.duelosPct, (s) => s.duelosGanados, (s) => s.duelosTotales),
    },
    {
      title: "Regates acertados",
      color: "var(--cielo)",
      rows: rowsForPct((s) => s.regatesPct, (s) => s.regatesOk, (s) => s.regatesTotales),
    },
    {
      title: "Despejes",
      color: "var(--cielo)",
      rows: rowsForPct((s) => s.despejesPct, (s) => s.despejes, (s) => s.despejesTotales),
    },
    { title: "Recuperaciones por partido", color: "var(--cielo)", rows: rowsForAvg((s) => s.robos) },
    { title: "Balones perdidos por partido", color: "var(--crimson)", rows: rowsForAvg((s) => s.perdidas) },
    { title: "Paradas (portero)", color: "var(--violet)", rows: rowsFor((s) => s.paradas) },
    { title: "Goles encajados (portero)", color: "var(--crimson)", rows: rowsFor((s) => s.golesEncajados) },
  ].filter((c) => c.rows.length > 0);

  const hasCards = withStats.some(({ s }) => s.amarillas > 0 || s.rojas > 0);

  if (charts.length === 0 && !hasCards) {
    return (
      <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
        Aún no hay suficientes eventos registrados para mostrar gráficos.
      </div>
    );
  }

  return (
    <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
      <CardsChart withStats={withStats} />
      {charts.map((c) => (
        <PlayerBarChart key={c.title} title={c.title} color={c.color} rows={c.rows} />
      ))}
    </div>
  );
}

function SeasonStats({ matches, squad, onBack, onGoCharts }) {
  const [showTeamStats, setShowTeamStats] = useState(false);
  const [showPlayerStats, setShowPlayerStats] = useState(false);
  const allSeasonEvents = matches.flatMap((m) => m.events);

  const stats = {};
  let matchesWithEvents = 0;

  matches.forEach((m) => {
    if (m.events.length > 0) matchesWithEvents += 1;
    m.events
      .filter((e) => e.type !== "pase_clave")
      .forEach((e) => {
        if (!stats[e.playerId]) {
          stats[e.playerId] = { number: e.playerNumber, name: e.playerName, counts: {} };
        }
        stats[e.playerId].counts[e.type] = (stats[e.playerId].counts[e.type] || 0) + 1;
      });
  });

  const rows = Object.values(stats)
    .map((r) => {
      const goles = ALL_GOAL_TYPES.reduce((sum, t) => sum + (r.counts[t] || 0), 0);
      const asistencias = r.counts["asistencia"] || 0;
      return { ...r, goles, asistencias, golesAsistencias: goles + asistencias };
    })
    .filter((r) => r.golesAsistencias > 0)
    .sort((a, b) => b.golesAsistencias - a.golesAsistencias);

  return (
    <div className="max-w-4xl mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-4 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <div>
          <h1 className="display text-2xl font-semibold">Estadísticas de temporada</h1>
          <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            {matches.length} partido{matches.length === 1 ? "" : "s"} registrado{matches.length === 1 ? "" : "s"}
            {matchesWithEvents > 0 && ` · ${matchesWithEvents} con eventos`}
          </div>
        </div>
      </div>

      {rows.length === 0 ? (
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          Aún no hay goles ni asistencias registrados en ningún partido.
        </div>
      ) : (
        <div className="mp-scroll overflow-x-auto">
          <table className="text-sm w-full" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th className="text-left p-2" style={{ color: "var(--chalk-dim)" }}>Jugador</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Goles</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Asistencias</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Goles+Asistencias</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.number + r.name} className="mp-card">
                  <td className="p-2 whitespace-nowrap">#{r.number} {r.name}</td>
                  <td className="text-center p-2">{r.goles || "–"}</td>
                  <td className="text-center p-2">{r.asistencias || "–"}</td>
                  <td className="text-center p-2 font-semibold">{r.golesAsistencias}</td>
                </tr>
              ))}
            </tbody>

function cornerConcededCount(match) {
  const legacy = (match.concededSetPieces || []).filter((e) => (e.origin || "corner") === "corner").length;
  const fromGoalkeeperEvent = match.events.filter((e) => e.type === "gol_encajado" && e.origen === "corner").length;
  return legacy + fromGoalkeeperEvent;
}

function clampPitchCoord(v, min, max) {
  return Math.min(max, Math.max(min, v));
}

/* ---------------------------------------------------------
   Formación de una jugada de balón parado: define posiciones fijas
   en el campo (independientes del jugador). Qué jugador ocupa cada
   una se decide después, partido a partido, en SetPieceAssignmentBoard.
--------------------------------------------------------- */
function SetPieceFormationEditor({ slots, ball, onSave }) {
  const [selected, setSelected] = useState(null); // { type: "slot", id } | { type: "ball" } | null
  const pitchRef = useRef(null);

  function coordsFromEvent(e) {
    const rect = pitchRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    return { x: clampPitchCoord(x, 3, 97), y: clampPitchCoord(y, 3, 94) };
  }

  function addSlot() {
    const newSlot = { id: genId(), x: 50, y: 50 };
    onSave({ slots: [...slots, newSlot], ball });
    setSelected({ type: "slot", id: newSlot.id });
  }

  function removeSlot(id) {
    onSave({ slots: slots.filter((s) => s.id !== id), ball });
    setSelected(null);
  }

  function moveSlot(id, coords) {
    onSave({ slots: slots.map((s) => (s.id === id ? { ...s, ...coords } : s)), ball });
  }

  function addBall() {
    onSave({ slots, ball: { x: 50, y: 30 } });
    setSelected({ type: "ball" });
  }

  function moveBall(coords) {
    onSave({ slots, ball: coords });
  }

  function removeBall() {
    onSave({ slots, ball: null });
    setSelected(null);
  }

  function handlePitchClick(e) {
    if (!selected || !pitchRef.current) return;
    const coords = coordsFromEvent(e);
    if (selected.type === "slot") moveSlot(selected.id, coords);
    else moveBall(coords);
    setSelected(null);
  }

  return (
    <div>
      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        {selected
          ? `Toca el campo para colocar ${selected.type === "ball" ? "el balón" : "esta posición"}`
          : "Toca una posición o el balón y luego el campo para moverlo"}
      </div>

      <MiniPitch pitchRef={pitchRef} onClick={handlePitchClick}>
        {slots.map((slot) => {
          const isSelected = selected && selected.type === "slot" && selected.id === slot.id;
          return (
            <button
              key={slot.id}
              onClick={(e) => {
                e.stopPropagation();
                setSelected(isSelected ? null : { type: "slot", id: slot.id });
              }}
              className={`mp-shirt w-10 h-10 ${isSelected ? "selected" : ""}`}
              style={{
                position: "absolute",
                left: `${slot.x}%`,
                top: `${slot.y}%`,
                transform: "translate(-50%, -50%)",
              }}
            />
          );
        })}

        {ball && (
          <button
            onClick={(e) => {
              e.stopPropagation();
              setSelected(selected && selected.type === "ball" ? null : { type: "ball" });
            }}
            className={`mp-shirt w-8 h-8 text-base ${selected && selected.type === "ball" ? "selected" : ""}`}
            style={{
              position: "absolute",
              left: `${ball.x}%`,
              top: `${ball.y}%`,
              transform: "translate(-50%, -50%)",
              background: selected && selected.type === "ball" ? undefined : "#F4F1E8",
            }}
          >
            ⚽
          </button>
        )}
      </MiniPitch>

      {selected && selected.type === "slot" && (
        <button
          onClick={() => removeSlot(selected.id)}
          className="mp-btn mp-btn-outline w-full py-2 text-xs mb-3"
          style={{ color: "var(--crimson)" }}
        >
          Eliminar esta posición
        </button>
      )}
      {selected && selected.type === "ball" && (
        <button
          onClick={removeBall}
          className="mp-btn mp-btn-outline w-full py-2 text-xs mb-3"
          style={{ color: "var(--crimson)" }}
        >
          Quitar el balón del campo
        </button>
      )}

      <div className="flex gap-2">
        <button onClick={addSlot} className="mp-btn mp-btn-primary px-3 py-2 text-sm flex-1">
          + Añadir posición
        </button>
        {!ball && (
          <button onClick={addBall} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
            ⚽ Añadir balón
          </button>
        )}
      </div>
      <div className="text-xs mt-2" style={{ color: "var(--chalk-dim)" }}>
        {slots.length} posición{slots.length === 1 ? "" : "es"} fija{slots.length === 1 ? "" : "s"}. Luego, en
        "Asignar jugadores", eliges qué jugador ocupa cada una en cada partido.
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Asignación de una jugada de balón parado: para un partido concreto,
   qué jugador de la plantilla ocupa cada posición fija ya definida.
--------------------------------------------------------- */
function SetPieceAssignmentBoard({ slots, ball, squad, matches, category, playId, onAssign }) {
  const sortedMatches = matches
    .slice()
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  const [matchId, setMatchId] = useState(sortedMatches[0] ? sortedMatches[0].id : null);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [selectedSlotId, setSelectedSlotId] = useState(null);

  const match = sortedMatches.find((m) => m.id === matchId) || sortedMatches[0] || null;

  function playerById(id) {
    return squad.find((p) => p.id === id) || { id, number: "?", name: "Desconocido" };
  }

  if (slots.length === 0) {
    return (
      <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
        Primero define las posiciones fijas de esta jugada en "Formación".
      </div>
    );
  }

  if (!match) {
    return (
      <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
        Todavía no hay ningún partido registrado.
      </div>
    );
  }

  const assignments =
    (match.setPieceAssignments && match.setPieceAssignments[category] && match.setPieceAssignments[category][playId]) ||
    {};
  const assignedPlayerIds = new Set(Object.values(assignments));
  const unassigned = squad.filter((p) => !assignedPlayerIds.has(p.id));

  function saveAssignments(next) {
    onAssign(match.id, category, playId, next);
  }

  function assignSlot(slotId, playerId) {
    const next = { ...assignments };
    // Un jugador solo puede ocupar una posición a la vez: si ya estaba en otra, la libera.
    Object.keys(next).forEach((sId) => {
      if (next[sId] === playerId) delete next[sId];
    });
    next[slotId] = playerId;
    saveAssignments(next);
  }

  function clearSlot(slotId) {
    const next = { ...assignments };
    delete next[slotId];
    saveAssignments(next);
  }

  function handleSlotClick(slot) {
    if (selectedPlayerId) {
      assignSlot(slot.id, selectedPlayerId);
      setSelectedPlayerId(null);
      setSelectedSlotId(null);
      return;
    }
    setSelectedSlotId((prev) => (prev === slot.id ? null : slot.id));
  }

  function handlePlayerClick(id) {
    if (selectedSlotId) {
      assignSlot(selectedSlotId, id);
      setSelectedSlotId(null);
      setSelectedPlayerId(null);
      return;
    }
    setSelectedPlayerId((prev) => (prev === id ? null : id));
  }

  return (
    <div>
      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Partido</div>
      <div className="flex flex-wrap gap-2 mb-3">
        {sortedMatches.map((m) => (
          <button
            key={m.id}
            onClick={() => {
              setMatchId(m.id);
              setSelectedPlayerId(null);
              setSelectedSlotId(null);
            }}
            className="mp-btn px-3 py-2 text-sm"
            style={match.id === m.id ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
          >
            vs {m.opponent} · {m.date}
          </button>
        ))}
      </div>

      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        {selectedPlayerId
          ? `Toca una posición para colocar a ${playerById(selectedPlayerId).name}`
          : selectedSlotId
          ? "Toca un jugador para colocarlo aquí, o quítalo con el botón de abajo"
          : "Toca un jugador y luego una posición para colocarlo, o toca directamente una posición"}
      </div>

      <MiniPitch>
        {slots.map((slot) => {
          const occupantId = assignments[slot.id];
          const occupant = occupantId ? playerById(occupantId) : null;
          const isSelected = selectedSlotId === slot.id;
          return (
            <button
              key={slot.id}
              onClick={(e) => {
                e.stopPropagation();
                handleSlotClick(slot);
              }}
              className={`mp-shirt w-10 h-10 text-sm font-semibold ${isSelected ? "selected" : ""}`}
              style={{
                position: "absolute",
                left: `${slot.x}%`,
                top: `${slot.y}%`,
                transform: "translate(-50%, -50%)",
                borderStyle: occupant ? "solid" : "dashed",
                opacity: occupant ? 1 : 0.65,
              }}
            >
              {occupant && occupant.number}
            </button>
          );
        })}

        {ball && (
          <div
            className="mp-shirt w-8 h-8 text-base"
            style={{
              position: "absolute",
              left: `${ball.x}%`,
              top: `${ball.y}%`,
              transform: "translate(-50%, -50%)",
              background: "#F4F1E8",
            }}
          >
            ⚽
          </div>
        )}
      </MiniPitch>

      {selectedSlotId && assignments[selectedSlotId] && (
        <button
          onClick={() => {
            clearSlot(selectedSlotId);
            setSelectedSlotId(null);
          }}
          className="mp-btn mp-btn-outline w-full py-2 text-xs mb-3"
          style={{ color: "var(--crimson)" }}
        >
          Quitar a {playerById(assignments[selectedSlotId]).name} de esta posición
        </button>
      )}

      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Jugadores sin colocar</div>
      <div className="flex flex-wrap gap-2">
        {unassigned.length === 0 && (
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            Todos los jugadores de la plantilla están colocados.
          </span>
        )}
        {unassigned.map((p) => {
          const selected = selectedPlayerId === p.id;
          return (
            <div key={p.id} className="flex flex-col items-center gap-1" style={{ width: 56 }}>
              <button
                onClick={() => handlePlayerClick(p.id)}
                className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
              >
                {p.number}
              </button>
              <span className="text-[10px] text-center leading-tight" style={{ color: "var(--chalk-dim)" }}>
                {p.name.split(" ")[0]}
              </span>
            </div>
          );
        })}
      </div>
    </div>
  );
}

const SET_PIECE_SIDES = [
  { id: "favor", label: "A favor" },
  { id: "contra", label: "En contra" },
];
const SET_PIECE_TYPES = [
  { id: "corner", label: "Córners" },
  { id: "falta", label: "Faltas" },
];

/* ---------------------------------------------------------
   Jugadas de una categoría de balón parado (p.ej. córners a favor):
   varias jugadas con nombre propio, cada una con su propio medio campo
--------------------------------------------------------- */
function SetPieceCategoryEditor({ plays, squad, matches, category, onSave, onAssign }) {
  const [activePlayId, setActivePlayId] = useState(plays[0] ? plays[0].id : null);
  // Al entrar se ve siempre la formación guardada (qué jugadas tenemos), independientemente
  // de si hay partidos con once elegido; asignar jugadores es un paso posterior, partido a partido.
  const [mode, setMode] = useState("formacion"); // "formacion" | "asignar"

  const activePlay = plays.find((pl) => pl.id === activePlayId) || null;

  function addPlay() {
    const newPlay = { id: genId(), name: `Jugada ${plays.length + 1}`, slots: [], ball: null };
    onSave([...plays, newPlay]);
    setActivePlayId(newPlay.id);
    setMode("formacion");
  }

  function renamePlay(id, name) {
    onSave(plays.map((pl) => (pl.id === id ? { ...pl, name } : pl)));
  }

  function removePlay(id) {
    if (!window.confirm("¿Eliminar esta jugada?")) return;
    const updated = plays.filter((pl) => pl.id !== id);
    onSave(updated);
    setActivePlayId(updated[0] ? updated[0].id : null);
  }

  function saveFormation(id, next) {
    onSave(plays.map((pl) => (pl.id === id ? { ...pl, slots: next.slots, ball: next.ball } : pl)));
  }

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-3">
        {plays.map((pl) => (
          <button
            key={pl.id}
            onClick={() => setActivePlayId(pl.id)}
            className="mp-btn px-3 py-2 text-sm"
            style={activePlayId === pl.id ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
          >
            {pl.name}
          </button>
        ))}
        <button onClick={addPlay} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          + Nueva jugada
        </button>
      </div>

      {!activePlay ? (
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          Añade una jugada para empezar a definir sus posiciones fijas.
        </div>
      ) : (
        <React.Fragment>
          <div className="mp-card p-3 mb-3 flex items-end gap-2">
            <div className="flex-1">
              <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Nombre de la jugada</label>
              <input
                value={activePlay.name}
                onChange={(e) => renamePlay(activePlay.id, e.target.value)}
                className="mp-input px-3 py-2 w-full mt-1"
              />
            </div>
            <button
              onClick={() => removePlay(activePlay.id)}
              className="mp-btn mp-btn-outline px-3 py-2 text-xs shrink-0"
              style={{ color: "var(--crimson)" }}
            >
              Eliminar
            </button>
          </div>

          <div className="flex gap-2 mb-3">
            <button
              onClick={() => setMode("formacion")}
              className="mp-btn px-3 py-2 text-sm flex-1"
              style={mode === "formacion" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
            >
              Formación
            </button>
            <button
              onClick={() => setMode("asignar")}
              className="mp-btn px-3 py-2 text-sm flex-1"
              style={mode === "asignar" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
            >
              Asignar jugadores
            </button>
          </div>

          {mode === "formacion" ? (
            <SetPieceFormationEditor
              key={activePlay.id}
              slots={activePlay.slots || []}
              ball={activePlay.ball || null}
              onSave={(next) => saveFormation(activePlay.id, next)}
            />
          ) : (
            <SetPieceAssignmentBoard
              key={activePlay.id}
              slots={activePlay.slots || []}
              ball={activePlay.ball || null}
              squad={squad}
              matches={matches}
              category={category}
              playId={activePlay.id}
              onAssign={onAssign}
            />
          )}
        </React.Fragment>
      )}
    </div>
  );
}

function SetPieceStats({ matches, squad, setPiecePositions, onSaveSetPiecePositions, onSaveAssignment, onBack }) {
  const [mainTab, setMainTab] = useState("estadisticas");
  const [spSide, setSpSide] = useState("favor");
  const [spType, setSpType] = useState("corner");
  const spCategory = `${spSide}_${spType}`;

  const allEvents = matches.flatMap((m) => m.events);
  const countType = (type) => allEvents.filter((e) => e.type === type).length;

  const cornerFavor = countType("gol_corner");
  const faltaFavor = countType("gol_falta");
  const penaltiFavor = countType("gol_penalti");
  const setPieceFavorTotal = cornerFavor + faltaFavor + penaltiFavor;
  const totalGoals = allEvents.filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const setPiecePct = totalGoals === 0 ? null : Math.round((setPieceFavorTotal / totalGoals) * 100);

  const contraTotal = matches.reduce((sum, m) => sum + cornerConcededCount(m), 0);

  const rows = matches
    .map((m) => ({
      id: m.id,
      opponent: m.opponent,
      date: m.date,
      favor: m.events.filter((e) => SET_PIECE_GOAL_TYPES.includes(e.type)).length,
      contra: cornerConcededCount(m),
    }))
    .filter((r) => r.favor > 0 || r.contra > 0)
    .sort((a, b) => (a.date < b.date ? 1 : -1));

  return (
    <div className="max-w-2xl mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-4 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">

            {SET_PIECE_TYPES.map((t) => (

                {t.label}
