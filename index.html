--------------------------------------------------------- */
function SeasonTeamStats({ matches }) {
  const played = matches.filter((m) => !m.scheduled);
  const n = played.length;
  if (n === 0) return null;

  const allEvents = played.flatMap((m) => m.events);
  const count = (type) => allEvents.filter((e) => e.type === type).length;
  const teamEventCount = (type) =>
    played.reduce((sum, m) => sum + (m.teamEvents || []).filter((e) => e.type === type).length, 0);

  const faltas = count("falta_cometida");
  const amarillas = count("amarilla");
  const rojas = count("roja");
  const tirosPuerta = count("remate_puerta");
  const tirosFuera = count("remate_fuera");
  const corners = teamEventCount("corner_favor");
  const robos = count("recuperacion");
  const golesFavor = allEvents.filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const golesContra = played.reduce(
    (sum, m) => sum + (m.concededSetPieces || []).length + m.events.filter((e) => e.type === "gol_encajado").length,
    0
  );
  const despejesOk = count("despeje");
  const despejesFallados = count("despeje_fallado");
  const despejesTotales = despejesOk + despejesFallados;
  const despejesPct = despejesTotales === 0 ? null : Math.round((despejesOk / despejesTotales) * 100);

  const avg = (total) => Math.round((total / n) * 10) / 10;

  return (
    <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-2">
      <StatCard label="Goles a favor" value={golesFavor} sub={`${avg(golesFavor)} por partido`} />
      <StatCard label="Goles encajados" value={golesContra} sub={`${avg(golesContra)} por partido`} />
      <StatCard label="Tarjetas amarillas" value={amarillas} sub={`${avg(amarillas)} por partido`} />
      <StatCard label="Tarjetas rojas" value={rojas} sub={`${avg(rojas)} por partido`} />
      <StatCard label="Faltas por partido" value={avg(faltas)} />
      <StatCard label="Tiros a puerta/partido" value={avg(tirosPuerta)} />
      <StatCard label="Tiros fuera/partido" value={avg(tirosFuera)} />
      <StatCard label="Córners por partido" value={avg(corners)} />
      <StatCard label="Robos por partido" value={avg(robos)} />
      <StatCard
        label="Despejes"
        value={despejesPct === null ? "–" : `${despejesPct}%`}
        sub={despejesTotales === 0 ? "Sin despejes registrados" : `${despejesOk} de ${despejesTotales}`}
      />
    </div>
  );
}

// Tramos que cada jugador pasó en el campo en un partido concreto ([{ enter, exit }, ...] en
// minutos): reconstruye el once inicial deshaciendo los cambios en orden inverso desde el
// `onPitch` final y recorre los cambios en orden. Un jugador sustituido puede volver a entrar
// más tarde, así que puede tener varios tramos.
// Partidos jugados antes de limitar el cronómetro pueden tener partes más largas de lo fijado
// (el reloj siguió corriendo): aquí cada parte cuenta como mucho su duración y los minutos de
// los cambios se ajustan dentro de su parte, así que nadie suma más minutos que el partido.
function computeMatchIntervals(match) {
  const L = Number(match.halfLength) || 0;
  const halfSecs = (v) => (L ? Math.min(v || 0, L * 60) : v || 0);
  const totalMinutes =
    Math.round((halfSecs(match.clock.half1Elapsed) + halfSecs(match.clock.half2Elapsed)) / 60) || L * 2;
  const clampMinute = (half, minute) => {
    if (!L) return minute;
    return half === 1 ? Math.min(minute, L) : Math.min(Math.max(minute, L), 2 * L);
  };
  const subsSorted = [...(match.subs || [])]
    .map((s) => ({ ...s, minute: clampMinute(s.half, s.minute) }))
    .sort((a, b) => a.half - b.half || a.minute - b.minute);

  const starters = new Set(match.onPitch || []);
  [...subsSorted].reverse().forEach((s) => {
    starters.delete(s.inId);
    starters.add(s.outId);
  });

  const intervals = {};
  const open = {};
  starters.forEach((id) => { open[id] = 0; });
  subsSorted.forEach((s) => {
    if (open[s.outId] != null) {
      (intervals[s.outId] = intervals[s.outId] || []).push({ enter: open[s.outId], exit: s.minute });
      delete open[s.outId];
    }
    open[s.inId] = s.minute;
  });
  Object.keys(open).forEach((id) => {
    (intervals[id] = intervals[id] || []).push({ enter: open[id], exit: Math.max(open[id], totalMinutes) });
  });
  return intervals;
}

// Minutos jugados por cada jugador en un partido concreto (suma de sus tramos en el campo).
function computeMatchMinutes(match) {
  const intervals = computeMatchIntervals(match);
  const minutesByPlayer = {};
  Object.keys(intervals).forEach((id) => {
    minutesByPlayer[id] = intervals[id].reduce((sum, t) => sum + Math.max(0, t.exit - t.enter), 0);
  });
  return minutesByPlayer;
}

// Destacados de la temporada para el resumen rápido de Inicio: máximo goleador, más
// asistencias y más minutos jugados. Devuelve null en cada uno si todavía no hay datos.
// Minutos jugados por cada jugador sumados en toda la temporada (solo partidos ya jugados,
// no los programados): titular desde el minuto 0, o desde que entra de suplente, hasta que le
// sustituyen o acaba el partido. Lo reutilizan el resumen rápido de Inicio y las estadísticas
// por jugador (temporada y gráficos).
function computeSeasonMinutesByPlayer(matches) {
  const minutesBy = {};
  matches
    .filter((m) => !m.scheduled)
    .forEach((m) => {
      const mins = computeMatchMinutes(m);
      Object.keys(mins).forEach((id) => { minutesBy[id] = (minutesBy[id] || 0) + mins[id]; });
    });
  return minutesBy;
}

function computeSeasonHighlights(matches, squad) {
  const played = matches.filter((m) => !m.scheduled);
  const goalsBy = {};
  const assistsBy = {};
  played.forEach((m) => {
    (m.events || []).forEach((e) => {
      if (ALL_GOAL_TYPES.includes(e.type)) goalsBy[e.playerId] = (goalsBy[e.playerId] || 0) + 1;
      if (e.type === "asistencia") assistsBy[e.playerId] = (assistsBy[e.playerId] || 0) + 1;
    });
  });
  const minutesBy = computeSeasonMinutesByPlayer(matches);
  const nameFor = (id) => { const p = squad.find((pp) => pp.id === id); return p ? p.name : null; };
  const topBy = (map) => {
    const entries = Object.entries(map).filter(([, v]) => v > 0);
    if (entries.length === 0) return null;
    entries.sort((a, b) => b[1] - a[1]);
    const [id, value] = entries[0];
    const name = nameFor(id);
    return name ? { name, value } : null;
  };
  return {
    topScorer: topBy(goalsBy),
    topAssists: topBy(assistsBy),
    mostMinutes: topBy(minutesBy),
  };
}

function computePlayerStats(playerId, events) {
  const own = events.filter((e) => e.playerId === playerId);
  const count = (type) => own.filter((e) => e.type === type).length;
  const duelosGanados = count("duelo_ganado") + count("duelo_general_ganado");
  const duelosPerdidos = count("duelo_perdido") + count("duelo_general_perdido");
  const duelosTotales = duelosGanados + duelosPerdidos;
  const duelosPct = duelosTotales === 0 ? null : Math.round((duelosGanados / duelosTotales) * 100);
  const regatesOk = count("regate");
  const regatesFallados = count("regate_fallado");
  const regatesTotales = regatesOk + regatesFallados;
  const regatesPct = regatesTotales === 0 ? null : Math.round((regatesOk / regatesTotales) * 100);
  const tirosPuerta = count("remate_puerta");
  const tirosFuera = count("remate_fuera");
  const tirosTotales = tirosPuerta + tirosFuera;
  const tirosPuertaPct = tirosTotales === 0 ? null : Math.round((tirosPuerta / tirosTotales) * 100);
  const perdidas = count("perdida");
  const robos = count("recuperacion");
  const goles = ALL_GOAL_TYPES.reduce((sum, t) => sum + count(t), 0);
  const asistencias = count("asistencia");
  const paradas = count("parada_area") + count("parada_fuera_area") + count("parada_area_pequena");
  const despejes = count("despeje");
  const despejesFallados = count("despeje_fallado");
  const despejesTotales = despejes + despejesFallados;
  const despejesPct = despejesTotales === 0 ? null : Math.round((despejes / despejesTotales) * 100);
  const golesEncajados = count("gol_encajado");
  const amarillas = count("amarilla");
  const rojas = count("roja");
  const paseClave = count("pase_clave");
  const faltasCometidas = count("falta_cometida");
  return {
    duelosGanados,
    duelosPerdidos,
    duelosTotales,
    duelosPct,
    regatesOk,
    regatesFallados,
    regatesTotales,
    regatesPct,
    tirosPuerta,
    tirosFuera,
    tirosTotales,
    tirosPuertaPct,
    perdidas,
    robos,
    goles,
    asistencias,
    paradas,
    despejes,
    despejesFallados,
    despejesTotales,
    despejesPct,
    golesEncajados,
    amarillas,
    rojas,
    paseClave,
    faltasCometidas,
  };
}

/* ---------------------------------------------------------
   Nota por partido (0-10, base configurable, 6.0 por defecto): cada evento del jugador suma o resta según
   la posición que ocupaba en el minuto exacto del evento (tramos de `positionHistory`
   que se guardan al moverle en Campo), no según su posición fija de Plantilla.
--------------------------------------------------------- */
const RATING_POSITION_GROUP = {
  PT: "PT",
  DFI: "DEF", DFC: "DEF", DFD: "DEF",
  CAI: "CAR", CAD: "CAR",
  MC: "MC",
  MCO: "MCO",
  DC: "DC",
};
const RATING_GROUPS = [
  { id: "PT", label: "PT" },
  { id: "DEF", label: "Defensa" },
  { id: "CAR", label: "Carrilero" },
  { id: "MC", label: "MC" },
  { id: "MCO", label: "MCO" },
  { id: "DC", label: "DC" },
];
// Filas de la tabla de pesos. `ptOnly`: solo aplica al portero (celdas de otras posiciones deshabilitadas).
const RATING_ROWS = [
  { key: "gol", label: "Gol" },
  { key: "asistencia", label: "Asistencia" },
  { key: "remate_puerta", label: "Remate a puerta" },
  { key: "pase_clave", label: "Pase clave" },
  { key: "regate", label: "Regate completado" },
  { key: "duelo_ganado", label: "Duelo ganado" },
  { key: "despeje", label: "Despeje" },
  { key: "recuperacion", label: "Recuperación" },
  { key: "falta_cometida", label: "Falta cometida" },
  { key: "amarilla", label: "Tarjeta amarilla" },
  { key: "roja", label: "Tarjeta roja" },
  { key: "parada", label: "Parada", ptOnly: true },
  { key: "gol_encajado", label: "Gol encajado", ptOnly: true },
];
// Configuración por defecto de la nota. Cada equipo guarda la suya en `data.ratingConfig`
// (sincronizada con Supabase por código de equipo); null = sin peso (no suma ni resta).
const DEFAULT_RATING_CONFIG = {
  base: 6.0,
  bonusWin: 0.5,
  bonusBigWin: 1.0,
  bonusCleanSheet: 1.0,
  weights: {
    gol: { PT: 2.0, DEF: 1.8, CAR: 1.5, MC: 1.5, MCO: 1.4, DC: 1.2 },
    asistencia: { PT: 1.0, DEF: 1.0, CAR: 1.0, MC: 1.0, MCO: 0.9, DC: 0.9 },
    remate_puerta: { PT: null, DEF: 0.3, CAR: 0.25, MC: 0.22, MCO: 0.18, DC: 0.12 },
    pase_clave: { PT: null, DEF: 0.35, CAR: 0.18, MC: 0.15, MCO: 0.15, DC: 0.3 },
    regate: { PT: null, DEF: 0.3, CAR: 0.14, MC: 0.2, MCO: 0.16, DC: 0.14 },
    duelo_ganado: { PT: 0.15, DEF: 0.15, CAR: 0.12, MC: 0.12, MCO: 0.08, DC: 0.05 },
    despeje: { PT: 0.1, DEF: 0.15, CAR: 0.1, MC: null, MCO: null, DC: null },
    recuperacion: { PT: null, DEF: 0.1, CAR: 0.1, MC: 0.15, MCO: 0.1, DC: 0.05 },
    falta_cometida: { PT: -0.15, DEF: -0.15, CAR: -0.15, MC: -0.15, MCO: -0.15, DC: -0.15 },
    amarilla: { PT: -0.5, DEF: -0.5, CAR: -0.5, MC: -0.5, MCO: -0.5, DC: -0.5 },
    roja: { PT: -1.5, DEF: -1.5, CAR: -1.5, MC: -1.5, MCO: -1.5, DC: -1.5 },
    parada: { PT: 0.3, DEF: null, CAR: null, MC: null, MCO: null, DC: null },
    gol_encajado: { PT: -0.3, DEF: null, CAR: null, MC: null, MCO: null, DC: null },
  },
};

// Completa una config guardada con los valores por defecto que le falten (equipos antiguos
// sin config, o filas nuevas); respeta los null que el entrenador haya dejado a propósito.
function normalizeRatingConfig(cfg) {
  const src = cfg || {};
  const num = (v, d) => (typeof v === "number" && isFinite(v) ? v : d);
  const weights = {};
  RATING_ROWS.forEach(({ key, ptOnly }) => {
    const def = DEFAULT_RATING_CONFIG.weights[key];
    const saved = (src.weights && src.weights[key]) || {};
    weights[key] = {};
    RATING_GROUPS.forEach(({ id }) => {
      if (ptOnly && id !== "PT") weights[key][id] = null;
      else if (id in saved) weights[key][id] = typeof saved[id] === "number" && isFinite(saved[id]) ? saved[id] : null;
      else weights[key][id] = def[id];
    });
  });
  return {
    base: num(src.base, DEFAULT_RATING_CONFIG.base),
    bonusWin: num(src.bonusWin, DEFAULT_RATING_CONFIG.bonusWin),
    bonusBigWin: num(src.bonusBigWin, DEFAULT_RATING_CONFIG.bonusBigWin),
    bonusCleanSheet: num(src.bonusCleanSheet, DEFAULT_RATING_CONFIG.bonusCleanSheet),
    weights,
  };
}

// Config de nota del equipo actual, disponible en cualquier pantalla sin pasarla por props
const RatingConfigContext = React.createContext(normalizeRatingConfig(null));

// Tipos de evento registrados → fila de la tabla de pesos
function ratingWeightKey(type) {
  if (ALL_GOAL_TYPES.includes(type)) return "gol";
  if (type === "duelo_ganado" || type === "duelo_general_ganado") return "duelo_ganado";
  if (type === "parada_area" || type === "parada_fuera_area" || type === "parada_area_pequena") return "parada";
  return DEFAULT_RATING_CONFIG.weights[type] ? type : null;
}

// Peso de un evento para una posición. Si no se conoce la posición del jugador, solo cuenta
// cuando el peso es igual en todas las posiciones (faltas y tarjetas, por defecto).
function ratingWeight(config, key, positionCode) {
  const row = config.weights[key];
  if (!row) return 0;
  const group = RATING_POSITION_GROUP[positionCode];
  if (group) return row[group] || 0;
  const values = RATING_GROUPS.map(({ id }) => row[id]);
  return values.every((v) => v === values[0]) ? values[0] || 0 : 0;
}

// Posición que ocupaba un jugador en un minuto dado: el último tramo de `positionHistory`
// que empezó en o antes de ese momento. Si el evento es anterior a su primer tramo se usa
// ese primer tramo, y si nunca se le colocó en Campo, su posición de Plantilla como respaldo.
function positionAtMinute(match, playerId, half, minute, fallbackCode) {
  const history = (match.positionHistory || [])
    .filter((h) => h.playerId === playerId)
    .sort((a, b) => a.half - b.half || a.minute - b.minute);
  if (history.length === 0) return fallbackCode || null;
  let current = history[0].code;
  history.forEach((h) => {
    if (h.half < half || (h.half === half && h.minute <= minute)) current = h.code;
  });
  return current;
}

function matchGoals(match) {
  const favor = (match.events || []).filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const contra =
    (match.concededSetPieces || []).length + (match.events || []).filter((e) => e.type === "gol_encajado").length;
  return { favor, contra };
}

function matchResultBonus(match, config) {
  if (!(match.finished || match.half === "finalizado")) return 0;
  const { favor, contra } = matchGoals(match);
  if (favor <= contra) return 0;
  let bonus = config.bonusWin;
  if (favor - contra >= 5) bonus += config.bonusBigWin;
  if (contra === 0) bonus += config.bonusCleanSheet;
  return bonus;
}

// Notas de un partido por jugador: { [playerId]: 7.2 } solo para quienes jugaron (titulares
// y suplentes que entraron), recortadas a 0-10 y redondeadas a un decimal.
function computeMatchRatings(match, squad, config) {
  const intervals = computeMatchIntervals(match);
  const squadPosition = {};
  (squad || []).forEach((p) => { squadPosition[p.id] = p.position || null; });
  const posAt = (playerId, half, minute) =>
    positionAtMinute(match, playerId, half, minute, squadPosition[playerId]);

  const scores = {};
  Object.keys(intervals).forEach((id) => { scores[id] = config.base; });

  (match.events || []).forEach((e) => {
    if (scores[e.playerId] == null) return;
    const key = ratingWeightKey(e.type);
    if (!key) return;
    scores[e.playerId] += ratingWeight(config, key, posAt(e.playerId, e.half, e.minute));
  });

  // Goles encajados antiguos guardados como dato de equipo (sin jugador): restan al que
  // estaba de PT en el campo en ese minuto.
  (match.concededSetPieces || []).forEach((g) => {
    Object.keys(intervals).forEach((id) => {
      const stints = intervals[id];
      const minute = g.minute != null ? g.minute : stints[stints.length - 1].exit;
      if (!stints.some((t) => minute >= t.enter && minute <= t.exit)) return;
      scores[id] += ratingWeight(config, "gol_encajado", posAt(id, g.half || 2, minute));
    });
  });

  // Bonificaciones por resultado, solo con el partido ya finalizado y si el equipo gana:
  // por ganar, más si gana por 5 o más goles, y más si no encaja ninguno (valores de la config).
  const bonus = matchResultBonus(match, config);
  if (bonus > 0) Object.keys(scores).forEach((id) => { scores[id] += bonus; });

  const ratings = {};
  Object.keys(scores).forEach((id) => {
    ratings[id] = Math.round(Math.min(10, Math.max(0, scores[id])) * 10) / 10;
  });
  return ratings;
}

/* ---------------------------------------------------------
   Informe PDF del partido (jsPDF + autotable)
   Con `onlyPlayerId` sale el informe de un solo jugador (para mandárselo a él); sin él, una
   primera página con la tabla del equipo y después una página por cada jugador que jugó.
--------------------------------------------------------- */
function pdfSafe(text) {
  // Las fuentes estándar de jsPDF no tienen algunos signos tipográficos
  return String(text == null ? "" : text).replace(/[–—]/g, "-").replace(/[“”]/g, '"').replace(/[‘’]/g, "'");
}

function pdfFileSlug(text) {
  return String(text || "")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
    .replace(/[^a-zA-Z0-9]+/g, "_").replace(/^_+|_+$/g, "").toLowerCase();
}

function buildMatchReportPdf(match, squad, ratingConfig, onlyPlayerId, ownCrest) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: "mm", format: "a4" });
  const GREEN = [22, 36, 28];
  const TURF = [127, 191, 106];
  const ratings = computeMatchRatings(match, squad, ratingConfig);
  const minutes = computeMatchMinutes(match);
  const { favor, contra } = matchGoals(match);
  const result = `${favor} - ${contra}`;
  const subtitle = pdfSafe(`vs ${match.opponent} · ${match.date} · Resultado: ${result}`);
  const rosterIds = [...new Set([...(match.onPitch || []), ...(match.bench || [])])];
  const players = rosterIds
    .map((id) => squad.find((p) => p.id === id))
    .filter(Boolean)
    .sort((a, b) => Number(a.number) - Number(b.number));
  const played = players.filter((p) => ratings[p.id] != null);
  const pct = (v) => (v === null ? "-" : `${v}%`);
  const fmtRating = (r) => (r == null ? "No jugó" : r.toFixed(1));

  // Escudo de nuestro equipo (el que se elige en Inicio), arriba a la derecha de cada página
  let crest = null;
  if (ownCrest && /^data:image\/(png|jpe?g)/i.test(ownCrest)) {
    try {
      const props = doc.getImageProperties(ownCrest);
      const h = 20;
      const w = Math.min(30, (props.width / props.height) * h);
      crest = { src: ownCrest, format: /png/i.test(ownCrest.slice(0, 20)) ? "PNG" : "JPEG", w, h: (w / props.width) * props.height };
    } catch (e) {
      crest = null;
    }
  }

  function header(title) {
    doc.setFillColor(...GREEN);
    doc.rect(0, 0, 210, 26, "F");
    if (crest) doc.addImage(crest.src, crest.format, 210 - 10 - crest.w, (26 - crest.h) / 2, crest.w, crest.h);
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(16);
    doc.text(pdfSafe(title), 14, 12);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(10);
    doc.text(subtitle, 14, 20);
    doc.setTextColor(0, 0, 0);
  }

  function playerPage(p) {
    header(`#${p.number} ${p.name}`);
    const rating = ratings[p.id];
    const st = computePlayerStats(p.id, match.events || []);
    const isGk = GOALKEEPER_NUMBERS.includes(String(p.number));

    // Nota y minutos, grandes
    doc.setDrawColor(...TURF);
    doc.setLineWidth(0.8);
    doc.roundedRect(14, 32, 56, 26, 3, 3);
    doc.roundedRect(76, 32, 56, 26, 3, 3);
    doc.setFontSize(9);
    doc.setTextColor(100, 100, 100);
    doc.text("NOTA", 42, 38, { align: "center" });
    doc.text("MINUTOS", 104, 38, { align: "center" });
    doc.setTextColor(0, 0, 0);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(22);
    doc.text(fmtRating(rating), 42, 52, { align: "center" });
    doc.text(`${minutes[p.id] || 0}'`, 104, 52, { align: "center" });
    doc.setFont("helvetica", "normal");

    const key = [
      ["Goles", st.goles],
      ["Asistencias", st.asistencias],
      ["Tiros (a puerta / total)", `${st.tirosPuerta} / ${st.tirosTotales}`],
      ["Duelos ganados", `${pct(st.duelosPct)} (${st.duelosGanados} de ${st.duelosTotales})`],
      ["Regates acertados", `${pct(st.regatesPct)} (${st.regatesOk} de ${st.regatesTotales})`],
      ["Despejes", `${pct(st.despejesPct)} (${st.despejes} de ${st.despejesTotales})`],
      ["Recuperaciones", st.robos],
      ["Pérdidas", st.perdidas],
      ["Tarjetas (amarilla / roja)", `${st.amarillas} / ${st.rojas}`],
    ];
    if (isGk) key.push(["Paradas", st.paradas], ["Goles encajados", st.golesEncajados]);
    doc.autoTable({
      startY: 66,
      head: [["Resumen", ""]],
      body: key.map(([k, v]) => [pdfSafe(k), pdfSafe(v)]),
      theme: "striped",
      headStyles: { fillColor: GREEN },
      columnStyles: { 1: { halign: "right", fontStyle: "bold" } },
      margin: { left: 14, right: 14 },
    });

    // Detalle: cada acción registrada, agrupada como en la app
    const own = (match.events || []).filter((e) => e.playerId === p.id);
    const detail = EVENT_TYPES.map((ev) => [ev, own.filter((e) => e.type === ev.id).length])
      .filter(([, n]) => n > 0)
      .map(([ev, n]) => [pdfSafe((GROUP_META[ev.group] || {}).label || ""), pdfSafe(ev.label), n]);
    doc.autoTable({
      startY: doc.lastAutoTable.finalY + 8,
      head: [["Grupo", "Acción", "Veces"]],
      body: detail.length ? detail : [["", "Sin acciones registradas", ""]],
      theme: "grid",
      headStyles: { fillColor: GREEN },
      columnStyles: { 2: { halign: "right" } },
      margin: { left: 14, right: 14 },
    });
  }

  if (onlyPlayerId) {
    const p = players.find((pl) => pl.id === onlyPlayerId);
    if (p) playerPage(p);
  } else {
    header("Informe del partido");
    doc.autoTable({
      startY: 34,
      head: [["#", "Jugador", "Min", "Nota", "Goles", "Asist.", "Tiros", "Duelos", "Regates", "Recup.", "Pérd."]],
      body: players.map((p) => {
        const st = computePlayerStats(p.id, match.events || []);
        return [
          p.number,
          pdfSafe(p.name),
          ratings[p.id] != null ? `${minutes[p.id] || 0}'` : "-",
          fmtRating(ratings[p.id]),
          st.goles,
          st.asistencias,
          `${st.tirosPuerta}/${st.tirosTotales}`,
          pct(st.duelosPct),
          pct(st.regatesPct),
          st.robos,
          st.perdidas,
        ];
      }),
      theme: "striped",
      headStyles: { fillColor: GREEN, fontSize: 8 },
      styles: { fontSize: 8 },
      columnStyles: { 3: { fontStyle: "bold" } },
      margin: { left: 10, right: 10 },
    });
    played.forEach((p) => {
      doc.addPage();
      playerPage(p);
    });
  }

  // Pie con número de página
  const pages = doc.getNumberOfPages();
  for (let i = 1; i <= pages; i++) {
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(140, 140, 140);
    doc.text(`Statix · ${i}/${pages}`, 196, 290, { align: "right" });
  }

  const who = onlyPlayerId ? `_${pdfFileSlug((players.find((pl) => pl.id === onlyPlayerId) || {}).name)}` : "";
  const filename = `statix_${pdfFileSlug(match.opponent)}_${pdfFileSlug(match.date)}${who}.pdf`;
  return { doc, filename };
}

// En iPad/iPhone abre el menú de compartir (WhatsApp, Mail...) con el PDF; si el navegador no
// permite compartir archivos, lo descarga.
async function shareOrDownloadPdf(doc, filename) {
  const blob = doc.output("blob");
  const file = typeof File !== "undefined" ? new File([blob], filename, { type: "application/pdf" }) : null;
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: filename });
      return;
    } catch (e) {
      if (e && e.name === "AbortError") return; // el usuario cerró el menú
    }
  }
  doc.save(filename);
}

function MatchPdfPanel({ match, squad, crests }) {
  const ratingConfig = React.useContext(RatingConfigContext);
  const [busy, setBusy] = useState(false);
  const ratings = computeMatchRatings(match, squad, ratingConfig);
  const playedPlayers = [...new Set([...(match.onPitch || []), ...(match.bench || [])])]
    .map((id) => squad.find((p) => p.id === id))
    .filter((p) => p && ratings[p.id] != null)
    .sort((a, b) => Number(a.number) - Number(b.number));

  async function generate(playerId) {
    if (!window.jspdf || !window.jspdf.jsPDF) {
      window.alert("No se ha podido cargar el generador de PDF. Abre la app una vez con conexión y vuelve a probar.");
      return;
    }
    setBusy(true);
    try {
      const { doc, filename } = buildMatchReportPdf(match, squad, ratingConfig, playerId, crests && crests.own);
      await shareOrDownloadPdf(doc, filename);
    } catch (e) {
      console.error("Error generando el PDF", e);
      window.alert("No se pudo generar el PDF.");
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="mp-card p-3 mb-5">
      <div className="text-xs uppercase tracking-wide mb-2" style={{ color: "var(--chalk-dim)" }}>
        Informe PDF con estadísticas y nota
      </div>
      <button
        onClick={() => generate(null)}
        disabled={busy}
        className="mp-btn mp-btn-primary w-full py-2.5 text-sm font-semibold mb-3 disabled:opacity-40"
      >
        PDF de todo el equipo
      </button>
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>O uno para cada jugador:</div>
      <div className="flex flex-wrap gap-2">
        {playedPlayers.map((p) => (
          <button
            key={p.id}
            onClick={() => generate(p.id)}
            disabled={busy}
            className="mp-btn mp-btn-outline px-3 py-2 text-xs disabled:opacity-40"
          >
            {p.number} · {p.name} ({ratings[p.id].toFixed(1)})
          </button>
        ))}
        {playedPlayers.length === 0 && (
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>Ningún jugador tiene minutos en este partido.</span>
        )}
      </div>
    </div>
  );
}

// Nota media de temporada por jugador (media de sus notas en los partidos jugados, sin los
// programados): { [playerId]: { avg, matches } }, con la media redondeada a un decimal.
function computeSeasonRatings(matches, squad, config) {
  const sums = {};
  matches
    .filter((m) => !m.scheduled)
    .forEach((m) => {
      const ratings = computeMatchRatings(m, squad, config);
      Object.keys(ratings).forEach((id) => {
        if (!sums[id]) sums[id] = { total: 0, matches: 0 };
        sums[id].total += ratings[id];
        sums[id].matches += 1;
      });
    });
  const result = {};
  Object.keys(sums).forEach((id) => {
    result[id] = { avg: Math.round((sums[id].total / sums[id].matches) * 10) / 10, matches: sums[id].matches };
  });
  return result;
}

// Rojo 0-5.99, verde 6-7.99, azul 8-10 (mismo criterio en Plantilla, notas y estadísticas)
function ratingColor(rating) {
  if (rating >= 8) return "var(--cielo)";
  if (rating >= 6) return "var(--turf)";
  return "var(--crimson)";
}

function RatingBadge({ rating, title = "Nota del partido (0-10)" }) {
  if (rating == null) return null;
  return (
    <span
      className="text-xs font-semibold px-1.5 py-0.5 rounded"
      style={{ color: ratingColor(rating), border: `1px solid ${ratingColor(rating)}` }}
      title={title}
    >
      {rating.toFixed(1)}
    </span>
  );
}

// Pestaña "Notas" de un partido finalizado: jugadores que participaron, de mayor a menor nota.
function MatchRatingsList({ match, squad }) {
  const ratingConfig = React.useContext(RatingConfigContext);
  const ratings = computeMatchRatings(match, squad, ratingConfig);
  const bonus = matchResultBonus(match, ratingConfig);
  const rows = Object.keys(ratings)
    .map((id) => ({ id, player: squad.find((p) => p.id === id), rating: ratings[id] }))
    .filter((r) => r.player)
    .sort((a, b) => b.rating - a.rating || Number(a.player.number) - Number(b.player.number));

  if (rows.length === 0) {
    return (
      <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
        Ningún jugador participó en este partido.
      </div>
    );
  }

  return (
    <div className="flex flex-col gap-2">
      <div className="text-xs mb-1" style={{ color: "var(--chalk-dim)" }}>
        Nota final (0-10, base {ratingConfig.base.toFixed(1)}) según eventos y posición
        {bonus > 0 && ` · incluye +${bonus.toFixed(1)} por el resultado`}
      </div>
      {rows.map((r, i) => (
        <div key={r.id} className="mp-card px-3 py-2.5 flex items-center justify-between">
          <span className="flex items-center gap-2">
            <span className="text-xs w-5 text-right" style={{ color: "var(--chalk-dim)" }}>{i + 1}.</span>
            <span className="font-semibold">#{r.player.number}</span>
            <span>{r.player.name}</span>
          </span>
          <RatingBadge rating={r.rating} />
        </div>
      ))}
    </div>
  );
}

      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>{title}</div>

        {rows.map((r) => (
          <div key={r.label} className="flex items-center gap-2">

              <div
                className="h-3 rounded-full"
                style={{ width: `${max === 0 ? 0 : (r.raw / max) * 100}%`, background: color }}

/* ---------------------------------------------------------
   Gráfico de composición: reparto en % entre 2-3 resultados posibles
--------------------------------------------------------- */
function PercentBreakdownChart({ title, segments }) {
  const total = segments.reduce((sum, s) => sum + s.value, 0);
  if (total === 0) return null;
  const visible = segments.filter((s) => s.value > 0);

  return (
    <div className="mp-card p-3">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>{title}</div>
      <div className="flex w-full h-4 rounded-full overflow-hidden">
        {visible.map((s, i) => (
          <div
            key={s.label}
            style={{
              width: `${(s.value / total) * 100}%`,
              background: s.color,
              borderRight: i < visible.length - 1 ? "2px solid var(--pitch)" : "none",
            }}
          />
        ))}
      </div>
      <div className="flex flex-wrap gap-x-3 gap-y-1 mt-2">
        {segments.map((s) => (
          <div key={s.label} className="flex items-center gap-1 text-[11px]" style={{ color: "var(--chalk-dim)" }}>
            <span
              style={{ width: 8, height: 8, borderRadius: 2, background: s.color, display: "inline-block" }}
            />
            {s.label}:{" "}
            <span className="font-semibold" style={{ color: "var(--chalk)" }}>
              {Math.round((s.value / total) * 100)}% ({s.value})
            </span>
          </div>
        ))}
      </div>
    </div>
  );
}

          color: "var(--amber)",
        },

function PlayerStatsCharts({ players, events, matches }) {
  const seasonMinutesByPlayer = matches ? computeSeasonMinutesByPlayer(matches) : {};
  const withStats = players.map((p) => {
    const matchesPlayed = matches
      ? matches.filter((m) => !m.scheduled && (m.onPitch.includes(p.id) || m.bench.includes(p.id))).length
      : 0;
    return {
      p,
      s: computePlayerStats(p.id, events),
      matchesPlayed,
      seasonMinutes: seasonMinutesByPlayer[p.id] || 0,
    };
  });

  function rowsFor(pick, format) {
    return withStats
      .map(({ p, s }) => {
        const raw = pick(s) || 0;
        return { label: p.name, raw, display: format ? format(raw) : String(raw) };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  // Como rowsFor, pero además añade debajo del porcentaje el número real de aciertos sobre el total
  function rowsForPct(pctPick, wonPick, totalPick) {
    return withStats
      .map(({ p, s }) => {
        const raw = pctPick(s) || 0;
        const won = wonPick(s) || 0;
        const total = totalPick(s) || 0;
        return { label: p.name, raw, display: `${raw}%`, sub: total > 0 ? `${won} de ${total}` : null };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  // Media por partido jugado (en vez del total), con el total real debajo
  function rowsForAvg(pick) {
    return withStats
      .map(({ p, s, matchesPlayed }) => {
        const total = pick(s) || 0;
        // Sin lista de partidos (p.ej. gráficos de un solo partido) no hay media que calcular: se muestra el total
        if (!matches) {
          return { label: p.name, raw: total, display: String(total) };
        }
        const raw = matchesPlayed > 0 ? Math.round((total / matchesPlayed) * 10) / 10 : 0;
        return {
          label: p.name,
          raw,
          display: raw.toFixed(1),
          sub: matchesPlayed > 0 ? `${total} en ${matchesPlayed} partido${matchesPlayed === 1 ? "" : "s"}` : null,
        };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  const minutesRows = matches
    ? withStats
        .map(({ p, seasonMinutes }) => ({ label: p.name, raw: seasonMinutes, display: `${seasonMinutes}'` }))
        .filter((r) => r.raw > 0)
        .sort((a, b) => b.raw - a.raw)
    : [];

  const charts = [
    { title: "Minutos jugados (temporada)", color: "var(--amber)", rows: minutesRows },
    { title: "Goles", color: "var(--turf)", rows: rowsFor((s) => s.goles) },
    { title: "Asistencias", color: "var(--turf)", rows: rowsFor((s) => s.asistencias) },
    {
      title: "Duelos ganados",
      color: "var(--cielo)",
      rows: rowsForPct((s) => s.duelosPct, (s) => s.duelosGanados, (s) => s.duelosTotales),
    },
    {
      title: "Regates acertados",
      color: "var(--cielo)",
      rows: rowsForPct((s) => s.regatesPct, (s) => s.regatesOk, (s) => s.regatesTotales),
    },
    {
      title: "Despejes",
      color: "var(--cielo)",
      rows: rowsForPct((s) => s.despejesPct, (s) => s.despejes, (s) => s.despejesTotales),
    },
    { title: "Recuperaciones por partido", color: "var(--cielo)", rows: rowsForAvg((s) => s.robos) },
    { title: "Balones perdidos por partido", color: "var(--crimson)", rows: rowsForAvg((s) => s.perdidas) },
    { title: "Paradas (portero)", color: "var(--violet)", rows: rowsFor((s) => s.paradas) },
    { title: "Goles encajados (portero)", color: "var(--crimson)", rows: rowsFor((s) => s.golesEncajados) },
  ].filter((c) => c.rows.length > 0);

  const hasCards = withStats.some(({ s }) => s.amarillas > 0 || s.rojas > 0);

  if (charts.length === 0 && !hasCards) {
    return (
      <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
        Aún no hay suficientes eventos registrados para mostrar gráficos.
      </div>
    );
  }

  return (
    <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
      <CardsChart withStats={withStats} />
      {charts.map((c) => (
        <PlayerBarChart key={c.title} title={c.title} color={c.color} rows={c.rows} />
      ))}
    </div>
  );
}

/* ---------------------------------------------------------
   Tabla de estadísticas de temporada por jugador: buscador, pestañas
   por bloque de columnas y cabeceras que ordenan al tocarlas.

const SEASON_TABLE_BASE_COLUMNS = [
  { key: "number", label: "#", numeric: true },
  { key: "name", label: "Jugador", numeric: false },
  { key: "position", label: "Pos.", numeric: false },

// `kind` indica cómo se muestra la columna: "avg" = media por partido jugado (con un decimal,
// cabecera con "(prom.)"), "pct" = porcentaje de acierto (con "%", cabecera empieza por "%").
// Sin `kind` = total acumulado — goles, asistencias y tarjetas siempre son totales.
const SEASON_TABLE_COLUMN_GROUPS = {
  general: [
    { key: "matchesPlayed", label: "Partidos", numeric: true },
    { key: "minutes", label: "Minutos", numeric: true },
    { key: "goles", label: "Goles", numeric: true },
    { key: "asistencias", label: "Asistencias", numeric: true },
  ],
  ataque: [
    { key: "tirosPuerta", label: "% Remates a puerta", numeric: true, kind: "pct" },
    { key: "paseClave", label: "Pases clave", numeric: true, kind: "avg" },
    { key: "regates", label: "% Regates", numeric: true, kind: "pct" },
  ],
  defensa: [
    { key: "duelosGanados", label: "% Duelos ganados", numeric: true, kind: "pct" },
    { key: "despejes", label: "% Despejes", numeric: true, kind: "pct" },
    { key: "robos", label: "Recuperaciones", numeric: true, kind: "avg" },
  ],
  disciplina: [
    { key: "faltasCometidas", label: "Faltas cometidas", numeric: true, kind: "avg" },
    { key: "amarillas", label: "Amarillas", numeric: true },
    { key: "rojas", label: "Rojas", numeric: true },
  ],
};
const SEASON_TABLE_TABS = [
  { id: "general", label: "General" },
  { id: "ataque", label: "Ataque" },

function SeasonPlayerTable({ squad, matches }) {
  const [search, setSearch] = useState("");
  const [tab, setTab] = useState("general");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");

  const played = matches.filter((m) => !m.scheduled);
  const allSeasonEvents = played.flatMap((m) => m.events);
  const minutesByPlayer = computeSeasonMinutesByPlayer(matches);
  const highlights = computeSeasonHighlights(matches, squad);
  const ratingConfig = React.useContext(RatingConfigContext);
  const seasonRatings = computeSeasonRatings(matches, squad, ratingConfig);

  const rows = squad.map((p) => {
    const s = computePlayerStats(p.id, allSeasonEvents);
    const matchesPlayed = played.filter((m) => m.onPitch.includes(p.id) || m.bench.includes(p.id)).length;
    // Media por partido jugado: total del evento entre partidos jugados por ese jugador.
    const avgOf = (total) => (matchesPlayed > 0 ? total / matchesPlayed : 0);
    return {
      id: p.id,
      number: Number(p.number) || 0,
      name: p.name,
      position: p.position || null,
      matchesPlayed,
      minutes: minutesByPlayer[p.id] || 0,
      goles: s.goles,
      asistencias: s.asistencias,
      // Porcentajes de acierto (null si no hay intentos): remates a puerta / remates totales,
      // regates completados / regates totales, duelos ganados / duelos totales (normales + aéreos),
      // despejes / (despejes + despejes fallados).
      tirosPuerta: s.tirosPuertaPct,
      paseClave: avgOf(s.paseClave),
      regates: s.regatesPct,
      duelosGanados: s.duelosPct,
      despejes: s.despejesPct,
      robos: avgOf(s.robos),
      faltasCometidas: avgOf(s.faltasCometidas),
      amarillas: s.amarillas,
      rojas: s.rojas,
      // Nota media de temporada (null si no ha jugado ningún partido); aún sin columna propia.
      rating: seasonRatings[p.id] ? seasonRatings[p.id].avg : null,
    };
  });

  const filtered = rows.filter((r) => r.name.toLowerCase().includes(search.trim().toLowerCase()));
  const columns = [...SEASON_TABLE_BASE_COLUMNS, ...SEASON_TABLE_COLUMN_GROUPS[tab]];

  function handleSort(col) {
    if (sortKey === col.key) {
      setSortDir((d) => (d === "asc" ? "desc" : "asc"));
    } else {
      setSortKey(col.key);
      setSortDir(col.numeric ? "desc" : "asc");
    }
  }

  function changeTab(id) {
    setTab(id);
    setSortKey(null);
  }

  const sorted = [...filtered].sort((r1, r2) => {
    if (!sortKey) return r1.number - r2.number;
    const col = columns.find((c) => c.key === sortKey);
    const numeric = col ? col.numeric : true;
    const v1 = r1[sortKey];
    const v2 = r2[sortKey];
    let cmp;
    if (v1 == null && v2 == null) cmp = 0;
    else if (v1 == null) cmp = 1;
    else if (v2 == null) cmp = -1;
    else if (numeric) cmp = v1 - v2;
    else cmp = String(v1).localeCompare(String(v2), "es");
    return sortDir === "asc" ? cmp : -cmp;
  });

  return (
    <div className="mb-4">
      <div className="grid grid-cols-3 gap-2 mb-4">
        <SeasonLeaderCard label="Máximo goleador" leader={highlights.topScorer} unit="goles" />
        <SeasonLeaderCard label="Más asistencias" leader={highlights.topAssists} unit="asist." />
        <SeasonLeaderCard label="Más minutos jugados" leader={highlights.mostMinutes} unit="min." />
      </div>

      <input
        value={search}
        onChange={(e) => setSearch(e.target.value)}
        placeholder="Buscar jugador…"
        className="mp-input px-3 py-2 w-full mb-3"
      />

      <div className="flex gap-2 mb-3 flex-wrap">
        {SEASON_TABLE_TABS.map((t) => (
          <button
            key={t.id}
            onClick={() => changeTab(t.id)}
            className="mp-btn px-3 py-1.5 text-sm flex-1"
            style={tab === t.id ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
          >
            {t.label}
          </button>
        ))}
      </div>

      {sorted.length === 0 ? (
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          {squad.length === 0
            ? "Aún no hay jugadores en la plantilla."
            : `Ningún jugador coincide con "${search}".`}
        </div>
      ) : (
        <div className="mp-scroll overflow-x-auto">
          <table className="text-sm w-full" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr>
                {columns.map((col) => (
                  <th
                    key={col.key}
                    onClick={() => handleSort(col)}
                    className={`p-2 whitespace-nowrap select-none cursor-pointer ${
                      col.key === "name" ? "text-left" : "text-center"
                    }`}
                    style={{ color: sortKey === col.key ? "var(--chalk)" : "var(--chalk-dim)" }}
                  >
                    {col.label}
                    {col.kind === "avg" && (
                      <span className="text-[9px] font-normal ml-0.5" style={{ color: "var(--chalk-dim)" }}>
                        (prom.)
                      </span>
                    )}
                    {sortKey === col.key && <span className="ml-1">{sortDir === "asc" ? "▲" : "▼"}</span>}
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {sorted.map((r) => (
                <tr key={r.id} className="mp-card">
                  <td className="p-2 text-center">{r.number}</td>
                  <td className="p-2 whitespace-nowrap">{r.name}</td>
                  <td className="p-2 text-center">{r.position || "—"}</td>
                  {SEASON_TABLE_COLUMN_GROUPS[tab].map((col) => (
                    <td key={col.key} className="p-2 text-center">
                      {col.kind === "avg"
                        ? (r[col.key] || 0).toFixed(1)
                        : col.kind === "pct"
                        ? r[col.key] == null
                          ? "—"
                          : `${r[col.key]}%`
                        : r[col.key] || 0}
                    </td>
                  ))}
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function clampPitchCoord(v, min, max) {
  return Math.min(max, Math.max(min, v));
}

/* ---------------------------------------------------------
   Formación de una jugada de balón parado: define posiciones fijas
   en el campo (marcadores genéricos, sin jugador). Qué jugador ocupa cada
   una se decide en cada partido, en Campo → Balón parado (LiveSetPieceBoard).
--------------------------------------------------------- */
function SetPieceFormationEditor({ slots, ball, onSave }) {
  const [selected, setSelected] = useState(null); // { type: "slot", id } | { type: "ball" } | null
  const pitchRef = useRef(null);

  function coordsFromEvent(e) {
    const rect = pitchRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    return { x: clampPitchCoord(x, 3, 97), y: clampPitchCoord(y, 3, 94) };
  }

  function addSlot() {
    const newSlot = { id: genId(), x: 50, y: 50 };
    onSave({ slots: [...slots, newSlot], ball });
    setSelected({ type: "slot", id: newSlot.id });
  }

  function removeSlot(id) {
    onSave({ slots: slots.filter((s) => s.id !== id), ball });
    setSelected(null);
  }

  function moveSlot(id, coords) {
    onSave({ slots: slots.map((s) => (s.id === id ? { ...s, ...coords } : s)), ball });
  }

  function addBall() {
    onSave({ slots, ball: { x: 50, y: 30 } });
    setSelected({ type: "ball" });
  }

  function moveBall(coords) {
    onSave({ slots, ball: coords });
  }

  function removeBall() {
    onSave({ slots, ball: null });
    setSelected(null);
  }

  function handlePitchClick(e) {
    if (!selected || !pitchRef.current) return;
    const coords = coordsFromEvent(e);
    if (selected.type === "slot") moveSlot(selected.id, coords);
    else moveBall(coords);
    setSelected(null);
  }

  return (
    <div>
      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        {selected
          ? `Toca el campo para colocar ${selected.type === "ball" ? "el balón" : "esta posición"}`
          : "Toca una posición o el balón y luego el campo para moverlo"}
      </div>

      <MiniPitch pitchRef={pitchRef} onClick={handlePitchClick}>
        {slots.map((slot) => {
          const isSelected = selected && selected.type === "slot" && selected.id === slot.id;
          return (
            <button
              key={slot.id}
              onClick={(e) => {
                e.stopPropagation();
                setSelected(isSelected ? null : { type: "slot", id: slot.id });
              }}
              className={`mp-shirt w-10 h-10 ${isSelected ? "selected" : ""}`}
              style={{
                position: "absolute",
                left: `${slot.x}%`,
                top: `${slot.y}%`,
                transform: "translate(-50%, -50%)",
              }}
            />
          );
        })}

        {ball && (
          <button
            onClick={(e) => {
              e.stopPropagation();
              setSelected(selected && selected.type === "ball" ? null : { type: "ball" });
            }}
            className={`mp-shirt w-8 h-8 text-base ${selected && selected.type === "ball" ? "selected" : ""}`}
            style={{
              position: "absolute",
              left: `${ball.x}%`,
              top: `${ball.y}%`,
              transform: "translate(-50%, -50%)",
              background: selected && selected.type === "ball" ? undefined : "#F4F1E8",
            }}
          >
            ⚽
          </button>
        )}
      </MiniPitch>

      {selected && selected.type === "slot" && (
        <button
          onClick={() => removeSlot(selected.id)}
          className="mp-btn mp-btn-outline w-full py-2 text-xs mb-3"
          style={{ color: "var(--crimson)" }}
        >
          Eliminar esta posición
        </button>
      )}
      {selected && selected.type === "ball" && (
        <button
          onClick={removeBall}
          className="mp-btn mp-btn-outline w-full py-2 text-xs mb-3"
          style={{ color: "var(--crimson)" }}
        >
          Quitar el balón del campo
        </button>
      )}

      <div className="flex gap-2">
        <button onClick={addSlot} className="mp-btn mp-btn-primary px-3 py-2 text-sm flex-1">
          + Añadir posición
        </button>
        {!ball && (
          <button onClick={addBall} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
            ⚽ Añadir balón
          </button>
        )}
      </div>
      <div className="text-xs mt-2" style={{ color: "var(--chalk-dim)" }}>
        {slots.length} {slots.length === 1 ? "posición" : "posiciones"} fija{slots.length === 1 ? "" : "s"}. En cada
        partido, desde Campo → Balón parado, eliges qué jugador ocupa cada una.
      </div>
    </div>
  );
}

const SET_PIECE_SIDES = [
  { id: "favor", label: "A favor" },
  { id: "contra", label: "En contra" },
];
// `favorOnly`: solo existe la variante a favor (no se diseñan saques de banda defensivos)
const SET_PIECE_TYPES = [
  { id: "corner", label: "Córners" },
  { id: "falta", label: "Faltas" },
  { id: "banda", label: "Saque de banda", favorOnly: true },
];
const isFavorOnlyType = (typeId) => !!(SET_PIECE_TYPES.find((t) => t.id === typeId) || {}).favorOnly;

/* ---------------------------------------------------------
   Campo → Balón parado: se elige una jugada ya diseñada (misma distribución de
   círculos) y se asigna a cada círculo un jugador de los que están en el campo en
   este partido. Se guarda en match.setPieceAssignments[categoría][jugada] = { slotId: playerId }.
--------------------------------------------------------- */
function LiveSetPieceBoard({ match, squad, setPiecePositions, playerById, onUpdate }) {
  const [side, setSide] = useState("favor");
  const [type, setType] = useState("corner");
  const effectiveSide = isFavorOnlyType(type) ? "favor" : side;
  const category = `${effectiveSide}_${type}`;
  const plays = Array.isArray(setPiecePositions[category]) ? setPiecePositions[category] : [];
  const [playId, setPlayId] = useState(null);
  const [selectedSlotId, setSelectedSlotId] = useState(null);
  const play = plays.find((pl) => pl.id === playId) || plays[0] || null;

  // Disponibles: los que están ahora en el campo (titulares que siguen + suplentes que han
  // entrado). Los desconvocados nunca están en el campo, así que quedan fuera.
  const available = (match.onPitch || [])
    .filter((id) => squad.some((p) => p.id === id))
    .sort((a, b) => Number(playerById(a).number) - Number(playerById(b).number));

  const assignments =
    (play && match.setPieceAssignments && match.setPieceAssignments[category] && match.setPieceAssignments[category][play.id]) ||
    {};

  function saveAssignments(next) {
    onUpdate(
      {
        ...match,
        setPieceAssignments: {
          ...(match.setPieceAssignments || {}),
          [category]: { ...((match.setPieceAssignments || {})[category] || {}), [play.id]: next },
        },
      },
      true
    );
  }

  function assign(slotId, playerId) {
    const next = { ...assignments };
    // Un jugador solo ocupa un círculo: si ya estaba en otro, lo libera
    Object.keys(next).forEach((sId) => {
      if (next[sId] === playerId) delete next[sId];
    });
    next[slotId] = playerId;
    saveAssignments(next);
    setSelectedSlotId(null);
  }

  function clearSlot(slotId) {
    const next = { ...assignments };
    delete next[slotId];
    saveAssignments(next);
    setSelectedSlotId(null);
  }

  function changeCategory(nextSide, nextType) {
    setSide(nextSide);
    setType(nextType);
    setPlayId(null);
    setSelectedSlotId(null);
  }

  const chip = (active, label, onClick, disabled) => (
    <button
      key={label}
      onClick={onClick}
      disabled={disabled}
      className="mp-btn px-3 py-1.5 text-sm flex-1 disabled:opacity-40"
      style={active ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
    >
      {label}
    </button>
  );

  return (
    <div className="mp-card p-3 mt-4">
      <div className="text-sm font-semibold mb-2">Balón parado</div>
      <div className="flex gap-2 mb-2">
        {SET_PIECE_SIDES.map((sd) =>
          chip(
            effectiveSide === sd.id,
            sd.label,
            () => changeCategory(sd.id, type),
            sd.id !== "favor" && isFavorOnlyType(type)
          )
        )}
      </div>
      <div className="flex gap-2 mb-3">
        {SET_PIECE_TYPES.map((t) => chip(type === t.id, t.label, () => changeCategory(side, t.id)))}
      </div>

      {plays.length === 0 ? (
        <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>
          No hay jugadas diseñadas de este tipo. Créalas en Stats → Balón parado → Posiciones.
        </div>
      ) : (
        <React.Fragment>
          <div className="flex flex-wrap gap-2 mb-3">
            {plays.map((pl) => (
              <button
                key={pl.id}
                onClick={() => {
                  setPlayId(pl.id);
                  setSelectedSlotId(null);
                }}
                className="mp-btn px-3 py-1.5 text-sm"
                style={play && play.id === pl.id ? { background: "var(--cielo)", color: "#0F1B14", border: "none" } : {}}
              >
                {pl.name}
              </button>
            ))}
          </div>

          {(play.slots || []).length === 0 ? (
            <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>
              Esta jugada aún no tiene posiciones colocadas.
            </div>
          ) : (
            <React.Fragment>
              <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
                {selectedSlotId ? "Elige el jugador para este círculo" : "Toca un círculo para asignarle un jugador"}
              </div>
              <MiniPitch>
                {play.slots.map((slot) => {
                  const occupantId = assignments[slot.id];
                  const occupant = occupantId && squad.some((p) => p.id === occupantId) ? playerById(occupantId) : null;
                  const isSelected = selectedSlotId === slot.id;
                  return (
                    <div
                      key={slot.id}
                      className="flex flex-col items-center"
                      style={{
                        position: "absolute",
                        left: `${slot.x}%`,
                        top: `${slot.y}%`,
                        transform: "translate(-50%, -20px)",
                      }}
                    >
                      <button
                        onClick={(e) => {
                          e.stopPropagation();
                          setSelectedSlotId(isSelected ? null : slot.id);
                        }}
                        className={`mp-shirt w-10 h-10 text-sm font-semibold ${isSelected ? "selected" : ""}`}
                        style={{ borderStyle: occupant ? "solid" : "dashed", opacity: occupant ? 1 : 0.65 }}
                      >
                        {occupant ? occupant.number : ""}
                      </button>
                      {occupant && (
                        <span
                          className="text-[10px] font-semibold mt-0.5 px-1 rounded whitespace-nowrap"
                          style={{ background: "rgba(0,0,0,0.55)", color: "#fff" }}
                        >
                          {occupant.name.split(" ")[0]}
                        </span>
                      )}
                    </div>
                  );
                })}
                {play.ball && (
                  <div
                    className="mp-shirt w-8 h-8 text-base"
                    style={{
                      position: "absolute",
                      left: `${play.ball.x}%`,
                      top: `${play.ball.y}%`,
                      transform: "translate(-50%, -50%)",
                      background: "#F4F1E8",
                    }}
                  >
                    ⚽
                  </div>
                )}
              </MiniPitch>

              {selectedSlotId && (
                <div className="mp-card p-3">
                  <div className="flex flex-wrap gap-2 mb-2">
                    {available.map((id) => {
                      const p = playerById(id);
                      const inSlot = Object.keys(assignments).find((sId) => assignments[sId] === id);
                      const here = inSlot === selectedSlotId;
                      return (
                        <button
                          key={id}
                          onClick={() => assign(selectedSlotId, id)}
                          className="mp-btn px-3 py-1.5 text-sm"
                          style={
                            here
                              ? { background: "var(--turf)", color: "#0F1B14", border: "none" }
                              : inSlot
                              ? { opacity: 0.55 }
                              : {}
                          }
                        >
                          {p.number} · {p.name}
                        </button>
                      );
                    })}
                    {available.length === 0 && (
                      <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>No hay jugadores en el campo.</span>
                    )}
                  </div>
                  <div className="flex gap-3">
                    {assignments[selectedSlotId] && (
                      <button onClick={() => clearSlot(selectedSlotId)} className="text-xs" style={{ color: "var(--crimson)" }}>
                        Dejar vacío
                      </button>
                    )}
                    <button onClick={() => setSelectedSlotId(null)} className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                      Cancelar
                    </button>
                  </div>
                </div>
              )}
            </React.Fragment>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Jugadas de una categoría de balón parado (p.ej. córners a favor):
   varias jugadas con nombre propio, cada una con su propio medio campo
--------------------------------------------------------- */
function SetPieceCategoryEditor({ plays, onSave }) {
  const [activePlayId, setActivePlayId] = useState(plays[0] ? plays[0].id : null);

  const activePlay = plays.find((pl) => pl.id === activePlayId) || null;

  function addPlay() {
    const newPlay = { id: genId(), name: `Jugada ${plays.length + 1}`, slots: [], ball: null };
    onSave([...plays, newPlay]);
    setActivePlayId(newPlay.id);
  }

  function renamePlay(id, name) {
    onSave(plays.map((pl) => (pl.id === id ? { ...pl, name } : pl)));
  }

  function removePlay(id) {
    if (!window.confirm("¿Eliminar esta jugada?")) return;
    const updated = plays.filter((pl) => pl.id !== id);
    onSave(updated);
    setActivePlayId(updated[0] ? updated[0].id : null);
  }

  function saveFormation(id, next) {
    onSave(plays.map((pl) => (pl.id === id ? { ...pl, slots: next.slots, ball: next.ball } : pl)));
  }

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-3">
        {plays.map((pl) => (
          <button
            key={pl.id}
            onClick={() => setActivePlayId(pl.id)}
            className="mp-btn px-3 py-2 text-sm"
            style={activePlayId === pl.id ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
          >
            {pl.name}
          </button>
        ))}
        <button onClick={addPlay} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          + Nueva jugada
        </button>
      </div>

      {!activePlay ? (
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          Añade una jugada para empezar a definir sus posiciones fijas.
        </div>
      ) : (
        <React.Fragment>
          <div className="mp-card p-3 mb-3 flex items-end gap-2">
            <div className="flex-1">
              <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Nombre de la jugada</label>
              <input
                value={activePlay.name}
                onChange={(e) => renamePlay(activePlay.id, e.target.value)}
                className="mp-input px-3 py-2 w-full mt-1"
              />
            </div>
            <button
              onClick={() => removePlay(activePlay.id)}
              className="mp-btn mp-btn-outline px-3 py-2 text-xs shrink-0"
              style={{ color: "var(--crimson)" }}
            >
              Eliminar
            </button>
          </div>

          <SetPieceFormationEditor
            key={activePlay.id}
            slots={activePlay.slots || []}
            ball={activePlay.ball || null}
            onSave={(next) => saveFormation(activePlay.id, next)}
          />
        </React.Fragment>
      )}
    </div>
  );
}
