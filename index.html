          </button>
          {showTimeline && (
            <div className="flex flex-col gap-2 mt-2">
              {timeline.length === 0 && (
                <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>Aún no hay eventos registrados.</div>
              )}
              {timeline.map((t) =>
                t.kind === "event" ? (
                  <div key={t.id} className={`mp-card ${eventChipCls(t.type)} p-2.5 flex items-center justify-between`}>
                    <span className="text-sm">
                      <span style={{ color: "var(--chalk-dim)" }}>{t.minute}' · </span>
                      #{t.playerNumber} {t.playerName} — {EVENT_LABEL[t.type]}
                      {eventDetailLabel(t) && ` (${eventDetailLabel(t)})`}
                    </span>
                    <button onClick={() => removeEvent(t.id)} className="text-xs" style={{ color: "var(--crimson)" }}>
                      Deshacer
                    </button>
                  </div>
                ) : (
                  <div key={t.id} className="mp-card chip-cielo p-2.5 flex items-center justify-between">
                    <span className="text-sm">
                      <span style={{ color: "var(--chalk-dim)" }}>{t.minute}' · </span>
                      Cambio: sale #{t.outNumber} {t.outName}, entra #{t.inNumber} {t.inName}
                    </span>
                    <button onClick={() => removeSub(t.id)} className="text-xs" style={{ color: "var(--crimson)" }}>
                      Deshacer
                    </button>
                  </div>
                )
              )}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Arrastrar fichas en las pizarras: si el dedo se mueve más de unos píxeles es un arrastre
   (onDrop con la posición en % del contenedor y si se soltó dentro), y si no, un toque
   (onTap, para seleccionar). Lo usan la Pizarra del partido y el editor de balón parado.
--------------------------------------------------------- */
const DRAG_THRESHOLD_PX = 6;

function useTokenDrag(containerRef, { onTap, onDrop, enabled = true }) {
  const [drag, setDrag] = useState(null); // { id, left, top, clientX, clientY }
  const startRef = useRef(null);

  function toPct(e) {
    const r = containerRef.current.getBoundingClientRect();
    return { left: ((e.clientX - r.left) / r.width) * 100, top: ((e.clientY - r.top) / r.height) * 100 };
  }

  function bind(id) {
    return {
      onPointerDown: (e) => {
        if (!enabled || !containerRef.current) return;
        e.stopPropagation();
        try {
          e.currentTarget.setPointerCapture(e.pointerId);
        } catch (err) {
          /* sin captura: el arrastre sigue funcionando dentro del elemento */
        }
        startRef.current = { id, x: e.clientX, y: e.clientY, moved: false };
      },
      onPointerMove: (e) => {
        const st = startRef.current;
        if (!st || st.id !== id) return;
        if (!st.moved && Math.hypot(e.clientX - st.x, e.clientY - st.y) < DRAG_THRESHOLD_PX) return;
        st.moved = true;
        setDrag({ id, ...toPct(e), clientX: e.clientX, clientY: e.clientY });
      },
      onPointerUp: (e) => {
        const st = startRef.current;
        startRef.current = null;
        if (!st || st.id !== id) return;
        setDrag(null);
        if (st.moved) {
          const p = toPct(e);
          onDrop(id, p, p.left >= 0 && p.left <= 100 && p.top >= 0 && p.top <= 100);
        } else if (onTap) {
          onTap(id);
        }
      },
      onPointerCancel: () => {
        startRef.current = null;
        setDrag(null);
      },
      // El toque ya se ha gestionado en onPointerUp: que el click no llegue al campo
      onClick: (e) => e.stopPropagation(),
    };
  }

  return { drag, bind };
}

/* ---------------------------------------------------------
   Formación 1-3-5-2: huecos fijos en el campo (coordenadas 0..100, igual que
   las posiciones que ya se guardan al tocar el campo). x = ancho del campo
   (banda a banda), y = profundidad (100 = portería propia, 0 = ataque).
--------------------------------------------------------- */
const FORMATION_1_3_5_2 = [
  { code: "PT", x: 50, y: 92 },
  { code: "DFI", x: 25, y: 76 },
  { code: "DFC", x: 50, y: 76 },
  { code: "DFD", x: 75, y: 76 },
  { code: "CAI", x: 12, y: 60 },
  { code: "CAD", x: 88, y: 60 },
  { code: "MC", x: 38, y: 46 },
  { code: "MC", x: 62, y: 46 },
  { code: "MCO", x: 50, y: 30 },
  { code: "DC", x: 38, y: 12 },
  { code: "DC", x: 62, y: 12 },
];

// Formaciones habituales del rival: jugadores por línea, de la defensa al ataque (más el portero).
// Solo son una referencia táctica: círculos rojos sin nombre en la mitad derecha del campo.
const RIVAL_FORMATIONS = [
  { id: "1-4-4-2", lines: [4, 4, 2] },
  { id: "1-4-3-3", lines: [4, 3, 3] },
  { id: "1-4-2-3-1", lines: [4, 2, 3, 1] },
  { id: "1-4-1-4-1", lines: [4, 1, 4, 1] },
  { id: "1-4-5-1", lines: [4, 5, 1] },
  { id: "1-4-4-1-1", lines: [4, 4, 1, 1] },
  { id: "1-3-5-2", lines: [3, 5, 2] },
  { id: "1-3-4-2-1", lines: [3, 4, 2, 1] },
  { id: "1-3-4-3", lines: [3, 4, 3] },
  { id: "1-5-3-2", lines: [5, 3, 2] },
  { id: "1-5-4-1", lines: [5, 4, 1] },
];

// Posiciones en pantalla (en % del campo horizontal: left 0 = nuestra portería, 100 = la suya)
// de los 11 del rival: portero junto a su portería y las líneas repartidas hasta el medio campo,
// en espejo respecto a los nuestros porque atacan hacia la izquierda.
function rivalFormationSpots(formationId) {
  const f = RIVAL_FORMATIONS.find((x) => x.id === formationId);
  if (!f) return [];
  const spots = [{ left: 95, top: 50 }];
  const back = 84;
  const front = 57;
  f.lines.forEach((n, li) => {
    const left = f.lines.length === 1 ? back : back - (li * (back - front)) / (f.lines.length - 1);
    // Cuanto menos jugadores en la línea, más juntos hacia el centro (2 puntas no van pegados a la banda)
    const span = n <= 1 ? 0 : Math.min(76, (n - 1) * 24);
    for (let i = 0; i < n; i++) {
      spots.push({ left, top: n === 1 ? 50 : 50 - span / 2 + (i * span) / (n - 1) });
    }
  });
  return spots;
}

// La misma 1-3-5-2 recogida en nuestra mitad (la izquierda en pantalla), en espejo con la
// formación del rival: portero junto a nuestra portería y las líneas hasta el medio campo.
// Es la colocación inicial de "Colocar automáticamente"; después se mueve cada uno donde se quiera.
function ownHalfSlot(slot) {
  const screenLeft = 5 + ((92 - slot.y) * 38) / 80;
  return { ...slot, y: Math.round((100 - screenLeft) * 10) / 10 };
}

/* ---------------------------------------------------------
   Formaciones propias: las mismas de la lista del rival. Cada línea (de la defensa al
   ataque) lleva el código de posición de cada hueco, de izquierda a derecha, con las
   posiciones que existen en Plantilla. La 1-3-5-2 conserva su dibujo original.
   Formación por defecto: team.defaultFormation (dato del equipo); cada partido puede tener
   la suya puntual en match.formation sin tocar la del equipo.
--------------------------------------------------------- */
const DEFAULT_FORMATION_ID = "1-3-5-2";
const BACK_FOUR = ["DFI", "DFC", "DFC", "DFD"];
const BACK_THREE = ["DFI", "DFC", "DFD"];
const BACK_FIVE = ["CAI", "DFI", "DFC", "DFD", "CAD"];
const TEAM_FORMATION_LINES = {
  "1-4-4-2": [BACK_FOUR, ["CAI", "MC", "MC", "CAD"], ["DC", "DC"]],
  "1-4-3-3": [BACK_FOUR, ["MC", "MCD", "MC"], ["DC", "DC", "DC"]],
  "1-4-2-3-1": [BACK_FOUR, ["MCD", "MCD"], ["MCO", "MCO", "MCO"], ["DC"]],
  "1-4-1-4-1": [BACK_FOUR, ["MCD"], ["CAI", "MCO", "MCO", "CAD"], ["DC"]],
  "1-4-5-1": [BACK_FOUR, ["CAI", "MC", "MC", "MC", "CAD"], ["DC"]],
  "1-4-4-1-1": [BACK_FOUR, ["CAI", "MC", "MC", "CAD"], ["SD"], ["DC"]],
  "1-3-4-3": [BACK_THREE, ["CAI", "MC", "MC", "CAD"], ["DC", "DC", "DC"]],
  // 3 centrales, 2 carrileros, 2 mediocentros, 2 mediocentros ofensivos y 1 delantero
  "1-3-4-2-1": [BACK_THREE, ["CAI", "MC", "MC", "CAD"], ["MCO", "MCO"], ["DC"]],
  "1-5-3-2": [BACK_FIVE, ["MC", "MCO", "MC"], ["DC", "DC"]],
  "1-5-4-1": [BACK_FIVE, ["MC", "MC", "MC", "MC"], ["DC"]],
};

// Huecos a campo completo (mismas coordenadas que FORMATION_1_3_5_2): portero atrás y las
// líneas repartidas en profundidad; en cada línea, los jugadores centrados y más abiertos
// cuantos más son.
function formationSlots(formationId) {
  if (formationId === "1-3-5-2" || !TEAM_FORMATION_LINES[formationId]) return FORMATION_1_3_5_2;
  const lines = TEAM_FORMATION_LINES[formationId];
  const slots = [{ code: "PT", x: 50, y: 92 }];
  lines.forEach((codes, li) => {
    const y = lines.length === 1 ? 76 : 76 - (li * 62) / (lines.length - 1);
    const n = codes.length;
    const span = n <= 1 ? 0 : Math.min(76, (n - 1) * 24);
    codes.forEach((code, i) => {
      slots.push({ code, x: n === 1 ? 50 : 50 - span / 2 + (i * span) / (n - 1), y: Math.round(y * 10) / 10 });
    });
  });
  return slots;
}

// La misma formación recogida en nuestra mitad (colocación inicial de "Colocar automáticamente")
function formationSlotsOwnHalf(formationId) {
  return formationSlots(formationId).map(ownHalfSlot);
}

// Qué tan lejos está una posición de otra: líneas de distancia (al cuadrado, para que sea
// preferible mover a varios jugadores un poco que a uno muy lejos) y cambio de lado.
// Los carrileros van entre la defensa y el medio; un defensa de banda que pasa a central apenas
// cambia de papel (así, en una defensa de 4 el central extra sale de los defensas de banda y
// el carrilero pasa a lateral, en vez de meter al carrilero de central).
const POSITION_DEPTH = { PT: 0, DFI: 1, DFC: 1, DFD: 1, CAI: 1.5, CAD: 1.5, MCD: 2.5, MC: 3, MCO: 4, SD: 4.5, DC: 5 };
const POSITION_SIDE = { DFI: "L", CAI: "L", DFD: "R", CAD: "R" };
const IMPOSSIBLE_COST = 1000;

function positionCost(playerCode, slotCode) {
  if ((playerCode === "PT") !== (slotCode === "PT")) return IMPOSSIBLE_COST; // la portería, solo porteros
  const depth = (POSITION_DEPTH[playerCode] || 0) - (POSITION_DEPTH[slotCode] || 0);
  const a = POSITION_SIDE[playerCode] || "C";
  const b = POSITION_SIDE[slotCode] || "C";
  let side = 0;
  if (a !== b) side = a === "C" || b === "C" ? 1 : 2;
  if (slotCode === "DFC" && (playerCode === "DFI" || playerCode === "DFD")) side = 0.5;
  return 3 * depth * depth + side;
}

// Asignación de coste mínimo (algoritmo húngaro) sobre una matriz cuadrada n×n
function minCostAssignment(cost) {
  const n = cost.length;
  const u = new Array(n + 1).fill(0);
  const v = new Array(n + 1).fill(0);
  const p = new Array(n + 1).fill(0);
  const way = new Array(n + 1).fill(0);
  for (let i = 1; i <= n; i++) {
    p[0] = i;
    let j0 = 0;
    const minv = new Array(n + 1).fill(Infinity);
    const used = new Array(n + 1).fill(false);
    do {
      used[j0] = true;
      const i0 = p[j0];
      let delta = Infinity;
      let j1 = 0;
      for (let j = 1; j <= n; j++) {
        if (used[j]) continue;
        const cur = cost[i0 - 1][j - 1] - u[i0] - v[j];
        if (cur < minv[j]) {
          minv[j] = cur;
          way[j] = j0;
        }
        if (minv[j] < delta) {
          delta = minv[j];
          j1 = j;
        }
      }
      for (let j = 0; j <= n; j++) {
        if (used[j]) {
          u[p[j]] += delta;
          v[j] -= delta;
        } else {
          minv[j] -= delta;
        }
      }
      j0 = j1;
    } while (p[j0] !== 0);
    do {
      const j1 = way[j0];
      p[j0] = p[j1];
      j0 = j1;
    } while (j0);
  }
  const rowToCol = new Array(n).fill(-1);
  for (let j = 1; j <= n; j++) if (p[j]) rowToCol[p[j] - 1] = j - 1;
  return rowToCol;
}

// Reparte a los jugadores (con su posición de Plantilla) en los huecos de una formación
// buscando el reparto que menos los aleja de su posición: si falta un hueco de su posición,
// se recoloca en cadena a los más parecidos (p. ej. un defensa izquierdo pasa a central y un
// carrilero a lateral) antes que mandar a alguien lejos. Devuelve [{ ...hueco, playerId }].
function assignPlayersToSlots(slots, players) {
  const result = slots.map((sl) => ({ ...sl, playerId: null }));
  const withPos = players.filter((p) => p.position);
  const n = Math.max(withPos.length, slots.length);
  if (!n) return result;
  const cost = Array.from({ length: n }, (_, i) =>
    Array.from({ length: n }, (_, j) => (i < withPos.length && j < slots.length ? positionCost(withPos[i].position, slots[j].code) : 0))
  );
  const assignment = minCostAssignment(cost);
  withPos.forEach((p, i) => {
    const j = assignment[i];
    if (j >= 0 && j < slots.length && cost[i][j] < IMPOSSIBLE_COST) result[j].playerId = p.id;
  });
  return result;
}

// Código de posición del hueco de formación más cercano a unas coordenadas del campo:
// se usa para inferir "qué posición pasa a jugar" un jugador cuando se le coloca a mano.
// Se mira la formación activa del partido tanto a campo completo como recogida en nuestra
// mitad, para que retocar a un jugador colocado en nuestra mitad no le cambie la posición.
function nearestPositionCode(x, y, formationId = DEFAULT_FORMATION_ID) {
  let best = null;
  let bestDist = Infinity;
  [...formationSlots(formationId), ...formationSlotsOwnHalf(formationId)].forEach((slot) => {
    const d = (slot.x - x) ** 2 + (slot.y - y) ** 2;
    if (d < bestDist) {
      bestDist = d;
      best = slot.code;
    }
  });
  return best;
}

/* ---------------------------------------------------------
   Campo: colocar a cada jugador en su posición
--------------------------------------------------------- */
function FieldFormation({ match, squad, crests, playerById, onUpdate, defaultFormation = DEFAULT_FORMATION_ID }) {
  const [selectedId, setSelectedId] = useState(null);
  const pitchRef = useRef(null);
  const positions = match.positions || {};
  const centerCrest = useWhiteCrest(crests && crests.own);

  // Lápiz y goma sobre el campo: los trazos se guardan en el partido (coordenadas 0..105 x 0..68)
  const [mode, setMode] = useState("mover");
  const [color, setColor] = useState(PITCH_COLORS[1].value);
  const [thick, setThick] = useState(false);
  const [eraserPos, setEraserPos] = useState(null);
  const [strokes, setStrokes] = useState(match.strokes || []);
  const strokesRef = useRef(strokes);
  const svgRef = useRef(null);
  const drawingRef = useRef(false);
  const erasingRef = useRef(false);
  const dirtyRef = useRef(false);
  useBlockTouchScroll(svgRef, mode !== "mover");

  // Si el dibujo cambia desde otro dispositivo, lo recogemos (salvo si estamos pintando ahora mismo)
  useEffect(() => {
    if (match.strokes && match.strokes !== strokesRef.current && !drawingRef.current && !erasingRef.current) {
      strokesRef.current = match.strokes;
      setStrokes(match.strokes);
    }
  }, [match.strokes]);

  function setStrokesLocal(next) {
    strokesRef.current = next;
    setStrokes(next);
  }

  function commitStrokes(next) {
    setStrokesLocal(next);
    onUpdate({ ...match, strokes: next }, true);
  }

  function toPitchPoint(e) {
    const rect = svgRef.current.getBoundingClientRect();
    return {
      x: Math.round(((e.clientX - rect.left) / rect.width) * 105 * 100) / 100,
      y: Math.round(((e.clientY - rect.top) / rect.height) * 68 * 100) / 100,
    };
  }

  function eraseAt(p) {
    const prev = strokesRef.current;
    const next = prev.filter((s) => !strokeTouches(s, p));
    if (next.length !== prev.length) {
      dirtyRef.current = true;
      setStrokesLocal(next);
    }
  }

  function handleDrawDown(e) {
    e.currentTarget.setPointerCapture(e.pointerId);
    const p = toPitchPoint(e);
    if (mode === "dibujar") {
      drawingRef.current = true;
      setStrokesLocal([...strokesRef.current, { color, width: thick ? 1.1 : 0.5, pts: [[p.x, p.y]] }]);
    } else if (mode === "goma") {
      erasingRef.current = true;
      setEraserPos(p);
      eraseAt(p);
    }
  }

  function handleDrawMove(e) {
    if (mode === "dibujar" && drawingRef.current) {
      const p = toPitchPoint(e);
      const prev = strokesRef.current;
      const last = prev[prev.length - 1];
      setStrokesLocal([...prev.slice(0, -1), { ...last, pts: [...last.pts, [p.x, p.y]] }]);
    } else if (mode === "goma") {
      const p = toPitchPoint(e);
      setEraserPos(p);
      if (erasingRef.current) eraseAt(p);
    }
  }

  function handleDrawUp() {
    if (drawingRef.current || (erasingRef.current && dirtyRef.current)) commitStrokes(strokesRef.current);
    drawingRef.current = false;
    erasingRef.current = false;
    dirtyRef.current = false;
  }

  function changeMode(next) {
    setMode(next);
    setSelectedId(null);
  }

  const modeBtn = (id, label) => (
    <button
      onClick={() => changeMode(id)}
      className="mp-btn px-3 py-2 text-sm"
      style={mode === id ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
    >
      {label}
    </button>
  );

  // Los expulsados (roja en este partido) ya no se colocan ni entran en cambios
  const sentOffIds = new Set((match.events || []).filter((e) => e.type === "roja").map((e) => e.playerId));
  const rosterOnPitch = match.onPitch.filter((id) => squad.some((p) => p.id === id) && !sentOffIds.has(id));
  const rosterBench = match.bench.filter((id) => squad.some((p) => p.id === id) && !sentOffIds.has(id));

  const placedIds = rosterOnPitch.filter((id) => positions[id]);
  const unplacedIds = rosterOnPitch.filter((id) => !positions[id]);
  const selectedIsBench = !!selectedId && rosterBench.includes(selectedId);

  // Añade al histórico del partido el código de posición más cercano a unas coordenadas, con el
  // minuto exacto — pero solo si es distinto del último registrado para ese jugador, para no
  // llenar el histórico de entradas repetidas por pequeños retoques dentro de la misma zona.
  function appendPositionHistory(history, playerId, coords, knownCode) {
    const code = knownCode || nearestPositionCode(coords.x, coords.y, activeFormation);
    const last = [...history].reverse().find((h) => h.playerId === playerId);
    if (last && last.code === code) return history;
    return [
      ...history,
      { id: genId(), playerId, code, half: match.clock.activeHalf, minute: computeMinute(match) },
    ];
  }

  function setPosition(playerId, coords) {
    const nextHistory = appendPositionHistory(match.positionHistory || [], playerId, coords);
    onUpdate(
      { ...match, positions: { ...positions, [playerId]: coords }, positionHistory: nextHistory },
      true
    );
  }

  function clearPosition(playerId) {
    const next = { ...positions };
    delete next[playerId];
    onUpdate({ ...match, positions: next }, true);
  }

  // Formación de este partido: la puntual si se eligió una, si no la del equipo
  const activeFormation = match.formation || defaultFormation;

  // Coloca a los titulares en la formación indicada, en nuestra mitad, según la posición de su
  // ficha de Plantilla (exacta o la más parecida). Los que no encajan se quedan sin colocar.
  // Devuelve los campos del partido que cambian (para combinarlos con otros cambios).
  function placementFor(formationId) {
    const slots = assignPlayersToSlots(formationSlotsOwnHalf(formationId), rosterOnPitch.map((id) => playerById(id)));
    const nextPositions = { ...positions };
    let nextHistory = match.positionHistory || [];
    slots.forEach((sl) => {
      if (!sl.playerId) return;
      const coords = { x: sl.x, y: sl.y };
      nextPositions[sl.playerId] = coords;
      nextHistory = appendPositionHistory(nextHistory, sl.playerId, coords, sl.code);
    });
    return { positions: nextPositions, positionHistory: nextHistory };
  }

  function autoPlaceFormation() {
    if (placedIds.length > 0 && !window.confirm("Esto sustituirá la colocación actual de los jugadores ya puestos en el campo. ¿Continuar?")) {
      return;
    }
    onUpdate({ ...match, ...placementFor(activeFormation) }, true);
  }

  // Formación puntual de este partido ("" = la del equipo). No cambia la formación del equipo.
  // Si ya hay jugadores colocados, se pregunta si recolocarlos en la nueva formación.
  function setMatchFormation(id) {
    const formation = id && id !== defaultFormation ? id : null;
    const target = formation || defaultFormation;
    const replace =
      rosterOnPitch.length > 0 &&
      (placedIds.length === 0 || window.confirm(`¿Recolocar a los jugadores en ${target}?`));
    onUpdate({ ...match, formation, ...(replace ? placementFor(target) : {}) }, true);
  }

  function substitute(outId, inId) {
    const outP = playerById(outId);
    const inP = playerById(inId);
    const half = match.clock.activeHalf;
    const minute = computeMinute(match);
    const newOnPitch = match.onPitch.map((id) => (id === outId ? inId : id));
    const newBench = match.bench.map((id) => (id === inId ? outId : id));
    const subEntry = {
      id: genId(),
      half,
      minute,
      outId: outP.id,
      outName: outP.name,
      outNumber: outP.number,
      inId: inP.id,
      inName: inP.name,
      inNumber: inP.number,
    };
    // El que entra hereda el sitio y la posición exacta del que sale (no se deduce del dibujo)
    onUpdate(
      {
        ...match,
        onPitch: newOnPitch,
        bench: newBench,
        subs: [...match.subs, subEntry],
        ...positionsAfterSub(match, outId, inId, half, minute, squad),
      },
      true
    );
  }

  function handleSelect(id) {
    if (!selectedId) {
      setSelectedId(id);
      return;
    }
    if (selectedId === id) {
      setSelectedId(null);
      return;
    }
    const tappedIsBench = rosterBench.includes(id);
    if (selectedIsBench !== tappedIsBench) {
      const inId = selectedIsBench ? selectedId : id;
      const outId = selectedIsBench ? id : selectedId;
      substitute(outId, inId);
      setSelectedId(null);
    } else {
      setSelectedId(id);
    }
  }

  // Tocar el césped solo quita la selección: los jugadores se mueven arrastrándolos
  function handlePitchClick() {
    if (selectedId) setSelectedId(null);
  }

  // Arrastrar a un jugador nuestro (del campo o de "Sin colocar") y soltarlo en el campo.
  // El campo se dibuja en horizontal (portería propia a la izquierda), pero las posiciones se
  // guardan como siempre (campo vertical, portería propia abajo): x = y_pantalla, y = 100 - x_pantalla.
  // Un toque sin arrastrar selecciona (para hacer un cambio o quitarlo del campo).
  const ownDrag = useTokenDrag(pitchRef, {
    enabled: mode === "mover",
    onTap: (id) => handleSelect(id),
    onDrop: (id, p, inside) => {
      if (!inside) return;
      setPosition(id, {
        x: Math.min(96, Math.max(4, p.top)),
        y: Math.min(96, Math.max(4, 100 - p.left)),
      });
      setSelectedId(null);
    },
  });

  // Rival: al elegir formación se colocan sus 11 en su sitio; después se pueden arrastrar.
  // Se guardan en el partido (rivalPositions, en % del campo en pantalla).
  const rivalBase =
    match.rivalFormation && Array.isArray(match.rivalPositions) && match.rivalPositions.length
      ? match.rivalPositions
      : rivalFormationSpots(match.rivalFormation);
  const [rivalDrag, setRivalDrag] = useState(null); // { index, left, top }
  const rivalSpots = rivalBase.map((spot, i) =>
    rivalDrag && rivalDrag.index === i ? { left: rivalDrag.left, top: rivalDrag.top } : spot
  );

  function setRivalFormation(id) {
    onUpdate({ ...match, rivalFormation: id || null, rivalPositions: id ? rivalFormationSpots(id) : null }, true);
  }

  function rivalPointFromEvent(e) {
    const rect = pitchRef.current.getBoundingClientRect();
    return {
      left: Math.min(97, Math.max(3, ((e.clientX - rect.left) / rect.width) * 100)),
      top: Math.min(96, Math.max(4, ((e.clientY - rect.top) / rect.height) * 100)),
    };
  }

  function handleRivalDown(e, index) {
    if (mode !== "mover" || !pitchRef.current) return;
    e.stopPropagation();
    e.preventDefault();
    try {
      e.currentTarget.setPointerCapture(e.pointerId);
    } catch (err) {
      /* sin captura: el arrastre sigue funcionando dentro del círculo */
    }
    setRivalDrag({ index, ...rivalBase[index] });
  }

  function handleRivalMove(e) {
    if (!rivalDrag) return;
    setRivalDrag({ index: rivalDrag.index, ...rivalPointFromEvent(e) });
  }

  function handleRivalUp() {
    if (!rivalDrag) return;
    const moved = rivalBase[rivalDrag.index];
    if (moved.left !== rivalDrag.left || moved.top !== rivalDrag.top) {
      const next = rivalBase.map((spot, i) => (i === rivalDrag.index ? { left: rivalDrag.left, top: rivalDrag.top } : spot));
      onUpdate({ ...match, rivalPositions: next }, true);
    }
    setRivalDrag(null);
  }

  return (
    <div className="mb-4">
      <div className="flex flex-wrap gap-2 mb-2">
        {rosterOnPitch.length > 0 && (
          <button
            onClick={autoPlaceFormation}
            className="mp-btn mp-btn-outline flex-1 py-2 text-sm"
            style={{ minWidth: 200 }}
          >
            Colocar automáticamente ({activeFormation})
          </button>
        )}
        <label className="mp-btn mp-btn-outline flex-1 flex items-center justify-center gap-2 py-1 text-sm" style={{ minWidth: 200 }}>
          <span className="mp-dot" style={{ background: "var(--turf)" }} />
          <span style={{ color: "var(--chalk-dim)" }}>Nosotros:</span>
          <select
            value={match.formation || ""}
            onChange={(e) => setMatchFormation(e.target.value)}
            className="bg-transparent text-sm font-semibold py-1"
            style={{ color: "var(--chalk)", outline: "none" }}
          >
            <option value="" style={{ color: "#111" }}>{defaultFormation} (la del equipo)</option>
            {RIVAL_FORMATIONS.filter((f) => f.id !== defaultFormation).map((f) => (
              <option key={f.id} value={f.id} style={{ color: "#111" }}>{f.id} (solo este partido)</option>
            ))}
          </select>
        </label>
        <label className="mp-btn mp-btn-outline flex-1 flex items-center justify-center gap-2 py-1 text-sm" style={{ minWidth: 200 }}>
          <span className="mp-dot" style={{ background: "#E53935" }} />
          <span style={{ color: "var(--chalk-dim)" }}>Rival:</span>
          <select
            value={match.rivalFormation || ""}
            onChange={(e) => setRivalFormation(e.target.value)}
            className="bg-transparent text-sm font-semibold py-1"
            style={{ color: "var(--chalk)", outline: "none" }}
          >
            <option value="" style={{ color: "#111" }}>Sin formación</option>
            {RIVAL_FORMATIONS.map((f) => (
              <option key={f.id} value={f.id} style={{ color: "#111" }}>{f.id}</option>
            ))}
          </select>
        </label>
      </div>

      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        {selectedId
          ? selectedIsBench
            ? `Toca al jugador del campo que sale por ${playerById(selectedId).name}`
            : `Toca un suplente para cambiar a ${playerById(selectedId).name}`
          : "Arrastra a los jugadores (tuyos y del rival) para moverlos. Toca uno para hacer un cambio"}
      </div>

      <div
        ref={pitchRef}
        onClick={handlePitchClick}
        className="relative w-full mx-auto mb-3"
        style={{
          aspectRatio: "105 / 68",
          background: "#2E7D32",
          borderRadius: 12,
          border: "2px solid rgba(255,255,255,0.55)",
          overflow: "hidden",
        }}
      >
        {(() => {
          const line = "2px solid rgba(255,255,255,0.55)";
          return (
            <React.Fragment>
              {/* Línea de medio campo y círculo central */}
              <div style={{ position: "absolute", top: 0, bottom: 0, left: "50%", width: 2, marginLeft: -1, background: "rgba(255,255,255,0.55)" }} />
              <div
                style={{
                  position: "absolute",
                  left: "50%",
                  top: "50%",
                  width: "17.4%",
                  aspectRatio: "1 / 1",
                  transform: "translate(-50%, -50%)",
                  borderRadius: "50%",
                  border: line,
                }}
              />
              {/* Áreas grandes y pequeñas de cada portería */}
              {[
                { side: "left", w: "15.7%", h: "59.3%", border: "borderLeft" },
                { side: "right", w: "15.7%", h: "59.3%", border: "borderRight" },
                { side: "left", w: "5.2%", h: "26.9%", border: "borderLeft" },
                { side: "right", w: "5.2%", h: "26.9%", border: "borderRight" },
              ].map((a, i) => (
                <div
                  key={i}
                  style={{
                    position: "absolute",
                    [a.side]: 0,
                    top: "50%",
                    width: a.w,
                    height: a.h,
                    transform: "translateY(-50%)",
                    border: line,
                    [a.border]: "none",
                  }}
                />
              ))}
            </React.Fragment>
          );
        })()}

        {/* Nuestro escudo en blanco en el centro del campo */}
        {centerCrest && (
          <img
            src={centerCrest}
            alt=""
            style={{
              position: "absolute",
              left: "50%",
              top: "50%",
              width: "13.3%",
              aspectRatio: "1 / 1",
              objectFit: "contain",
              transform: "translate(-50%, -50%)",
              opacity: 0.85,
              pointerEvents: "none",
            }}
          />
        )}

        {/* Formación del rival: círculos rojos sin nombre que se arrastran con el dedo. No se
            seleccionan ni entran en los cambios: son solo una referencia táctica */}
        {rivalSpots.map((spot, i) => (
          <div
            key={`rival-${i}`}
            onPointerDown={(e) => handleRivalDown(e, i)}
            onPointerMove={handleRivalMove}
            onPointerUp={handleRivalUp}
            onPointerCancel={handleRivalUp}
            onClick={(e) => e.stopPropagation()}
            style={{
              position: "absolute",
              left: `${spot.left}%`,
              top: `${spot.top}%`,
              width: 26,
              height: 26,
              transform: "translate(-50%, -50%)",
              borderRadius: "50%",
              background: "#E53935",
              border: "2px solid rgba(255,255,255,0.85)",
              boxShadow: rivalDrag && rivalDrag.index === i ? "0 0 0 4px rgba(229,57,53,0.35)" : "0 1px 3px rgba(0,0,0,0.35)",
              touchAction: "none",
              cursor: "grab",
            }}
          />
        ))}

        {placedIds.map((id) => {
          const p = playerById(id);
          const pos = positions[id];
          const selected = selectedId === id;
          const dragging = ownDrag.drag && ownDrag.drag.id === id;
          const left = dragging ? Math.min(97, Math.max(3, ownDrag.drag.left)) : 100 - pos.y;
          const top = dragging ? Math.min(96, Math.max(4, ownDrag.drag.top)) : pos.x;
          return (
            <div
              key={id}
              className="flex flex-col items-center"
              style={{
                position: "absolute",
                left: `${left}%`,
                top: `${top}%`,
                transform: "translate(-50%, -50%)",
                pointerEvents: "none",
                zIndex: dragging ? 5 : undefined,
              }}
            >
              <button
                {...ownDrag.bind(id)}
                className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
                style={{ pointerEvents: "auto", touchAction: "none", cursor: "grab" }}
              >
                {p.number}
              </button>
              <span
                className="text-[9px] font-semibold leading-none whitespace-nowrap px-1 rounded mt-0.5"
                style={{ color: "var(--chalk)", background: "rgba(15,27,20,0.65)" }}
              >
                {p.name.split(" ")[0]}
              </span>
            </div>
          );
        })}

        {/* Dibujo (por encima de las fichas); solo captura el dedo con el lápiz o la goma activos */}
        <svg
          ref={svgRef}
          viewBox="0 0 105 68"
          preserveAspectRatio="none"
          onPointerDown={handleDrawDown}
          onPointerMove={handleDrawMove}
          onPointerUp={handleDrawUp}
          onPointerCancel={handleDrawUp}
          onPointerLeave={() => setEraserPos(null)}
          onClick={(e) => e.stopPropagation()}
          style={{
            position: "absolute",
            inset: 0,
            width: "100%",
            height: "100%",
            pointerEvents: mode === "mover" ? "none" : "auto",
            touchAction: "none",
            userSelect: "none",
            WebkitUserSelect: "none",
            cursor: "crosshair",
          }}
        >
          {strokes.map((s, i) => (
            <path
              key={i}
              d={strokePath(s.pts)}
              fill="none"
              stroke={s.color}
              strokeWidth={s.width}
              strokeLinecap="round"
              strokeLinejoin="round"
            />
          ))}
          {mode === "goma" && eraserPos && (
            <circle
              cx={eraserPos.x}
              cy={eraserPos.y}
              r={ERASER_RADIUS}
              fill="rgba(255,255,255,0.15)"
              stroke="#FFFFFF"
              strokeWidth="0.3"
              strokeDasharray="0.8 0.6"
            />
          )}
        </svg>
      </div>

      {selectedId && !selectedIsBench && (
        <button
          onClick={() => {
            clearPosition(selectedId);
            setSelectedId(null);
          }}
          className="mp-btn mp-btn-outline w-full py-2 text-xs mb-3"
          style={{ color: "var(--crimson)" }}
        >
          Quitar del campo a {playerById(selectedId).name}
        </button>
      )}

      <div className="md:grid md:grid-cols-[1fr_auto] md:gap-4 md:items-start">
      <div>
      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Sin colocar</div>
      <div className="flex flex-wrap gap-2 mb-4">
        {unplacedIds.length === 0 && (
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            Todos los jugadores en el campo están colocados.
          </span>
        )}
        {unplacedIds.map((id) => {
          const p = playerById(id);
          const selected = selectedId === id;
          const dragging = ownDrag.drag && ownDrag.drag.id === id;
          return (
            <button
              key={id}
              {...ownDrag.bind(id)}
              className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
              style={{ touchAction: "none", cursor: "grab", opacity: dragging ? 0.35 : 1 }}
            >
              {p.number}
            </button>
          );
        })}
      </div>
      {/* Ficha que sigue al dedo al arrastrar desde "Sin colocar" hasta el campo */}
      {ownDrag.drag && unplacedIds.includes(ownDrag.drag.id) && (
        <div
          className="mp-shirt w-10 h-10 text-sm font-semibold"
          style={{
            position: "fixed",
            left: ownDrag.drag.clientX,
            top: ownDrag.drag.clientY,
            transform: "translate(-50%, -50%)",
            pointerEvents: "none",
            zIndex: 80,
          }}
        >
          {playerById(ownDrag.drag.id).number}
        </div>
      )}

      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        Banquillo — toca un suplente y luego a quién sustituye
      </div>
      <div className="flex flex-wrap gap-2">
        {rosterBench.length === 0 && (
          <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>No hay suplentes disponibles.</span>
        )}
        {rosterBench.map((id) => {
          const p = playerById(id);
          const selected = selectedId === id;
          return (
            <div key={id} className="flex flex-col items-center gap-1" style={{ width: 56 }}>
              <button
                onClick={() => handleSelect(id)}
                className={`mp-shirt w-10 h-10 text-sm font-semibold ${selected ? "selected" : ""}`}
              >
                {p.number}
              </button>
              <span className="text-[10px] text-center leading-tight" style={{ color: "var(--chalk-dim)" }}>
                {p.name.split(" ")[0]}
              </span>
            </div>
          );
        })}
      </div>
      </div>

      {/* Herramientas de dibujo: en el hueco de abajo a la derecha del campo */}
      <div className="mp-card p-3 mt-4 md:mt-0" style={{ maxWidth: 300 }}>
        <div className="mb-2 text-xs" style={{ color: "var(--chalk-dim)" }}>Dibujar sobre el campo</div>
        <div className="flex flex-wrap gap-2 mb-2">
          {modeBtn("mover", "✋ Mover")}
          {modeBtn("dibujar", "✏️ Lápiz")}
          {modeBtn("goma", "🧽 Goma")}
        </div>
        <div className="flex flex-wrap items-center gap-2 mb-2" style={{ opacity: mode === "dibujar" ? 1 : 0.5 }}>
          {PITCH_COLORS.map((c) => (
            <button
              key={c.id}
              aria-label={`Color ${c.id}`}
              onClick={() => {
                setColor(c.value);
                changeMode("dibujar");
              }}
              style={{
                width: 28,
                height: 28,
                borderRadius: 999,
                background: c.value,
                border: color === c.value ? "3px solid var(--cielo)" : "2px solid rgba(244,241,232,0.4)",
              }}
            />
          ))}
          <button onClick={() => setThick((t) => !t)} className="mp-btn px-2 py-1 text-xs">
            {thick ? "Trazo grueso" : "Trazo fino"}
          </button>
        </div>
        <div className="flex flex-wrap gap-2">
          <button
            onClick={() => commitStrokes(strokes.slice(0, -1))}
            disabled={strokes.length === 0}
            className="mp-btn px-3 py-2 text-sm disabled:opacity-40"
          >
            Deshacer
          </button>
          <button
            onClick={() => commitStrokes([])}
            disabled={strokes.length === 0}
            className="mp-btn px-3 py-2 text-sm disabled:opacity-40"
            style={{ color: "var(--crimson)" }}
          >
            Borrar todo
          </button>
        </div>
      </div>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Eventos de equipo: no se asignan a un jugador (córners, ataques por banda...)
--------------------------------------------------------- */
// En columnas estrechas "+1" y "Deshacer" no caben en una fila: "Deshacer" baja a la siguiente
// (flex-wrap) en lugar de salirse de la tarjeta e invadir la de al lado.
function TeamEventCounter({ label, value, onAdd, onUndo }) {
  return (
    <div className="mp-card p-3 min-w-0 overflow-hidden">
      <div className="text-xs mb-1 truncate" style={{ color: "var(--chalk-dim)" }}>{label}</div>
      <div className="display text-3xl font-semibold leading-none mb-2">{value}</div>
      <div className="flex flex-wrap gap-2">
        <button onClick={onAdd} className="mp-btn mp-btn-primary px-3 py-1.5 text-xs flex-1" style={{ minWidth: "3rem" }}>
          +1
        </button>
        {value > 0 && (
          <button
            onClick={onUndo}
            className="mp-btn mp-btn-outline px-3 py-1.5 text-xs flex-1 whitespace-nowrap"
            style={{ color: "var(--crimson)" }}
          >
            Deshacer
          </button>
        )}
      </div>
    </div>
  );
}

// Mensaje común al registrar algo que ya está apuntado en ese mismo minuto (Repetir partido)
function confirmDuplicateAt(minute) {
  return window.confirm(`Ya existe un evento igual en el minuto ${minute}', ¿quieres añadirlo de todas formas?`);
}

// `at` (opcional) da la parte y el minuto en que se apunta; por defecto, el cronómetro del partido.
// Con `checkDuplicates`, si ya hay algo igual en ese minuto se pregunta antes de añadirlo.
function OpponentChanceMarker({ match, onUpdate, at, checkDuplicates = false }) {
  const opponentChances = match.opponentChances || [];

  function addOpponentChance() {
    const { half, minute } = at ? at() : { half: match.clock.activeHalf, minute: computeMinute(match) };
    if (checkDuplicates && opponentChances.some((e) => e.minute === minute) && !confirmDuplicateAt(minute)) return;
    const entry = { id: genId(), half, minute };
    onUpdate({ ...match, opponentChances: [...opponentChances, entry] }, true);
  }
  function removeOpponentChance(id) {
    onUpdate({ ...match, opponentChances: opponentChances.filter((e) => e.id !== id) }, true);
  }

  return (
    <div className="mp-card p-3 mb-3">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>
        Ocasiones del rival — solo para localizarlas luego en el vídeo, no cuenta en las estadísticas
      </div>
      <button onClick={addOpponentChance} className="mp-btn mp-btn-outline w-full py-2 text-sm mb-2">
        + Marcar ocasión del rival
      </button>
      {opponentChances.length > 0 && (
        <div className="flex flex-wrap gap-2">
          {opponentChances
            .slice()
            .sort((a, b) => b.half - a.half || b.minute - a.minute)
            .map((c) => (
              <span key={c.id} className="mp-card px-2 py-1 text-xs flex items-center gap-2">
                {c.minute}'
                <button onClick={() => removeOpponentChance(c.id)} style={{ color: "var(--crimson)" }}>
                  ×
                </button>
              </span>
            ))}
        </div>
      )}
    </div>
  );
}

function TeamEventsPanel({ match, onUpdate, at, checkDuplicates = false }) {
  const teamEvents = match.teamEvents || [];

  function countOf(typeId) {
    return teamEvents.filter((e) => e.type === typeId).length;
  }
  function addTeamEvent(typeId) {
    const { half, minute } = at ? at() : { half: match.clock.activeHalf, minute: computeMinute(match) };
    if (checkDuplicates && teamEvents.some((e) => e.type === typeId && e.minute === minute) && !confirmDuplicateAt(minute)) return;
    const entry = { id: genId(), type: typeId, half, minute };
    onUpdate({ ...match, teamEvents: [...teamEvents, entry] }, true);
  }
  function undoLastTeamEvent(typeId) {
    const idxFromEnd = [...teamEvents].reverse().findIndex((e) => e.type === typeId);
    if (idxFromEnd === -1) return;
    const idx = teamEvents.length - 1 - idxFromEnd;
    onUpdate({ ...match, teamEvents: [...teamEvents.slice(0, idx), ...teamEvents.slice(idx + 1)] }, true);
  }

  return (
    <div className="mb-4">
      {TEAM_EVENT_SECTIONS.map((section) => (
        <div key={section.id} className="mb-4">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>{section.label}</div>
          <div className="grid grid-cols-2 gap-2">
            {TEAM_EVENT_TYPES.filter((t) => t.section === section.id).map((t) => (
              <TeamEventCounter
                key={t.id}
                label={t.short}
                value={countOf(t.id)}
                onAdd={() => addTeamEvent(t.id)}
                onUndo={() => undoLastTeamEvent(t.id)}
              />
            ))}
          </div>
        </div>
      ))}
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Repetir partido. Con el partido ya finalizado, la misma botonera de eventos del
   directo pero con un cronómetro propio (no toca el del partido) para ir viendo el vídeo:
   cada evento se apunta en el minuto que marque, igual que en directo. Si ya hay uno igual en
   ese minuto, pregunta antes. El cronómetro se recuerda en este dispositivo por partido.
--------------------------------------------------------- */
// Quién estaba en el campo en un momento dado: se deshacen los cambios desde la alineación
// final para sacar el once inicial y se aplican los hechos hasta ese minuto (sin expulsados).
function lineupAtMinute(match, half, minute) {
  const at = (h, m) => h * 1000 + m;
  const subs = (match.subs || []).map((s, i) => ({ ...s, i })).sort((a, b) => at(a.half, a.minute) - at(b.half, b.minute) || a.i - b.i);
  let onPitch = [...(match.onPitch || [])];
  [...subs].reverse().forEach((s) => { onPitch = onPitch.map((x) => (x === s.inId ? s.outId : x)); });
  subs.filter((s) => at(s.half, s.minute) <= at(half, minute)).forEach((s) => {
    onPitch = onPitch.map((x) => (x === s.outId ? s.inId : x));
  });
  const sentOff = new Set(
    (match.events || []).filter((e) => e.type === "roja" && at(e.half, e.minute) <= at(half, minute)).map((e) => e.playerId)
  );
  return onPitch.filter((id) => !sentOff.has(id));
}

function ReplayMatch({ match, squad, crests, onUpdate, onBack }) {
  const L = Number(match.halfLength) || 45;
  const storageKey = `replayClock:${match.id}`;
  const [clock, setClock] = useState(() => {
    try {
      const saved = JSON.parse(localStorage.getItem(storageKey));
      if (saved && (saved.half === 1 || saved.half === 2)) return { half: saved.half, base: Number(saved.base) || 0, running: false, startedAt: null };
    } catch (err) {
      /* sin almacenamiento: se empieza desde 0 */
    }
    return { half: 1, base: 0, running: false, startedAt: null };
  });
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [pendingDetail, setPendingDetail] = useState(null);
  const [editing, setEditing] = useState(null); // { half, min, sec } mientras se escribe el tiempo a mano
  const [, forceTick] = useState(0);

  // Lo que ya estaba apuntado al abrir la pantalla: el resto es lo añadido en esta repetición
  const initialIdsRef = useRef(null);
  if (!initialIdsRef.current) {
    initialIdsRef.current = new Set(
      [...(match.events || []), ...(match.teamEvents || []), ...(match.opponentChances || [])].map((e) => e.id)
    );
  }

  useEffect(() => {
    if (!clock.running) return;
    const interval = setInterval(() => forceTick((t) => t + 1), 1000);
    return () => clearInterval(interval);
  }, [clock.running]);

  function elapsedOf(c) {
    return c.running ? c.base + Math.floor((Date.now() - c.startedAt) / 1000) : c.base;
  }
  const elapsed = elapsedOf(clock);

  // El estado más reciente del cronómetro, para leerlo justo al tocar un botón y al salir
  const clockRef = useRef(clock);
  clockRef.current = clock;

  function rememberClock(c) {
    try {
      localStorage.setItem(storageKey, JSON.stringify({ half: c.half, base: elapsedOf(c) }));
    } catch (err) {
      /* sin almacenamiento: solo se pierde recordar el minuto */
    }
  }
  function saveClock(c) {
    setClock(c);
    rememberClock(c);
  }
  // Al salir se guarda dónde iba, para seguir otro día por el mismo sitio
  // eslint-disable-next-line react-hooks/exhaustive-deps
  useEffect(() => () => rememberClock(clockRef.current), []);

  function toggleRunning() {
    if (clock.running) saveClock({ ...clock, base: elapsed, running: false, startedAt: null });
    else saveClock({ ...clock, running: true, startedAt: Date.now() });
  }
  function shift(delta) {
    const base = Math.max(0, elapsed + delta);
    saveClock({ ...clock, base, startedAt: clock.running ? Date.now() : null });
  }
  function switchHalf() {
    saveClock({ half: clock.half === 1 ? 2 : 1, base: 0, running: false, startedAt: null });
  }
  function startEditing() {
    setEditing({ half: clock.half, min: Math.floor(elapsed / 60), sec: elapsed % 60 });
  }
  function applyEditing() {
    const base = Math.max(0, (Number(editing.min) || 0) * 60 + Math.min(Math.max(Number(editing.sec) || 0, 0), 59));
    saveClock({ half: editing.half, base, running: false, startedAt: null });
    setEditing(null);
  }

  // Mismo cálculo que en directo: el minuto no pasa de la duración de la parte
  function currentAt() {
    const c = clockRef.current;
    const secs = elapsedOf(c);
    const inHalf = Math.min(Math.floor(secs / 60) + 1, L);
    return { half: c.half, seconds: Math.min(secs, L * 60), minute: c.half === 1 ? inHalf : L + inHalf };
  }
  const now = currentAt();

  const playerById = (id) => squad.find((p) => p.id === id) || { id, number: "?", name: "Desconocido" };
  const rosterIds = [...new Set([...(match.onPitch || []), ...(match.bench || [])])].filter((id) => squad.some((p) => p.id === id));
  const byNumber = (a, b) => (Number(playerById(a).number) || 0) - (Number(playerById(b).number) || 0);
  const onPitchNow = lineupAtMinute(match, now.half, now.minute).filter((id) => rosterIds.includes(id));
  const others = rosterIds.filter((id) => !onPitchNow.includes(id)).sort(byNumber);

  function addPlayerEvent(playerId, type, extra = {}) {
    const p = playerById(playerId);
    const { half, seconds, minute } = currentAt();
    const dup = (match.events || []).some((e) => e.playerId === p.id && e.type === type && e.minute === minute);
    if (dup && !confirmDuplicateAt(minute)) return;
    const entry = { id: genId(), half, seconds, minute, playerId: p.id, playerNumber: p.number, playerName: p.name, type, ...extra };
    onUpdate({ ...match, events: [...(match.events || []), entry] }, true);
  }

  function addEvent(typeId) {
    if (!selectedPlayerId) return;
    if (EVENTS_WITH_DETAIL[typeId]) {
      setPendingDetail({ typeId, playerId: selectedPlayerId });
      return;
    }
    addPlayerEvent(selectedPlayerId, typeId);
  }

  function confirmDetail(value) {
    if (!pendingDetail) return;
    const { typeId, playerId } = pendingDetail;
    const meta = EVENTS_WITH_DETAIL[typeId];
    if (meta.field === "__type__") addPlayerEvent(playerId, value);
    else addPlayerEvent(playerId, typeId, { [meta.field]: value });
    setPendingDetail(null);
  }

  const selectedPlayer = selectedPlayerId ? playerById(selectedPlayerId) : null;
  const isGoalkeeperSelected = isGoalkeeper(selectedPlayer);
  const liveEventSections = LIVE_EVENT_SECTIONS.map((section) => ({
    title: section.title,
    events: section.ids.map((id) => EVENT_TYPES.find((ev) => ev.id === id)).filter(Boolean),
  })).filter((section) => section.title !== "Portero" || isGoalkeeperSelected);

  const added = [
    ...(match.events || []).map((e) => ({
      ...e,
      kind: "events",
      cls: eventChipCls(e.type),
      text: `#${e.playerNumber} ${e.playerName} — ${EVENT_LABEL[e.type] || e.type}${eventDetailLabel(e) ? ` (${eventDetailLabel(e)})` : ""}`,
    })),
    ...(match.teamEvents || []).map((e) => ({
      ...e,
      kind: "teamEvents",
      cls: "",
      text: `Equipo — ${(TEAM_EVENT_TYPES.find((t) => t.id === e.type) || {}).label || e.type}`,
    })),
    ...(match.opponentChances || []).map((e) => ({ ...e, kind: "opponentChances", cls: "", text: "Ocasión del rival" })),
  ]
    .filter((e) => !initialIdsRef.current.has(e.id))
    .sort((a, b) => b.half - a.half || b.minute - a.minute || (b.id > a.id ? 1 : -1));

  function removeAdded(kind, id) {
    onUpdate({ ...match, [kind]: (match[kind] || []).filter((e) => e.id !== id) }, true);
  }

  const golesFavor = (match.events || []).filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const golesContra =
    (match.concededSetPieces || []).length + (match.events || []).filter((e) => e.type === "gol_encajado").length;

  function playerRow(id) {
    const p = playerById(id);
    const selected = selectedPlayerId === id;
    return (
      <button
        key={id}
        onClick={() => setSelectedPlayerId(selected ? null : id)}
        className="mp-card flex items-center gap-2 px-2 py-1.5 text-left"
        style={selected ? { borderColor: "var(--cielo)" } : {}}
      >
        <span className={`mp-shirt w-9 h-9 text-sm font-semibold shrink-0 ${selected ? "selected" : ""}`}>{p.number}</span>
        <span className="flex-1 min-w-0 text-sm truncate">{p.name}</span>
      </button>
    );
  }

  return (
    <div className="max-w-6xl mx-auto p-3 pb-8">
      <div className="text-center pt-1 mb-1">
        <div className="text-[10px] uppercase tracking-wide" style={{ color: "var(--chalk-dim)" }}>Resultado</div>
        <ScoreWithCrests match={match} favor={golesFavor} contra={golesContra} crests={crests} />
      </div>

      <div className="flex flex-wrap items-center justify-between gap-2 mb-3 pt-2">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">Volver</button>
          <div>
            <div className="font-semibold leading-tight">Repetir partido · vs {match.opponent}</div>
            <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>{match.date}</div>
          </div>
        </div>

        <div className="mp-card px-4 py-2 flex flex-wrap items-center gap-3">
          <div>
            <div className="text-[10px]" style={{ color: "var(--chalk-dim)" }}>
              {clock.half === 1 ? "1ª parte" : "2ª parte"} · min. {now.minute}'
            </div>
            <div className="display text-2xl font-semibold tabular-nums leading-none">{formatClock(elapsed)}</div>
          </div>
          <div className="flex flex-wrap items-center gap-2">
            <button onClick={toggleRunning} className="mp-btn mp-btn-primary px-3 py-2 text-xs font-semibold">
              {clock.running ? "Pausar" : elapsed > 0 ? "Reanudar" : "Poner en marcha"}
            </button>
            <button onClick={() => shift(-10)} className="mp-btn mp-btn-outline px-2 py-2 text-xs">−10s</button>
            <button onClick={() => shift(10)} className="mp-btn mp-btn-outline px-2 py-2 text-xs">+10s</button>
            <button onClick={() => shift(-60)} className="mp-btn mp-btn-outline px-2 py-2 text-xs">−1'</button>
            <button onClick={() => shift(60)} className="mp-btn mp-btn-outline px-2 py-2 text-xs">+1'</button>
            <button onClick={switchHalf} className="mp-btn mp-btn-outline px-3 py-2 text-xs">
              {clock.half === 1 ? "Ir a 2ª parte" : "Ir a 1ª parte"}
            </button>
            <button onClick={startEditing} className="mp-btn mp-btn-outline px-3 py-2 text-xs">Ajustar tiempo</button>
          </div>
        </div>
      </div>

      {editing && (
        <div className="mp-card p-3 mb-3" style={{ borderColor: "var(--amber)" }}>
          <div className="text-sm mb-2">Tiempo del cronómetro, contado desde el inicio de la parte</div>
          <div className="flex flex-wrap items-center gap-2 mb-2">
            <select
              value={editing.half}
              onChange={(e) => setEditing({ ...editing, half: Number(e.target.value) })}
              className="mp-input px-2 py-2 text-sm"
            >
              <option value={1}>1ª parte</option>
              <option value={2}>2ª parte</option>
            </select>
            <label className="flex items-center gap-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
              Min.
              <input type="number" min={0} value={editing.min}
                onChange={(e) => setEditing({ ...editing, min: e.target.value })} className="mp-input w-20 px-2 py-2 text-sm" />
            </label>
            <label className="flex items-center gap-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
              Seg.
              <input type="number" min={0} max={59} value={editing.sec}
                onChange={(e) => setEditing({ ...editing, sec: e.target.value })} className="mp-input w-20 px-2 py-2 text-sm" />
            </label>
          </div>
          <div className="flex gap-2">
            <button onClick={applyEditing} className="mp-btn mp-btn-primary px-3 py-2 text-sm font-semibold">Aplicar</button>
            <button onClick={() => setEditing(null)} className="mp-btn mp-btn-outline px-3 py-2 text-sm">Cancelar</button>
          </div>
        </div>
      )}

      <OpponentChanceMarker match={match} onUpdate={onUpdate} at={currentAt} checkDuplicates />

      <div className="lg:grid lg:grid-cols-[260px_1fr_280px] lg:gap-4 lg:items-start">
        <div className="mb-4 lg:mb-0">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
            En el campo en el minuto {now.minute}' — toca para seleccionar
          </div>
          <div className="grid grid-cols-2 gap-2 lg:grid-cols-1 lg:gap-1.5">{onPitchNow.map(playerRow)}</div>
          {others.length > 0 && (
            <React.Fragment>
              <div className="mt-3 mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Resto de convocados</div>
              <div className="grid grid-cols-2 gap-2 lg:grid-cols-1 lg:gap-1.5">{others.map(playerRow)}</div>
            </React.Fragment>
          )}
        </div>

        <div>
          {pendingDetail && (
            <div className="mp-card p-3 mb-3" style={{ borderColor: "var(--amber)" }}>
              <div className="text-sm mb-2">
                {EVENTS_WITH_DETAIL[pendingDetail.typeId].prompt} — {playerById(pendingDetail.playerId).name}
              </div>
              <div className="flex flex-wrap gap-2 mb-2">
                {EVENTS_WITH_DETAIL[pendingDetail.typeId].options.map((opt) => (
                  <button key={opt.value} onClick={() => confirmDetail(opt.value)} className="mp-btn px-3 py-2 text-sm">
                    {opt.label}
                  </button>
                ))}
              </div>
              <button onClick={() => setPendingDetail(null)} className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                Cancelar
              </button>
            </div>
          )}

          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
            {selectedPlayerId
              ? `Evento para ${playerById(selectedPlayerId).name}${isGoalkeeperSelected ? " (portero)" : ""} — se apunta en el ${now.minute}'`
              : "Selecciona un jugador para registrar un evento"}
          </div>
          <div className="mb-5 flex flex-col gap-3">
            {liveEventSections.map((section) => (
              <div key={section.title}>
                <div className="text-xs uppercase tracking-wide mb-1.5 font-semibold" style={{ color: "var(--chalk-dim)" }}>
                  {section.title}
                </div>
                <div className="flex flex-wrap gap-2">
                  {section.events.map((ev) => (
                    <button
                      key={ev.id}
                      disabled={!selectedPlayerId}
                      onClick={() => addEvent(ev.id)}
                      className={`mp-card ${eventChipCls(ev.id)} px-3 py-3 text-sm font-semibold leading-tight disabled:opacity-30`}
                    >
                      {ev.label}
                    </button>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>

        <div className="mt-4 lg:mt-0">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>Eventos de equipo</div>
          <TeamEventsPanel match={match} onUpdate={onUpdate} at={currentAt} checkDuplicates />
        </div>
      </div>

      <div className="mt-4">
        <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>Añadido en esta repetición ({added.length})</div>
        {added.length === 0 && (
          <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>Aún no has añadido nada.</div>
        )}
        <div className="flex flex-col gap-2">
          {added.map((t) => (
            <div key={t.id} className={`mp-card ${t.cls} p-2.5 flex items-center justify-between`}>
              <span className="text-sm">
                <span style={{ color: "var(--chalk-dim)" }}>{t.minute}' · </span>
                {t.text}
              </span>
              <button onClick={() => removeAdded(t.kind, t.id)} className="text-xs" style={{ color: "var(--crimson)" }}>
                Deshacer
              </button>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}
