// Plantilla → Sancionados: jugadores con partidos de sanción pendientes (roja o 5 amarillas).
// El número se puede ajustar (lo decide el comité); con 0 o "Quitar" sale de la lista.
function SanctionsCard({ sanctions, squad, onUpdate }) {
  const [drafts, setDrafts] = useState({});
  const dim = { color: "var(--chalk-dim)" };
  const list = (sanctions || [])
    .filter((s) => s.remaining > 0)
    .map((s) => ({ s, p: squad.find((pl) => pl.id === s.playerId) }))
    .filter((x) => x.p)
    .sort((a, b) => Number(a.p.number) - Number(b.p.number));

  function set(s, value) {
    const n = Math.max(0, Math.min(99, Math.round(Number(value) || 0)));
    if (n === 0 && !window.confirm(`¿Quitar la sanción de ${squad.find((p) => p.id === s.playerId).name}? Volverá a estar disponible para convocar.`)) return;
    setDrafts((d) => {
      const { [s.id]: _x, ...rest } = d;
      return rest;
    });
    onUpdate(s.id, n);
  }

  return (
    <div className="mp-card p-3 mb-4" style={list.length ? { borderColor: "var(--crimson)" } : {}}>
      <div className="text-xs uppercase tracking-wide mb-1" style={dim}>Sancionados</div>
      {list.length === 0 ? (
        <div className="text-xs" style={dim}>
          Nadie. Una roja, o cada 5 amarillas en la temporada, sanciona automáticamente 1 partido.
        </div>
      ) : (
        <div className="flex flex-col gap-2 mt-1">
          {list.map(({ s, p }) => {
            const draft = drafts[s.id];
            return (
              <div key={s.id} className="flex items-center gap-2">
                <div className="flex-1 min-w-0">
                  <div className="text-sm truncate"><span className="font-semibold">#{p.number}</span> {p.name}</div>
                  <div className="text-[11px] truncate" style={dim}>{sanctionReasonText(s)}</div>
                </div>
                <div className="flex items-center gap-1 shrink-0">
                  <button onClick={() => set(s, s.remaining - 1)} className="mp-btn px-2 py-1 text-sm" aria-label="Un partido menos">−</button>
                  <input
                    type="text"
                    inputMode="numeric"
                    value={draft != null ? draft : String(s.remaining)}
                    onChange={(e) => setDrafts((d) => ({ ...d, [s.id]: e.target.value.replace(/[^0-9]/g, "") }))}
                    onBlur={() => draft != null && draft !== String(s.remaining) && set(s, draft)}
                    onKeyDown={(e) => e.key === "Enter" && e.currentTarget.blur()}
                    className="mp-input px-1 py-1 text-sm text-center"
                    style={{ width: 40 }}
                    aria-label="Partidos de sanción pendientes"
                  />
                  <button onClick={() => set(s, s.remaining + 1)} className="mp-btn px-2 py-1 text-sm" aria-label="Un partido más">+</button>
                </div>
                <button onClick={() => set(s, 0)} className="text-xs shrink-0" style={{ color: "var(--crimson)" }}>Quitar</button>
              </div>
            );
          })}
          <div className="text-[11px]" style={dim}>
            Partidos pendientes de cumplir. Se descuenta 1 al finalizar cada partido de liga; no se pueden convocar hasta llegar a 0.
          </div>
        </div>
      )}
    </div>
  );
}

function SquadManager({ squad, matches, onSave, onBack, sanctions = [], onUpdateSanction }) {
  const [players, setPlayers] = useState(squad);
  const [number, setNumber] = useState("");
  const [name, setName] = useState("");
  const [position, setPosition] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editNumber, setEditNumber] = useState("");
  const [editName, setEditName] = useState("");
  const [editPosition, setEditPosition] = useState("");

  useEffect(() => setPlayers(squad), [squad]);

  const ratingConfig = React.useContext(RatingConfigContext);
  const seasonRatings = computeSeasonRatings(matches || [], squad, ratingConfig);

  function addPlayer() {
    if (!name.trim()) return;
    const updated = [
      ...players,
      { id: genId(), number: number.trim() || "-", name: name.trim(), position: position || null },
    ];
    setPlayers(updated);
    onSave(updated);
    setNumber("");
    setName("");
    setPosition("");
  }

  function removePlayer(id) {
    const updated = players.filter((p) => p.id !== id);
    setPlayers(updated);
    onSave(updated);
  }

  function startEdit(p) {
    setEditingId(p.id);
    setEditNumber(String(p.number));
    setEditName(p.name);
    setEditPosition(p.position || "");
  }

  function cancelEdit() {
    setEditingId(null);
  }

  function saveEdit() {
    if (!editName.trim()) return;
    const updated = players.map((p) =>
      p.id === editingId
        ? { ...p, number: editNumber.trim() || "-", name: editName.trim(), position: editPosition || null }
        : p
    );
    setPlayers(updated);
    onSave(updated);
    setEditingId(null);
  }

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-6 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <h1 className="display text-2xl font-semibold">Plantilla</h1>
      </div>

      {onUpdateSanction && <SanctionsCard sanctions={sanctions} squad={squad} onUpdate={onUpdateSanction} />}

      <div className="mp-card p-3 mb-4 flex flex-col gap-2">
        <div className="flex gap-2">
          <input
            value={number}
            onChange={(e) => setNumber(e.target.value)}
            placeholder="Dorsal"
            inputMode="numeric"
            pattern="[0-9]*"
            className="mp-input px-3 py-2 w-20 text-center"
          />
          <input
            value={name}
            onChange={(e) => setName(e.target.value)}
            placeholder="Nombre del jugador"
            className="mp-input px-3 py-2 flex-1"
            onKeyDown={(e) => e.key === "Enter" && addPlayer()}
          />
        </div>
        <div className="flex gap-2">
          <select
            value={position}
            onChange={(e) => setPosition(e.target.value)}
            className="mp-input px-3 py-2 flex-1"
          >
            <option value="">Sin posición</option>
            {PLAYER_POSITIONS.map((opt) => (
              <option key={opt.value} value={opt.value}>{opt.value} — {opt.label}</option>
            ))}
          </select>
          <button onClick={addPlayer} className="mp-btn mp-btn-primary px-4 text-sm font-semibold">
            Añadir
          </button>
        </div>
      </div>

      <div className="flex flex-col gap-2">
        {players
          .slice()
          .sort((a, b) => Number(a.number) - Number(b.number))
          .map((p) =>
            editingId === p.id ? (
              <div key={p.id} className="mp-card p-3 flex flex-col gap-2">
                <div className="flex gap-2">
                  <input
                    value={editNumber}
                    onChange={(e) => setEditNumber(e.target.value)}
                    placeholder="Dorsal"
                    inputMode="numeric"
                    pattern="[0-9]*"
                    className="mp-input px-3 py-2 w-20 text-center"
                  />
                  <input
                    value={editName}
                    onChange={(e) => setEditName(e.target.value)}
                    placeholder="Nombre del jugador"
                    className="mp-input px-3 py-2 flex-1"
                    onKeyDown={(e) => e.key === "Enter" && saveEdit()}
                  />
                </div>
                <div className="flex gap-2">
                  <select
                    value={editPosition}
                    onChange={(e) => setEditPosition(e.target.value)}
                    className="mp-input px-3 py-2 flex-1"
                  >
                    <option value="">Sin posición</option>
                    {PLAYER_POSITIONS.map((opt) => (
                      <option key={opt.value} value={opt.value}>{opt.value} — {opt.label}</option>
                    ))}
                  </select>
                  <button onClick={saveEdit} className="mp-btn mp-btn-primary px-3 py-2 text-sm font-semibold">
                    Guardar
                  </button>
                  <button onClick={cancelEdit} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
                    Cancelar
                  </button>
                </div>
              </div>
            ) : (
              <div key={p.id} className="mp-card p-3 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="mp-shirt w-9 h-9 text-sm font-semibold">{p.number}</div>
                  <div>
                    <div>{p.name}</div>
                    <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                      {p.position ? PLAYER_POSITION_LABEL[p.position] || p.position : "Sin posición"}
                    </div>
                  </div>
                </div>
                <div className="flex items-center gap-3">
                  {seasonRatings[p.id] ? (
                    <RatingBadge
                      rating={seasonRatings[p.id].avg}
                      title={`Nota media de temporada (${seasonRatings[p.id].matches} partido${seasonRatings[p.id].matches === 1 ? "" : "s"})`}
                    />
                  ) : (
                    <span className="text-xs" style={{ color: "var(--chalk-dim)" }} title="Aún no ha jugado ningún partido">—</span>
                  )}
                  <button
                    onClick={() => startEdit(p)}
                    className="text-sm"
                    style={{ color: "var(--cielo)" }}
                  >
                    Editar
                  </button>
                  <button
                    onClick={() => removePlayer(p.id)}
                    className="text-sm"
                    style={{ color: "var(--crimson)" }}
                  >
                    Quitar
                  </button>
                </div>
              </div>
            )
          )}
        {players.length === 0 && (
          <div className="text-sm" style={{ color: "var(--chalk-dim)" }}>
            Añade jugadores para poder convocarlos en un partido.
          </div>
        )}
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Nuevo partido
--------------------------------------------------------- */
/* ---------------------------------------------------------
   Alineación de un partido: once inicial + desconvocados (con motivo opcional).
   Los desconvocados se guardan en `match.desconvocados` ({ [playerId]: { reason, other } })
   y no entran en `bench`, así que no cuentan para cambios, Campo ni estadísticas del partido.
--------------------------------------------------------- */
const UNCALLED_REASONS = [
  { value: "lesion", label: "Lesión" },
  { value: "sancion", label: "Sanción" },
  { value: "tecnica", label: "Decisión técnica" },
  { value: "personal", label: "Motivos personales" },
  { value: "enfermedad", label: "Enfermedad" },
  { value: "otro", label: "Otro" },
];

function uncalledReasonText(entry) {
  if (!entry || !entry.reason) return "Sin especificar";
  if (entry.reason === "otro") return entry.other && entry.other.trim() ? `Otro: ${entry.other.trim()}` : "Otro";
  const r = UNCALLED_REASONS.find((x) => x.value === entry.reason);
  return r ? r.label : "Sin especificar";
}

function LineupPicker({ squad, titulares, setTitulares, desconvocados, setDesconvocados, optional, sanctioned = {} }) {
  const [mode, setMode] = useState("titulares");
  // Los sancionados (Plantilla → Sancionados) no se pueden convocar: aparecen bloqueados
  const sortedSquad = squad.slice().sort((a, b) => Number(a.number) - Number(b.number)).filter((p) => !sanctioned[p.id]);
  const sanctionedPlayers = squad.filter((p) => sanctioned[p.id]).sort((a, b) => Number(a.number) - Number(b.number));
  const uncalledIds = Object.keys(desconvocados).filter((id) => squad.some((p) => p.id === id) && !sanctioned[id]);

  useEffect(() => {
    if (titulares.some((id) => sanctioned[id])) setTitulares((prev) => prev.filter((id) => !sanctioned[id]));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function tap(id) {
    if (sanctioned[id]) return;
    if (mode === "titulares") {
      if (desconvocados[id]) return;
      setTitulares((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : [...prev, id]));
    } else {
      setDesconvocados((prev) => {
        const next = { ...prev };
        if (next[id]) delete next[id];
        else next[id] = { reason: "", other: "" };
        return next;
      });
      setTitulares((prev) => prev.filter((x) => x !== id));
    }
  }

  function setReason(id, patch) {
    setDesconvocados((prev) => ({ ...prev, [id]: { ...prev[id], ...patch } }));
  }

  const modeBtn = (id, label, activeStyle) => (
    <button
      onClick={() => setMode(id)}
      className="mp-btn px-3 py-1.5 text-xs flex-1"
      style={mode === id ? activeStyle : {}}
    >
      {label}
    </button>
  );

  return (
    <div className="mp-card p-3 mb-4">
      <div className="flex gap-2 mb-2">
        {modeBtn("titulares", "Marcar once inicial", { background: "var(--turf)", color: "#0F1B14", border: "none" })}
        {modeBtn("desconvocados", "Marcar desconvocados", { background: "var(--crimson)", color: "#fff", border: "none" })}
      </div>
      <div className="flex items-center justify-between mb-2">
        <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>
          {mode === "titulares"
            ? `Once inicial${optional ? " (opcional por ahora)" : ""}`
            : "Toca a los jugadores que no están convocados"}
        </label>
        <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>
          {titulares.filter((id) => !sanctioned[id]).length} titulares · {uncalledIds.length} desconv.
          {sanctionedPlayers.length > 0 ? ` · ${sanctionedPlayers.length} sancion.` : ""}
        </span>
      </div>
      <div className="flex flex-wrap gap-2">
        {sortedSquad.map((p) => {
          const isStarter = titulares.includes(p.id);
          const isUncalled = !!desconvocados[p.id];
          let style = {};
          if (isStarter) style = { background: "var(--turf)", color: "#0F1B14", border: "none" };
          if (isUncalled) style = { background: "var(--crimson)", color: "#fff", border: "none", opacity: mode === "titulares" ? 0.45 : 1 };
          return (
            <button
              key={p.id}
              onClick={() => tap(p.id)}
              className="mp-btn px-3 py-2 text-sm flex items-center gap-2"
              style={style}
            >
              <span className="font-semibold">{p.number}</span>
              <span style={isUncalled ? { textDecoration: "line-through" } : undefined}>{p.name}</span>
            </button>
          );
        })}
      </div>

      {sanctionedPlayers.length > 0 && (
        <div className="mt-3">
          <div className="text-xs mb-1.5" style={{ color: "var(--chalk-dim)" }}>
            Sancionados — no se pueden convocar
          </div>
          <div className="flex flex-wrap gap-2">
            {sanctionedPlayers.map((p) => (
              <span key={p.id} className="mp-btn px-3 py-2 text-sm flex items-center gap-2" style={{ opacity: 0.55, cursor: "default" }}>
                <span className="font-semibold">{p.number}</span>
                <span style={{ textDecoration: "line-through" }}>{p.name}</span>
                <span className="text-xs" style={{ color: "var(--crimson)" }}>
                  {sanctioned[p.id]} partido{sanctioned[p.id] === 1 ? "" : "s"}
                </span>
              </span>
            ))}
          </div>
        </div>
      )}

      {uncalledIds.length > 0 && (
        <div className="mt-4">
          <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>
            Desconvocados — motivo (opcional)
          </div>
          <div className="flex flex-col gap-2">
            {sortedSquad
              .filter((p) => desconvocados[p.id])
              .map((p) => {
                const entry = desconvocados[p.id];
                return (
                  <div key={p.id} className="flex flex-col gap-1">
                    <div className="flex items-center gap-2">
                      <span className="text-sm flex-1 min-w-0 truncate">
                        <span className="font-semibold">#{p.number}</span> {p.name}
                      </span>
                      <select
                        value={entry.reason || ""}
                        onChange={(e) => setReason(p.id, { reason: e.target.value })}
                        className="mp-input px-2 py-1.5 text-sm"
                      >
                        <option value="">Sin especificar</option>
                        {UNCALLED_REASONS.map((r) => (
                          <option key={r.value} value={r.value}>{r.label}</option>
                        ))}
                      </select>
                    </div>
                    {entry.reason === "otro" && (
                      <input
                        value={entry.other || ""}
                        onChange={(e) => setReason(p.id, { other: e.target.value })}
                        placeholder="Especifica el motivo"
                        className="mp-input px-3 py-1.5 text-sm"
                      />
                    )}
                  </div>
                );
              })}
          </div>
        </div>
      )}
    </div>
  );
}

// Selector de motivo de un desconvocado (desplegable + texto libre si es "Otro")
function UncalledReasonInput({ entry, onChange }) {
  return (
    <React.Fragment>
      <select
        value={entry.reason || ""}
        onChange={(e) => onChange({ reason: e.target.value }, true)}
        className="mp-input px-2 py-1.5 text-sm"
      >
        <option value="">Sin especificar</option>
        {UNCALLED_REASONS.map((r) => (
          <option key={r.value} value={r.value}>{r.label}</option>
        ))}
      </select>
      {entry.reason === "otro" && (
        <input
          value={entry.other || ""}
          onChange={(e) => onChange({ other: e.target.value }, false)}
          onBlur={() => onChange({}, true)}
          placeholder="Especifica el motivo"
          className="mp-input px-3 py-1.5 text-sm w-full"
        />
      )}
    </React.Fragment>
  );
}

// Convocatoria con el partido ya empezado: se puede desconvocar a un suplente que todavía no
// ha participado (ni ha entrado ni tiene eventos) y volver a convocar a un desconvocado.
function LiveUncalledPanel({ match, squad, playerById, onUpdate }) {
  const [open, setOpen] = useState(false);
  const desconvocados = match.desconvocados || {};
  const uncalledIds = Object.keys(desconvocados).filter((id) => squad.some((p) => p.id === id));
  const tookPart = (id) =>
    (match.subs || []).some((s) => s.inId === id || s.outId === id) ||
    (match.events || []).some((e) => e.playerId === id);
  const eligibleBench = match.bench.filter((id) => squad.some((p) => p.id === id) && !tookPart(id));
  const byNumber = (a, b) => Number(playerById(a).number) - Number(playerById(b).number);

  function uncall(id) {
    onUpdate(
      {
        ...match,
        bench: match.bench.filter((x) => x !== id),
        desconvocados: { ...desconvocados, [id]: { reason: "", other: "" } },
      },
      true
    );
  }

  function recall(id) {
    const next = { ...desconvocados };
    delete next[id];
    onUpdate({ ...match, bench: [...match.bench, id], desconvocados: next }, true);
  }

  function updateReason(id, patch, persistNow) {
    const entry = { ...desconvocados[id], ...patch };
    if (entry.reason !== "otro") entry.other = "";
    onUpdate({ ...match, desconvocados: { ...desconvocados, [id]: entry } }, persistNow);
  }

  return (
    <div className="mp-card p-3 mt-3">
      <button onClick={() => setOpen((v) => !v)} className="w-full flex items-center justify-between text-sm">
        <span>
          Convocatoria
          <span className="text-xs ml-2" style={{ color: "var(--chalk-dim)" }}>
            {uncalledIds.length} desconvocado{uncalledIds.length === 1 ? "" : "s"}
          </span>
        </span>
        <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>{open ? "▲" : "▼"}</span>
      </button>
      {open && (
        <div className="mt-3 flex flex-col gap-3">
          <div>
            <div className="text-xs mb-1" style={{ color: "var(--chalk-dim)" }}>
              Suplentes que aún no han jugado — toca para desconvocar
            </div>
            <div className="flex flex-wrap gap-2">
              {eligibleBench.sort(byNumber).map((id) => {
                const p = playerById(id);
                return (
                  <button key={id} onClick={() => uncall(id)} className="mp-btn px-3 py-1.5 text-sm">
                    {p.number} · {p.name}
                  </button>
                );
              })}
              {eligibleBench.length === 0 && (
                <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>No hay suplentes sin participar.</span>
              )}
            </div>
          </div>
          {uncalledIds.length > 0 && (
            <div className="flex flex-col gap-2">
              <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>Desconvocados — motivo (opcional)</div>
              {uncalledIds.sort(byNumber).map((id) => {
                const p = playerById(id);
                return (
                  <div key={id} className="flex flex-col gap-1">
                    <div className="flex items-center gap-2">
                      <span className="text-sm flex-1 min-w-0 truncate">
                        <span className="font-semibold">#{p.number}</span> {p.name}
                      </span>
                      {desconvocados[id] && desconvocados[id].sanctioned ? (
                        <span className="text-xs shrink-0" style={{ color: "var(--crimson)" }}>Sancionado</span>
                      ) : (
                        <button onClick={() => recall(id)} className="text-xs shrink-0" style={{ color: "var(--cielo)" }}>
                          Volver a convocar
                        </button>
                      )}
                    </div>
                    {!(desconvocados[id] && desconvocados[id].sanctioned) && (
                      <UncalledReasonInput
                        entry={desconvocados[id]}
                        onChange={(patch, persistNow) => updateReason(id, patch, persistNow)}
                      />
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// Lista de desconvocados de un partido con su motivo (para revisarlo después)
function UncalledList({ match, squad }) {
  const entries = Object.keys(match.desconvocados || {})
    .map((id) => ({ p: squad.find((pp) => pp.id === id), entry: match.desconvocados[id] }))
    .filter((r) => r.p)
    .sort((a, b) => Number(a.p.number) - Number(b.p.number));
  if (entries.length === 0) return null;
  return (
    <div className="mp-card p-3 mb-4">
      <div className="text-xs mb-2" style={{ color: "var(--chalk-dim)" }}>Desconvocados</div>
      <div className="flex flex-col gap-1">
        {entries.map(({ p, entry }) => (
          <div key={p.id} className="flex items-center justify-between gap-2 text-sm">
            <span className="min-w-0 truncate">
              <span className="font-semibold">#{p.number}</span> {p.name}
            </span>
            <span className="text-xs shrink-0" style={{ color: "var(--chalk-dim)" }}>{uncalledReasonText(entry)}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

// Limpia los desconvocados antes de guardarlos: sin texto libre salvo en "Otro"
function cleanUncalled(desconvocados) {
  const out = {};
  Object.keys(desconvocados || {}).forEach((id) => {
    const e = desconvocados[id] || {};
    out[id] = { reason: e.reason || "", other: e.reason === "otro" ? (e.other || "").trim() : "" };
  });
  return out;
}

function MatchSetup({ squad, crests, onSaveCrest, onCreate, onBack, onGoSquad, defaultHalfLength = 45, teamFormation, formationChosen, onChooseFormation, sanctioned = {} }) {
  const [competition, setCompetition] = useState("liga");
  const [opponent, setOpponent] = useState("");
  const [date, setDate] = useState(todayISO());
  const [halfLength, setHalfLength] = useState(defaultHalfLength);
  const [titulares, setTitulares] = useState([]);
  const [desconvocados, setDesconvocados] = useState({});
  const [isHome, setIsHome] = useState(true);
  // Escudo elegido para este rival (si no elige ninguno se usa el que ya haya guardado con ese nombre)
  const [newCrest, setNewCrest] = useState(null);

  const isFuture = date > todayISO();
  const rivalCrestSrc = newCrest || rivalCrest(crests, opponent);

  function submit() {
    if (!opponent.trim() || (!isFuture && titulares.length === 0)) return;
    if (newCrest) onSaveCrest("rival", opponent.trim(), newCrest);
    onCreate({
      opponent: opponent.trim(),
      date,
      halfLength: Number(halfLength) || 45,
      titulares,
      desconvocados: cleanUncalled(desconvocados),
      isHome,
      competition,
    });
  }

  if (squad.length === 0) {
    return (
      <div className="max-w-md mx-auto p-4 pb-10">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm mb-4">
          Volver
        </button>
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
          Primero necesitas añadir jugadores a la plantilla.
        </div>
        <button onClick={onGoSquad} className="mp-btn mp-btn-primary w-full py-3 mt-4 font-semibold">
          Ir a la plantilla
        </button>
      </div>
    );
  }

  return (
    <div className="max-w-md mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-6 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        <h1 className="display text-2xl font-semibold">Nuevo partido</h1>
      </div>

      <div className="mp-card p-3 mb-3">
        <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Rival</label>
        <div className="flex items-center gap-3 mt-1">
          <CrestPicker src={rivalCrestSrc} size={40} onPick={setNewCrest} label="Elegir el escudo del rival" />
          <input
            value={opponent}
            onChange={(e) => setOpponent(e.target.value)}
            placeholder="Nombre del equipo rival"
            className="mp-input px-3 py-2 w-full"
          />
        </div>
        <div className="text-[10px] mt-1" style={{ color: "var(--chalk-dim)" }}>
          Toca el círculo para elegir el escudo (opcional). Se recordará para este rival.
        </div>
      </div>

      <div className="flex gap-3 mb-3">
        <div className="mp-card p-3 flex-1 min-w-0">
          <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Fecha</label>
          <input
            type="date"
            value={date}
            onChange={(e) => setDate(e.target.value)}
            className="mp-input px-3 py-2 w-full mt-1"
          />
        </div>
        <div className="mp-card p-3 w-28">
          <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Min./parte</label>
          <input
            type="number"
            value={halfLength}
            onChange={(e) => setHalfLength(e.target.value)}
            inputMode="numeric"
            pattern="[0-9]*"
            className="mp-input px-3 py-2 w-full mt-1"
          />
        </div>
      </div>

      <div className="mp-card p-3 mb-3">
        <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>¿Dónde se juega?</label>
        <div className="flex gap-2 mt-1">
          <button
            onClick={() => setIsHome(true)}
            className="mp-btn px-3 py-2 text-sm flex-1"
            style={isHome ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
          >
            Local
          </button>
          <button
            onClick={() => setIsHome(false)}
            className="mp-btn px-3 py-2 text-sm flex-1"
            style={!isHome ? { background: "var(--crimson)", color: "#fff", border: "none" } : {}}
          >
            Visitante
          </button>
        </div>
      </div>

      <div className="mp-card p-3 mb-3">
        <label className="text-xs" style={{ color: "var(--chalk-dim)" }}>Tipo de partido</label>
        <div className="flex gap-2 mt-1">
          <button
            onClick={() => setCompetition("liga")}
            className="mp-btn px-3 py-2 text-sm flex-1"
            style={competition === "liga" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
          >
            Liga
          </button>
          <button
            onClick={() => setCompetition("amistoso")}
            className="mp-btn px-3 py-2 text-sm flex-1"
            style={competition === "amistoso" ? { background: "var(--cielo)", color: "#0F1B14", border: "none" } : {}}
          >
            Amistoso
          </button>
        </div>
        <div className="text-[11px] mt-1" style={{ color: "var(--chalk-dim)" }}>
          Los amistosos no descuentan partidos de sanción.
        </div>
      </div>

      {isFuture && (
        <div className="mp-card p-3 mb-4 text-xs" style={{ color: "var(--chalk-dim)" }}>
          Esta fecha es futura: el partido se guardará como <span style={{ color: "var(--cielo)" }}>programado</span> en
          el calendario. Podrás elegir el once inicial y empezarlo cuando llegue el día.
        </div>
      )}

      {onChooseFormation && (
        <TeamFormationPicker formation={teamFormation} chosen={formationChosen} onChoose={onChooseFormation} />
      )}

      <LineupPicker
        squad={squad}
        titulares={titulares}
        setTitulares={setTitulares}
        desconvocados={desconvocados}
        setDesconvocados={setDesconvocados}
        optional={isFuture}
        sanctioned={sanctioned}
      />

      <button
        onClick={submit}
        disabled={!opponent.trim() || (!isFuture && titulares.length === 0)}
        className="mp-btn mp-btn-primary w-full py-3 font-semibold disabled:opacity-40"
      >
        {isFuture ? "Programar partido" : "Empezar partido"}
      </button>
    </div>
  );
}

/* ---------------------------------------------------------
   Formación habitual del equipo al elegir el once inicial. La primera vez (el equipo aún no
   la ha elegido: team.formationChosen) se pide con un recuadro visible; después solo se
   muestra con un "Cambiar". Se guarda como formación por defecto del equipo (team.defaultFormation),
   la que usa "Colocar automáticamente" en la Pizarra de cada partido.
--------------------------------------------------------- */
function TeamFormationPicker({ formation, chosen, onChoose }) {
  const [open, setOpen] = useState(false);
  const dim = { color: "var(--chalk-dim)" };
  const chips = (
    <div className="flex flex-wrap gap-2">
      {RIVAL_FORMATIONS.map((f) => (
        <button
          key={f.id}
          onClick={() => {
            onChoose(f.id);
            setOpen(false);
          }}
          className="mp-btn px-3 py-1.5 text-sm"
          style={chosen && formation === f.id ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          {f.id}
        </button>
      ))}
    </div>
  );

  if (!chosen) {
    return (
      <div className="mp-card p-3 mb-4" style={{ borderColor: "var(--turf)" }}>
        <div className="text-sm font-semibold mb-1">¿Con qué formación jugáis normalmente?</div>
        <div className="text-xs mb-3" style={dim}>
          Se guarda como la formación de tu equipo y "Colocar automáticamente" la usará en cada
          partido. Si un día cambiáis de sistema, se puede cambiar solo para ese partido desde la Pizarra.
        </div>
        {chips}
      </div>
    );
  }

  return (
    <div className="mb-4">
      <div className="flex items-center justify-between text-sm">
        <span>
          <span style={dim}>Formación habitual: </span>
          <span className="font-semibold">{formation}</span>
        </span>
        <button onClick={() => setOpen((v) => !v)} className="text-xs" style={{ color: "var(--cielo)" }}>
          {open ? "Cerrar" : "Cambiar"}
        </button>
      </div>
      {open && (
        <div className="mp-card p-3 mt-2">
          <div className="text-xs mb-2" style={dim}>
            Cambia la formación habitual del equipo (para todos los partidos). Para un solo partido,
            cámbiala desde su Pizarra.
          </div>
          {chips}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Pantalla: Partido en directo
--------------------------------------------------------- */
function LiveMatch({ match, squad, crests, setPiecePositions, onSaveCrest, onUpdate, onFinish, onBack, syncView, defaultFormation }) {
  const ratingConfig = React.useContext(RatingConfigContext);
  const [selectedPlayerId, setSelectedPlayerId] = useState(null);
  const [subOutId, setSubOutId] = useState(null);
  const [tab, setTab] = useState("jugadores");
  const [showPlayerStats, setShowPlayerStats] = useState(false);
  const [showTimeline, setShowTimeline] = useState(false);
  const [pendingDetail, setPendingDetail] = useState(null);
  const [, forceTick] = useState(0);

  const matchRef = useRef(match);
  useEffect(() => { matchRef.current = match; }, [match]);

  const playerById = useCallback(
    (id) => squad.find((p) => p.id === id) || { id, number: "?", name: "Desconocido" },
    [squad]
  );

  // Filtra jugadores que ya no están en la plantilla (p.ej. borrados después de convocarlos)
  const rosterOnPitch = match.onPitch.filter((id) => squad.some((p) => p.id === id));
  const rosterBench = match.bench.filter((id) => squad.some((p) => p.id === id));
  // Expulsados (roja en este partido): dejan de poder seleccionarse, entrar o salir en un cambio;
  // el equipo sigue con uno menos. Si se borra la roja, vuelven solos.
  const sentOffIds = new Set((match.events || []).filter((e) => e.type === "roja").map((e) => e.playerId));
  const activeOnPitch = rosterOnPitch.filter((id) => !sentOffIds.has(id));
  const availableBench = rosterBench.filter((id) => !sentOffIds.has(id));
  const sentOffList = [...rosterOnPitch, ...rosterBench].filter((id) => sentOffIds.has(id));
  useEffect(() => {
    if (selectedPlayerId && sentOffIds.has(selectedPlayerId)) setSelectedPlayerId(null);
    if (subOutId && sentOffIds.has(subOutId)) setSubOutId(null);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [match.events]);

  const clockKey = match.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";

  function currentElapsed() {
    return computeElapsed(match);
  }

  function currentMinute() {
    return computeMinute(match);
  }

  // Refresca la pantalla cada segundo sin escribir en almacenamiento ni red. Al cumplirse la
  // duración de la parte, para el cronómetro solo (también si la app estuvo cerrada mientras).
  useEffect(() => {
    if (!match.clock.running) return;
    function tick() {
      const m = matchRef.current;
      if (m.clock.running && isHalfTimeUp(m)) {
        const key = m.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";
        onUpdate({ ...m, clock: { ...m.clock, [key]: halfLimitSeconds(m), running: false } }, true);
        return;
      }
      forceTick((t) => t + 1);
    }
    tick();
    const interval = setInterval(tick, 1000);
    return () => clearInterval(interval);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [match.clock.running]);

  // Persiste el cronómetro cada pocos segundos, sin bloquear el tap del usuario.
  // Al persistir, reinicia runStartedAt para que el siguiente cálculo no cuente el tiempo dos veces.
  useEffect(() => {
    if (!match.clock.running) return;
    const interval = setInterval(() => {
      const m = matchRef.current;
      const key = m.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";
      onUpdate(
        { ...m, clock: { ...m.clock, [key]: computeElapsed(m), runStartedAt: Date.now() } },
        false
      );
    }, 5000);
    return () => clearInterval(interval);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [match.clock.running, match.clock.activeHalf]);

  function toggleRunning() {
    const willRun = !match.clock.running;
    if (willRun && isHalfTimeUp(match)) return; // la parte ya duró lo que tenía que durar
    onUpdate(
      {
        ...match,
        clock: {
          ...match.clock,
          [clockKey]: computeElapsed(match),
          running: willRun,
          runStartedAt: willRun ? Date.now() : match.clock.runStartedAt,
        },
      },
      true
    );
  }

  function resetClock() {
    if (!window.confirm("¿Reiniciar el cronómetro de esta parte a 00:00?")) return;
    onUpdate(
      {
        ...match,
        clock: {
          ...match.clock,
          [clockKey]: 0,
          runStartedAt: match.clock.running ? Date.now() : match.clock.runStartedAt,
        },
      },
      true
    );
  }

  function restartMatchClock() {
    if (!window.confirm("¿Empezar el partido de nuevo desde el minuto 0 (1ª parte)?")) return;
    onUpdate(
      {
        ...match,
        half: 1,
        clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1, runStartedAt: null },
      },
      true
    );
  }

  function endHalf1() {
    onUpdate(
      { ...match, half: "descanso", clock: { ...match.clock, half1Elapsed: computeElapsed(match), running: false } },
      true
    );
  }

  function startHalf2() {
    onUpdate(
      { ...match, half: 2, clock: { ...match.clock, running: true, activeHalf: 2, runStartedAt: Date.now() } },
      true
    );
  }

  function addEvent(typeId) {
    if (!selectedPlayerId) return;
    if (EVENTS_WITH_DETAIL[typeId]) {
      setPendingDetail({ typeId, playerId: selectedPlayerId });
      return;
    }
    const p = playerById(selectedPlayerId);
    const half = match.clock.activeHalf;
    const seconds = currentElapsed();
    const minute = currentMinute();
    const entry = {
      id: genId(),
      half,
      seconds,
      minute,
      playerId: p.id,
      playerNumber: p.number,
      playerName: p.name,
      type: typeId,
    };
    onUpdate({ ...match, events: [...match.events, entry] }, true);
  }

  function confirmDetail(value) {
    if (!pendingDetail) return;
    const { typeId, playerId } = pendingDetail;
    const meta = EVENTS_WITH_DETAIL[typeId];
    const isTypeOverride = meta.field === "__type__";
    const p = playerById(playerId);
    const half = match.clock.activeHalf;
    const seconds = currentElapsed();
    const minute = currentMinute();
    const entry = {
      id: genId(),
      half,
      seconds,
      minute,
      playerId: p.id,
      playerNumber: p.number,
      playerName: p.name,
      type: isTypeOverride ? value : typeId,
    };
    if (!isTypeOverride) entry[meta.field] = value;
    onUpdate({ ...match, events: [...match.events, entry] }, true);
    setPendingDetail(null);
  }

  function cancelDetail() {
    setPendingDetail(null);
  }

  function removeEvent(id) {
    onUpdate({ ...match, events: match.events.filter((e) => e.id !== id) }, true);
  }

  // Deshacer un cambio: además de borrar el apunte, el que entró vuelve al banquillo y el que
  // salió vuelve al campo (con su sitio en la Pizarra). Solo se puede deshacer el último cambio
  // en el que participa cada uno de los dos; si no, los minutos quedarían incoherentes.
  function removeSub(id) {
    const sub = match.subs.find((s) => s.id === id);
    if (!sub) return;
    const order = (s) => s.half * 1000 + s.minute;
    const involved = (s) => [s.inId, s.outId].some((x) => x === sub.inId || x === sub.outId);
    const idx = (s) => match.subs.indexOf(s);
    const later = match.subs.find(
      (s) => s.id !== id && involved(s) && (order(s) > order(sub) || (order(s) === order(sub) && idx(s) > idx(sub)))
    );
    if (later) {
      window.alert(
        `Primero deshaz el cambio del ${later.minute}' (sale ${later.outName}, entra ${later.inName}), en el que también participa uno de estos jugadores.`
      );
      return;
    }
    if (!match.onPitch.includes(sub.inId)) {
      window.alert(`${sub.inName} ya no está en el campo, así que este cambio no se puede deshacer.`);
      return;
    }
    const inEvents = match.events.filter(
      (e) => e.playerId === sub.inId && (e.half > sub.half || (e.half === sub.half && e.minute >= sub.minute))
    ).length;
    const msg =
      `¿Deshacer el cambio del ${sub.minute}'? ${sub.inName} vuelve al banquillo y ${sub.outName} vuelve al campo.` +
      (inEvents
        ? `\n\n${sub.inName} tiene ${inEvents} acción${inEvents === 1 ? "" : "es"} registrada${inEvents === 1 ? "" : "s"} después de entrar: se quedan apuntadas, pero ya no contará como que jugó.`
        : "");
    if (!window.confirm(msg)) return;
    const positions = { ...(match.positions || {}) };
    if (positions[sub.inId] && !positions[sub.outId]) positions[sub.outId] = positions[sub.inId];
    delete positions[sub.inId];
    onUpdate(
      {
        ...match,
        subs: match.subs.filter((s) => s.id !== id),
        onPitch: match.onPitch.map((x) => (x === sub.inId ? sub.outId : x)),
        bench: match.bench.includes(sub.outId)
          ? match.bench.map((x) => (x === sub.outId ? sub.inId : x))
          : [...match.bench, sub.inId],
        positions,
        positionHistory: (match.positionHistory || []).filter(
          (h) => !(h.playerId === sub.inId && h.half === sub.half && h.minute === sub.minute)
        ),
      },
      true
    );
  }

  function confirmSub(inId) {
    const outP = playerById(subOutId);
    const inP = playerById(inId);
    const half = match.clock.activeHalf;
    const minute = currentMinute();
    const newOnPitch = match.onPitch.map((id) => (id === subOutId ? inId : id));
    const newBench = match.bench.map((id) => (id === inId ? subOutId : id));
    const subEntry = {
      id: genId(),
      half,
      minute,
      outId: outP.id,
      outName: outP.name,
      outNumber: outP.number,
      inId: inP.id,
      inName: inP.name,
      inNumber: inP.number,
    };
    onUpdate(
      {
        ...match,
        onPitch: newOnPitch,
        bench: newBench,
        subs: [...match.subs, subEntry],
        ...positionsAfterSub(match, outP.id, inP.id, half, minute, squad),
      },
      true
    );
    setSubOutId(null);
    if (selectedPlayerId === subOutId) setSelectedPlayerId(null);
  }

  const activeElapsed = currentElapsed();

  const timeline = [
    ...match.events.map((e) => ({ ...e, kind: "event" })),
    ...match.subs.map((s) => ({ ...s, kind: "sub" })),
  ].sort((a, b) => (b.half - a.half) || (b.minute - a.minute) || (b.id > a.id ? 1 : -1));

  const selectedPlayer = selectedPlayerId ? playerById(selectedPlayerId) : null;
  const isGoalkeeperSelected = isGoalkeeper(selectedPlayer);
  const liveEventSections = LIVE_EVENT_SECTIONS.map((section) => ({
    title: section.title,
    events: section.ids.map((id) => EVENT_TYPES.find((ev) => ev.id === id)).filter(Boolean),
  })).filter((section) => section.title !== "Portero" || isGoalkeeperSelected);

  const golesFavor = match.events.filter((e) => ALL_GOAL_TYPES.includes(e.type)).length;
  const golesContra =
    (match.concededSetPieces || []).length + match.events.filter((e) => e.type === "gol_encajado").length;

  return (
    <div className="max-w-6xl mx-auto p-3 pb-8">
      {/* Resultado del partido, bien visible arriba del todo */}
      <div className="text-center pt-1 mb-1">
        <div className="text-[10px] uppercase tracking-wide" style={{ color: "var(--chalk-dim)" }}>
          Resultado
        </div>
        <ScoreWithCrests
          match={match}
          favor={golesFavor}
          contra={golesContra}
          crests={crests}
          onPickOwn={(url) => onSaveCrest("own", null, url)}
          onPickRival={(url) => onSaveCrest("rival", match.opponent, url)}
        />
      </div>

      {/* Cabecera + marcador, todo en una franja compacta */}
      <div className="flex flex-wrap items-center justify-between gap-2 mb-3 pt-2">
        <div className="flex items-center gap-3">
          <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
            Volver
          </button>
          <div>
            <div className="font-semibold leading-tight">vs {match.opponent}</div>
            <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>{match.date}</div>
          </div>
          {syncView && <SyncBadge status={syncView} />}
        </div>

        <div className="mp-card px-4 py-2 flex items-center gap-4">
          <div>
            <div className="text-[10px]" style={{ color: "var(--chalk-dim)" }}>{halfLabel(match)}</div>
            <div className="display text-2xl font-semibold tabular-nums leading-none">
              {formatClock(activeElapsed)}
            </div>
          </div>
          <div className="flex items-center gap-2">
            {(match.half === 1 || match.half === 2) && (
              <button
                onClick={toggleRunning}
                disabled={!match.clock.running && isHalfTimeUp(match)}
                className="mp-btn mp-btn-primary px-3 py-2 text-xs font-semibold disabled:opacity-40"
              >
                {match.clock.running ? "Pausar" : isHalfTimeUp(match) ? `Tiempo cumplido (${match.halfLength}')` : "Reanudar"}
              </button>
            )}
            {(match.half === 1 || match.half === 2) && (
              <button
                onClick={resetClock}
                className="mp-btn mp-btn-outline px-3 py-2 text-xs"
                style={{ color: "var(--crimson)" }}
              >
                Reiniciar
              </button>
            )}
            <button
              onClick={restartMatchClock}
              className="mp-btn mp-btn-outline px-3 py-2 text-xs"
              style={{ color: "var(--crimson)" }}
            >
              Empezar desde 0
            </button>
            {match.half === 1 && (
              <button onClick={endHalf1} className="mp-btn mp-btn-outline px-3 py-2 text-xs">
                Fin 1ª parte
              </button>
            )}
            {match.half === "descanso" && (
              <button onClick={startHalf2} className="mp-btn mp-btn-primary px-3 py-2 text-xs font-semibold">
                Iniciar 2ª parte
              </button>
            )}
            {match.half === 2 && (
              <button onClick={onFinish} className="mp-btn mp-btn-outline px-3 py-2 text-xs" style={{ color: "var(--crimson)" }}>
                Finalizar partido
              </button>
            )}
          </div>
        </div>
      </div>

      {tab === "jugadores" && <OpponentChanceMarker match={match} onUpdate={onUpdate} />}

      {/* Pestañas: jugadores/eventos en directo, o el resumen de cómo va el partido */}
      <div className="flex gap-2 mb-3">
        <button
          onClick={() => setTab("jugadores")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "jugadores" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Jugadores y equipo
        </button>
        <button
          onClick={() => setTab("estadisticas")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "estadisticas" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Estadísticas del partido
        </button>
        <button
          onClick={() => setTab("campo")}
          className="mp-btn px-3 py-2 text-sm flex-1"
          style={tab === "campo" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
        >
          Pizarra
        </button>
        {match.half === "finalizado" && (
          <button
            onClick={() => setTab("notas")}
            className="mp-btn px-3 py-2 text-sm flex-1"
            style={tab === "notas" ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
          >
            Notas
          </button>
        )}
      </div>

      {tab === "notas" && match.half === "finalizado" && <MatchRatingsList match={match} squad={squad} />}

      {tab === "campo" && (
        <React.Fragment>
          <FieldFormation match={match} squad={squad} crests={crests} playerById={playerById} onUpdate={onUpdate} defaultFormation={defaultFormation} />
          <LiveSetPieceBoard
            match={match}
            squad={squad}
            setPiecePositions={setPiecePositions || {}}
            playerById={playerById}
            onUpdate={onUpdate}
          />
        </React.Fragment>
      )}

      {tab === "estadisticas" && (
        <React.Fragment>
          {match.events.length === 0 ? (
            <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
              Aún no hay eventos registrados en este partido.
            </div>
          ) : (
            <MatchTotals events={match.events} teamEvents={match.teamEvents || []} />
          )}

          <button
            onClick={() => setShowPlayerStats((v) => !v)}
            className="mp-btn mp-btn-outline w-full py-2.5 text-sm mt-4 mb-2"
          >
            {showPlayerStats ? "Ocultar estadísticas por jugador" : "Ver estadísticas por jugador"}
          </button>
          {showPlayerStats && (
            <PlayerStatsAccordion
              players={[...rosterOnPitch, ...rosterBench].map((id) => playerById(id))}
              events={match.events}
              ratings={computeMatchRatings(match, squad, ratingConfig)}
            />
          )}
          <PositionTimelineReview match={match} squad={squad} />
        </React.Fragment>
      )}

      {/* Layout horizontal: en el campo a la izquierda, eventos + cronología en medio, eventos de equipo a la derecha */}
      {tab === "jugadores" && (
      <div className="lg:grid lg:grid-cols-[260px_1fr_280px] lg:gap-4 lg:items-start">
        <div className="mb-4 lg:mb-0">
          <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
            En el campo — toca para seleccionar
          </div>
          <div className="grid grid-cols-2 gap-2 lg:grid-cols-1 lg:gap-1.5">
            {activeOnPitch.map((id) => {
              const p = playerById(id);
              const selected = selectedPlayerId === id;
              return (
                <div
                  key={id}
                  className="mp-card flex items-center gap-2 px-2 py-1.5"
                  style={selected ? { borderColor: "var(--cielo)" } : {}}
                >
                  <button

              const p = playerById(id);

          {/* Panel de cambio: los suplentes (y los ya sustituidos) aparecen aquí, al pulsar "Cambiar" */}

            <div className="mp-card p-3 mt-3">

              <div className="flex flex-wrap gap-2 mb-2">

                  return (
                    <button
                      key={id}

                      className="mp-btn px-3 py-2 text-sm"

                  );

                {availableBench.length === 0 && (
                  <span className="text-xs" style={{ color: "var(--chalk-dim)" }}>No hay suplentes disponibles.</span>

              </div>
              <button onClick={() => setSubOutId(null)} className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                Cancelar
              </button>
            </div>
          )}

          {match.half !== "finalizado" && (
            <LiveUncalledPanel match={match} squad={squad} playerById={playerById} onUpdate={onUpdate} />
          )}
        </div>

        <div>
          {/* Detalle pendiente: motivo de tarjeta o zona de la falta */}

              </div>

          <div className="mb-5 flex flex-col gap-3">
            {liveEventSections.map((section) => (
              <div key={section.title}>
                <div
                  className="text-xs uppercase tracking-wide mb-1.5 font-semibold"

      {/* Cronología: colapsada por defecto para no robarle espacio a los botones de evento */}
      {tab === "jugadores" && (
        <div className="mt-4">
          <button
            onClick={() => setShowTimeline((v) => !v)}
            className="mp-btn mp-btn-outline w-full py-2.5 text-sm"
