function PlayerStatsCharts({ players, events, matches }) {
  const withStats = players.map((p) => {
    const matchesPlayed = matches
      ? matches.filter((m) => m.onPitch.includes(p.id) || m.bench.includes(p.id)).length
      : 0;
    return { p, s: computePlayerStats(p.id, events), matchesPlayed };
  });

  function rowsFor(pick, format) {
    return withStats
      .map(({ p, s }) => {
        const raw = pick(s) || 0;
        return { label: p.name, raw, display: format ? format(raw) : String(raw) };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  // Como rowsFor, pero además añade debajo del porcentaje el número real de aciertos sobre el total
  function rowsForPct(pctPick, wonPick, totalPick) {
    return withStats
      .map(({ p, s }) => {
        const raw = pctPick(s) || 0;
        const won = wonPick(s) || 0;
        const total = totalPick(s) || 0;
        return { label: p.name, raw, display: `${raw}%`, sub: total > 0 ? `${won} de ${total}` : null };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  // Media por partido jugado (en vez del total), con el total real debajo
  function rowsForAvg(pick) {
    return withStats
      .map(({ p, s, matchesPlayed }) => {
        const total = pick(s) || 0;
        // Sin lista de partidos (p.ej. gráficos de un solo partido) no hay media que calcular: se muestra el total
        if (!matches) {
          return { label: p.name, raw: total, display: String(total) };
        }
        const raw = matchesPlayed > 0 ? Math.round((total / matchesPlayed) * 10) / 10 : 0;
        return {
          label: p.name,
          raw,
          display: raw.toFixed(1),
          sub: matchesPlayed > 0 ? `${total} en ${matchesPlayed} partido${matchesPlayed === 1 ? "" : "s"}` : null,
        };
      })
      .filter((r) => r.raw > 0)
      .sort((a, b) => b.raw - a.raw);
  }

  const charts = [
    { title: "Goles", color: "var(--turf)", rows: rowsFor((s) => s.goles) },
    { title: "Asistencias", color: "var(--turf)", rows: rowsFor((s) => s.asistencias) },
    {
      title: "Duelos ganados",
      color: "var(--cielo)",
      rows: rowsForPct((s) => s.duelosPct, (s) => s.duelosGanados, (s) => s.duelosTotales),
    },
    {
      title: "Regates acertados",
      color: "var(--cielo)",
      rows: rowsForPct((s) => s.regatesPct, (s) => s.regatesOk, (s) => s.regatesTotales),
    },
    { title: "Recuperaciones por partido", color: "var(--cielo)", rows: rowsForAvg((s) => s.robos) },
    { title: "Balones perdidos por partido", color: "var(--crimson)", rows: rowsForAvg((s) => s.perdidas) },
    { title: "Paradas (portero)", color: "var(--violet)", rows: rowsFor((s) => s.paradas) },
    { title: "Goles encajados (portero)", color: "var(--crimson)", rows: rowsFor((s) => s.golesEncajados) },
  ].filter((c) => c.rows.length > 0);

  const hasCards = withStats.some(({ s }) => s.amarillas > 0 || s.rojas > 0);

  if (charts.length === 0 && !hasCards) {
    return (
      <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
        Aún no hay suficientes eventos registrados para mostrar gráficos.
      </div>
    );
  }

  return (
    <div className="grid gap-2 sm:grid-cols-2 lg:grid-cols-3">
      <CardsChart withStats={withStats} />
      {charts.map((c) => (
        <PlayerBarChart key={c.title} title={c.title} color={c.color} rows={c.rows} />
      ))}
    </div>
  );
}

function SeasonStats({ matches, squad, onBack, onGoCharts }) {
  const [showTeamStats, setShowTeamStats] = useState(false);
  const [showPlayerStats, setShowPlayerStats] = useState(false);
  const allSeasonEvents = matches.flatMap((m) => m.events);

  const stats = {};
  let matchesWithEvents = 0;

  matches.forEach((m) => {
    if (m.events.length > 0) matchesWithEvents += 1;
    m.events
      .filter((e) => e.type !== "pase_clave")
      .forEach((e) => {
        if (!stats[e.playerId]) {
          stats[e.playerId] = { number: e.playerNumber, name: e.playerName, counts: {} };
        }
        stats[e.playerId].counts[e.type] = (stats[e.playerId].counts[e.type] || 0) + 1;
      });
  });

  const rows = Object.values(stats)
    .map((r) => {
      const goles = ALL_GOAL_TYPES.reduce((sum, t) => sum + (r.counts[t] || 0), 0);
      const asistencias = r.counts["asistencia"] || 0;
      return { ...r, goles, asistencias, golesAsistencias: goles + asistencias };
    })
    .filter((r) => r.golesAsistencias > 0)
    .sort((a, b) => b.golesAsistencias - a.golesAsistencias);

  return (
    <div className="max-w-4xl mx-auto p-4 pb-10">
      <div className="flex items-center gap-3 mb-4 pt-2">
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver

        <div>
          <h1 className="display text-2xl font-semibold">Estadísticas de temporada</h1>
          <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
            {matches.length} partido{matches.length === 1 ? "" : "s"} registrado{matches.length === 1 ? "" : "s"}
            {matchesWithEvents > 0 && ` · ${matchesWithEvents} con eventos`}

      {rows.length === 0 ? (
        <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>

      ) : (
        <div className="mp-scroll overflow-x-auto">
          <table className="text-sm w-full" style={{ borderCollapse: "collapse" }}>
            <thead>
              <tr>
                <th className="text-left p-2" style={{ color: "var(--chalk-dim)" }}>Jugador</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Goles</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Asistencias</th>
                <th className="text-center p-2 whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>Goles+Asistencias</th>
              </tr>
            </thead>
            <tbody>
              {rows.map((r) => (
                <tr key={r.number + r.name} className="mp-card">
                  <td className="p-2 whitespace-nowrap">#{r.number} {r.name}</td>
                  <td className="text-center p-2">{r.goles || "–"}</td>
                  <td className="text-center p-2">{r.asistencias || "–"}</td>
                  <td className="text-center p-2 font-semibold">{r.golesAsistencias}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <button
        onClick={() => setShowTeamStats((v) => !v)}
        className="mp-btn mp-btn-outline w-full py-2.5 text-sm mt-4 mb-2"
      >
        {showTeamStats ? "Ocultar estadísticas del equipo" : "Ver estadísticas del equipo"}
      </button>
      {showTeamStats && (
        matches.length === 0 ? (
          <div className="mp-card p-4 text-sm mb-2" style={{ color: "var(--chalk-dim)" }}>
            Aún no hay partidos registrados.
          </div>
        ) : (
          <div className="mb-2">
            <SeasonTeamStats matches={matches} />
          </div>
        )
      )}

      <button
        onClick={() => setShowPlayerStats((v) => !v)}
        className="mp-btn mp-btn-outline w-full py-2.5 text-sm mb-2"
      >
        {showPlayerStats ? "Ocultar estadísticas por jugador" : "Ver estadísticas por jugador"}
      </button>
      {showPlayerStats && <PlayerStatsAccordion players={squad} events={allSeasonEvents} matches={matches} />}

/* ---------------------------------------------------------
   Pantalla: Balón parado
--------------------------------------------------------- */
function cornerConcededCount(match) {
  const legacy = (match.concededSetPieces || []).filter((e) => (e.origin || "corner") === "corner").length;
  const fromGoalkeeperEvent = match.events.filter((e) => e.type === "gol_encajado" && e.origen === "corner").length;
  return legacy + fromGoalkeeperEvent;
}

/* ---------------------------------------------------------
   Medio campo: colocar a cada jugador según su posición
   en las jugadas de balón parado (córner o falta, a favor o en contra)
--------------------------------------------------------- */
function SetPieceBoard({ positions, squad, onSave }) {
  const [selectedId, setSelectedId] = useState(null);
  const pitchRef = useRef(null);

  function playerById(id) {
    return squad.find((p) => p.id === id) || { id, number: "?", name: "Desconocido" };
  }

  const placedIds = squad.map((p) => p.id).filter((id) => positions[id]);
  const unplacedIds = squad.map((p) => p.id).filter((id) => !positions[id]);

  function setPosition(playerId, coords) {
    onSave({ ...positions, [playerId]: coords });
  }

  function clearPosition(playerId) {
    const next = { ...positions };
    delete next[playerId];
    onSave(next);
  }

  function handleSelect(id) {
    setSelectedId((prev) => (prev === id ? null : id));
  }

  function handlePitchClick(e) {
    if (!selectedId || !pitchRef.current) return;
    const rect = pitchRef.current.getBoundingClientRect();
    const x = ((e.clientX - rect.left) / rect.width) * 100;
    const y = ((e.clientY - rect.top) / rect.height) * 100;
    setPosition(selectedId, {
      x: Math.min(97, Math.max(3, x)),
      y: Math.min(94, Math.max(3, y)),
    });
    setSelectedId(null);
  }

  if (squad.length === 0) {
    return (
      <div className="mp-card p-4 text-sm" style={{ color: "var(--chalk-dim)" }}>
        Añade jugadores a la plantilla para poder colocarlos en el campo.
      </div>
    );
  }

  return (
    <div>
      <div className="mb-1 text-xs" style={{ color: "var(--chalk-dim)" }}>
        {selectedId
          ? `Toca el campo para colocar a ${selectedId === "ball" ? "el balón" : playerById(selectedId).name}`
          : "Toca un jugador o el balón y luego el campo para colocarlo"}
      </div>

      <div
        ref={pitchRef}
        onClick={handlePitchClick}
        className="relative w-full mx-auto mb-3"
        style={{
          maxWidth: 620,
          aspectRatio: "68 / 50",
          background: "#2E7D32",
          borderRadius: 12,
          border: "2px solid rgba(255,255,255,0.55)",
          overflow: "hidden",
        }}
      >
        {/* Portería */}
        <div
          style={{
            position: "absolute",
            left: "50%",
            top: 0,
            width: "22%",
            height: "2.5%",
            marginLeft: "-11%",
            background: "rgba(255,255,255,0.55)",
          }}
        />
        {/* Área pequeña */}
        <div
          style={{
            position: "absolute",
            left: "50%",
            top: 0,
            width: "30%",
            height: "20%",

function SetPieceCategoryEditor({ plays, squad, onSave }) {
  const [activePlayId, setActivePlayId] = useState(plays[0] ? plays[0].id : null);

  const activePlay = plays.find((pl) => pl.id === activePlayId) || null;

  function addPlay() {
    const newPlay = { id: genId(), name: `Jugada ${plays.length + 1}`, positions: {} };
    onSave([...plays, newPlay]);
    setActivePlayId(newPlay.id);
  }

  function renamePlay(id, name) {
    onSave(plays.map((pl) => (pl.id === id ? { ...pl, name } : pl)));
  }

  function removePlay(id) {
    if (!window.confirm("¿Eliminar esta jugada?")) return;
    const updated = plays.filter((pl) => pl.id !== id);
    onSave(updated);
    setActivePlayId(updated[0] ? updated[0].id : null);
  }

  function savePositions(id, positions) {
    onSave(plays.map((pl) => (pl.id === id ? { ...pl, positions } : pl)));
  }

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-3">
        {plays.map((pl) => (
          <button
            key={pl.id}
            onClick={() => setActivePlayId(pl.id)}

            <div className="flex-1">

/* ---------------------------------------------------------
   Pantalla: Campo (pizarra táctica a pantalla completa)
   Campo entero en horizontal a todo el ancho de la pantalla, con la
   plantilla y los 11 rivales en filas debajo del campo (la pantalla
   hace scroll). Las fichas se arrastran al campo. Incluye un balón,
   un lápiz con varios colores y una goma.
--------------------------------------------------------- */
const PITCH_BOARD_KEY = "rp_pitch_board_v4";
const PITCH_COLORS = [
  { id: "white", value: "#FFFFFF" },
  { id: "amber", value: "#FFD23F" },
  { id: "crimson", value: "#FF4D4D" },
  { id: "cielo", value: "#4DB2FF" },
  { id: "violet", value: "#C08BFF" },
  { id: "black", value: "#111111" },
];
const PITCH_LINE = "rgba(255,255,255,0.7)";
const RIVAL_IDS = Array.from({ length: 11 }, (_, i) => `rival_${i + 1}`);
const TRAY_TOP = 71;
const TRAY_LABEL_W = 14;
const TRAY_COL_W = 6.4;
const TRAY_COLS = Math.floor((105 - TRAY_LABEL_W) / TRAY_COL_W);
const TRAY_ROW_H = 9.6;
const ERASER_RADIUS = 3;

function loadPitchBoard() {
  try {
    const parsed = JSON.parse(localStorage.getItem(PITCH_BOARD_KEY) || "null");
    return { positions: parsed?.positions || {}, strokes: parsed?.strokes || [] };
  } catch (e) {
    return { positions: {}, strokes: [] };
  }
}

// Reparto: campo (coordenadas 0..105 x 0..68) y debajo una franja para mi equipo y otra para el rival
function pitchLayout(squadSize) {
  const rowsA = Math.max(1, Math.ceil(squadSize / TRAY_COLS));
  const rowsB = Math.max(1, Math.ceil(RIVAL_IDS.length / TRAY_COLS));
  const hA = rowsA * TRAY_ROW_H + 0.8;
  const hB = rowsB * TRAY_ROW_H + 0.8;
  const topB = TRAY_TOP + hA + 1;
  const bottom = topB + hB;
  return { topA: TRAY_TOP, hA, topB, hB, vbX: -2, vbY: -1, vbW: 109, vbH: bottom + 1.5 + 1 };
}

// Posiciones iniciales: plantilla y rivales en las franjas de debajo del campo
function defaultPitchPositions(squad, layout) {
  const positions = { ball: { x: 52.5, y: 34 } };
  const place = (ids, top) => {
    ids.forEach((id, i) => {
      positions[id] = {
        x: TRAY_LABEL_W + (i % TRAY_COLS + 0.5) * TRAY_COL_W,
        y: top + 3.9 + Math.floor(i / TRAY_COLS) * TRAY_ROW_H,
      };
    });
  };
  place(squad.map((p) => p.id), layout.topA);
  place(RIVAL_IDS, layout.topB);
  return positions;
}

function distToSegment(p, a, b) {
  const dx = b[0] - a[0];
  const dy = b[1] - a[1];
  const lenSq = dx * dx + dy * dy;
  const t = lenSq === 0 ? 0 : Math.max(0, Math.min(1, ((p.x - a[0]) * dx + (p.y - a[1]) * dy) / lenSq));
  return Math.hypot(p.x - (a[0] + t * dx), p.y - (a[1] + t * dy));
}

// Mientras se dibuja o borra, un gesto que empieza sobre el campo no debe hacer scroll de la pantalla
// (Safari en iPad no siempre respeta touch-action, así que se cancela también el touchmove)
function useBlockTouchScroll(ref, active) {
  useEffect(() => {
    const el = ref.current;
    if (!el || !active) return;
    const block = (e) => e.preventDefault();
    el.addEventListener("touchmove", block, { passive: false });
    return () => el.removeEventListener("touchmove", block);
  }, [active]);
}

function strokePath(pts) {
  return pts.length === 1
    ? `M ${pts[0][0]} ${pts[0][1]} l 0.01 0`
    : "M " + pts.map((p) => `${p[0]} ${p[1]}`).join(" L ");
}

function strokeTouches(stroke, p) {
  const reach = ERASER_RADIUS + stroke.width / 2;
  if (stroke.pts.length === 1) return Math.hypot(p.x - stroke.pts[0][0], p.y - stroke.pts[0][1]) <= reach;
  for (let i = 1; i < stroke.pts.length; i++) {
    if (distToSegment(p, stroke.pts[i - 1], stroke.pts[i]) <= reach) return true;
  }
  return false;
}

function PitchLines() {

      {/* Córners */}

function PitchScreen({ squad, crests, onBack }) {
  const initial = useRef(null);
  if (!initial.current) initial.current = loadPitchBoard();
  // Solo se guardan las fichas que el usuario ha movido; el resto sigue el reparto por defecto
  const [positions, setPositions] = useState(initial.current.positions);
  const [strokes, setStrokes] = useState(initial.current.strokes);
  const [mode, setMode] = useState("mover");
  const [color, setColor] = useState(PITCH_COLORS[1].value);
  const [thick, setThick] = useState(false);
  const [eraserPos, setEraserPos] = useState(null);
  const scrollRef = useRef(null);
  const svgRef = useRef(null);
  const dragRef = useRef(null);
  const drawingRef = useRef(false);
  const erasingRef = useRef(false);
  useBlockTouchScroll(svgRef, mode !== "mover");

  // Nuestro escudo en blanco, pintado en el centro del campo
  const [centerCrest, setCenterCrest] = useState(null);
  const ownCrestSrc = crests && crests.own;
  useEffect(() => {
    let alive = true;
    if (!ownCrestSrc) {
      setCenterCrest(null);
      return undefined;
    }
    whiteCrest(ownCrestSrc).then((url) => alive && setCenterCrest(url));
    return () => {
      alive = false;
    };
  }, [ownCrestSrc]);

  useEffect(() => {
    try {
      localStorage.setItem(PITCH_BOARD_KEY, JSON.stringify({ positions, strokes }));
    } catch (e) {}
  }, [positions, strokes]);

  const layout = pitchLayout(squad.length);
  const tokenIds = [...squad.map((p) => p.id), ...RIVAL_IDS];
  const defaults = defaultPitchPositions(squad, layout);
  const clampPos = (p) => ({
    x: Math.min(layout.vbX + layout.vbW - 1, Math.max(layout.vbX + 1, p.x)),
    y: Math.min(layout.vbY + layout.vbH - 1, Math.max(layout.vbY + 1, p.y)),
  });
  const posOf = (id) => clampPos(positions[id] || defaults[id]);

  function toSvgPoint(e) {
    const svg = svgRef.current;
    const pt = svg.createSVGPoint();
    pt.x = e.clientX;
    pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: Math.round(p.x * 100) / 100, y: Math.round(p.y * 100) / 100 };
  }

  function erase(p) {
    setStrokes((prev) => {
      const next = prev.filter((s) => !strokeTouches(s, p));
      return next.length === prev.length ? prev : next;
    });
  }

  function handleTokenDown(e, id) {
    if (mode !== "mover") return;
    e.stopPropagation();
    e.currentTarget.setPointerCapture(e.pointerId);
    dragRef.current = id;
  }

  function handleMove(e) {
    if (mode === "mover" && dragRef.current) {
      const id = dragRef.current;
      const p = clampPos(toSvgPoint(e));
      setPositions((prev) => ({ ...prev, [id]: p }));
    } else if (mode === "dibujar" && drawingRef.current) {
      const p = toSvgPoint(e);
      setStrokes((prev) => {
        const last = prev[prev.length - 1];
        return [...prev.slice(0, -1), { ...last, pts: [...last.pts, [p.x, p.y]] }];
      });
    } else if (mode === "goma") {
      const p = toSvgPoint(e);
      setEraserPos(p);
      if (erasingRef.current) erase(p);
    }
  }

  function handleDown(e) {
    if (mode === "dibujar") {
      e.currentTarget.setPointerCapture(e.pointerId);
      const p = toSvgPoint(e);
      drawingRef.current = true;
      setStrokes((prev) => [...prev, { color, width: thick ? 1.1 : 0.5, pts: [[p.x, p.y]] }]);
    } else if (mode === "goma") {
      e.currentTarget.setPointerCapture(e.pointerId);
      const p = toSvgPoint(e);
      erasingRef.current = true;
      setEraserPos(p);
      erase(p);
    }
  }

  function handleUp() {
    dragRef.current = null;
    drawingRef.current = false;
    erasingRef.current = false;
  }

  function resetTokens() {
    if (!window.confirm("¿Volver a colocar a todos los jugadores y el balón en su sitio inicial?")) return;
    setPositions({});
  }

  // La pantalla hace scroll (campo a todo el ancho): salta entre el campo y las fichas de debajo
  function toggleScroll() {
    const el = scrollRef.current;
    if (!el) return;
    const atTop = el.scrollTop < 20;
    el.scrollTo({ top: atTop ? el.scrollHeight : 0, behavior: "smooth" });
  }

  const modeBtn = (id, label) => (
    <button
      onClick={() => setMode(id)}
      className="mp-btn px-3 py-2 text-sm"
      style={mode === id ? { background: "var(--turf)", color: "#0F1B14", border: "none" } : {}}
    >
      {label}
    </button>
  );

  const tokenStyle = {
    cursor: mode === "mover" ? "grab" : "crosshair",
    pointerEvents: mode === "mover" ? "auto" : "none",
  };
  const ballPos = posOf("ball");

  return (
    <div
      style={{
        position: "fixed",
        inset: 0,
        zIndex: 40,
        display: "flex",
        flexDirection: "column",
        background: "var(--pitch)",
      }}
    >
      <div
        className="flex items-center gap-2 px-3 py-2"
        style={{ flexWrap: "wrap", borderBottom: "1px solid rgba(244,241,232,0.1)" }}
      >
        <button onClick={onBack} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Volver
        </button>
        {modeBtn("mover", "✋ Mover")}
        {modeBtn("dibujar", "✏️ Lápiz")}
        {modeBtn("goma", "🧽 Goma")}
        <div className="flex items-center gap-2" style={{ opacity: mode === "dibujar" ? 1 : 0.5 }}>
          {PITCH_COLORS.map((c) => (
            <button
              key={c.id}
              aria-label={`Color ${c.id}`}
              onClick={() => {
                setColor(c.value);
                setMode("dibujar");
              }}
              style={{
                width: 28,
                height: 28,
                borderRadius: 999,
                background: c.value,
                border: color === c.value ? "3px solid var(--cielo)" : "2px solid rgba(244,241,232,0.4)",
              }}
            />
          ))}
          <button onClick={() => setThick((t) => !t)} className="mp-btn px-2 py-1 text-xs">
            {thick ? "Trazo grueso" : "Trazo fino"}
          </button>
        </div>
        <button
          onClick={() => setStrokes((s) => s.slice(0, -1))}
          disabled={strokes.length === 0}
          className="mp-btn px-3 py-2 text-sm disabled:opacity-40"
        >
          Deshacer
        </button>
        <button
          onClick={() => setStrokes([])}
          disabled={strokes.length === 0}
          className="mp-btn px-3 py-2 text-sm disabled:opacity-40"
          style={{ color: "var(--crimson)" }}
        >
          Borrar todo
        </button>
        <button onClick={resetTokens} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          Recolocar
        </button>
        <button onClick={toggleScroll} className="mp-btn mp-btn-outline px-3 py-2 text-sm">
          ⇅ Campo / Fichas
        </button>
      </div>

      <div ref={scrollRef} style={{ flex: 1, minHeight: 0, overflowY: "auto" }}>
        <svg
          ref={svgRef}
          viewBox={`${layout.vbX} ${layout.vbY} ${layout.vbW} ${layout.vbH}`}
          onPointerDown={handleDown}
          onPointerMove={handleMove}
          onPointerUp={handleUp}
          onPointerCancel={handleUp}
          onPointerLeave={() => setEraserPos(null)}
          style={{
            display: "block",
            width: "100%",
            height: "auto",
            aspectRatio: `${layout.vbW} / ${layout.vbH}`,
            touchAction: "none",
            userSelect: "none",
            WebkitUserSelect: "none",
            cursor: mode === "mover" ? "default" : "crosshair",
          }}
        >
          <PitchLines />
          {centerCrest && (
            <image
              href={centerCrest}
              x="45.5"
              y="27"
              width="14"
              height="14"
              preserveAspectRatio="xMidYMid meet"
              opacity="0.85"
              style={{ pointerEvents: "none" }}
            />
          )}

          {/* Franjas de fichas debajo del campo */}
          <rect x="0" y={layout.topA} width="105" height={layout.hA} rx="1.5" fill="rgba(244,241,232,0.1)" />
          <rect x="0" y={layout.topB} width="105" height={layout.hB} rx="1.5" fill="rgba(209,55,62,0.2)" />
          <text
            x="1.2"
            y={layout.topA + layout.hA / 2}
            dominantBaseline="central"
            fontSize="2.3"
            fontWeight="700"
            fill="rgba(244,241,232,0.85)"
          >
            MI EQUIPO
          </text>
          <text
            x="1.2"
            y={layout.topB + layout.hB / 2}
            dominantBaseline="central"
            fontSize="2.3"
            fontWeight="700"
            fill="rgba(244,241,232,0.85)"
          >
            RIVAL
          </text>

          {tokenIds.map((id) => {
            const pos = posOf(id);
            const rival = id.startsWith("rival_");
            const player = rival ? null : squad.find((p) => p.id === id);
            const label = rival ? id.split("_")[1] : player.number;
            return (
              <g
                key={id}
                transform={`translate(${pos.x} ${pos.y})`}
                onPointerDown={(e) => handleTokenDown(e, id)}
                style={tokenStyle}
              >
                <circle r="2.9" fill={rival ? "#D1373E" : "#F4F1E8"} stroke={rival ? "#7A1B20" : "#16241C"} strokeWidth="0.3" />
                <text
                  textAnchor="middle"
                  dominantBaseline="central"
                  fontSize="3.1"
                  fontWeight="700"
                  fontFamily="Oswald, sans-serif"
                  fill={rival ? "#FFFFFF" : "#16241C"}
                  style={{ pointerEvents: "none" }}
                >
                  {label}
                </text>
                {player && (
                  <text
                    y="5.6"
                    textAnchor="middle"
                    fontSize="2"
                    fontWeight="600"
                    fill="#FFFFFF"
                    stroke="rgba(0,0,0,0.6)"
                    strokeWidth="0.5"
                    paintOrder="stroke"
                    style={{ pointerEvents: "none" }}
                  >
                    {player.name.split(" ")[0].slice(0, 6)}
                  </text>
                )}
              </g>
            );
          })}

          {/* Balón */}
          <g
            transform={`translate(${ballPos.x} ${ballPos.y})`}
            onPointerDown={(e) => handleTokenDown(e, "ball")}
            style={tokenStyle}
          >
            <circle r="2.2" fill="#FFFFFF" stroke="#111" strokeWidth="0.3" />
            <text textAnchor="middle" dominantBaseline="central" fontSize="3.6" style={{ pointerEvents: "none" }}>
              ⚽
            </text>
          </g>

          {/* Dibujo (por encima de las fichas) */}
          <g style={{ pointerEvents: "none" }}>
            {strokes.map((s, i) => (
              <path
                key={i}
                d={strokePath(s.pts)}
                fill="none"
                stroke={s.color}
                strokeWidth={s.width}
                strokeLinecap="round"
                strokeLinejoin="round"
              />
            ))}
            {mode === "goma" && eraserPos && (
              <circle
                cx={eraserPos.x}
                cy={eraserPos.y}
                r={ERASER_RADIUS}
                fill="rgba(255,255,255,0.15)"
                stroke="#FFFFFF"
                strokeWidth="0.3"
                strokeDasharray="0.8 0.6"
              />
            )}
          </g>
        </svg>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   App principal
--------------------------------------------------------- */
function App() {
  const [view, setView] = useState("home");
  const [data, setData] = useState(loadLocalData);
  const [match, setMatch] = useState(null);
  const [teamCode, setTeamCodeState] = useState(getStoredTeamCode);
  const [supabaseConfig, setSupabaseConfig] = useState(getStoredSupabaseConfig);
  const [syncStatus, setSyncStatus] = useState("unconfigured");
  const [lastSyncedAt, setLastSyncedAt] = useState(null);
  const [calendarImport, setCalendarImport] = useState({ loading: false, message: null });
  const [crestImport, setCrestImport] = useState({ loading: false, message: null });

  const configured = isValidSupabaseConfig(supabaseConfig.url, supabaseConfig.key);

  const dataRef = useRef(data);
  const teamCodeRef = useRef(teamCode);
  const matchRef = useRef(match);
  const pushTimerRef = useRef(null);
  const supabaseRef = useRef(null);
  const deviceId = useRef(getDeviceId()).current;

  useEffect(() => { dataRef.current = data; }, [data]);
  useEffect(() => { teamCodeRef.current = teamCode; }, [teamCode]);
  useEffect(() => { matchRef.current = match; }, [match]);

  // Crea (o recrea) el cliente de Supabase cuando cambia la configuración
  useEffect(() => {
    if (configured && window.supabase) {
      supabaseRef.current = window.supabase.createClient(supabaseConfig.url, supabaseConfig.key);
      setSyncStatus(teamCodeRef.current ? "synced" : "no-code");
    } else {
      supabaseRef.current = null;
      setSyncStatus("unconfigured");
    }
  }, [configured, supabaseConfig.url, supabaseConfig.key]);

  /* --- Sincronización con Supabase --- */

  function computeStatus() {
    if (!configured) return "unconfigured";
    if (!teamCodeRef.current) return "no-code";
    if (!navigator.onLine) return "offline";
    return "synced";
  }

  async function pushToSupabase(stamped) {
    if (!supabaseRef.current || !teamCodeRef.current) return;
    setSyncStatus("syncing");
    try {
      const { error } = await supabaseRef.current.from(TABLE).upsert({
        team_code: teamCodeRef.current,
        data: stamped,
        device_id: deviceId,
        updated_at: new Date(stamped.updatedAt).toISOString(),
      });
      if (error) throw error;
      setSyncStatus("synced");
      setLastSyncedAt(Date.now());
    } catch (e) {
      console.error("Error sincronizando con Supabase", e);
      setSyncStatus("error");
    }
  }

  function scheduleSync(stamped, immediate) {
    if (!supabaseRef.current || !teamCodeRef.current) return;
    if (pushTimerRef.current) {
      clearTimeout(pushTimerRef.current);
      pushTimerRef.current = null;
    }
    if (immediate) {
      pushToSupabase(stamped);
    } else {
      pushTimerRef.current = setTimeout(() => {
        pushToSupabase(dataRef.current);
      }, 1500);
    }
  }

  function applyRemoteData(remoteData, remoteUpdatedAt) {
    const merged = { ...emptyData(), ...remoteData, updatedAt: remoteUpdatedAt };
    setData(merged);
    dataRef.current = merged;
    saveLocalData(merged);
    if (matchRef.current) {
      const refreshed = merged.matchesById[matchRef.current.id];
      if (refreshed) setMatch(refreshed);
    }
  }

  async function pullFromSupabase() {
    if (!supabaseRef.current || !teamCodeRef.current) return;
    setSyncStatus("syncing");
    try {
      const { data: row, error } = await supabaseRef.current
        .from(TABLE)
        .select("data, updated_at")
        .eq("team_code", teamCodeRef.current)
        .maybeSingle();
      if (error) throw error;
      if (row && row.data) {
        const remoteUpdatedAt = new Date(row.updated_at).getTime();
        if (remoteUpdatedAt > dataRef.current.updatedAt) {
          applyRemoteData(row.data, remoteUpdatedAt);
        } else if (dataRef.current.updatedAt > remoteUpdatedAt) {
          await pushToSupabase(dataRef.current);
        }
      } else {
        await pushToSupabase(dataRef.current);
      }
      setSyncStatus("synced");
      setLastSyncedAt(Date.now());
    } catch (e) {
      console.error("Error sincronizando con Supabase", e);
      setSyncStatus("error");
    }
  }

  function saveTeamCode(code) {
    setStoredTeamCode(code);
    setTeamCodeState(code);
    teamCodeRef.current = code;
    setSyncStatus(computeStatus());
    if (code) pullFromSupabase();
  }

  function saveSupabaseConfig(url, key) {
    setStoredSupabaseConfig(url, key);
    setSupabaseConfig({ url, key });
  }

  // Sincroniza al arrancar y suscribe a cambios en tiempo real
  useEffect(() => {
    if (!supabaseRef.current || !teamCode) return;
    pullFromSupabase();

    const channel = supabaseRef.current
      .channel(`registro_partido_${teamCode}`)
      .on(
        "postgres_changes",
        { event: "*", schema: "public", table: TABLE, filter: `team_code=eq.${teamCode}` },
        (payload) => {
          const row = payload.new;
          if (!row || row.device_id === deviceId) return;
          const remoteUpdatedAt = new Date(row.updated_at).getTime();
          if (remoteUpdatedAt > dataRef.current.updatedAt) {
            applyRemoteData(row.data, remoteUpdatedAt);
          }
        }
      )
      .subscribe();

    return () => {
      supabaseRef.current.removeChannel(channel);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [teamCode, configured, supabaseConfig.url, supabaseConfig.key]);

  // Reintenta al recuperar conexión / volver a la pestaña
  useEffect(() => {
    function handleOnline() { pullFromSupabase(); }
    function handleVisibility() {
      if (document.hidden && pushTimerRef.current) {
        clearTimeout(pushTimerRef.current);
        pushTimerRef.current = null;
        pushToSupabase(dataRef.current);
      } else if (!document.hidden) {
        pullFromSupabase();
      }
    }
    window.addEventListener("online", handleOnline);
    document.addEventListener("visibilitychange", handleVisibility);
    return () => {
      window.removeEventListener("online", handleOnline);
      document.removeEventListener("visibilitychange", handleVisibility);
    };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  /* --- Mutación central de datos --- */

  function commit(nextData, { syncNow = true } = {}) {
    const stamped = { ...nextData, updatedAt: Date.now() };
    setData(stamped);
    dataRef.current = stamped;
    saveLocalData(stamped);
    scheduleSync(stamped, syncNow);
  }

  function saveSquad(updatedSquad) {
    commit({ ...dataRef.current, squad: updatedSquad });
  }

  function saveSetPiecePositions(category, positions) {
    commit({
      ...dataRef.current,
      setPiecePositions: { ...(dataRef.current.setPiecePositions || {}), [category]: positions },
    });
  }

  // kind: "own" (nuestro escudo) o "rival" (el del equipo `name`)
  async function saveCrest(kind, name, dataUrl) {
    dataUrl = await removeWhiteBackground(dataUrl);
    const crests = dataRef.current.crests || emptyCrests();
    const next =
      kind === "own"
        ? { ...crests, own: dataUrl, ownNoBg: true }
        : { ...crests, rivals: { ...crests.rivals, [crestKey(name)]: dataUrl } };
    commit({ ...dataRef.current, crests: next });
  }

  // Los escudos ya guardados (de antes de este cambio) también pierden el fondo blanco, una sola vez
  useEffect(() => {
    const c = data.crests;
    if (!c || (c.ownNoBg && c.rivalsNoBg)) return;
    (async () => {
      const own = c.own && !c.ownNoBg ? await removeWhiteBackground(c.own) : c.own;
      let rivals = c.rivals;
      if (!c.rivalsNoBg) {
        const entries = await Promise.all(
          Object.entries(c.rivals).map(async ([k, v]) => [k, await removeWhiteBackground(v)])
        );
        rivals = Object.fromEntries(entries);
      }
      const cur = dataRef.current.crests;
      if (cur && cur.own === c.own && cur.rivals === c.rivals) {
        commit({ ...dataRef.current, crests: { ...cur, own, ownNoBg: true, rivals, rivalsNoBg: true } });
      }
    })();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [data.crests]);

  // Descarga de la FFCV los escudos de todos los equipos del grupo (el nuestro incluido).
  // Solo rellena los que aún no tienen escudo: los que hayas elegido a mano no se tocan.
  async function importFfcvCrests() {
    setCrestImport({ loading: true, message: null });
    try {
      const r = await fetch("/api/clasificacion");
      const body = await r.json();
      if (!r.ok) throw new Error(body.error || "No se pudo consultar la FFCV");
      const teams = (body.clasificacion || []).filter((t) => t.escudo);
      const base = dataRef.current.crests || emptyCrests();
      const missing = teams.filter((t) =>
        t.codequipo === LEAGUE_TEAM_CODE ? !base.own : !base.rivals[crestKey(t.nombre)]
      );
      const results = await Promise.all(
        missing.map(async (t) => {
          try {
            const ir = await fetch("/api/escudo?p=" + encodeURIComponent(t.escudo));
            if (!ir.ok) throw new Error("sin imagen");
            return { team: t, url: await removeWhiteBackground(await resizeCrest(await ir.blob())) };
          } catch (e) {
            return { team: t, url: null };
          }
        })
      );
      const current = dataRef.current.crests || emptyCrests();
      let own = current.own;
      const rivals = { ...current.rivals };
      let added = 0;
      let failed = 0;
      results.forEach(({ team, url }) => {
        if (!url) {
          failed++;
          return;
        }
        if (team.codequipo === LEAGUE_TEAM_CODE) own = url;
        else rivals[crestKey(team.nombre)] = url;
        added++;
      });
      const ownChanged = own !== current.own;
      if (added > 0) {
        const latest = dataRef.current.crests || emptyCrests();
        commit({
          ...dataRef.current,
          crests: { ...latest, own: ownChanged ? own : latest.own, ownNoBg: ownChanged ? true : latest.ownNoBg, rivals: { ...latest.rivals, ...rivals } },
        });
      }
      const msg =
        added === 0 && failed === 0
          ? "Ya tienes los escudos de todos los equipos del grupo."
          : `Escudos descargados de la FFCV: ${added}.` + (failed ? ` No se pudieron descargar ${failed}.` : "");
      setCrestImport({ loading: false, message: msg });
    } catch (e) {
      setCrestImport({ loading: false, message: `Error: ${e.message || "no se pudieron descargar los escudos"}` });
    }
  }

  function goHome() {
    setMatch(null);
    setView("home");
  }

  function createMatch({ opponent, date, halfLength, titulares, isHome }) {
    const squad = dataRef.current.squad;
    const scheduled = date > todayISO();
    const bench = squad.filter((p) => !titulares.includes(p.id)).map((p) => p.id);
    const newMatch = {
      id: genId(),
      opponent,
      date,
      halfLength,
      half: 1,
      finished: false,
      scheduled,
      isHome,
      clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1, runStartedAt: null },
      onPitch: titulares,
      bench,
      events: [],
      subs: [],
      concededSetPieces: [],
      teamEvents: [],
      opponentChances: [],
      positions: {},
    };
    const updatedList = [
      ...dataRef.current.matchesList,
      { id: newMatch.id, opponent, date, finished: false, scheduled, isHome },
    ];
    commit({
      ...dataRef.current,
      matchesList: updatedList,
      matchesById: { ...dataRef.current.matchesById, [newMatch.id]: newMatch },
    });
    if (scheduled) {
      setMatch(null);
      setView("home");
    } else {
      setMatch(newMatch);
      setView("live");
    }
  }

  function beginScheduledMatch(titulares) {
    const squad = dataRef.current.squad;
    const bench = squad.filter((p) => !titulares.includes(p.id)).map((p) => p.id);
    const updated = {
      ...match,
      scheduled: false,
      half: 1,
      onPitch: titulares,
      bench,
      clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1, runStartedAt: null },
    };
    setMatch(updated);
    const updatedList = dataRef.current.matchesList.map((m) =>
      m.id === updated.id ? { ...m, scheduled: false } : m
    );
    commit({
      ...dataRef.current,
      matchesList: updatedList,
      matchesById: { ...dataRef.current.matchesById, [updated.id]: updated },
    });
    setView("live");
  }

  function openMatch(id) {
    const m = dataRef.current.matchesById[id];
    if (!m) return;
    setMatch(m);
    setView(m.scheduled ? "scheduled" : m.finished ? "summary" : "live");
  }

  function importFfcvCalendar() {
    setCalendarImport({ loading: true, message: null });
    fetch("/api/calendario")
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        if (!ok || body.error) throw new Error(body.error || "No se pudo obtener el calendario");
        const fixtures = body.fixtures || [];
        const existing = dataRef.current.matchesList;
        const alreadyImported = (f) =>
          existing.some((m) => m.date === f.date && m.opponent.trim().toLowerCase() === f.opponent.trim().toLowerCase());
        const squad = dataRef.current.squad;
        const newFixtures = fixtures.filter((f) => !alreadyImported(f));

        if (newFixtures.length === 0) {
          setCalendarImport({ loading: false, message: "El calendario ya estaba importado, no hay partidos nuevos." });
          return;
        }

        const newMatches = newFixtures.map((f) => ({
          id: genId(),
          opponent: f.opponent,
          date: f.date,
          halfLength: 40,
          half: 1,
          finished: false,
          scheduled: true,
          isHome: f.isHome,
          clock: { half1Elapsed: 0, half2Elapsed: 0, running: false, activeHalf: 1, runStartedAt: null },
          onPitch: [],
          bench: squad.map((p) => p.id),
          events: [],
          subs: [],
          concededSetPieces: [],
          teamEvents: [],
          opponentChances: [],
          positions: {},
        }));

        const updatedList = [
          ...existing,
          ...newMatches.map((m) => ({
            id: m.id,
            opponent: m.opponent,
            date: m.date,
            finished: false,
            scheduled: true,
            isHome: m.isHome,
          })),
        ];
        const updatedById = { ...dataRef.current.matchesById };
        newMatches.forEach((m) => { updatedById[m.id] = m; });

        commit({ ...dataRef.current, matchesList: updatedList, matchesById: updatedById });
        setCalendarImport({
          loading: false,
          message: `Importados ${newMatches.length} partido${newMatches.length === 1 ? "" : "s"} del calendario de la FFCV.`,
        });
      })
      .catch((e) => setCalendarImport({ loading: false, message: `Error: ${e.message}` }));
  }

  function deleteMatch(id, opponent) {
    if (!window.confirm(`¿Eliminar el partido vs ${opponent}? Esta acción no se puede deshacer.`)) return;
    const { [id]: _removed, ...restMatchesById } = dataRef.current.matchesById;
    const updatedList = dataRef.current.matchesList.filter((m) => m.id !== id);
    commit({ ...dataRef.current, matchesList: updatedList, matchesById: restMatchesById });
    if (match && match.id === id) {
      setMatch(null);
      setView("home");
    }
  }

  function updateMatch(updated, persistNow) {
    setMatch(updated);
    commit(
      { ...dataRef.current, matchesById: { ...dataRef.current.matchesById, [updated.id]: updated } },
      { syncNow: persistNow }
    );
  }

  function finishMatch() {
    const updated = {
      ...match,
      half: "finalizado",
      finished: true,
      clock: { ...match.clock, running: false },
    };
    setMatch(updated);
    const updatedList = dataRef.current.matchesList.map((m) =>
      m.id === updated.id ? { ...m, finished: true } : m
    );
    commit({
      ...dataRef.current,
      matchesList: updatedList,
      matchesById: { ...dataRef.current.matchesById, [updated.id]: updated },
    });
    setView("summary");
  }

  function exportCSV() {
    const rows = [["partido", "fecha", "rival", "parte", "minuto", "dorsal", "jugador", "evento"]];
    match.events.forEach((e) => {
      rows.push([match.id, match.date, match.opponent, e.half, e.minute, e.playerNumber, e.playerName, EVENT_LABEL[e.type] || e.type]);
    });
    match.subs.forEach((s) => {
      rows.push([match.id, match.date, match.opponent, s.half, s.minute, s.outNumber, s.outName, `sale (entra ${s.inName})`]);
      rows.push([match.id, match.date, match.opponent, s.half, s.minute, s.inNumber, s.inName, `entra (sale ${s.outName})`]);
    });
    const csv = rows
      .map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(","))
      .join("\n");
    const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `partido_${match.opponent.replace(/\s+/g, "_")}_${match.date}.csv`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  return (
    <div className="mp-app">
      <GlobalStyles />
      {view === "home" && (
        <Home
          matches={data.matchesList}
          crests={data.crests}
          onSaveCrest={saveCrest}
          squadCount={data.squad.length}
          onNewMatch={() => setView("setup")}
          onOpenMatch={openMatch}
          onDeleteMatch={deleteMatch}
          onGoSquad={() => setView("squad")}
          onGoSeason={() => setView("season")}
          onGoSetPieces={() => setView("setpieces")}
          onGoCharts={() => setView("charts")}
          onGoPitch={() => setView("pitch")}
          syncStatus={syncStatus}
          onGoSync={() => setView("sync")}
          onImportCalendar={importFfcvCalendar}
          calendarImport={calendarImport}
          onImportCrests={importFfcvCrests}
          crestImport={crestImport}
        />
      )}
      {view === "squad" && (
        <SquadManager squad={data.squad} onSave={saveSquad} onBack={goHome} />
      )}
      {view === "setup" && (
        <MatchSetup
          squad={data.squad}
          crests={data.crests}
          onSaveCrest={saveCrest}
          onCreate={createMatch}
          onBack={goHome}
          onGoSquad={() => setView("squad")}
        />
      )}
      {view === "scheduled" && match && (
        <ScheduledMatch
          match={match}
          squad={data.squad}
          crests={data.crests}
          onSaveCrest={saveCrest}
          onStart={beginScheduledMatch}
          onDelete={() => deleteMatch(match.id, match.opponent)}
          onBack={goHome}
        />
      )}
      {view === "live" && match && (
        <LiveMatch
          match={match}
          squad={data.squad}
          crests={data.crests}
          onSaveCrest={saveCrest}
          onUpdate={updateMatch}
          onFinish={finishMatch}
          onBack={goHome}
        />
      )}
      {view === "summary" && match && (
        <MatchSummary match={match} squad={data.squad} crests={data.crests} onBack={goHome} onExport={exportCSV} />
      )}
      {view === "season" && (
        <SeasonStats
          matches={Object.values(data.matchesById)}
          squad={data.squad}
          onBack={goHome}
          onGoCharts={() => setView("charts")}
        />
      )}
      {view === "charts" && (
        <PlayerChartsScreen
          players={data.squad}
          events={Object.values(data.matchesById).flatMap((m) => m.events)}
          teamEvents={Object.values(data.matchesById).flatMap((m) => m.teamEvents || [])}
          matches={Object.values(data.matchesById)}
          onBack={() => setView("home")}
        />
      )}
      {view === "setpieces" && (
        <SetPieceStats
          matches={Object.values(data.matchesById)}
          squad={data.squad}
          setPiecePositions={data.setPiecePositions || {}}
          onSaveSetPiecePositions={saveSetPiecePositions}
          onBack={goHome}
        />
      )}
      {view === "pitch" && <PitchScreen squad={data.squad} crests={data.crests} onBack={goHome} />}
      {view === "sync" && (
        <SyncSettings
          status={syncStatus}
          teamCode={teamCode}
          lastSyncedAt={lastSyncedAt}
          supabaseUrl={supabaseConfig.url}
          supabaseKey={supabaseConfig.key}
          configured={configured}
          onSaveTeamCode={saveTeamCode}
          onSaveConfig={saveSupabaseConfig}
          onSyncNow={pullFromSupabase}
          onBack={goHome}
        />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
