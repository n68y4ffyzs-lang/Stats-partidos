<script>
  // Service Worker: guarda la app para poder abrirla sin conexión (ver sw.js).
  // Busca versiones nuevas al arrancar, al recuperar conexión y al volver a la app; una versión
  // nueva se aplica la próxima vez que se abra la app, sin cortar lo que se esté haciendo.
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("/sw.js").then(function (reg) {
        function check() { if (navigator.onLine) reg.update().catch(function () {}); }
        window.addEventListener("online", check);
        document.addEventListener("visibilitychange", function () { if (!document.hidden) check(); });
      }).catch(function (e) { console.error("Error registrando el Service Worker", e); });
    });
  }
</script>

const SUPABASE_ANON_KEY_KEY = "rp_supabase_anon_key";

function isValidSupabaseConfig(url, key) {
  return !!(url && key && /^https?:\/\//.test(url));
}

function getStoredSupabaseConfig() {
  return {
    url: localStorage.getItem(SUPABASE_URL_KEY) || "",
    key: localStorage.getItem(SUPABASE_ANON_KEY_KEY) || "",
  };
}

function setStoredSupabaseConfig(url, key) {
  if (url) localStorage.setItem(SUPABASE_URL_KEY, url);
  else localStorage.removeItem(SUPABASE_URL_KEY);
  if (key) localStorage.setItem(SUPABASE_ANON_KEY_KEY, key);
  else localStorage.removeItem(SUPABASE_ANON_KEY_KEY);
}

/* ---------------------------------------------------------
   Utilidades
--------------------------------------------------------- */
function genId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function todayISO() {
  return new Date().toISOString().slice(0, 10);
}

function formatClock(totalSeconds) {
  const m = Math.floor(totalSeconds / 60).toString().padStart(2, "0");
  const s = Math.floor(totalSeconds % 60).toString().padStart(2, "0");
  return `${m}:${s}`;
}

// Cálculo puro del tiempo transcurrido y el minuto a partir del propio match,
// sin depender de referencias locales que puedan quedarse desactualizadas entre componentes.
// Duración de cada parte en segundos, la que se puso al crear el partido (sin límite si falta)
function halfLimitSeconds(match) {
  return (Number(match.halfLength) || 0) * 60 || Infinity;
}

// El cronómetro de cada parte nunca pasa de su duración: al llegar, se queda clavado ahí.
function computeElapsed(match) {
  const key = match.clock.activeHalf === 1 ? "half1Elapsed" : "half2Elapsed";
  const base = match.clock[key] || 0;
  if (!match.clock.running) return Math.min(base, halfLimitSeconds(match));
  const startedAt = match.clock.runStartedAt || Date.now();
  return Math.min(base + Math.floor((Date.now() - startedAt) / 1000), halfLimitSeconds(match));
}

function isHalfTimeUp(match) {
  return computeElapsed(match) >= halfLimitSeconds(match);
}

function computeMinute(match) {
  const secs = computeElapsed(match);
  const inHalf = Math.min(Math.floor(secs / 60) + 1, Number(match.halfLength) || Infinity);
  if (match.clock.activeHalf === 1) return inHalf;
  return match.halfLength + inHalf;
}

function halfLabel(match) {
  if (match.half === "descanso") return "Descanso";
  if (match.half === "finalizado") return "Finalizado";
  return match.half === 1 ? "1ª parte" : "2ª parte";
}

function matchBadge(m) {
  if (m.scheduled) return { label: "Programado", bg: "rgba(62,146,204,0.18)", color: "var(--cielo)" };
  if (m.finished) return { label: "Finalizado", bg: "rgba(111,190,68,0.15)", color: "var(--turf)" };
  return { label: "En juego", bg: "rgba(227,167,45,0.18)", color: "var(--amber)" };
}

}

/* ---------------------------------------------------------
   Escudos: el propio y los de los rivales (por nombre), como imágenes pequeñas en data URL.
   Viajan dentro de los datos, así que se sincronizan con Supabase como todo lo demás.
--------------------------------------------------------- */
function emptyCrests() {
  return { own: null, ownNoBg: false, rivalsNoBg: false, rivals: {} };
}

function crestKey(name) {
  return (name || "").trim().toLowerCase().replace(/\s+/g, " ");
}

function rivalCrest(crests, name) {
  return (crests && crests.rivals && crests.rivals[crestKey(name)]) || null;
}

// Reduce la imagen elegida a un cuadrado máximo de 128 px (conserva la transparencia)
function resizeCrest(file, size = 128) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = () => reject(new Error("No se pudo leer la imagen"));
    reader.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("La imagen no es válida"));
      img.onload = () => {
        const iw = img.width || size; // un SVG sin tamaño propio puede dar 0
        const ih = img.height || size;
        const scale = Math.min(1, size / Math.max(iw, ih));
        const w = Math.max(1, Math.round(iw * scale));
        const h = Math.max(1, Math.round(ih * scale));
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        canvas.getContext("2d").drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL("image/png"));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

// Quita el fondo blanco de un escudo (los JPG de la FFCV lo traen): borra el blanco que toca el
// borde de la imagen, así el blanco de dentro del escudo se conserva. Devuelve un data URL PNG.
function removeWhiteBackground(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(dataUrl);
    img.onload = () => {
      try {
        const w = img.width;
        const h = img.height;
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, w, h);
        const px = imageData.data;
        const isLight = (i, min) => px[i + 3] < 10 || Math.min(px[i], px[i + 1], px[i + 2]) >= min;
        const removed = new Uint8Array(w * h);
        const stack = [];
        const push = (x, y) => {
          const k = y * w + x;
          if (!removed[k] && isLight(k * 4, 225)) {
            removed[k] = 1;
            stack.push(k);
          }
        };
        for (let x = 0; x < w; x++) {
          push(x, 0);
          push(x, h - 1);
        }
        for (let y = 0; y < h; y++) {
          push(0, y);
          push(w - 1, y);
        }
        while (stack.length) {
          const k = stack.pop();
          const x = k % w;
          const y = (k - x) / w;
          if (x > 0) push(x - 1, y);
          if (x < w - 1) push(x + 1, y);
          if (y > 0) push(x, y - 1);
          if (y < h - 1) push(x, y + 1);
        }
        // Halo claro que deja la compresión JPG junto al borde del escudo
        const halo = [];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const k = y * w + x;
            if (removed[k] || !isLight(k * 4, 195)) continue;
            if (
              (x > 0 && removed[k - 1]) ||
              (x < w - 1 && removed[k + 1]) ||
              (y > 0 && removed[k - w]) ||
              (y < h - 1 && removed[k + w])
            ) {
              halo.push(k);
            }
          }
        }
        halo.forEach((k) => (removed[k] = 1));
        for (let k = 0; k < removed.length; k++) if (removed[k]) px[k * 4 + 3] = 0;
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL("image/png"));
      } catch (e) {
        resolve(dataUrl);
      }
    };
    img.src = dataUrl;
  });
}

// Versión en blanco de un escudo (para pintarlo sobre el césped): conserva la forma y los detalles,
// que quedan más tenues cuanto más claros eran en el original. Devuelve un data URL PNG.
function whiteCrest(dataUrl) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onerror = () => resolve(null);
    img.onload = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = img.width;
        canvas.height = img.height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const px = imageData.data;
        for (let i = 0; i < px.length; i += 4) {
          const lum = (0.299 * px[i] + 0.587 * px[i + 1] + 0.114 * px[i + 2]) / 255;
          px[i + 3] = Math.round(px[i + 3] * (0.25 + 0.75 * (1 - lum)));
          px[i] = px[i + 1] = px[i + 2] = 255;
        }
        ctx.putImageData(imageData, 0, 0);
        resolve(canvas.toDataURL("image/png"));
      } catch (e) {
        resolve(null);
      }
    };
    img.src = dataUrl;
  });
}

function useWhiteCrest(src) {
  const [white, setWhite] = useState(null);
  useEffect(() => {
    let alive = true;
    if (!src) {
      setWhite(null);
      return undefined;
    }
    whiteCrest(src).then((url) => alive && setWhite(url));
    return () => {
      alive = false;
    };
  }, [src]);
  return white;
}

// Escudo pequeño; si no hay imagen y `empty` es true, un círculo vacío del mismo tamaño
function CrestImage({ src, size = 24, empty = false }) {
  if (!src) {
    if (!empty) return null;
    return (
      <span
        className="shrink-0 inline-flex items-center justify-center"
        style={{
          width: size,
          height: size,
          borderRadius: 999,
          border: "2px dashed rgba(244,241,232,0.35)",
          color: "var(--chalk-dim)",
          fontSize: size * 0.45,
          lineHeight: 1,
        }}
      >
        +
      </span>
    );
  }
  return <img src={src} alt="" className="shrink-0" style={{ width: size, height: size, objectFit: "contain" }} />;
}

// Escudo que se cambia tocándolo: abre el selector de imágenes del dispositivo
function CrestPicker({ src, size = 40, onPick, label }) {
  const inputRef = useRef(null);
  async function handleFile(e) {
    const file = e.target.files && e.target.files[0];
    e.target.value = "";
    if (!file) return;
    try {
      onPick(await resizeCrest(file));
    } catch (err) {
      window.alert(err.message || "No se pudo cargar la imagen");
    }
  }
  return (
    <span className="inline-flex flex-col items-center gap-1 shrink-0">
      <button type="button" onClick={() => inputRef.current && inputRef.current.click()} aria-label={label}>
        <CrestImage src={src} size={size} empty />
      </button>
      <input ref={inputRef} type="file" accept="image/*" onChange={handleFile} style={{ display: "none" }} />
    </span>
  );
}

// Los dos escudos de un partido en fila, en el orden local - visitante (nosotros primero si jugamos en casa)
function MatchCrests({ match, crests, size = 28 }) {
  const own = crests && crests.own;
  const rival = rivalCrest(crests, match.opponent);
  if (!own && !rival) return null;
  const pair = match.isHome === false ? [rival, own] : [own, rival];
  return (
    <span className="inline-flex items-center gap-1 shrink-0">
      {pair.map((src, i) => (src ? <CrestImage key={i} src={src} size={size} /> : <span key={i} style={{ width: size }} />))}
    </span>
  );
}

// Resultado con escudos: local a la izquierda y visitante a la derecha (nosotros, si jugamos en casa)
function ScoreWithCrests({ match, favor, contra, crests, onPickOwn, onPickRival, size = 44 }) {
  const away = match.isHome === false;
  const own = onPickOwn ? (
    <CrestPicker src={crests && crests.own} size={size} onPick={onPickOwn} label="Cambiar nuestro escudo" />
  ) : (
    <CrestImage src={crests && crests.own} size={size} />
  );
  const rivalSrc = rivalCrest(crests, match.opponent);
  const rival = onPickRival ? (
    <CrestPicker src={rivalSrc} size={size} onPick={onPickRival} label={`Cambiar el escudo de ${match.opponent}`} />
  ) : (
    <CrestImage src={rivalSrc} size={size} />
  );
  return (
    <div className="display text-4xl font-bold tabular-nums leading-none flex items-center justify-center gap-3">
      {away ? rival : own}
      <span>
        {away ? contra : favor} - {away ? favor : contra}
      </span>
      {away ? own : rival}
    </div>
  );
}

// Formato antiguo de una jugada de balón parado: positions = { [playerId]: {x,y}, ball: {x,y} },
// es decir, las posiciones estaban atadas a un jugador concreto de la plantilla.
// Formato nuevo: slots = [{id,x,y}], posiciones fijas independientes del jugador; qué jugador
// ocupa cada slot se decide partido a partido (match.setPieceAssignments).
function migratePlay(play) {
  if (play.slots) return play;
  const legacyPositions = play.positions || {};
  const slots = Object.keys(legacyPositions)
    .filter((k) => k !== "ball")
    .map((playerId) => ({ id: genId(), x: legacyPositions[playerId].x, y: legacyPositions[playerId].y }));
  return { id: play.id, name: play.name, slots, ball: legacyPositions.ball || null };
}

function migrateSetPiecePositions(raw) {
  const out = {};
  Object.keys(raw || {}).forEach((category) => {
    out[category] = (Array.isArray(raw[category]) ? raw[category] : []).map(migratePlay);
  });
  return out;
}

// Migra las 4 posiciones antiguas (Portero/Defensa/Centrocampista/Delantero) al nuevo detalle
// de 9 posiciones (PT/DFI/DFC/DFD/CAI/CAD/MC/MCO/DC). Un jugador ya migrado no se toca.
const LEGACY_POSITION_MIGRATION = {
  portero: "PT",
  defensa: "DFC",
  centrocampista: "MC",
  delantero: "DC",
};
function migrateSquadPositions(squad) {
  return (squad || []).map((p) =>
    p.position && LEGACY_POSITION_MIGRATION[p.position]
      ? { ...p, position: LEGACY_POSITION_MIGRATION[p.position] }
      : p
  );
}

function loadLocalData() {
  try {
    const raw = localStorage.getItem(DATA_KEY);
    if (!raw) return emptyData();
    const parsed = JSON.parse(raw);
    return {
      squad: migrateSquadPositions(parsed.squad || []),
      matchesList: parsed.matchesList || [],
      matchesById: parsed.matchesById || {},
      setPiecePositions: migrateSetPiecePositions(parsed.setPiecePositions || {}),
      ratingConfig: parsed.ratingConfig || null,
      crests: {
        own: (parsed.crests && parsed.crests.own) || null,
        ownNoBg: !!(parsed.crests && parsed.crests.ownNoBg),
        rivalsNoBg: !!(parsed.crests && parsed.crests.rivalsNoBg),
        rivals: (parsed.crests && parsed.crests.rivals) || {},
      },
      updatedAt: parsed.updatedAt || 0,
    };
  } catch (e) {
    return emptyData();
  }
}

function saveLocalData(data) {
  try {
    localStorage.setItem(DATA_KEY, JSON.stringify(data));
  } catch (e) {
    console.error("Error guardando en localStorage", e);
  }
}

function getDeviceId() {
  let id = localStorage.getItem(DEVICE_ID_KEY);
  if (!id) {
    id = genId();
    localStorage.setItem(DEVICE_ID_KEY, id);
  }
  return id;
}

function getStoredTeamCode() {
  return localStorage.getItem(TEAM_CODE_KEY) || "";
}

function setStoredTeamCode(code) {
  if (code) localStorage.setItem(TEAM_CODE_KEY, code);
  else localStorage.removeItem(TEAM_CODE_KEY);
}

/* ---------------------------------------------------------
   Cola de cambios pendientes de subir a Supabase
   Cada cambio guardado en local añade una entrada { id, at, keys, matchIds, silent } con qué
   partes de los datos tocó (claves de primer nivel y partidos). No guarda copias completas
   (llenarían el almacenamiento del iPad): como los datos son un único documento, subir el
   estado actual ya incluye todos los cambios de la cola en el orden en que ocurrieron. Las
   entradas se borran solo cuando la subida que las incluye se confirma, así que un corte a
   mitad no pierde nada, y reintentar es seguro porque la subida sustituye el documento.
   Las marcas de qué se tocó sirven para fusionar si otro dispositivo cambió la nube mientras
   tanto (ver mergePendingIntoRemote).
--------------------------------------------------------- */
function loadPending() {
  try {
    const parsed = JSON.parse(localStorage.getItem(PENDING_KEY) || "[]");
    return Array.isArray(parsed) ? parsed : [];
  } catch (e) {
    return [];
  }
}

function savePending(entries) {
  try {
    if (entries.length) localStorage.setItem(PENDING_KEY, JSON.stringify(entries));
    else localStorage.removeItem(PENDING_KEY);
  } catch (e) {
    console.error("Error guardando la cola de sincronización", e);
  }
}

// updated_at de la nube la última vez que este dispositivo quedó al día con ella
function getLastRemoteUpdatedAt() {
  return Number(localStorage.getItem(LAST_REMOTE_KEY)) || 0;
}

function setLastRemoteUpdatedAt(ts) {
  try {
    localStorage.setItem(LAST_REMOTE_KEY, String(ts || 0));
  } catch (e) {
    /* no crítico */
  }
}

// Qué ha cambiado entre dos versiones de los datos (comparando referencias: las
// actualizaciones son inmutables, así que lo que no se tocó conserva la misma referencia).
function diffDataForQueue(prev, next) {
  const keys = new Set([...Object.keys(prev || {}), ...Object.keys(next || {})]);
  keys.delete("updatedAt");
  const changedKeys = [...keys].filter((k) => (prev || {})[k] !== (next || {})[k]);
  const prevById = (prev && prev.matchesById) || {};
  const nextById = (next && next.matchesById) || {};
  const matchIds = [...new Set([...Object.keys(prevById), ...Object.keys(nextById)])].filter(
    (id) => prevById[id] !== nextById[id]
  );
  return { keys: changedKeys, matchIds };
}

// Otro dispositivo cambió la nube mientras este tenía cambios sin subir: parte de lo que hay
// en la nube y encima pone lo que este dispositivo cambió (partidos concretos y secciones
// enteras como la plantilla), para no pisar lo del otro ni perder lo de este.
function mergePendingIntoRemote(remote, local, pending) {
  const keys = new Set();
  const matchIds = new Set();
  pending.forEach((e) => {
    (e.keys || []).forEach((k) => keys.add(k));
    (e.matchIds || []).forEach((id) => matchIds.add(id));
  });
  const merged = { ...emptyData(), ...remote };
  keys.forEach((k) => {
    if (k !== "matchesById" && k !== "matchesList") merged[k] = local[k];
  });
  const byId = { ...(remote.matchesById || {}) };
  let list = [...(remote.matchesList || [])];
  matchIds.forEach((id) => {
    const localMatch = (local.matchesById || {})[id];
    const localEntry = (local.matchesList || []).find((m) => m.id === id);
    if (localMatch) byId[id] = localMatch;
    else delete byId[id];
    const idx = list.findIndex((m) => m.id === id);
    if (localEntry) {
      if (idx >= 0) list[idx] = localEntry;
      else list.push(localEntry);
    } else if (!localMatch && idx >= 0) {
      list.splice(idx, 1);
    }
  });
  merged.matchesById = byId;
  merged.matchesList = list;
  return merged;
}

const SYNC_META = {
  unconfigured: { color: "#8A8577", label: "Sin configurar" },
  "no-code": { color: "var(--amber)", label: "Sin código de equipo" },
  offline: { color: "var(--amber)", label: "Sin conexión" },
  syncing: { color: "var(--cielo)", label: "Sincronizando…" },
  synced: { color: "var(--turf)", label: "Sincronizado" },
  error: { color: "var(--crimson)", label: "Error de sincronización" },
  blocked: { color: "var(--amber)", label: "Sincronización cancelada (revisa)" },
};

// Lo que enseña el indicador: sin conexión manda sobre todo lo demás, luego los cambios
// pendientes de subir y, si no queda nada, el estado normal ("Sincronizado", error...).
function syncDisplay(status, online, pendingCount) {
  if (status === "unconfigured" || status === "no-code") return SYNC_META[status];
  const plural = pendingCount === 1 ? "" : "s";
  if (!online) {
    return {
      color: "var(--amber)",
      label: pendingCount > 0
        ? `Sin conexión — guardando en local (${pendingCount} pendiente${plural})`
        : "Sin conexión — guardando en local",
    };
  }
  if (status === "blocked") return SYNC_META.blocked;
  if (pendingCount > 0) {
    return {
      color: status === "syncing" ? "var(--cielo)" : "var(--amber)",
      label: status === "syncing"
        ? `Subiendo ${pendingCount} cambio${plural}…`
        : `${pendingCount} cambio${plural} pendiente${plural} de subir`,
    };
  }
  return SYNC_META[status] || SYNC_META.unconfigured;
}

function SyncBadge({ status, onClick }) {
  const meta = typeof status === "object" && status ? status : SYNC_META[status] || SYNC_META.unconfigured;
  return (
    <button
      onClick={onClick}
      className="flex items-center gap-2 text-xs px-2 py-1.5 rounded-full mp-card"
      style={{ color: "var(--chalk-dim)" }}
    >
      <span className="mp-dot" style={{ background: meta.color }} />
      {meta.label}
    </button>
  );
}

/* ---------------------------------------------------------
   Ajustes → Puntuación de jugadores: tabla editable de pesos por evento y posición,
   nota base y bonos por resultado. Se edita en un borrador y se guarda con el botón.
--------------------------------------------------------- */
function ratingConfigToDraft(config) {
  const fmt = (v) => (v == null ? "" : v.toFixed(2));
  const weights = {};
  RATING_ROWS.forEach(({ key }) => {
    weights[key] = {};
    RATING_GROUPS.forEach(({ id }) => { weights[key][id] = fmt(config.weights[key][id]); });
  });
  return {
    base: fmt(config.base),
    bonusWin: fmt(config.bonusWin),
    bonusBigWin: fmt(config.bonusBigWin),
    bonusCleanSheet: fmt(config.bonusCleanSheet),
    weights,
  };
}

function parseRatingNumber(text) {
  const t = String(text).trim().replace(",", ".");
  if (t === "") return null;
  const n = Number(t);
  return isFinite(n) ? Math.round(n * 100) / 100 : undefined;
}

function RatingSettings({ config, onSave }) {
  const [draft, setDraft] = useState(() => ratingConfigToDraft(config));
  const [error, setError] = useState(null);
  const savedDraft = ratingConfigToDraft(config);
  const dirty = JSON.stringify(draft) !== JSON.stringify(savedDraft);

  // Si llega una config nueva (otro dispositivo, restaurar) y no hay cambios a medias, se refleja
  const configKey = JSON.stringify(config);
  useEffect(() => {
    if (!dirty) setDraft(ratingConfigToDraft(config));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [configKey]);

  function setField(field, value) {
    setDraft((d) => ({ ...d, [field]: value }));
  }

  function setWeight(key, group, value) {
    setDraft((d) => ({ ...d, weights: { ...d.weights, [key]: { ...d.weights[key], [group]: value } } }));
  }

  function save() {
    const scalar = {};
    for (const f of ["base", "bonusWin", "bonusBigWin", "bonusCleanSheet"]) {
      const v = parseRatingNumber(draft[f]);
      if (v == null) return setError("La nota base y los bonos no pueden quedar vacíos.");
      scalar[f] = v;
    }
    const weights = {};
    for (const { key } of RATING_ROWS) {
      weights[key] = {};
      for (const { id } of RATING_GROUPS) {
        const v = parseRatingNumber(draft.weights[key][id]);
        if (v === undefined) return setError("Hay algún valor que no es un número.");
        weights[key][id] = v;
      }
    }
    setError(null);
    onSave({ ...scalar, weights });
  }

  function restoreDefaults() {
    if (!window.confirm("¿Restaurar la tabla de puntuación, la nota base y los bonos a los valores por defecto?")) return;
    setError(null);
    setDraft(ratingConfigToDraft(DEFAULT_RATING_CONFIG));
    onSave(DEFAULT_RATING_CONFIG);
  }

  const numberInput = (value, onChange, disabled, extraClass = "") => (
    <input
      type="text"
      inputMode="decimal"
      value={disabled ? "" : value}
      disabled={disabled}
      onChange={(e) => onChange(e.target.value)}
      onBlur={(e) => {
        const v = parseRatingNumber(e.target.value);
        if (v != null) onChange(v.toFixed(2));
      }}
      className={`mp-input px-1 py-1 text-center text-xs ${extraClass}`}
      style={disabled ? { opacity: 0.3 } : undefined}
    />
  );

  const scalarRow = (field, label) => (
    <div className="flex items-center justify-between gap-2">
      <span className="text-sm">{label}</span>
      {numberInput(draft[field], (v) => setField(field, v), false, "w-20")}
    </div>
  );

  return (
    <div className="mp-card p-3 mt-4">
      <div className="text-sm font-semibold mb-1">Puntuación de jugadores</div>
      <div className="text-xs mb-3" style={{ color: "var(--chalk-dim)" }}>
        Puntos que suma o resta cada evento según la posición del jugador en ese momento. Una celda vacía
        no suma ni resta. Se guarda con el resto de datos del equipo y se sincroniza entre dispositivos.
      </div>

      <div className="flex flex-col gap-2 mb-3">
        {scalarRow("base", "Nota base al empezar el partido")}
        {scalarRow("bonusWin", "Bono por victoria")}
        {scalarRow("bonusBigWin", "Bono extra por ganar de 5+ goles")}
        {scalarRow("bonusCleanSheet", "Bono extra por ganar con portería a cero")}
      </div>

      <div className="mp-scroll overflow-x-auto -mx-1 px-1">
        <table className="text-xs w-full" style={{ borderCollapse: "collapse" }}>
          <thead>
            <tr>
              <th className="p-1 text-left" style={{ color: "var(--chalk-dim)" }}>Evento</th>
              {RATING_GROUPS.map((g) => (
                <th key={g.id} className="p-1 text-center whitespace-nowrap" style={{ color: "var(--chalk-dim)" }}>
                  {g.label}
                </th>
              ))}
            </tr>
          </thead>
          <tbody>
            {RATING_ROWS.map((row) => (
              <tr key={row.key}>
                <td className="p-1 whitespace-nowrap">{row.label}</td>
                {RATING_GROUPS.map((g) => (
                  <td key={g.id} className="p-0.5">
                    {numberInput(
                      draft.weights[row.key][g.id],
                      (v) => setWeight(row.key, g.id, v),
                      !!row.ptOnly && g.id !== "PT",
                      "w-14"
                    )}
                  </td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>

      {error && (
        <div className="text-xs mt-2" style={{ color: "var(--crimson)" }}>{error}</div>
      )}

      <div className="flex gap-2 mt-3">
        <button
          onClick={save}
          disabled={!dirty}
          className="mp-btn mp-btn-primary flex-1 py-2 text-sm font-semibold"
          style={!dirty ? { opacity: 0.5 } : undefined}
        >
          {dirty ? "Guardar cambios" : "Guardado"}
        </button>
        <button onClick={restoreDefaults} className="mp-btn mp-btn-outline flex-1 py-2 text-sm">
          Restaurar valores por defecto
        </button>
      </div>
    </div>
  );
}

/* ---------------------------------------------------------
   Clasificación de liga (FFCV) — vía proxy propio en /api/clasificacion
   para evitar el bloqueo CORS del navegador. No es una API oficial de
   la FFCV: si deja de funcionar o el equipo cambia de grupo, hay que
   actualizar DEFAULT_COD_GRUPO en api/clasificacion.js.
--------------------------------------------------------- */
const LEAGUE_TEAM_CODE = "903635134"; // C.F. Nou Jove Castelló 'A' — Primera Cadet, Grup 1
const LEAGUE_CACHE_KEY = "rp_league_cache_v1";

function loadLeagueCache() {
  try {
    const raw = localStorage.getItem(LEAGUE_CACHE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function saveLeagueCache(data) {
  try {
    localStorage.setItem(LEAGUE_CACHE_KEY, JSON.stringify({ data, fetchedAt: Date.now() }));
  } catch (e) {
    console.error("Error guardando la clasificación en caché", e);
  }
}

function LeagueStandings() {
  const cached = useRef(loadLeagueCache()).current;
  const [data, setData] = useState(cached ? cached.data : null);
  const [fetchedAt, setFetchedAt] = useState(cached ? cached.fetchedAt : null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);
  const [expanded, setExpanded] = useState(false);

  const load = useCallback(() => {
    setLoading(true);
    setError(null);
    fetch("/api/clasificacion")
      .then((r) => r.json().then((body) => ({ ok: r.ok, body })))
      .then(({ ok, body }) => {
        if (!ok || body.error) throw new Error(body.error || "No se pudo cargar la clasificación");
        setData(body);
        setFetchedAt(Date.now());
        saveLeagueCache(body);
      })
      .catch((e) => setError(e.message))
      .finally(() => setLoading(false));
  }, []);

  useEffect(() => { load(); }, [load]);

  const rows = data ? data.clasificacion || [] : [];
  const myRow = rows.find((r) => r.codequipo === LEAGUE_TEAM_CODE) || null;

  return (
    <div className="mb-6">
      {/* Etiqueta horizontal: toca para desplegar la tabla completa */}
      <button
        onClick={() => setExpanded((v) => !v)}
        className="mp-card mp-btn w-full flex items-center justify-between gap-3 px-3 py-2.5"
        style={expanded ? { borderColor: "var(--turf)" } : {}}
      >
        <div className="flex items-center gap-3 min-w-0">
          <div
            className="mp-shirt w-9 h-9 text-sm font-semibold shrink-0"
            style={myRow ? { borderColor: "var(--turf)" } : {}}
          >
            {myRow ? myRow.posicion : "–"}
          </div>
          <div className="min-w-0 text-left">
            <div className="text-sm font-semibold">Clasificación</div>
            <div className="text-xs truncate" style={{ color: "var(--chalk-dim)" }}>
              {data ? `${data.competicion} · ${data.grupo}` : loading ? "Cargando…" : "Toca para ver"}
            </div>
          </div>
        </div>
        <div className="flex items-center gap-2 shrink-0">
          {myRow && (
            <span className="text-xs font-semibold" style={{ color: "var(--turf)" }}>
              {myRow.puntos} pts
            </span>
          )}
          <span
            className="text-xs"
            style={{
              color: "var(--chalk-dim)",
              display: "inline-block",
              transition: "transform 0.18s ease",
              transform: expanded ? "rotate(180deg)" : "none",
            }}
          >
            ▼
          </span>
        </div>
      </button>

      {expanded && (
        <div className="mp-card mp-fade-in p-3 mt-2">
          <div className="flex items-center justify-between mb-2 gap-2">
            <div className="min-w-0 text-xs truncate" style={{ color: "var(--chalk-dim)" }}>
              {data ? `Jornada ${data.jornada} · ${data.fecha_jornada}` : "Sin datos todavía"}
            </div>
            <button
              onClick={load}
              disabled={loading}
              className="mp-btn mp-btn-outline px-2 py-1 text-xs shrink-0 disabled:opacity-40"
            >
              {loading ? "Cargando…" : "Actualizar"}
            </button>
          </div>

          {error && (
            <div className="text-xs mb-2" style={{ color: "var(--amber)" }}>
              {data
                ? "No se pudo actualizar; se muestra la última clasificación guardada."
                : `No se pudo cargar la clasificación (${error}). Puede que la FFCV esté dando problemas, inténtalo de nuevo en unos segundos.`}
            </div>
          )}

          {rows.length > 0 ? (
            <div className="mp-scroll overflow-x-auto">
              <table className="text-xs w-full" style={{ borderCollapse: "collapse" }}>
                <thead>
                  <tr style={{ color: "var(--chalk-dim)" }}>
                    <th className="text-left p-1">#</th>
                    <th className="text-left p-1">Equipo</th>
                    <th className="text-center p-1">PJ</th>
                    <th className="text-center p-1">PG</th>
                    <th className="text-center p-1">PE</th>
                    <th className="text-center p-1">PP</th>
                    <th className="text-center p-1">GF</th>
                    <th className="text-center p-1">GC</th>
                    <th className="text-center p-1">Pts</th>
                  </tr>
                </thead>
                <tbody>
                  {rows.map((r) => {
                    const isUs = r.codequipo === LEAGUE_TEAM_CODE;
                    return (
                      <tr key={r.codequipo} style={isUs ? { background: "rgba(111,190,68,0.15)" } : {}}>
                        <td className="p-1">{r.posicion}</td>
                        <td className="p-1 whitespace-nowrap" style={isUs ? { fontWeight: 600 } : {}}>
                          {r.nombre}
                        </td>
                        <td className="text-center p-1">{r.jugados}</td>
                        <td className="text-center p-1">{r.ganados}</td>
                        <td className="text-center p-1">{r.empatados}</td>
                        <td className="text-center p-1">{r.perdidos}</td>
                        <td className="text-center p-1">{r.goles_a_favor}</td>
                        <td className="text-center p-1">{r.goles_en_contra}</td>
                        <td className="text-center p-1 font-semibold">{r.puntos}</td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          ) : (
            !error && (
              <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                {loading ? "Cargando clasificación…" : "Sin datos de clasificación todavía."}
              </div>
            )
          )}

          {fetchedAt && (
            <div className="text-[10px] mt-2" style={{ color: "var(--chalk-dim)" }}>
              Actualizado: {new Date(fetchedAt).toLocaleString()}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* ---------------------------------------------------------
   Calendario: cada partido en su día/mes, incluidos los futuros
--------------------------------------------------------- */
const CALENDAR_WEEKDAYS = ["L", "M", "X", "J", "V", "S", "D"];

function MatchCalendar({ matches, crests, onOpenMatch }) {
  const [cursor, setCursor] = useState(() => {
    const [y, m] = todayISO().split("-").map(Number);
    return { year: y, month: m - 1 };
  });
  const [selectedDate, setSelectedDate] = useState(null);

  const matchesByDate = {};
  matches.forEach((m) => {
    (matchesByDate[m.date] = matchesByDate[m.date] || []).push(m);
  });

  const pad = (n) => String(n).padStart(2, "0");
  const first = new Date(cursor.year, cursor.month, 1);
  const startWeekday = (first.getDay() + 6) % 7;
  const daysInMonth = new Date(cursor.year, cursor.month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < startWeekday; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);
  const isoFor = (d) => `${cursor.year}-${pad(cursor.month + 1)}-${pad(d)}`;
  const monthLabel = first.toLocaleDateString("es-ES", { month: "long", year: "numeric" });
  const todayIso = todayISO();

  function shiftMonth(delta) {
    setSelectedDate(null);
    setCursor((c) => {
      let month = c.month + delta;
      let year = c.year;
      if (month < 0) { month = 11; year -= 1; }
      if (month > 11) { month = 0; year += 1; }
      return { year, month };
    });
  }

  const selectedMatches = selectedDate ? matchesByDate[selectedDate] || [] : [];

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <button onClick={() => shiftMonth(-1)} className="mp-btn mp-btn-outline px-3 py-1.5 text-sm">
          ‹
        </button>
        <div className="text-sm font-semibold capitalize">{monthLabel}</div>
        <button onClick={() => shiftMonth(1)} className="mp-btn mp-btn-outline px-3 py-1.5 text-sm">
          ›
        </button>
      </div>

      <div className="grid grid-cols-7 gap-1 mb-1">
        {CALENDAR_WEEKDAYS.map((d) => (
          <div key={d} className="text-center text-[10px]" style={{ color: "var(--chalk-dim)" }}>
            {d}
          </div>
        ))}
      </div>

      <div className="grid grid-cols-7 gap-1 mb-2">
        {cells.map((d, i) => {
          if (d === null) return <div key={i} />;
          const iso = isoFor(d);
          const dayMatches = matchesByDate[iso] || [];
          const hasMatch = dayMatches.length > 0;
          const isToday = iso === todayIso;
          const selected = iso === selectedDate;
          const vColor = hasMatch ? venueColor(dayMatches[0]) : null;
          return (
            <button
              key={i}
              onClick={() => hasMatch && setSelectedDate(selected ? null : iso)}
              className="mp-card flex flex-col items-center justify-center gap-0.5 py-1 px-0.5 text-xs"
              style={{
                minHeight: 42,
                borderColor: selected ? "var(--chalk)" : hasMatch ? vColor : isToday ? "var(--cielo)" : undefined,
                borderWidth: hasMatch ? 2 : 1,
                opacity: hasMatch ? 1 : 0.4,
              }}
            >
              <span>{d}</span>
              {hasMatch && (
                <span
                  className="truncate w-full text-center leading-tight"
                  style={{ fontSize: 8, color: vColor }}
                >
                  {dayMatches[0].opponent}
                </span>
              )}
            </button>
          );
        })}
      </div>

      {selectedDate && (
        <div className="flex flex-col gap-2 mp-fade-in">
          {selectedMatches.map((m) => {
            const badge = matchBadge(m);
            const vLabel = venueLabel(m);
            return (
              <button
                key={m.id}
                onClick={() => onOpenMatch(m.id)}
                className="mp-card p-3 text-left flex items-center justify-between gap-2"
              >
                <div className="min-w-0 flex items-center gap-2">
                  <MatchCrests match={m} crests={crests} size={28} />
                  <div className="min-w-0">
                    <div className="font-semibold truncate">vs {m.opponent}</div>
                    <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                      {m.date}
                      {vLabel && <span style={{ color: venueColor(m) }}> · {vLabel}</span>}
                    </div>
                  </div>
                </div>
                <span
                  className="text-xs px-2 py-1 rounded-full whitespace-nowrap shrink-0"
                  style={{ background: badge.bg, color: badge.color }}
                >
                  {badge.label}
                </span>
              </button>
            );
          })}
        </div>
      )}
    </div>
  );
}

        <div className="flex flex-col gap-2">
          {filteredMatches
            .slice()
            .sort((a, b) => (a.date < b.date ? 1 : -1))
            .map((m) => {
              const badge = matchBadge(m);
              const vLabel = venueLabel(m);
              return (
                <div key={m.id} className="mp-card p-3 flex items-center gap-2">
                  <button
                    onClick={() => onOpenMatch(m.id)}
                    className="flex-1 min-w-0 text-left flex items-center justify-between gap-2"

                    <div className="min-w-0 flex items-center gap-2">

                      <div className="min-w-0">
                        <div className="font-semibold truncate">vs {m.opponent}</div>
                        <div className="text-xs" style={{ color: "var(--chalk-dim)" }}>
                          {m.date}
                          {vLabel && <span style={{ color: venueColor(m) }}> · {vLabel}</span>}
                        </div>
                      </div>
                    </div>
                    <span
                      className="text-xs px-2 py-1 rounded-full whitespace-nowrap"
                      style={{ background: badge.bg, color: badge.color }}
                    >
                      {badge.label}
                    </span>
                  </button>
                  <button
                    onClick={() => onDeleteMatch(m.id, m.opponent)}
                    className="text-xs px-2 py-1 shrink-0"
                    style={{ color: "var(--crimson)" }}
                  >
                    Eliminar
                  </button>
                </div>
              );
            })}
        </div>
      ) : (
        filteredMatches.length > 0 && <MatchCalendar matches={filteredMatches} crests={crests} onOpenMatch={onOpenMatch} />
      )}
    </div>
  );
}
